{id:'d_shouchan',prio:1,when:()=>P.year===220&&ruler()==='위'&&P.age>=14,time:8,title:'수선대',han:'禪',hr:'선',
 text:()=>'허도의 천자가 위왕 조비에게 옥새를 넘긴다. 번양에 쌓은 수선대 아래로 백관이 늘어섰다는 소식이다.',
 ch:[{l:'상서로운 징조를 적어 바친다',req:()=>P.path==='관',rq:'관리만',st:'지',d:45,act:ok=>{if(ok){P.fame+=8;return '황룡을 보았다는 고을 노인의 말을 다듬어 올렸다. 새 조정이 기뻐했다.'}P.fame+=1;return '징조를 바친 자가 너무 많아 아무도 읽지 않았다.'}},
     {l:'한나라를 위해 몰래 곡한다',st:'지',d:45,act:ok=>{P.s.매+=3;if(ok)return '문을 닫고 사백 년 한나라를 위해 울었다. 아무도 몰랐다.';hurt(15,'곤장');P.fame=Math.max(0,P.fame-3);return '이웃이 고발했다. 곤장을 맞고 풀려났다.'}},
     {l:'축하 잔치에서 술을 얻어 마신다',act:()=>{P.wealth+=1;P.hp=Math.min(maxHp(),P.hp+3);return '고을 관아가 술과 고기를 풀었다. 천자가 바뀌어도 술맛은 같았다.'}}],
 to:()=>'왕조가 바뀌었다는 것을 장날에야 알았다. 연호가 황초로 바뀌었다.'},
{id:'d_jiupin',w:4,once:1,when:()=>P.year>=220&&P.year<=234&&ruler()==='위'&&['민','관'].includes(P.path)&&P.age>=18&&P.age<=50,time:7,title:'중정관의 품평',han:'品',hr:'품',
 text:()=>{P.tmp.n=mkName();return `구품관인법이 내려와 군마다 중정관이 선비들의 품을 매긴다. 이 고을 중정관은 ${P.tmp.n}이다. 품이 낮으면 벼슬길도 막힌다.`},
 ch:[{l:'고을 평판을 다진다',st:'매',d:50,act:ok=>{if(ok){P.fame+=6;if(P.path==='민')setPath('관');return '효행과 학문으로 이름이 올라 높은 품을 받았다.'}P.s.매+=1;return '하품을 받았다. 가문 없는 자에게 상품은 드물었다.'}},
     {l:'중정관 집에 예물을 보낸다',req:()=>P.wealth>=25,rq:'2만 5천 전 필요',p:.6,act:ok=>{P.wealth-=20;if(ok){P.fame+=4;if(P.path==='민')setPath('관');later('f3_jiupin_gift',rint(3,5),{n:P.tmp.n||'중정관'});return '중정관이 당신 이름 옆에 좋은 평을 적었다. 그 집 예물 장부에도 당신 이름이 적혔다.'}return '예물만 받고 품은 그대로였다.'}},
     {l:'품 따위에 매이지 않는다',act:()=>{P.s.지+=2;P.fame=Math.max(0,P.fame-1);return '집안이 품을 정하는 세상이라며 웃어넘겼다. 대신 책을 더 읽었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-1);return '품평 명단에서 당신 이름이 빠졌다.'}},
{id:'d_liubeidi',w:5,once:1,when:()=>P.year>=220&&P.year<=221&&inR('익주')&&P.age>=14,time:7,title:'한중왕 즉위',han:'漢',hr:'한',
 text:()=>'허도의 천자가 시해되었다는 소문이 성도에 닿았다. 한중왕이 상복을 입고, 신하들은 제위에 오르라 청한다.',
 ch:[{l:'상복을 입고 함께 곡한다',act:()=>{P.s.매+=3;return '무담산 남쪽에서 한중왕이 황제에 올랐다. 국호는 여전히 한이었다.'}},
     {l:'즉위를 권하는 상소에 이름을 올린다',req:()=>P.path==='관',rq:'관리만',st:'정',d:40,act:ok=>{if(ok){P.fame+=7;return '새 조정에서 당신 이름을 기억했다.'}P.fame+=2;return '이름은 올렸지만 맨 끝줄이었다.'}},
     {l:'천자의 생사부터 확인하자고 아뢴다',st:'정',d:55,act:ok=>{if(ok){P.fame+=5;P.s.지+=2;return '곧은 말이라며 벌은 면했다. 훗날 산양공이 살아 있다는 말이 들려왔다.'}P.fame=Math.max(0,P.fame-4);return '즉위를 막던 비시처럼 외진 곳으로 밀려났다.'}}],
 to:()=>'성도 거리에 새 연호 장무가 나붙었다.'},
{id:'d_nanzheng',w:6,once:1,when:()=>P.year===225&&ruler()==='촉'&&P.path==='군',time:7,title:'노수를 건너다',han:'瀘',hr:'로',
 text:()=>'제갈 승상이 남중 정벌에 나섰다. 오월, 장기가 피어오르는 노수를 건너야 한다. 맹획이 강 건너에 있다.',
 ch:[{l:'도하 선발대에 선다',st:'무',d:50,act:ok=>{if(ok){P.fame+=10;return '물살을 가르고 맞은편 기슭에 깃발을 꽂았다.'}hurt(35,'노수의 장기');return '강을 건너자 열이 오르고 온몸이 떨렸다.'}},
     {l:'매복해 맹획을 사로잡는다',st:'통',d:55,act:ok=>{if(ok){P.fame+=12;return '맹획을 묶어 끌고 왔다. 승상은 진채를 구경시키고 풀어 주었다. 일곱 번 잡았다 놓았다는 이야기는 뒤에 퍼졌다.'}hurt(30,'남만의 독화살');return '숲속에서 독화살을 맞았다.'}},
     {l:'부락과 소금으로 소를 바꾼다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=10;P.s.매+=2;return '남중 사람들이 소와 말을 몰고 왔다. 군량 걱정이 줄었다.'}P.wealth=Math.max(0,P.wealth-5);return '말이 통하지 않아 소금만 빼앗겼다.'}}],
 to:()=>{hurt(25,'노수의 장기');return '강가에서 머뭇거리다 장기를 들이마셨다.'}},
{id:'d_jieting',w:6,once:1,when:()=>P.year===228&&P.path==='군'&&(ruler()==='촉'||(ruler()==='위'&&inR('량주','사례'))),time:6,title:'가정',han:'亭',hr:'정',
 text:()=>ruler()==='촉'?'참군 마속이 물길에서 먼 산 위에 진을 쳤다. 장합의 군이 산 아래 물길을 끊었다.':'촉의 선봉이 가정의 산 위에 진을 쳤다. 장합 장군이 물길부터 끊으라 명했다.',
 ch:[{l:'왕평의 진에서 북을 울린다',req:()=>ruler()==='촉',rq:'촉군만',st:'통',d:50,act:ok=>{if(ok){P.fame+=10;return '천 명이 북을 치며 버티자 장합은 복병을 의심해 다가오지 않았다. 돌아와 보니 마속이 처형되었다.'}hurt(35,'가정의 패주');return '무너지는 대열에 휩쓸렸다.'}},
     {l:'물을 찾아 산을 내려간다',req:()=>ruler()==='촉',rq:'촉군만',p:.5,act:ok=>{if(ok){hurt(10,'목마름');return '물통을 지고 살아 돌아왔다. 승상은 스스로 벼슬을 세 등급 깎았다고 한다.'}hurt(40,'위군의 화살');return '물가에서 위군의 화살이 날아왔다.'}},
     {l:'산 위로 기어오른다',req:()=>ruler()==='위',rq:'위군만',st:'무',d:55,act:ok=>{if(ok){P.fame+=12;return '목마른 촉군은 한 번 밀자 흩어졌다.'}hurt(35,'가정의 돌무더기');return '굴러떨어지는 돌에 맞았다.'}},
     {l:'물길을 막는 둑을 쌓는다',req:()=>ruler()==='위',rq:'위군만',st:'지',d:40,act:ok=>{if(ok){P.fame+=7;return '사흘 만에 산 위의 촉군이 술렁였다.'}hurt(15,'가정의 화살');return '둑을 쌓다 화살을 맞았다.'}}],
 to:()=>{hurt(25,'가정 전투');return '어느 쪽이 이기는지도 모른 채 흙먼지 속을 달렸다.'}},
{id:'d_shiting',w:6,once:1,when:()=>P.year===228&&P.path==='군'&&((ruler()==='위'&&inR('예주','서주','연주'))||(ruler()==='오'&&inR('양주'))),time:7,title:'석정',han:'石',hr:'석',
 text:()=>ruler()==='위'?'오의 파양 태수 주방이 머리카락을 잘라 보내며 항복하겠다고 한다. 대사마 조휴가 십만을 이끌고 환성으로 간다.':'육손 도독이 석정에 군을 숨겼다. 주방의 거짓 항복을 믿은 조휴가 깊숙이 들어온다.',
 ch:[{l:'조휴를 따라 깊이 들어간다',req:()=>ruler()==='위',rq:'위군만',st:'무',d:55,act:ok=>{if(ok){P.fame+=6;hurt(15,'석정의 매복');return '사방에서 오군이 일어났다. 가규의 구원군 덕에 협석을 빠져나왔다.'}hurt(45,'석정의 매복');return '수레와 군장을 버리고 달아나다 쓰러졌다.'}},
     {l:'거짓 항복이라고 간언한다',req:()=>ruler()==='위',rq:'위군만',st:'지',d:50,act:ok=>{if(ok){P.fame+=8;return '조휴는 듣지 않았다. 하지만 당신이 지킨 퇴로 덕에 많은 이가 살았다.'}P.fame=Math.max(0,P.fame-3);return '겁쟁이라며 후방으로 밀려났다.'}},
     {l:'협석 길목을 막는다',req:()=>ruler()==='오',rq:'오군만',st:'무',d:50,act:ok=>{if(ok){P.fame+=12;return '달아나는 위군의 목을 수없이 베었다.'}hurt(35,'위군의 창');return '궁지에 몰린 위군이 거세게 덤볐다.'}},
     {l:'버려진 군수품을 줍는다',req:()=>ruler()==='오',rq:'오군만',p:.8,act:ok=>{if(ok){P.wealth+=12;return '수레 하나 가득 갑옷과 쌀을 거두었다.'}hurt(20,'군율');return '군율을 어겼다고 곤장을 맞았다.'}}],
 to:()=>{hurt(25,'석정 전투');return '산길에서 길을 잃었다.'}},
{id:'d_chencang',w:6,once:1,when:()=>P.year>=228&&P.year<=229&&P.path==='군'&&(ruler()==='촉'||(ruler()==='위'&&inR('량주','사례'))),time:7,title:'진창성',han:'倉',hr:'창',
 text:()=>ruler()==='촉'?'겨울, 승상이 수만 군으로 진창을 에워쌌다. 성을 지키는 학소의 군사는 천 명 남짓이라 한다.':'학소 장군과 천여 명이 진창을 지킨다. 성 밖에 촉군 수만이 운제와 충차를 끌고 왔다.',
 ch:[{l:'불화살로 운제를 태운다',req:()=>ruler()==='위',rq:'위군만',st:'무',d:50,act:ok=>{if(ok){P.fame+=10;return '운제가 불타며 위에 탄 촉병이 떨어졌다. 이십여 일을 버텼다.'}hurt(35,'촉군의 쇠뇌');return '성가퀴에 몸을 내밀었다가 쇠뇌를 맞았다.'}},
     {l:'성 안에서 맞굴을 판다',req:()=>ruler()==='위',rq:'위군만',st:'지',d:45,act:ok=>{if(ok){P.fame+=8;return '땅속에서 촉군의 굴을 옆으로 끊었다.'}hurt(30,'무너진 갱도');return '굴이 무너져 흙에 묻혔다가 끌려 나왔다.'}},
     {l:'운제를 타고 오른다',req:()=>ruler()==='촉',rq:'촉군만',st:'무',d:60,act:ok=>{if(ok){P.fame+=8;hurt(15,'진창의 불화살');return '성벽에 올랐다가 밀려났다. 성은 끝내 떨어지지 않았다.'}hurt(45,'진창의 불화살');return '불붙은 운제와 함께 떨어졌다.'}},
     {l:'군량 수레를 지킨다',req:()=>ruler()==='촉',rq:'촉군만',act:()=>{P.fame+=3;hurt(5,'겨울 추위');return '군량이 다하자 승상은 군을 돌렸다. 언 손으로 빈 수레를 끌고 돌아왔다.'}}],
 to:()=>{hurt(25,'진창 공방');return '성벽 아래서 돌에 맞았다.'}},
{id:'d_jianye',w:5,once:1,when:()=>P.year>=229&&P.year<=230&&inR('양주','형주')&&P.age>=14,time:7,title:'건업 천도',han:'業',hr:'업',
 text:()=>'오왕이 무창 남쪽 교외에서 황제에 올랐다. 가을에는 도읍을 건업으로 옮긴다고 한다.',
 ch:[{l:'건업으로 옮겨 가게를 연다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',st:'정',d:45,act:ok=>{moveTo('양주');if(P.path==='민')setPath('상');if(ok){P.wealth+=15;return '새 도읍에 몰려드는 관리와 군사 덕에 장사가 잘되었다.'}P.wealth=Math.max(0,P.wealth-8);return '목 좋은 자리는 이미 권세가들 차지였다.'}},
     {l:'천도하는 배를 젓는다',p:.8,act:ok=>{if(ok){P.wealth+=5;return '품삯을 두둑이 받았다.'}hurt(15,'장강');return '짐을 싣다 배에서 떨어졌다.'}},
     {l:'축하 잔치에 가서 술을 얻어 마신다',act:()=>{P.wealth+=1;P.s.매+=1;return '황제가 셋이 되었다. 하늘에 해는 하나라던데, 잔치 술은 달았다.'}}],
 to:()=>'천도 행렬이 강을 따라 내려갔다.'},
{id:'d_yizhou',w:5,once:1,when:()=>P.year===230&&ruler()==='오'&&(P.path==='군'||(P.path==='민'&&P.age>=16&&P.age<=50)),time:7,title:'바다 건너 이주',han:'島',hr:'도',
 text:()=>'장군 위온과 제갈직이 갑사 만 명을 이끌고 바다 건너 이주(夷州)를 찾아 떠난다. 배에 탈 사람을 모은다.',
 ch:[{l:'배에 오른다',p:.4,act:ok=>{setPath('군');if(ok){P.fame+=8;hurt(10,'뱃멀미');return '이주 사람 수천을 데리고 돌아왔다. 함께 간 이 열에 여덟은 돌아오지 못했다.'}hurt(45,'바다 건너 역병');return '섬에서 역병이 돌았다. 살아 돌아온 것이 기적이었다.'}},
     {l:'병을 핑계로 빠진다',st:'지',d:45,act:ok=>{if(ok){P.s.지+=1;return '이듬해, 두 장군은 공 없이 돌아와 옥에서 죽었다.'}hurt(15,'곤장');return '꾀병이 들통나 곤장을 맞았다.'}},
     {l:'배 만드는 일만 거든다',act:()=>{P.wealth+=4;hurt(5,'과로');return '못질만 하고 품삯을 받았다. 떠난 배들은 대부분 돌아오지 않았다.'}}],
 to:()=>{setPath('군');hurt(30,'바다 건너 역병');return '끌려가 배에 실렸다.'}},
{id:'d_wuzhu',w:4,once:1,when:()=>P.year>=221&&P.year<=226&&ruler()==='위'&&['민','상'].includes(P.path)&&P.age>=16,time:7,title:'비단으로 셈하다',han:'錢',hr:'전',
 text:()=>'조정이 오수전을 폐하고 곡식과 비단으로만 사고팔게 했다. 장터에 물 먹인 곡식과 얇은 비단이 돈다.',
 ch:[{l:'나도 곡식에 물을 먹인다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=12;P.s.매-=3;return '무게가 늘어 셈이 남았다. 양심은 줄었다.'}hurt(15,'곤장');P.wealth=Math.max(0,P.wealth-10);return '시장 관리에게 걸려 곤장을 맞고 곡식을 빼앗겼다.'}},
     {l:'저울과 자로 꼼꼼히 따진다',st:'정',d:40,act:ok=>{if(ok){P.wealth+=5;return '속임수를 다 골라냈다. 손해 본 일이 없었다.'}P.wealth=Math.max(0,P.wealth-6);return '젖은 쌀을 제값에 샀다.'}},
     {l:'숨겨 둔 동전을 땅에 묻는다',act:()=>{const amt=Math.max(3,Math.round(P.wealth*.2));P.wealth=Math.max(0,P.wealth-amt);later('f3_wuzhu_dig',Math.max(1,227-P.year),{amt});return '동전 꾸러미를 항아리에 담아 뒷마당에 묻었다. 당장 쓸 밑천은 줄었다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-4);return '얇은 비단 한 필에 보리 한 섬을 내주었다.'}},
{id:'d_shanyue',w:5,once:1,when:()=>P.year>=234&&P.year<=236&&inR('양주')&&ruler()==='오'&&['적','민'].includes(P.path)&&P.age>=14,time:7,title:'단양의 산월',han:'越',hr:'월',
 text:()=>'단양 태수 제갈각이 산 아래 길목을 막고 가을걷이를 모두 성안으로 거둬들였다. 산채에 곡식이 떨어져 간다.',
 ch:[{l:'산을 내려가 항복한다',req:()=>P.path==='적',rq:'도적만',act:()=>{setPath('민');P.wealth+=5;return '제갈각은 항복한 자를 평민으로 받아 주고 곡식을 나눠 주었다.'}},
     {l:'끝까지 산채를 지킨다',req:()=>P.path==='적',rq:'도적만',st:'무',d:55,act:ok=>{if(ok){P.wealth+=8;P.fame+=4;return '관창 하나를 털어 겨울을 넘겼다.'}hurt(35,'굶주림');return '풀뿌리로 버티다 쓰러졌다.'}},
     {l:'산에 숨은 친척을 데려온다',req:()=>P.path==='민',rq:'백성만',st:'매',d:45,act:ok=>{if(ok){P.fame+=5;return '친척 일가가 산을 내려와 호적에 올랐다.'}hurt(20,'산월의 독화살');return '산채 입구에서 독화살이 날아왔다.'}},
     {l:'제갈각의 병사가 된다',st:'무',d:40,act:ok=>{setPath('군');if(ok){P.fame+=5;return '산에서 내려온 이들 가운데 장정 사만이 군사가 되었다. 당신도 그중 하나였다.'}hurt(15,'훈련');return '훈련이 혹독했다.'}}],
 to:()=>{hurt(20,'굶주림');return '겨울이 왔다. 곡식은 오지 않았다.'}},
{id:'d_liaodong',w:6,once:1,when:()=>P.year===238&&inR('유주')&&P.age>=14,time:7,title:'양평 함락',han:'遼',hr:'료',
 text:()=>'태위 사마의가 장맛비 속에 공손연의 양평을 에워쌌다. 성이 떨어지면 열다섯 넘은 사내는 모두 벤다는 말이 돈다.',
 ch:[{l:'식구들을 데리고 성을 빠져나간다',st:'지',d:50,act:ok=>{if(ok){P.s.매+=3;return '수레 바닥에 아이들을 숨겨 빠져나왔다. 성이 떨어진 날 성안 사내 칠천이 죽었다.'}hurt(30,'양평의 화살');return '성문에서 들켰다. 화살을 맞고 겨우 식구들만 내보냈다.'}},
     {l:'위군에 길을 안내한다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=10;P.fame+=4;return '요동 길을 아는 눈이 쓸모 있었다. 상을 받았다.'}hurt(20,'공손연 잔당의 칼');return '공손연의 잔당에게 들켜 얻어맞았다.'}},
     {l:'중원 출신이라며 고향으로 간다',p:.7,act:ok=>{const r=moveTo(pick(['기주','청주']));if(ok)return `중원 사람은 돌아가도 좋다는 영이 내렸다. ${jo(r,'로')} 돌아왔다.`;hurt(20,'귀향길');return `${jo(r,'로')} 가는 길은 멀고 험했다.`}}],
 to:()=>{hurt(30,'양평 함락');return '성이 떨어지던 날, 시체 더미 사이에 숨어 겨우 칼을 면했다.'}},
{id:'d_gaoping',w:8,once:1,when:()=>P.year===249&&inR('사례')&&P.age>=14,time:7,title:'고평릉의 정변',han:'陵',hr:'릉',
 text:()=>'황제와 대장군 조상이 고평릉에 참배 간 사이 태부 사마의가 낙양 성문을 닫았다. 낙수 부교에 군사가 섰다.',
 ch:[{l:'성문을 빠져나가 조상에게 알린다',req:()=>P.path==='관',rq:'관리만',st:'지',d:55,act:ok=>{if(ok){P.fame+=5;const r=moveRandom();return `환범과 함께 성을 빠져나갔으나 조상은 끝내 인끈을 풀었다. 삼족이 멸해지기 전에 ${jo(r,'로')} 달아났다.`}die('낙양 성문');return '성문에서 붙잡혔다.'}},
     {l:'태부에게 충성 서약을 올린다',req:()=>P.path==='관',rq:'관리만',st:'정',d:45,act:ok=>{if(ok){P.fame+=8;return '사마씨의 조정에서 자리를 지켰다.'}P.fame+=1;return '줄을 선 자가 너무 많았다.'}},
     {l:'성문이 닫힌 틈에 쌀을 사 둔다',req:()=>P.path!=='관'&&P.wealth>=5,rq:'관리가 아니고 5천 전 이상 있을 때만',st:'정',d:45,act:ok=>{if(ok){P.wealth+=6;return '성문이 닫힌 며칠 사이 쌀값이 두 배가 되었다.'}P.wealth=Math.max(0,P.wealth-3);return '성문이 곧 열렸다. 쌀값은 그대로였다.'}},
     {l:'대문을 닫고 식구들을 단속한다',act:()=>{P.s.지+=2;return '난리에는 나서지 않는 법이다. 열흘 뒤 조상 일가의 목이 저자에 걸렸다.'}}],
 to:()=>'성문이 다시 열렸을 때 조정의 얼굴이 바뀌어 있었다.'},
{id:'d_xincheng',w:6,once:1,when:()=>P.year===253&&inR('양주')&&ruler()==='오'&&P.age>=14,time:7,title:'동흥 다음 해',han:'興',hr:'흥',
 text:()=>'지난겨울 동흥에서 이긴 제갈 태부가 이번에는 이십만을 일으켜 신성을 친다. 집집마다 사내를 내라 한다.',
 ch:[{l:'징발에 응해 군량 수레를 끈다',st:'무',d:45,act:ok=>{if(ok){P.fame+=6;return '여름 역병 속에서 살아 돌아왔다. 신성은 끝내 떨어지지 않았다.'}hurt(35,'신성의 역병');return '진영에 역병이 돌았다. 몸이 버티지 못했다.'}},
     {l:'산골 친척 집에 숨는다',st:'지',d:45,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-3);return '처가 쪽 산골에서 여름을 넘겼다. 원정군 태반이 병으로 쓰러졌다.'}hurt(15,'곤장');P.wealth=Math.max(0,P.wealth-10);return '들켜서 곤장을 맞고 벌금을 냈다.'}},
     {l:'제갈 가문과 오간 서찰을 태운다',req:()=>P.path==='관',rq:'관리만',act:()=>{P.s.지+=2;return '겨울, 손준이 연회 자리에서 제갈각을 베고 삼족을 멸했다. 당신은 무사했다.'}}],
 to:()=>{hurt(20,'신성의 역병');return '끌려가지는 않았지만 돌아온 이웃들이 역병을 옮겨 왔다.'}},
{id:'d_shouchun',w:6,once:1,when:()=>P.year>=257&&P.year<=258&&inR('예주','서주')&&P.age>=14,time:7,title:'수춘 포위',han:'淮',hr:'회',
 text:()=>'관구검이 쓰러진 지 두 해, 이번에는 제갈탄이 수춘에서 일어났다. 포위군 군량을 나를 부역이 고을마다 떨어졌다.',
 ch:[{l:'부역에 나간다',st:'무',d:50,act:ok=>{if(ok){P.wealth+=3;return '해를 넘겨 수춘이 떨어졌다. 제갈탄의 부하 수백은 하나씩 베일 때까지 항복하지 않았다고 한다.'}hurt(30,'수춘 부역');return '수레 무게를 이기지 못하고 허리를 다쳤다.'}},
     {l:'곡식을 바쳐 부역을 면한다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',act:()=>{P.wealth-=12;return '곳간을 덜어 집안 사내들을 지켰다.'}},
     {l:'수춘에서 도망친 친척을 숨긴다',st:'지',d:55,act:ok=>{if(ok){P.s.매+=5;P.fame+=3;return '친척은 이름을 바꾸고 살아남았다.'}hurt(35,'연좌');P.wealth=Math.floor(P.wealth*.5);return '연좌되어 옥에 갇혔다가 재산 절반을 내고 풀려났다.'}}],
 to:()=>{hurt(20,'수춘 부역');return '명단에 이름이 올라 끌려갔다.'}},
{id:'d_yinping',w:8,once:1,when:()=>P.year===263&&inR('익주')&&P.age>=14,time:7,title:'음평의 길',han:'險',hr:'험',
 text:()=>'위장 등애가 길 없는 음평 산길 칠백 리를 넘어 강유(江油)에 나타났다. 검각을 지키는 강유 장군은 아직 모른다.',
 ch:[{l:'면죽의 제갈첨 군에 든다',st:'무',d:55,act:ok=>{if(ok){P.fame+=10;hurt(20,'면죽의 화살');return '제갈 승상의 아들이 면죽에서 죽었다. 당신은 시체 더미에서 기어 나왔다.'}hurt(50,'면죽의 화살');return '창을 제대로 잡아 보기도 전에 화살이 날아왔다.'}},
     {l:'식구들을 데리고 산으로 피한다',p:.75,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-3);return '산속 절벽 아래서 겨울을 넘겼다. 나라가 망했다는 소식은 나무꾼이 전해 주었다.'}hurt(20,'피난길');return '눈길에서 미끄러졌다.'}},
     {l:'등애 군에 길과 곡식을 내준다',st:'정',d:45,act:ok=>{if(ok){P.wealth+=6;return '등애는 노략을 금했다. 황제가 손을 뒤로 묶고 관을 수레에 싣고 항복했다.'}P.wealth=Math.max(0,P.wealth-15);return '곡식만 빼앗겼다.'}}],
 to:()=>'사흘 뒤, 성도의 황제가 관을 수레에 싣고 나와 항복했다는 소식을 들었다.'},
{id:'d_jinchao',prio:1,when:()=>P.year===265&&ruler()==='진'&&P.age>=14,time:8,title:'다시 선양',han:'晉',hr:'진',
 text:()=>'진왕 사마염이 위의 천자에게서 제위를 넘겨받는다. 마흔다섯 해 전 조비가 한에게서 받은 그대로다.',
 ch:[{l:()=>P.age>=55?'한이 위가 되던 날을 손주들에게 들려준다':'노인들에게 한이 위가 되던 날 이야기를 듣는다',act:()=>{P.s.매+=3;if(P.age>=55)return '아이들은 왕조가 바뀌는 걸 처음 본다고 했다. 당신은 두 번째였다.';P.s.지+=1;return '노인은 그날도 장이 섰다고 했다. 왕조가 바뀌어도 세금은 걷혔다.'}},
     {l:'새 조정에 축하 글을 올린다',st:'정',d:45,act:ok=>{if(ok){P.fame+=6;return '당신의 글이 고을 관아에 걸렸다.'}P.s.지+=1;return '글은 돌아오지 않았다.'}},
     {l:'벼슬을 내려놓고 물러난다',req:()=>['관','군'].includes(P.path),rq:'관리·군인만',act:()=>{P.flags.retired=title();setPath('민');P.wealth+=8;P.hp=Math.min(maxHp(),P.hp+10);return '두 왕조를 섬길 수는 없다며 인끈을 풀었다.'}}],
 to:()=>'연호가 태시로 바뀌었다. 세금 고지서의 글자만 달라졌다.'},
{id:'d_wumie',prio:1,when:()=>P.year===280&&inR('양주','형주')&&P.age>=14,time:8,title:'석두성의 항복',han:'降',hr:'항',
 text:()=>'익주에서 내려온 왕준의 누선이 장강을 덮었다. 강을 가로지른 쇠사슬은 횃불에 녹았다. 건업이 술렁인다.',
 ch:[{l:'마지막으로 성을 지킨다',st:'무',d:60,act:ok=>{if(ok){P.fame+=8;return '성벽 위에서 하루를 버텼다. 이튿날 황제가 먼저 항복했다.'}hurt(45,'건업 공방');return '성벽 아래로 밀려 떨어졌다.'}},
     {l:'향을 피워 진군을 맞는다',st:'매',d:40,act:ok=>{if(ok){P.wealth+=5;return '사람 얼굴 가죽을 벗기던 손호의 시절이 끝났다. 진의 군사는 마을을 건드리지 않았다.'}P.wealth=Math.max(0,P.wealth-10);return '진의 병졸들이 닭과 쌀을 가져갔다.'}},
     {l:()=>P.age>=60?'손주들에게 살아온 세상을 들려준다':'노인들에게 옛이야기를 청해 듣는다',act:()=>{P.fame+=3;P.s.지+=1;return P.age>=60?'황건부터 오의 멸망까지, 이야기는 사흘 밤 동안 이어졌다. 천하는 다시 하나가 되었다.':'황건부터 오의 멸망까지, 노인의 이야기는 사흘 밤 동안 이어졌다. 천하는 다시 하나가 되었다.'}}],
 to:()=>'손호가 손을 뒤로 묶고 관을 끌고 나왔다. 황건이 일어난 지 아흔여섯 해 만에 천하가 하나가 되었다.'},
{id:'d_cowfair',w:4,cd:6,when:()=>P.year>=160&&P.year<=260&&['민','상'].includes(P.path)&&P.age>=14,time:6,title:'소장수',han:'秤',hr:'칭',
 text:()=>'장터에서 소를 산다. 소장수는 다섯 살배기라고 우기는데, 이빨이 이상하게 반질반질하다.',
 ch:[{l:'이빨을 꼼꼼히 들여다본다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=5;return '갈아 낸 이빨이었다. 값을 반으로 깎았다.'}P.wealth=Math.max(0,P.wealth-8);return '열 살 넘은 늙은 소였다. 이듬해 쟁기도 못 끌었다.'}},
     {l:'시장 관리에게 고발한다',st:'매',d:50,act:ok=>{if(ok){P.fame+=3;P.wealth+=3;return '소장수가 벌금을 물고 쫓겨났다.'}hurt(15,'소장수 패거리의 몽둥이');return '장터 뒷골목에서 소장수 패거리를 만났다.'}},
     {l:'흥정 없이 그냥 산다',p:.4,act:ok=>{if(ok){P.wealth+=4;return '운 좋게 튼튼한 소였다.'}P.wealth=Math.max(0,P.wealth-6);return '소가 석 달 만에 쓰러졌다.'}}],
 to:()=>'흥정하는 사이 옆 사람이 소를 끌고 갔다.'},
{id:'d_corvee',w:4,cd:5,when:()=>P.year>=160&&P.year<=260&&P.path==='민'&&P.age>=16&&P.age<=55,time:6,title:'부역',han:'役',hr:'역',
 text:()=>{P.tmp.work=pick(['성벽 수축','제방 쌓기','군량 수송','역참 길 닦기']);return `관아에서 부역 명단이 내려왔다. 한 달 동안 ${P.tmp.work}에 나가야 한다.`},
 ch:[{l:'부역에 나간다',st:'무',d:40,act:ok=>{if(ok){const n=mkName();P.s.무+=2;P.s.매+=1;later('f3_corvee_mate',rint(2,5),{n,work:P.tmp.work});return `${jo(P.tmp.work,'을/를')} 마치고 돌아왔다. 함께 흙짐을 진 ${jo(n,'과/와')} 형제처럼 되었다.`}hurt(20,P.tmp.work);return '흙짐에 깔려 허리를 다쳤다.'}},
     {l:'사람을 사서 대신 보낸다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',act:()=>{P.wealth-=10;return '이웃집 머슴이 대신 갔다. 비단 한 필 값이 나갔다.'}},
     {l:'산으로 도망친다',st:'지',d:50,act:ok=>{if(ok){P.s.매-=1;return '산에서 한 달을 버텼다. 명단은 다음 사람에게 넘어갔고 이웃들의 눈길이 차가워졌다.'}hurt(20,'곤장');P.wealth=Math.max(0,P.wealth-5);return '붙잡혀 곤장을 맞고 두 배로 일했다.'}}],
 to:()=>{hurt(15,'부역');return '대답도 하기 전에 끌려갔다.'}},
{id:'d_mourning',w:3,once:1,when:()=>P.year>=160&&P.year<=260&&P.age>=20&&P.age<=50&&!P.flags.orphan&&P.fam&&P.fam.fa&&P.fam.fa.alive,time:7,title:'상복',han:'喪',hr:'상',
 text:()=>{const f=P.fam.fa;f.alive=0;f.d=P.year;P.tmp.fa=f.n;const who=/아버지/.test(f.n)?'아버지가':`아버지 ${jo(f.n,'이/가')}`;return `${who} 세상을 떠났다. 예법대로라면 삼 년 동안 상복을 입고 무덤 곁 움막에서 지내야 한다.`},
 ch:[{l:'무덤 곁 움막에서 삼 년을 지낸다',p:.7,act:ok=>{P.wealth=Math.max(0,P.wealth-8);P.s.매+=4;if(ok){P.fame+=8;spend(3,'여묘살이','삼 년 상을 마쳤다. 효자라는 소문이 군 전체에 퍼져 있었다.');return '상복을 입고 무덤 곁 움막으로 들어갔다.'}P.fame+=5;hurt(20,'상중의 병');spend(3,'여묘살이','삼 년 상을 마쳤다. 죽만 먹으며 곡하다 뼈만 남았지만 사람들은 그것도 효라 했다.');return '상복을 입고 움막으로 들어갔다. 몸이 버틸지 걱정이다.'}},
     {l:'후하게 장례를 치른다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=15;P.fame+=3;later('f3_grave_robbed',rint(2,5),{n:P.tmp.fa||'아버지'});return '옥 장식과 칠기를 넣어 묻었다. 장례 행렬을 지켜보는 낯선 눈이 몇 있었다.'}},
     {l:'간소히 묻고 일터로 돌아간다',act:()=>{P.wealth+=3;P.s.매-=2;return '살아 있는 식구가 먼저였다. 친척들이 수군거렸다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '장례를 미루는 사이 친척들 입방아에 올랐다.'}},
{id:'d_salt',w:4,cd:5,when:()=>P.year>=160&&P.year<=260&&['상','적'].includes(P.path)&&P.age>=16,time:6,title:'밀염',han:'鹽',hr:'염',
 text:()=>'관청 소금은 비싸고 바닷가 소금은 싸다. 밀염 짐을 지고 관문 샛길을 넘자는 제안이 들어왔다.',
 ch:[{l:'밀염을 지고 샛길을 넘는다',st:'지',d:50,act:ok=>{if(ok){const n=mkName();P.wealth+=15;later('f3_salt_boss',rint(1,2),{n});return `소금 한 짐이 비단 한 필이 되었다. 짐을 대 준 ${jo(n,'이/가')} 당신을 눈여겨보았다.`}hurt(25,'관문 수졸의 매');P.wealth=Math.floor(P.wealth*.6);return '관문 수졸에게 붙잡혀 소금을 빼앗기고 매를 맞았다.'}},
     {l:'밀염꾼들을 관에 밀고한다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=6;P.fame+=2;later('f3_salt_revenge',rint(2,4),{});return '포상금을 받았다. 붙잡혀 가던 밀염꾼 하나가 당신 얼굴을 오래 쳐다보았다.'}hurt(20,'밀염꾼의 칼');return '밀고한 사실이 새어 나갔다.'}},
     {l:'관청 소금만 판다',act:()=>{P.wealth+=2;P.s.정+=1;return '남는 건 적었지만 밤에 잠은 편히 잤다.'}}],
 to:()=>'제안한 자는 다른 짐꾼을 찾아갔다.'},
{id:'d_chupu',w:4,cd:4,when:()=>P.year>=160&&P.year<=260&&P.path==='군',time:6,title:'저포 판',han:'博',hr:'박',
 text:()=>'야영지 모닥불 가에서 저포 판이 벌어졌다. 다섯 개의 나무쪽이 굴러간다. 한 달 치 녹봉이 걸렸다.',
 ch:[{l:'판에 낀다',p:.45,act:ok=>{if(ok){P.wealth+=10;return '노(盧)가 연달아 나왔다. 주머니가 불룩해졌다.'}P.wealth=Math.max(0,P.wealth-10);return '한 달 치 녹봉을 다 잃었다.'}},
     {l:'나무쪽에 몰래 손을 쓴다',st:'지',d:55,act:ok=>{if(ok){P.wealth+=18;P.s.매-=2;return '아무도 눈치채지 못했다. 잃은 동료들이 밤새 한숨을 쉬었다.'}hurt(25,'노름판 칼부림');return '들켰다. 칼부림이 났다.'}},
     {l:'군율을 내세워 판을 엎는다',req:()=>P.rank>=2,rq:'십장 이상',st:'통',d:45,act:ok=>{if(ok){P.fame+=4;return '병사들이 투덜대며 흩어졌다. 군기가 섰다.'}P.s.매-=3;return '병사들의 미움만 샀다.'}}],
 to:()=>{P.s.매-=1;return '구경만 하다 판이 끝났다. 끼지 않았다고 핀잔을 들었다.'}},
{id:'d_guosuo',w:3,cd:5,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.age>=18,time:7,title:'과소',han:'印',hr:'인',
 text:()=>'호적이 없는 피난민 일가가 관문을 넘게 과소(過所)를 하나 써 달라고 한다. 관인을 찍는 건 당신 몫이다.',
 ch:[{l:'몰래 과소를 써 준다',st:'지',d:45,act:ok=>{P.s.매+=4;if(ok){const n=mkName();later('f3_guosuo_son',rint(5,9),{n});return `그 가족이 무사히 관문을 넘었다는 말을 들었다. 막내아이 이름이 ${n}이라 했다.`}hurt(20,'문책');P.fame=Math.max(0,P.fame-4);return '관문에서 위조가 드러나 문책을 받았다.'}},
     {l:'돈을 받고 써 준다',act:()=>{P.wealth+=12;P.flags.corrupt=1;later('f3_guosuo_audit',rint(2,4),{});return '비단 두 필을 받았다. 장부에 흔적이 남았다.'}},
     {l:'법대로 거절한다',act:()=>{P.s.정+=1;P.s.매-=1;return '가족은 밤에 샛길로 떠났다. 상관은 당신을 깐깐하다고 칭찬했다.'}}],
 to:()=>'답을 미루는 사이 가족이 사라졌다.'},
{id:'d_heir',w:5,once:1,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.age>=18,time:6,title:'두목의 자리',han:'寨',hr:'채',
 text:()=>{P.tmp.n=mkName();return `늙은 두목이 화살 독으로 죽어 간다. 졸개들이 둘로 갈라져 당신과 둘째 두목 ${jo(P.tmp.n,'을/를')} 번갈아 본다.`},
 ch:[{l:'두목 자리를 차지한다',st:'통',d:50,act:ok=>{if(ok){P.fame+=10;P.wealth+=8;return '두목의 칼을 물려받았다. 졸개들이 무릎을 꿇었다.'}hurt(35,'둘째 두목의 칼');return '둘째 두목이 먼저 칼을 뽑았다.'}},
     {l:'둘째에게 양보한다',act:()=>{P.s.매+=3;later('f3_heir_second',rint(2,4),{n:P.tmp.n||'두목'});return `산채는 갈라지지 않았다. ${jo(P.tmp.n||'둘째','은/는')} 당신을 오른팔로 삼았다.`}},
     {l:'산채 재물을 챙겨 달아난다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=15;setPath('민');const r=moveRandom();return `금붙이를 품고 ${jo(r,'로')} 가서 새 이름으로 살았다.`}hurt(25,'추격대의 몽둥이');return '산을 내려가기도 전에 붙잡혔다.'}}],
 to:()=>'둘째 두목이 자리를 차지했다. 당신을 보는 눈빛이 차갑다.'},
/* ---- 후속·일상 사건 ---- */
{id:'f1_child_pal',when:()=>false,time:8,title:'골목 졸병',han:'伴',hr:'반',
 text:()=>`어릴 적 골목 전쟁놀이에서 늘 당신의 졸병이던 ${jo(P.tmp.q.n,'이/가')} 찾아왔다. 산적 무리의 소두목이 되었다며 함께 가자고 한다.`,
 ch:[{l:()=>P.path==='적'?'무리를 합친다':'산채로 함께 간다',req:()=>P.path!=='관',rq:'관리는 불가',act:()=>{const n=P.tmp.q.n;if(P.path==='적'){P.fame+=5;P.s.통+=2;return `${n}의 무리가 당신 밑으로 들어왔다. 대장 노릇은 어릴 때와 다르지 않았다.`}setPath('적');P.s.무+=3;P.fame+=3;return `${jo(n,'과/와')} 함께 산으로 들어갔다. 이번에도 당신이 대장이었다.`}},
     {l:'관아에 알린다',act:()=>{P.wealth+=5;P.fame+=3;P.s.매-=3;return `${jo(P.tmp.q.n,'은/는')} 붙잡혀 목이 베였다. 상금을 받았지만 마음이 무거웠다.`}},
     {l:'밥 한 끼 먹여 돌려보낸다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=2;kind(P.tmp.q.n,'어릴 적 골목 동무');return `${jo(P.tmp.q.n,'은/는')} 국밥 두 그릇을 비우고 고개 숙여 인사한 뒤 떠났다.`}}],
 to:()=>`대답을 기다리던 ${jo(P.tmp.q.n,'은/는')} 말없이 떠났다.`},
{id:'f1_orphan',when:()=>false,time:8,title:'먼 친척',han:'族',hr:'족',
 text:()=>'난리 때 부모를 잃은 당신을 먼 친척이라는 사람이 찾아왔다. 당신 집안의 땅이 아직 호적에 남아 있다고 한다.',
 ch:[{l:'친척을 따라 땅을 찾으러 간다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=12;return '현청 호적을 뒤져 아버지 이름이 적힌 땅을 되찾았다.'}P.wealth=Math.max(0,P.wealth-3);return '친척은 땅문서를 챙겨 사라졌다. 사기꾼이었다.'}},
     {l:'땅을 친척에게 맡긴다',act:()=>{P.wealth+=4;P.s.매+=2;return '친척은 해마다 곡식 몇 섬을 보내왔다. 적었지만 끊기지 않았다.'}},
     {l:'지금 사는 곳에 남는다',act:()=>{P.s.정+=1;return '부모 없는 땅에 돌아가고 싶지 않았다. 친척은 섭섭해하며 떠났다.'}}],
 to:()=>'친척은 대답을 기다리다 혼자 떠났다.'},
{id:'f1_heishan',when:()=>false,time:8,title:'흑산의 사자',han:'黑',hr:'흑',
 text:()=>'흑산의 우두머리 장연이 조정에 사자를 보내 평난중랑장 벼슬을 받았다. 산채 무리에게도 호적에 오를 길이 열렸다.',
 ch:[{l:'산을 내려와 호적에 오른다',act:()=>{setPath('민');P.wealth+=3;return '이름을 새로 올리고 산기슭에 밭을 받았다. 다시 백성이 되었다.'}},
     {l:'장연 밑에서 두령이 된다',req:()=>P.path==='적',rq:'도적만',act:()=>{P.fame+=6;P.s.통+=2;return '장연은 당신에게 골짜기 하나를 맡겼다. 조정도 이제 함부로 건드리지 못한다.'}},
     {l:'따로 무리를 꾸려 독립한다',req:()=>P.path==='적',rq:'도적만',st:'통',d:50,act:ok=>{if(ok){P.fame+=8;return '당신을 따라 나선 졸개가 수백이었다.'}hurt(25,'흑산 두령들의 칼');return '배신자라며 두령들이 칼을 뽑았다. 맨몸으로 도망쳤다.'}}],
 to:()=>'우물쭈물하는 사이 귀순 명단이 닫혔다.'},
{id:'f1_liubei_pingyuan',when:()=>false,time:8,title:'평원의 부름',han:'召',hr:'소',
 text:()=>P.tmp.q.m?'예전에 당신이 돈을 대 주었던 유비가 평원상이 되었다. 그가 사람을 보내 당신을 찾는다.':'탁현에서 함께 의병을 일으켰던 유비가 평원상이 되었다. 흩어진 옛 동료들을 부른다는 전갈이 왔다.',
 ch:[{l:'평원으로 간다',act:()=>{moveTo('청주');if(P.path!=='군'&&P.path!=='관')setPath('군');P.fame+=5;P.flags.liu=1;later('f1_liubei_xiapi',Math.max(1,196-P.year),{});return '유비는 옛 동료를 반기며 한 상에서 밥을 먹었다. 그는 손님을 신분으로 가리지 않았다.'}},
     {l:'편지와 예물만 보낸다',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.s.매+=2;P.fame+=2;return '"훗날 꼭 갚겠소." 짧은 답장이 왔다.'}},
     {l:'지금 자리를 지킨다',act:()=>{P.wealth+=2;return '전갈을 가져온 사람은 아쉬워하며 돌아갔다. 그 뒤로 유비의 이름은 소문으로만 들었다.'}}],
 to:()=>'답을 미루는 사이 사자는 떠났다.'},
{id:'f1_liubei_xiapi',when:()=>false,time:7,title:'하비 함락',han:'邳',hr:'비',
 text:()=>'유비가 원술을 막으러 나간 사이 여포가 하비를 빼앗고 유비의 처자를 사로잡았다. 군중이 흩어지기 시작한다.',
 ch:[{l:'끝까지 유비를 따른다',act:()=>{P.fame+=6;P.flags.liu=1;hurt(15,'굶주림');return '광릉에서 굶주린 군사들이 서로 잡아먹을 지경이 되었다. 그래도 그의 곁을 지켰다.'}},
     {l:'여포에게 항복한다',st:'매',d:40,act:ok=>{moveTo('서주');if(ok){P.fame+=2;return '여포는 항복한 자들을 그대로 받아 주었다.'}hurt(25,'여포군의 매질');return '첩자로 의심받아 매를 맞았다.'}},
     {l:'고향으로 돌아간다',act:()=>{setPath('민');moveTo('유주');return '먼 길을 걸어 유주로 돌아왔다. 싸움이라면 이제 지긋지긋했다.'}}],
 to:()=>{hurt(20,'하비의 난리');P.wealth=Math.floor(P.wealth*.5);return '혼란 속에 짐과 말을 다 잃었다.'}},
{id:'f1_changan',when:()=>false,time:7,title:'장안의 변',han:'變',hr:'변',
 text:()=>inR('사례')?'동탁이 여포의 창에 죽었다. 그러나 이각과 곽사가 서량병을 이끌고 장안에 쳐들어와 거리마다 피가 흐른다.':'장안에서 소식이 왔다. 동탁이 죽은 뒤 이각과 곽사가 장안을 짓밟았다고 한다.',
 ch:[{l:'관동으로 달아난다',req:()=>inR('사례'),rq:'장안에 있을 때만',st:'지',d:45,act:ok=>{if(ok){moveTo('예주');return '함곡관을 넘어 동쪽으로 빠져나왔다.'}hurt(35,'서량병의 칼');return '관문 앞에서 서량병에게 붙잡혔다. 칼을 맞고 버려졌다.'}},
     {l:'성안에 숨어 버틴다',req:()=>inR('사례'),rq:'장안에 있을 때만',act:()=>{hurt(10,'장안의 난리');P.wealth=Math.floor(P.wealth*.6);later('f1_changan2',Math.max(1,194-P.year),{});return '집 바닥을 파고 들어가 숨었다. 서량병이 세간을 다 쓸어 갔다.'}},
     {l:'함께 끌려갔던 이들을 떠올린다',req:()=>!inR('사례'),rq:'장안을 떠났을 때만',act:()=>{P.s.정+=1;return '천도 길에서 헤어진 이들의 소식은 끝내 오지 않았다. 그 이름들을 하나씩 떠올렸다.'}}],
 to:()=>{if(inR('사례')){hurt(30,'이각군의 칼');return '피할 곳을 찾기도 전에 서량병이 문을 부수었다.'}return '소식을 전한 이는 한숨만 쉬었다.'}},
{id:'f1_changan2',when:()=>false,time:7,title:'삼보 대기근',han:'饉',hr:'근',
 text:()=>'삼보에 큰 가뭄이 들었다. 곡식 한 섬이 오십만 전, 콩과 보리도 이십만 전이다. 사람이 사람을 먹는다는 말이 돈다.',
 ch:[{l:'황제가 연 죽 쑤는 곳에 줄을 선다',p:.6,act:ok=>{if(ok)return '헌제가 태창을 열어 쑨 죽을 얻어먹었다. 묽었지만 살았다.';hurt(30,'굶주림');return '죽은 물처럼 묽었다. 감독관이 곡식을 빼돌린 것이다.'}},
     {l:'살림을 다 팔아 곡식을 산다',act:()=>{P.wealth=Math.floor(P.wealth*.2);hurt(8,'굶주림');return '집과 세간을 곡식 몇 말과 바꾸었다. 그 몇 말로 겨울을 났다.'}},
     {l:'관동으로 걸어서 떠난다',act:()=>{moveTo('예주');hurt(25,'굶주림');return '백골이 쌓인 길을 걸어 동쪽으로 갔다.'}}],
 to:()=>{hurt(35,'굶주림');return '풀뿌리도 남지 않았다.'}},
{id:'f1_coal_cao',when:()=>false,time:8,title:'청주병',han:'靑',hr:'청',
 text:()=>'청주 황건 백만이 연주로 밀려들었다. 연주목이 된 조조가 이들을 항복받아 날랜 자들을 골라 청주병을 만든다.',
 ch:[{l:'청주병 조련을 맡는다',req:()=>P.path==='군',rq:'군인만',st:'통',d:45,act:ok=>{if(ok){P.fame+=8;P.s.통+=3;return '거친 황건 출신들을 대오에 맞춰 세웠다. 조조가 당신 이름을 기억했다.'}hurt(20,'항복한 황건의 칼');return '조련 중에 칼부림이 났다.'}},
     {l:'항복한 무리의 호적 정리를 돕는다',st:'정',d:40,act:ok=>{if(ok){P.fame+=5;P.s.정+=2;return '남녀 수십만의 이름을 새 호적에 올렸다.'}P.fame=Math.max(0,P.fame-2);return '장부가 엉켜 문책을 받았다.'}},
     {l:'조조 곁을 떠난다',act:()=>{setPath('민');const r=moveRandom();return `조조가 하는 일을 끝까지 지켜볼 자신이 없었다. ${jo(r,'로')} 떠났다.`}}],
 to:()=>'그새 일은 다른 사람에게 돌아갔다.'},
{id:'f1_coal_sunjian',when:()=>false,time:8,title:'현산의 화살',han:'峴',hr:'현',
 text:()=>'손견이 유표를 치다가 양양 현산에서 황조 군사의 화살에 맞아 죽었다. 맏아들 손책은 아직 어리다.',
 ch:[{l:'관을 모시고 곡아로 간다',act:()=>{P.fame+=5;P.s.매+=2;moveTo('양주');P.flags.sunjian=1;return '곡아에 장례를 치렀다. 어린 손책이 당신의 손을 잡고 아버지의 원수를 잊지 않겠다고 했다.'}},
     {l:'원술의 군에 남는다',act:()=>{P.fame+=2;moveTo('예주');return '손견의 군사는 원술에게 넘어갔다. 당신도 그 틈에 섞였다.'}},
     {l:'창을 내려놓는다',act:()=>{setPath('민');return '장수가 죽자 군은 흩어졌다. 고향으로 걸어서 돌아갔다.'}}],
 to:()=>'관이 떠나는 것을 멀리서 보기만 했다.'},
{id:'f1_xuzhou_liubei',when:()=>false,time:8,title:'서주의 새 주인',han:'讓',hr:'양',
 text:()=>'도겸이 병으로 죽으며 서주를 유비에게 맡겼다. 새 주인이 성을 지킨 이들을 불러 모은다.',
 ch:[{l:'유비의 군에 남는다',act:()=>{if(P.path!=='관')setPath('군');P.fame+=4;P.flags.liu=1;return '유비는 성벽 위에서 싸운 이들의 이름을 하나하나 물었다.'}},
     {l:'진등의 둔전 일을 돕는다',st:'정',d:40,act:ok=>{if(ok){P.wealth+=6;P.s.정+=2;return '전농교위 진등 밑에서 물길을 트고 둔전을 돌보았다.'}P.wealth+=1;return '장부 일에 서툴러 한 철 만에 쫓겨났다.'}},
     {l:'무너진 집으로 돌아간다',act:()=>{setPath('민');P.wealth+=3;return '불탄 집터에 다시 기둥을 세웠다.'}}],
 to:()=>'부름에 답하지 않았다. 새 주인은 곧 당신을 잊었다.'},
{id:'f1_famine_thief',when:()=>false,time:7,title:'쌀가마의 빚',han:'債',hr:'채',
 text:()=>`흉년에 당신이 털었던 창고의 주인, ${P.tmp.q.n}씨 집안 사람이 당신 얼굴을 알아보았다.`,
 ch:[{l:'쌀값을 갑절로 갚는다',req:()=>P.wealth>=15,rq:'1만5천 전 필요',act:()=>{P.wealth-=12;P.s.매+=3;return '주인은 한참 말이 없다가 돈을 받았다. "그해엔 다들 짐승이었지."'}},
     {l:'사람을 잘못 봤다고 잡아뗀다',st:'매',d:50,act:ok=>{if(ok){P.s.매-=2;return '상대는 고개를 갸웃하며 돌아섰다.'}hurt(20,'하인들의 몽둥이');P.fame=Math.max(0,P.fame-3);return '하인들이 몰려와 몽둥이를 휘둘렀다.'}},
     {l:'그 집 머슴으로 일해 갚는다',act:()=>{P.s.매+=2;P.s.무+=1;hurt(10,'고된 머슴살이');return '세 해 동안 그 집 논을 갈았다. 빚은 갚았고 허리는 굽었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-4);return '소문이 퍼졌다. 도둑이라는 꼬리표가 붙었다.'}},
{id:'f1_tuntian_tax',when:()=>false,time:7,title:'둔전의 가을',han:'秋',hr:'추',
 text:()=>'둔전에서 몇 해를 보냈다. 둔전관이 올해 소출을 부풀려 매기고, 모자란 몫은 부역으로 채우라 한다.',
 ch:[{l:'둔전민들을 대신해 하소연한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;later('f1_tuntian_rise',rint(2,3),{});return '사정을 들은 전농중랑장이 둔전관을 갈아 치웠다. 둔전민들이 당신을 따르기 시작했다.'}hurt(20,'곤장');return '곤장 스무 대를 맞고 쫓겨났다.'}},
     {l:'부역을 나간다',act:()=>{hurt(12,'부역');P.wealth+=2;return '성벽 돌을 지고 한 철을 보냈다. 품삯으로 좁쌀 몇 말을 받았다.'}},
     {l:'밤에 둔전을 빠져나간다',act:()=>{P.flags.tuntian=0;P.wealth=Math.floor(P.wealth*.7);const r=moveRandom();return `둔전민은 마음대로 떠날 수 없다. 이름을 숨기고 ${jo(r,'로')} 달아났다.`}}],
 to:()=>{hurt(10,'부역');return '말 한마디 못 하고 부역에 끌려갔다.'}},
{id:'f1_tuntian_rise',when:()=>false,time:7,title:'둔전의 우두머리',han:'田',hr:'전',
 text:()=>'둔전민들이 당신을 우두머리로 받들자, 전농중랑장이 당신을 둔전의 말단 관리로 쓰겠다고 한다.',
 ch:[{l:'관리가 된다',act:()=>{setPath('관');P.rank=Math.max(P.rank,1);P.fame+=3;return '붓과 장부를 받았다. 이제 거두는 쪽이 되었다.'}},
     {l:'둔전민으로 남는다',act:()=>{P.s.매+=3;P.wealth+=5;return '이웃들과 함께 남았다. 그해 물길을 새로 내어 소출이 늘었다.'}}],
 to:()=>'자리는 다른 사람에게 돌아갔다.'},
{id:'f1_guandu_after',when:()=>false,time:7,title:'원씨 형제',han:'袁',hr:'원',
 text:()=>'원소가 피를 토하고 죽었다. 셋째 아들 원상이 뒤를 잇자 맏아들 원담이 들고일어났다.',
 ch:[{l:'원상을 따라 업성을 지킨다',act:()=>{moveTo('기주');P.fame+=4;later('f1_ye_fall',2,{});return '업성으로 들어갔다. 조조의 군세가 해마다 가까워졌다.'}},
     {l:'청주의 원담에게 간다',act:()=>{moveTo('청주');P.fame+=2;return '청주로 가 원담 밑에 들었다. 형제의 싸움은 조조만 이롭게 했다.'}},
     {l:'조조에게 항복한다',st:'매',d:45,act:ok=>{moveTo('연주');if(ok){P.fame+=3;return '창을 거꾸로 들고 조조 진영으로 건너갔다. 조조는 항복한 자들을 받아 주었다.'}hurt(25,'항복병 심문');return '첩자로 의심받아 한참을 묶여 있었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '혼란 속에 부대가 흩어졌다.'}},
{id:'f1_ye_fall',when:()=>false,time:7,title:'업성 함락',han:'鄴',hr:'업',
 text:()=>inR('기주')?'조조가 장수의 물을 끌어 업성을 잠갔다. 성안 사람 태반이 굶어 죽었다. 심배는 끝까지 항복하지 않는다.':'업성이 물에 잠겼다는 소식이 왔다. 그곳에 남은 옛 동료들은 굶주리고 있다고 한다.',
 ch:[{l:'심배와 함께 성을 지킨다',req:()=>inR('기주'),rq:'업성에 있을 때만',st:'무',d:60,act:ok=>{if(ok){P.fame+=8;return '성이 떨어지고 심배는 목이 베였다. 당신은 끝까지 싸운 공을 인정받아 조조군에 편입되었다.'}die('업성 함락');return '무너진 성문으로 조조군이 밀려들었다.'}},
     {l:'성문을 열어 조조군을 들인다',req:()=>inR('기주'),rq:'업성에 있을 때만',st:'지',d:45,act:ok=>{if(ok){P.fame+=5;return '심배의 조카 심영과 함께 동문을 열었다. 조조는 문을 연 이들을 살려 주었다.'}hurt(35,'심배의 칼');return '심배의 군사에게 들켰다.'}},
     {l:'성벽을 넘어 달아난다',act:()=>{setPath('민');moveTo('병주');hurt(15,'탈출');return '밤에 줄을 타고 성벽을 내려와 병주로 숨어들었다. 이제 군인이 아니다.'}}],
 to:()=>{hurt(40,'업성의 굶주림');return '성안에서 굶주림에 쓰러졌다.'}},
{id:'f1_longzhong',when:()=>false,time:8,title:'삼고초려',han:'顧',hr:'고',
 text:()=>P.tmp.q.a?'융중에서 만났던 그 선비 제갈량이 유비를 따라 나섰다. 유비가 세 번을 찾아간 끝이라 한다.':'예전에 당신이 비웃었던 융중의 선비가 유비를 따라 나섰다. 유비가 세 번이나 찾아갔다고 한다. 이름은 제갈량이었다.',
 ch:[{l:'제갈량을 찾아가 일자리를 청한다',req:()=>!!P.tmp.q.a,rq:'그와 쌓은 인연이 없다',st:'지',d:50,act:ok=>{if(ok){setPath('관');P.rank=Math.max(P.rank,1);P.fame+=5;moveTo('형주');return '제갈량은 당신을 기억했다. 신야에서 문서 일을 맡게 되었다.'}P.s.지+=2;return '제갈량은 정중했지만 당신에게 줄 자리는 없었다. 그가 권한 책 몇 권을 얻어 왔다.'}},
     {l:'그의 말을 떠올려 곡식을 사 둔다',act:()=>{P.s.지+=2;P.wealth+=5;return '형주가 곧 싸움터가 된다는 뜻이었다. 사 둔 곡식이 이듬해 값이 뛰었다.'}},
     {l:'사람 일은 모른다며 웃는다',act:()=>{P.s.매+=1;return P.tmp.q.a?'"그 친구, 결국 나갔군." 혼잣말을 하며 술을 한 잔 따랐다.':'그때 비웃은 일을 누구에게도 말하지 않기로 했다.'}}],
 to:()=>'소식은 바람처럼 지나갔다.'},
{id:'f1_yizhou_coin',when:()=>false,time:7,title:'직백전',han:'錢',hr:'전',
 text:()=>'곳간이 비자 유파의 건의로 한 닢이 백 전 값을 하는 직백전을 찍었다. 장터의 물건값이 들썩인다.',
 ch:[{l:'옛 돈을 서둘러 물건으로 바꾼다',st:'지',d:40,act:ok=>{if(ok){P.wealth=Math.floor(P.wealth*1.15)+2;return '쌀과 베를 사서 쌓아 두었다가 값이 오르자 되팔았다.'}P.wealth=Math.floor(P.wealth*.9);return '한발 늦었다. 이미 값이 뛰어 있었다.'}},
     {l:'관에서 정한 값을 따른다',act:()=>{P.wealth=Math.floor(P.wealth*.85);P.s.정+=2;return '관시에서 정한 값대로 팔았다. 손해를 봤지만 탈은 없었다.'}},
     {l:'관시 일을 맡겠다고 나선다',req:()=>P.path==='관'||P.s.정>=50,rq:'관리 또는 정무 50 이상',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;return '몇 달 만에 관청 곳간이 다시 찼다. 유파가 당신 이름을 적어 두었다.'}P.fame=Math.max(0,P.fame-2);return '값을 잘못 매겨 장꾼들의 원성을 샀다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.9);return '손 놓고 있는 사이 가진 돈의 값이 떨어졌다.'}},
{id:'f1_jingzhou_wu',when:()=>false,time:7,title:'여몽의 군령',han:'令',hr:'령',
 text:()=>'강릉에 들어온 여몽은 백성의 물건에 손대지 말라 명했다. 삿갓 하나를 가져간 병사도 목이 베였다. 그때 거래한 병사가 찾아왔다.',
 ch:[{l:'오군에 쌀을 대기로 한다',act:()=>{P.wealth+=8;P.s.매-=1;if(P.path==='민')setPath('상');return '오군은 값을 꼬박꼬박 치렀다. 관우 편 사람들은 당신을 곱게 보지 않았다.'}},
     {l:'오의 관리로 써 달라 청한다',st:'정',d:50,act:ok=>{if(ok){setPath('관');P.rank=Math.max(P.rank,1);return '형주 민심을 달래려던 손권은 당신 같은 토박이를 반겼다.'}return '자리는 강동 사람들 몫이었다. 병사는 미안해하며 돌아갔다.'}},
     {l:'문을 닫는다',act:()=>{P.s.정+=1;return '"관 장군이 돌아오면 어쩌려고." 문을 닫았다. 관우는 돌아오지 않았다.'}}],
 to:()=>'병사는 기다리다 돌아갔다.'},
{id:'f1_beifa_deserter',when:()=>false,time:7,title:'탈영병 수색',han:'捕',hr:'포',
 text:()=>'호적을 다시 맞추는 관리가 마을에 왔다. 몇 해 전 군에서 달아난 자를 찾는다고 한다. 탈영병의 처자는 관노비가 된다.',
 ch:[{l:'이웃들에게 입을 막아 달라 한다',req:()=>P.wealth>=5,rq:'5천 전 필요',act:()=>{P.wealth-=5;return '이웃들이 입을 다물어 주었다. 그 대가로 해마다 그 집들에 품을 팔았다.'}},
     {l:'스스로 자수한다',st:'매',d:45,act:ok=>{setPath('군');if(ok){P.s.매+=2;return '마침 사면령이 내려 죽음은 면했다. 다시 군적에 올랐다.'}hurt(35,'군법');return '곤장 백 대를 맞고 변방 둔전으로 보내졌다.'}},
     {l:'또 달아난다',act:()=>{P.wealth=Math.floor(P.wealth*.6);const r=moveRandom();return `식구를 데리고 밤길을 걸어 ${jo(r,'로')} 갔다.`}}],
 to:()=>{hurt(40,'군법');setPath('군');return '관리가 당신 얼굴을 알아보았다.'}},
{id:'f1_caocao_again',when:()=>false,time:7,title:'두 번째 부름',han:'辟',hr:'벽',
 text:()=>'조조의 사자가 다시 왔다. "이번에도 머뭇거리면 잡아 오라는 명을 받았소."',
 ch:[{l:'이번에는 응한다',act:()=>{const war=P.s.무+P.s.통>P.s.지+P.s.정;setPath(war?'군':'관');P.rank=Math.max(P.rank,1);P.fame+=2;return '끌려가다시피 출사했다. 조조는 당신을 한참 지켜보기만 했다.'}},
     {l:'중풍이 들었다며 누워 버틴다',st:'지',d:55,act:ok=>{if(ok){P.s.매+=3;P.fame+=4;return '사자가 밤에 몰래 들여다봤지만 당신은 꼼짝하지 않았다. 사자는 돌아갔다.'}hurt(20,'옥살이');setPath('관');P.rank=Math.max(P.rank,1);return '꾀병이 들통나 묶여 끌려갔다. 조조는 웃으며 말단 자리를 주었다.'}},
     {l:'식구를 데리고 강동으로 달아난다',act:()=>{moveTo('양주');P.wealth=Math.floor(P.wealth*.6);P.fame+=2;return '조조의 손이 닿지 않는 강 건너로 떠났다.'}}],
 to:()=>{setPath('관');P.rank=Math.max(P.rank,1);return '사자가 당신을 수레에 태워 끌고 갔다.'}},
{id:'f1_sunce_death',when:()=>false,time:7,title:'손책의 죽음',han:'刺',hr:'자',
 text:()=>P.tmp.q.far?'사냥을 나갔던 손책이 옛 오군 태수 허공의 식객들에게 습격당해 죽었다고 한다. 겨우 스물여섯이었다.':'손책이 사냥길에 허공의 식객들에게 얼굴을 맞고 끝내 숨졌다. 아우 손권은 열아홉, 군중이 술렁인다.',
 ch:[{l:'손권을 섬긴다',req:()=>P.path==='군',rq:'군인만',act:()=>{P.fame+=5;return '장소와 주유가 손권을 받들자 군중이 가라앉았다. 당신도 새 주인 앞에 엎드렸다.'}},
     {l:'이 틈에 고향으로 돌아간다',req:()=>P.path==='군',rq:'군인만',act:()=>{setPath('민');return '한 시대가 끝났다고 여겼다. 창을 내려놓았다.'}},
     {l:'새 주인의 됨됨이를 살핀다',req:()=>P.path!=='군',rq:'군인이 아닐 때만',act:()=>{P.s.정+=1;return '"형만은 못하다"는 말과 "사람을 쓸 줄 안다"는 말이 함께 돌았다.'}}],
 to:()=>'장례 행렬이 길게 이어졌다.'},
{id:'f1_huatuo_relapse',when:()=>false,time:7,title:'묵은 병',han:'痼',hr:'고',
 text:()=>'화타가 삼 년 뒤 다시 도질 것이라 했던 병이 올라왔다. 광릉 태수 진등도 같은 말을 듣고 죽었다는 소문이다.',
 ch:[{l:'화타를 찾아 나선다',req:()=>P.year<=207,rq:'화타가 살아 있을 때만',p:.7,act:ok=>{P.wealth=Math.max(0,P.wealth-5);if(ok){P.hp=maxHp();return '수소문 끝에 화타를 만났다. 그는 약 한 첩으로 병을 뿌리 뽑았다.'}hurt(30,'묵은 병');return '화타는 조조에게 불려 가 만날 수 없었다.'}},
     {l:'동네 의원에게 보인다',p:.5,act:ok=>{P.wealth=Math.max(0,P.wealth-2);if(ok)return '동네 의원의 처방이 뜻밖에 들었다.';hurt(35,'묵은 병');return '약값만 들고 병은 깊어졌다.'}},
     {l:'이를 악물고 버틴다',act:()=>{hurt(rint(15,40),'묵은 병');return '한 철을 꼬박 앓았다.'}}],
 to:()=>{hurt(30,'묵은 병');return '손쓸 틈도 없이 병이 깊어졌다.'}},
{id:'f1_conscript_bribe',when:()=>false,time:7,title:'또 온 관리',han:'索',hr:'색',
 text:()=>'지난번 돈을 받아 간 관리가 또 왔다. "올해는 장정 명단이 길어서 말이야." 손을 내민다.',
 ch:[{l:'또 쥐여준다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=18;return '관리는 내년에도 들르겠다며 웃었다.'}},
     {l:'현령에게 고발한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;return '관리가 쫓겨났다. 새로 온 관리는 명단을 공정하게 짰다.'}hurt(15,'곤장');if(P.path==='민'||P.path==='상')setPath('군');return '현령과 관리는 한통속이었다. 곤장을 맞고 군에 끌려갔다.'}},
     {l:'이번엔 창을 받는다',req:()=>P.path==='민'||P.path==='상',rq:'백성·상인만',act:()=>{setPath('군');return '더 털릴 돈도 없었다. 군적에 이름을 올렸다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.7);return '관리는 대답이 없자 집 안의 곡식을 퍼 갔다.'}},
{id:'f1_bandit_meet',when:()=>false,time:6,title:'칼자국 사내',han:'面',hr:'면',
 text:()=>'장터에서 왼뺨에 칼자국이 있는 사내를 보았다. 몇 해 전 고갯길에서 당신 보따리를 털어 간 그 두목이다.',
 ch:[{l:'정장에게 알린다',st:'지',d:40,act:ok=>{if(ok){P.wealth+=6;P.fame+=3;return '사내는 붙잡혔다. 현상금을 받았다.'}hurt(20,'도적의 칼');return '정장이 굼뜬 사이 사내가 먼저 눈치챘다. 그날 밤 칼을 맞았다.'}},
     {l:'다가가 물건값을 돌려 달라 한다',st:'매',d:50,act:ok=>{if(ok){P.wealth+=5;P.s.매+=1;return '사내는 멋쩍게 웃으며 돈을 내놓았다. "그해엔 나도 굶었소."'}P.wealth=Math.max(0,P.wealth-2);return '사내는 모른 척하며 인파 속으로 사라졌다. 그사이 소매치기가 당신 주머니를 털었다.'}}],
 to:()=>'머뭇거리는 사이 사내는 인파 속으로 사라졌다.'},
{id:'f1_xiaolian_patron',when:()=>false,time:7,title:'옛 은인',han:'舊',hr:'구',
 text:()=>`당신을 효렴으로 천거해 준 ${P.tmp.q.n} 태수가 모함을 받아 옥에 갇혔다. 그 집 대문 앞이 쓸쓸하다.`,
 ch:[{l:'옛 은인을 위해 상소한다',st:'정',d:55,act:ok=>{if(ok){P.fame+=10;return '태수가 풀려났다. 의리 있는 고리라는 칭송이 돌았다.'}hurt(15,'연좌');P.rank=Math.max(0,P.rank-1);return '상소는 묵살되고 당신도 한 계급 내려앉았다.'}},
     {l:'옥바라지를 돕는다',req:()=>P.wealth>=5,rq:'5천 전 필요',act:()=>{const n=P.tmp.q.n;P.wealth-=5;P.s.매+=3;kind(n[0]+pick(GIV),'당신이 옥바라지를 도운 태수의 아들');return `날마다 밥을 넣어 주었다. ${jo(n,'은/는')} 끝내 옥에서 죽었지만, 그 집안은 당신을 잊지 않았다.`}},
     {l:'발길을 끊는다',act:()=>{P.fame=Math.max(0,P.fame-3);P.s.매-=2;return '의리 없는 자라는 말을 들었다. 그래도 자리는 무사했다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '머뭇거리는 사이 태수는 옥에서 죽었다.'}},
{id:'f1_graft_revenge',when:()=>false,time:7,title:'돌아온 상관',han:'讐',hr:'수',
 text:()=>'당신이 고발해 파면된 옛 상관이 권세가에 줄을 대고 다시 벼슬길에 올랐다. 그가 당신을 벼르고 있다는 말이 들린다.',
 ch:[{l:'먼저 찾아가 고개를 숙인다',act:()=>{P.s.매-=3;P.fame=Math.max(0,P.fame-3);return '그는 당신이 따르는 술잔을 받으며 웃었다. 그날 밤 잠을 이루지 못했다.'}},
     {l:'그의 새 비리를 모아 둔다',st:'지',d:55,act:ok=>{if(ok){P.fame+=8;return '그는 다시 쫓겨났다. 이번에는 돌아오지 못했다.'}hurt(25,'모함');P.rank=Math.max(0,P.rank-1);return '그가 한발 빨랐다. 당신이 좌천되었다.'}},
     {l:'먼 곳으로 떠난다',act:()=>{P.fame=Math.max(0,P.fame-1);const r=moveRandom();return `${jo(r,'로')} 옮겨 갔다. 그의 손은 거기까지 닿지 않았다.`}}],
 to:()=>{P.rank=Math.max(0,P.rank-1);return '손쓸 틈도 없이 좌천 명령이 내려왔다.'}},
{id:'f1_caught_son',when:()=>false,time:7,title:'억울한 아들',han:'冤',hr:'원',
 text:()=>`${P.tmp.q.n}의 아들이 찾아왔다. "아버지는 장부를 고치지 않았습니다. 누가 고쳤는지 아시지요?"`,
 ch:[{l:'사실을 털어놓고 사죄한다',act:()=>{P.fame=Math.max(0,P.fame-8);P.s.매+=5;P.wealth=Math.floor(P.wealth*.5);return '재산 절반을 그 집에 넘겼다. 아들은 침을 뱉고 돌아섰지만 칼을 들지는 않았다.'}},
     {l:'모른다고 돌려보낸다',act:()=>{P.s.매-=2;later('f1_caught_avenge',rint(2,5),{n:P.tmp.q.n});return '아들은 오래 당신 얼굴을 쳐다보다가 떠났다.'}},
     {l:'돈을 쥐여 입을 막는다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=15;if(R()<.5)later('f1_caught_avenge',rint(3,6),{n:P.tmp.q.n});return '아들은 돈을 받았다. 눈빛은 그대로였다.'}}],
 to:()=>{later('f1_caught_avenge',rint(2,5),{n:P.tmp.q.n});return '아들은 대답을 듣지 못하고 돌아갔다.'}},
{id:'f1_caught_avenge',when:()=>false,time:6,title:'복수',han:'仇',hr:'구',
 text:()=>`밤길에 복면한 사내가 칼을 들고 막아섰다. "${P.tmp.q.n}의 원수!"`,
 ch:[{l:'맞서 싸운다',st:'무',d:50,act:ok=>{if(ok){P.s.매-=1;return '칼을 쳐내고 사내를 붙잡았다. 관아는 아버지 원수를 갚으려 한 효자라며 가벼운 벌만 내렸다.'}hurt(40,'원수의 칼');return '사내의 칼이 옆구리를 갈랐다. 그는 어둠 속으로 사라졌다.'}},
     {l:'무릎을 꿇고 죄를 고한다',p:.5,act:ok=>{if(ok){P.s.매+=4;P.fame=Math.max(0,P.fame-5);if(P.path==='관')setPath('민');return '사내는 칼을 떨구고 울었다. 다음 날 관아에 나가 그날의 일을 밝히고 벼슬을 내놓았다.'}die('원수의 칼');return '사내의 칼은 망설이지 않았다.'}},
     {l:'달아난다',p:.6,act:ok=>{if(ok){const r=moveRandom();return `그 길로 ${jo(r,'로')} 떠났다. 다시는 돌아가지 않았다.`}hurt(30,'원수의 칼');return '등에 칼을 맞고 쓰러졌다.'}}],
 to:()=>{hurt(45,'원수의 칼');return '얼어붙은 사이 칼이 날아왔다.'}},
{id:'f1_lawsuit_farmer',when:()=>false,time:7,title:'땅 잃은 농부',han:'怨',hr:'원',
 text:()=>`몇 해 전 송사에서 땅을 잃은 ${jo(P.tmp.q.n,'이/가')} 산적 무리에 들었다는 소문이다. 그가 당신 이름을 입에 올린다고 한다.`,
 ch:[{l:'사람을 보내 땅값을 물어 준다',req:()=>P.wealth>=15,rq:'1만5천 전 필요',act:()=>{P.wealth-=12;P.s.매+=3;return `${jo(P.tmp.q.n,'은/는')} 돈을 받고 산에서 내려왔다. 그래도 고개 숙여 인사하지는 않았다.`}},
     {l:'토벌을 청해 먼저 친다',st:'통',d:50,act:ok=>{const n=P.tmp.q.n;if(ok){P.fame+=5;P.s.매-=3;return `${n}의 무리를 흩었다. 그의 목이 성문에 걸렸다.`}hurt(30,'산적의 화살');later('f1_lawsuit_farmer2',rint(1,3),{n});return '토벌대가 골짜기에서 매복에 걸렸다.'}},
     {l:'헛소문이라 여긴다',act:()=>{later('f1_lawsuit_farmer2',rint(2,4),{n:P.tmp.q.n});return '대문 빗장만 하나 더 걸었다.'}}],
 to:()=>{later('f1_lawsuit_farmer2',rint(2,4),{n:P.tmp.q.n});return '아무 손도 쓰지 못했다.'}},
{id:'f1_lawsuit_farmer2',when:()=>false,time:6,title:'산적의 습격',han:'襲',hr:'습',
 text:()=>`${jo(P.tmp.q.n,'이/가')} 이끄는 산적들이 당신 집을 덮쳤다. 횃불이 담장을 넘어온다.`,
 ch:[{l:'맞서 싸운다',st:'무',d:55,act:ok=>{if(ok){P.fame+=4;return `${jo(P.tmp.q.n,'은/는')} 붙잡혔다. 끌려가면서도 당신을 노려보았다.`}hurt(40,'산적의 칼');P.wealth=Math.floor(P.wealth*.5);return '칼을 맞고 쓰러졌다. 곳간이 털렸다.'}},
     {l:'재물을 내주고 목숨을 빈다',act:()=>{P.wealth=Math.floor(P.wealth*.3);return `${jo(P.tmp.q.n,'은/는')} 곳간을 다 털어 갔다. "이제 셈이 맞소."`}},
     {l:'뒷담을 넘어 달아난다',p:.6,act:ok=>{P.wealth=Math.floor(P.wealth*.5);if(ok)return '집은 불탔지만 식구들은 살았다.';hurt(35,'산적의 칼');return '담을 넘다 붙잡혔다.'}}],
 to:()=>{hurt(40,'산적의 칼');P.wealth=Math.floor(P.wealth*.4);return '잠에서 깨기도 전에 문이 부서졌다.'}},
{id:'f1_riot_audit',when:()=>false,time:7,title:'관창 문책',han:'倉',hr:'창',
 text:()=>'조정에서 사람이 내려왔다. 허락 없이 관창을 연 죄를 묻겠다고 한다.',
 ch:[{l:'급암의 옛일을 들어 변명한다',st:'지',d:50,act:ok=>{if(ok){P.fame+=6;P.wealth+=5;return '"백성을 살린 일이니 죄를 묻지 말라." 오히려 상을 받았다.'}P.rank=Math.max(0,P.rank-1);P.fame=Math.max(0,P.fame-2);return '한 계급 깎였다. 그래도 고을 백성들은 당신 편이었다.'}},
     {l:'빈 곡식을 내 돈으로 채운다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=18;return '사재를 털어 창고를 채웠다. 문책은 없던 일이 되었다.'}},
     {l:'달아난 현령에게 책임을 미룬다',act:()=>{P.s.매-=4;return '현령이 대신 죄를 받았다. 틀린 말은 아니었지만 뒷맛이 썼다.'}}],
 to:()=>{P.rank=Math.max(0,P.rank-1);return '변명할 틈 없이 한 계급 깎였다.'}},
{id:'f1_trade_partner',when:()=>false,time:7,title:'동업 제안',han:'契',hr:'계',
 text:()=>`${P.tmp.q.dest}의 상인 ${jo(P.tmp.q.n,'이/가')} 편지를 보냈다. 북방에서 말을 들여와 군벌에게 팔자며, 밑천을 반씩 대자고 한다.`,
 ch:[{l:'밑천을 댄다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{const v=Math.floor(P.wealth*.4);P.wealth-=v;later('f1_trade_partner2',rint(1,2),{n:P.tmp.q.n,v});return `${money(v)}을 실어 보냈다. 이제 기다릴 뿐이다.`}},
     {l:'편지로 시세만 묻는다',act:()=>{P.s.지+=2;P.wealth+=3;return `${jo(P.tmp.q.n,'이/가')} 알려 준 시세 덕에 가까운 장에서 쏠쏠히 남겼다.`}},
     {l:'답장을 쓰지 않는다',act:()=>{P.s.정+=1;return '"군벌과 얽히면 끝이 좋지 않다." 편지를 아궁이에 넣었다.'}}],
 to:()=>'답을 미루는 사이 그는 다른 동업자를 찾았다.'},
{id:'f1_trade_partner2',when:()=>false,time:7,title:'말 무리',han:'馬',hr:'마',
 text:()=>`${jo(P.tmp.q.n,'이/가')} 말 무리를 끌고 돌아왔다. 그런데 군벌의 군관이 말값을 후려치려 든다.`,
 ch:[{l:'군관에게 뒷돈을 주고 제값을 받는다',st:'정',d:45,act:ok=>{const v=P.tmp.q.v;if(ok){P.wealth+=Math.floor(v*2.2);P.fame+=3;return '말을 다 팔았다. 밑천이 두 배 넘게 불었다.'}P.wealth+=Math.floor(v*.5);return '뒷돈만 쓰고 헐값에 넘겼다.'}},
     {l:'다른 군벌에게 몰래 판다',st:'지',d:55,act:ok=>{const v=P.tmp.q.v;if(ok){P.wealth+=Math.floor(v*3);P.s.매-=2;return '더 높은 값을 부른 쪽에 넘겼다. 원래 군벌에게는 미움을 샀다.'}hurt(25,'군관의 매질');return '말을 빼돌리다 붙잡혔다. 말은 몰수되었다.'}},
     {l:'깎인 값에 넘긴다',act:()=>{P.wealth+=Math.floor(P.tmp.q.v*1.2);return '조금 남겼다. 군벌과 다투지 않은 것만도 다행이었다.'}}],
 to:()=>{P.wealth+=Math.floor(P.tmp.q.v*.8);return '머뭇거리는 사이 군관이 정한 값에 넘어갔다.'}},
{id:'f1_raid_bounty',when:()=>false,time:7,title:'현상금',han:'懸',hr:'현',
 text:()=>'지난번 털린 집안이 태수와 사돈이었다. 고을마다 당신의 생김새를 적은 방이 붙었다.',
 ch:[{l:'산채를 옮긴다',act:()=>{P.fame+=2;const r=moveRandom();return `졸개들을 이끌고 ${jo(r,'로')} 옮겨 갔다.`}},
     {l:'빼앗은 재물 일부를 돌려보낸다',p:.6,act:ok=>{P.wealth=Math.floor(P.wealth*.6);if(ok){P.s.매+=2;return '수레 하나를 돌려보내자 방이 슬그머니 떼어졌다.'}return '재물만 날렸다. 방은 그대로 붙어 있었다.'}},
     {l:'맞설 채비를 한다',st:'통',d:55,act:ok=>{if(ok){P.fame+=8;return '토벌하러 온 현병을 골짜기 매복으로 물리쳤다.'}hurt(35,'현병의 창');return '현병이 생각보다 많았다.'}}],
 to:()=>{hurt(30,'현병의 창');return '현병이 산채를 덮쳤다.'}},
{id:'f1_drought_well',when:()=>false,time:7,title:'우물 다툼',han:'井',hr:'정',
 text:()=>'당신이 판 우물 덕에 마을이 살았다. 그런데 물이 마른 이웃 마을 사람들이 물을 나눠 달라며 몰려왔다.',
 ch:[{l:'물을 나눈다',act:()=>{P.s.매+=4;P.fame+=4;P.wealth=Math.max(0,P.wealth-2);kind(mkName(),'가뭄 때 당신 우물물을 얻어 간 이웃 마을 사람');return '두 마을이 한 우물을 쓰게 되었다. 우리 논에 댈 물은 줄었다.'}},
     {l:'물값을 받는다',act:()=>{P.wealth+=6;P.s.매-=3;return '한 동이에 몇 전씩 받았다. 원망 섞인 눈길이 따라왔다.'}},
     {l:'마을 장정들과 우물을 지킨다',st:'무',d:40,act:ok=>{if(ok){P.s.무+=1;return '몽둥이를 든 장정들이 우물을 둘러쌌다. 이웃 마을은 물러갔다.'}hurt(20,'우물 싸움');return '몸싸움 끝에 머리가 깨졌다.'}}],
 to:()=>{P.s.매-=2;return '머뭇거리는 사이 두 마을 사이에 주먹다짐이 났다.'}},
{id:'f1_refugee_xue',when:()=>false,time:7,title:'형주 학관',han:'學',hr:'학',
 text:()=>'유표가 양양에 학관을 세우고 송충 같은 학자들을 모았다. 북쪽에서 피난 온 선비들이 앞다퉈 모여든다.',
 ch:[{l:'학관에 들어가 글을 배운다',req:()=>inR('형주'),rq:'형주에 있을 때만',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.s.지+=5;return '송충의 강의를 들었다. 『태현경』은 어려웠지만 귀가 트였다.'}},
     {l:'선비들 상대로 붓과 먹을 판다',req:()=>inR('형주'),rq:'형주에 있을 때만',act:()=>{P.wealth+=6;if(P.path==='민')setPath('상');return '양양 장터에서 붓과 먹이 날개 돋친 듯 팔렸다.'}},
     {l:'배움은 배부른 자의 몫이다',act:()=>{P.wealth+=2;return '그해 밭을 한 뙈기 더 일궜다.'}}],
 to:()=>'학관 소식은 먼 이야기로 흘려들었다.'},
{id:'f1_friend_return',when:()=>false,time:7,title:'돌아온 벗',han:'朋',hr:'붕',
 text:()=>{const q=P.tmp.q;P.tmp.good=R()<.5;return `${q.lent?'돈을 빌려 갔던':'몇 해 전 당신이 돈을 빌려주지 않았던'} 벗 ${jo(q.n,'이/가')} 다시 나타났다. ${P.tmp.good?'비단옷 차림이다.':'누더기 차림이다.'}`},
 ch:[{l:'술상을 차려 맞는다',act:()=>{const q=P.tmp.q;P.wealth=Math.max(0,P.wealth-1);if(P.tmp.good){if(q.lent){P.wealth+=Math.round(q.v*1.5)+2;P.s.매+=3;return '벗은 빌린 돈에 이자까지 얹어 갚았다. 장사로 크게 일어섰다고 한다.'}P.fame+=2;return '벗은 장사로 일어섰다고 했다. 술값은 그가 냈지만 예전 같은 정은 없었다.'}if(q.lent){P.s.매+=2;return '벗은 돈을 갚지 못했다며 울었다. 대신 당신 밭일을 한 해 거들었다.'}P.s.매+=2;kind(q.n,'당신이 굶주릴 때 술상을 차려 준 옛 벗');return '벗은 술 한 잔에 눈물을 흘렸다. "그때 자네 탓을 한 적도 있었네."'}},
     {l:'빚 이야기부터 꺼낸다',req:()=>!!P.tmp.q.lent,rq:'돈을 빌려준 경우만',act:()=>{const q=P.tmp.q;if(P.tmp.good){P.wealth+=q.v;return '벗은 군말 없이 원금을 갚고 서둘러 일어섰다.'}P.s.매-=2;return '벗은 고개를 떨구고 다시 떠났다. 돈은 영영 돌아오지 않았다.'}},
     {l:'문을 열어 주지 않는다',act:()=>{P.s.매-=2;return '벗은 한참 문 앞에 서 있다가 떠났다.'}}],
 to:()=>'벗은 기다리다 떠났다.'},
{id:'f1_sanlao_case',when:()=>false,time:7,title:'삼로의 판가름',han:'裁',hr:'재',
 text:()=>'두 집안이 논물 대는 차례를 두고 다투다 사람이 다쳤다. 삼로인 당신에게 판가름을 청한다.',
 ch:[{l:'물길을 나눠 차례를 정한다',st:'정',d:40,act:ok=>{if(ok){P.fame+=4;P.s.정+=1;return '사흘씩 번갈아 물을 대기로 했다. 두 집안이 술잔을 나눴다.'}P.fame=Math.max(0,P.fame-2);return '한쪽이 불복하고 현청에 고소했다.'}},
     {l:'다친 쪽 손을 들어 준다',act:()=>{P.s.매+=2;P.fame+=2;return '다친 집은 고마워했고 다른 집은 등을 돌렸다.'}},
     {l:'현청으로 넘긴다',act:()=>{P.fame=Math.max(0,P.fame-3);return '"삼로가 제 일을 안 한다"는 말이 돌았다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '판가름을 미루는 사이 두 집안이 또 주먹다짐을 했다.'}},
{id:'f1_hermit_pupil',when:()=>false,time:7,title:'제자의 천거',han:'薦',hr:'천',
 text:()=>`제자 ${jo(P.tmp.q.n,'이/가')} 벼슬길에 올라 이름을 날린다. 그가 조정에 스승인 당신을 천거하는 글을 올렸다.`,
 ch:[{l:'제자의 체면을 봐서 나간다',act:()=>{setPath('관');P.rank=Math.max(P.rank,3);P.fame+=5;return '흰머리로 관복을 입었다. 제자가 문밖까지 나와 맞았다.'}},
     {l:'"나는 밭이 좋다" 사양한다',act:()=>{P.fame+=5;P.s.매+=2;return '사양하는 글이 오히려 널리 읽혔다.'}},
     {l:'제자를 꾸짖는 편지를 쓴다',act:()=>{P.s.지+=2;P.fame+=2;return '"벼슬은 백성을 위해 하는 것이지 스승을 위해 하는 것이 아니다." 제자는 그 편지를 평생 간직했다.'}}],
 to:()=>'답을 미루는 사이 천거는 흐지부지되었다.'},
{id:'f1_healer_noble',when:()=>false,time:7,title:'권세가의 부름',han:'召',hr:'소',
 text:()=>`${ruler()==='한'?'조정 고관':ruler()}의 집에서 사람이 왔다. 머리가 깨질 듯 아프다는 주인을 고쳐 달라 한다.`,
 ch:[{l:'가서 침을 놓는다',st:'지',d:50,act:ok=>{if(ok){P.wealth+=15;P.fame+=6;later('f1_healer_noble2',rint(1,3),{});return '침 몇 대에 두통이 가라앉았다. 주인은 곁에 머물라 했다.'}P.fame=Math.max(0,P.fame-3);hurt(10,'권세가의 매질');return '차도가 없자 매를 맞고 쫓겨났다.'}},
     {l:'병을 핑계로 가지 않는다',act:()=>{P.fame=Math.max(0,P.fame-2);return '사자가 얼굴을 붉히며 돌아갔다. 고을 환자들은 안도했다.'}},
     {l:'제자를 대신 보낸다',p:.5,act:ok=>{if(ok){P.wealth+=5;return '제자가 잘 해냈다. 사례금 일부가 당신 몫으로 왔다.'}P.fame=Math.max(0,P.fame-2);return '제자가 실수해 당신 이름에도 금이 갔다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '답을 미루는 사이 사자가 화를 내며 돌아갔다.'}},
{id:'f1_healer_noble2',when:()=>false,time:7,title:'떠나지 못하는 의원',han:'囚',hr:'수',
 text:()=>'권세가의 전속 의원이 된 지 오래다. 고향 환자들이 기다리지만 주인은 휴가를 허락하지 않는다. 화타도 이렇게 붙잡혀 있다가 죽었다.',
 ch:[{l:'아내가 아프다 둘러대고 고향에 간다',st:'지',d:55,act:ok=>{if(ok){P.fame+=4;return '고향에 돌아와 다시 약방 문을 열었다. 주인은 더 찾지 않았다.'}hurt(45,'옥살이');P.fame=Math.max(0,P.fame-5);return '거짓이 드러났다. 화타가 걸었던 길을 따라 옥에 갇혔다가 간신히 풀려났다.'}},
     {l:'곁에 머문다',act:()=>{P.wealth+=10;P.fame=Math.max(0,P.fame-2);return '대우는 후했다. 고향 환자들의 소식은 끊겼다.'}},
     {l:'처방을 책으로 엮어 둔다',act:()=>{P.s.지+=3;return '처방을 한 권으로 엮어 제자에게 맡겼다. 화타의 책은 옥에서 불탔지만 당신의 책은 남을 것이다.'}}],
 to:()=>'또 한 해가 그렇게 갔다.'},
{id:'f1_magnate_levy',when:()=>false,time:7,title:'군량 징발',han:'糧',hr:'량',
 text:()=>`${ruler()==='한'?'주목':ruler()}의 사자가 왔다. 장원 곳간의 곡식 절반을 군량으로 내놓으라 한다. 사병들이 당신의 눈치를 본다.`,
 ch:[{l:'순순히 내놓는다',act:()=>{P.wealth=Math.floor(P.wealth*.6);P.fame+=4;return '군량을 바치자 사자는 공을 적은 문서를 남기고 갔다.'}},
     {l:'사병으로 장원 문을 걸어 잠근다',st:'통',d:60,act:ok=>{if(ok){P.fame+=6;return '사자는 빈손으로 돌아갔다. 장원은 한동안 무사했다.'}P.wealth=Math.floor(P.wealth*.3);hurt(30,'군벌의 칼');return '군벌이 군사를 보내 장원을 짓밟았다.'}},
     {l:'사병을 이끌고 군벌에 들어간다',act:()=>{setPath('군');P.rank=Math.max(P.rank,5);P.fame=Math.max(P.fame,TH.군[5])+5;return '이전이 종족과 식객을 이끌고 조조에게 갔던 것처럼, 사병을 거느리고 귀부했다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.5);return '머뭇거리는 사이 군사들이 곳간 문을 부쉈다.'}},
{id:'f1_xia_revenge',when:()=>false,time:7,title:'대신 갚는 원수',han:'劍',hr:'검',
 text:()=>`한 과부가 찾아와 무릎을 꿇었다. 남편을 죽인 호족 ${jo(P.tmp.q.n,'이/가')} 돈으로 죄를 면했다며 원수를 갚아 달라 한다.`,
 ch:[{l:'그 호족을 찾아간다',st:'무',d:55,act:ok=>{if(ok){P.fame+=10;const r=moveRandom();return `${P.tmp.q.n}의 목을 과부의 남편 무덤에 바쳤다. 그 길로 ${jo(r,'로')} 몸을 피했다.`}hurt(40,'호족 식객의 칼');return '호족의 식객들이 기다리고 있었다.'}},
     {l:'관아에 다시 고소하도록 돕는다',st:'정',d:50,act:ok=>{if(ok){P.fame+=5;return `새로 온 태수가 송사를 다시 열었다. ${jo(P.tmp.q.n,'은/는')} 옥에 갇혔다.`}P.fame=Math.max(0,P.fame-2);return '관아는 이번에도 돈을 받았다.'}},
     {l:'거절한다',act:()=>{P.fame=Math.max(0,P.fame-4);return '협객이 칼을 뽑지 않았다는 소문이 돌았다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-3);return '과부는 울며 돌아갔다.'}},
{id:'f1_bandit_siege',when:()=>false,time:7,title:'포위된 산채',han:'寨',hr:'채',
 text:()=>`사자의 목을 벤 대가로 ${ruler()==='한'?'관':ruler()}의 토벌군이 산 아래를 에워쌌다. 산채로 드는 물길이 끊겼다.`,
 ch:[{l:'밤에 포위를 뚫는다',st:'무',d:55,act:ok=>{if(ok){P.fame+=8;const r=moveRandom();return `골짜기를 타고 빠져나와 ${jo(r,'로')} 옮겨 갔다.`}hurt(40,'토벌군의 창');return '포위망에 걸려 무리 태반을 잃었다.'}},
     {l:'두령 하나를 내주고 화친한다',st:'지',d:50,act:ok=>{if(ok){P.s.매-=4;return '토벌군은 두령의 목을 받고 물러갔다.'}hurt(25,'산채의 내분');return '두령들이 눈치채고 칼을 뽑았다.'}},
     {l:'이제라도 귀순한다',st:'매',d:55,act:ok=>{if(ok){setPath('군');P.flags.yellow=0;P.fame+=3;return '늦은 귀순이라 장수 자리는 없었다. 졸병부터 다시 시작했다.'}hurt(45,'토벌군의 매질');return '"사자를 죽인 놈이 무슨 귀순이냐." 매질 끝에 산으로 쫓겨났다.'}}],
 to:()=>{hurt(40,'토벌군의 칼');return '머뭇거리는 사이 토벌군이 산채로 밀려 올라왔다.'}},
{id:'f1_mourn_filial',when:()=>false,time:7,title:'효행 표창',han:'孝',hr:'효',
 text:()=>'여묘살이를 한 일이 군에 알려졌다. 태수가 당신의 효행을 표창하고 벼슬길을 열어 주겠다고 한다.',
 ch:[{l:'천거를 받든다',act:()=>{if(P.path==='관'){P.rank+=1;P.fame+=3;return '효행이 알려져 한 계급 올랐다.'}setPath('관');P.rank=Math.max(P.rank,1);P.fame+=3;return '현청의 말단 관리로 불려 나갔다.'}},
     {l:'표창만 받는다',act:()=>{P.fame+=5;P.s.매+=2;return '태수가 집 대문에 효행을 기리는 글을 걸어 주었다.'}},
     {l:'"자식 된 도리일 뿐" 사양한다',act:()=>{P.s.매+=3;P.fame+=3;return '사양하는 말이 더 널리 퍼졌다.'}}],
 to:()=>'표창 이야기는 흐지부지되었다.'},
{id:'f1_kidwed_inlaw',when:()=>false,time:7,title:'사돈의 화',han:'禍',hr:'화',
 text:()=>{const c=(P.kids||[])[P.tmp.q.i]||{n:'딸'};P.tmp.c=c;return `사돈인 ${P.tmp.q.h} 집안이 역모에 연루되었다는 소문이 돈다. 시집간 딸 ${c.n}의 소식이 끊겼다.`},
 ch:[{l:'사람을 보내 딸을 데려온다',st:'지',d:50,act:ok=>{const c=P.tmp.c;if(ok){c.fate=`${P.tmp.q.h} 집안이 몰락해 친정으로 돌아왔다`;return '딸이 친정으로 돌아왔다. 사돈집은 얼마 뒤 몰락했다.'}hurt(20,'연좌');P.fame=Math.max(0,P.fame-4);return '딸을 데려오려다 관에 붙잡혀 연좌로 매를 맞았다.'}},
     {l:'사돈을 위해 변호한다',st:'정',d:55,act:ok=>{if(ok){P.fame+=8;P.wealth+=5;return '혐의가 풀렸다. 사돈은 당신에게 큰 빚을 졌다.'}hurt(30,'연좌');P.fame=Math.max(0,P.fame-5);return '변호는 묵살되고 당신까지 의심을 받았다.'}},
     {l:'사돈과 인연을 끊는다고 알린다',act:()=>{P.s.매-=3;return '집안은 무사했다. 딸에게서는 다시 편지가 오지 않았다.'}}],
 to:()=>'손쓸 틈도 없이 사돈 집안이 몰락했다. 딸의 소식은 끝내 듣지 못했다.'},
{id:'f1_son_return',when:()=>false,time:7,title:'아들의 소식',han:'歸',hr:'귀',
 text:()=>{const c=(P.kids||[])[P.tmp.q.i];P.tmp.c=c;if(!c||!c.alive){P.tmp.r='gone';return `전장에 나간 아들 ${c?jo(c.n,'은/는'):'은'} 이미 세상에 없다. 함께 끌려갔던 이웃 청년이 그 마지막을 전해 주었다.`}const r=R();P.tmp.r=r<.3?'dead':r<.65?'hurt':'up';if(P.tmp.r==='dead'){c.alive=0;c.fate=`${P.year}년 전장에서 죽었다`;return `전장에 나간 아들 ${c.n}의 전사 소식이 왔다. 돌아온 것은 낡은 짚신 한 켤레뿐이다.`}if(P.tmp.r==='hurt'){c.path='민';return `아들 ${jo(c.n,'이/가')} 한쪽 다리를 절며 돌아왔다. 다시는 창을 들 수 없다고 한다.`}return `아들 ${jo(c.n,'이/가')} 공을 세워 십장이 되어 휴가를 나왔다.`},
 ch:[{l:()=>['dead','gone'].includes(P.tmp.r)?'옷가지로 초혼장을 치른다':'잔치를 열어 맞는다',act:()=>{const r=P.tmp.r;P.wealth=Math.max(0,P.wealth-3);if(r==='dead'||r==='gone'){P.fame+=2;P.s.매+=1;return '시신 없이 옷가지를 묻었다. 곡소리가 마을 끝까지 들렸다.'}if(r==='hurt'){P.s.매+=2;return '살아 돌아온 것만도 고마웠다. 이웃들이 닭 한 마리씩 들고 왔다.'}P.fame+=4;return '마을 사람들이 몰려와 술을 마셨다. 아들이 자랑스러웠다.'}},
     {l:()=>['dead','gone'].includes(P.tmp.r)?'관아에 휼전을 청한다':P.tmp.r==='hurt'?'관아에 군적 삭제를 청한다':'다시는 보내지 않으려 숨긴다',act:()=>{const r=P.tmp.r,c=P.tmp.c;if(r==='dead'||r==='gone'){P.wealth+=4;return '전사자 집안이라 한 해 부역을 면제받고 곡식 몇 섬을 받았다.'}if(r==='hurt'){P.s.정+=1;return '부상병이라 군적에서 빼 주었다. 아들은 절룩이며 다시 밭을 갈았다.'}if(c)c.path='민';P.fame=Math.max(0,P.fame-2);return '아들은 탈영병이 되었다. 관리의 발길이 잦아졌다.'}}],
 to:()=>['dead','gone'].includes(P.tmp.r)?'말없이 아들의 빈 자리를 바라보았다.':'말없이 아들의 어깨를 두드렸다.'},
{id:'f2_npc_ask',w:1,when:()=>false,time:8,title:'갚을 차례',han:'債',hr:'채',
 text:()=>{const q=P.tmp.q;const n=(P.npcs||[]).find(x=>x.n===q.n);P.tmp.n=n;P.tmp.m=n&&n.alive?'alive':'dead';

       const c=Math.max(10,Math.round(P.wealth*.3));P.wealth=Math.max(0,P.wealth-c);n.bond=Math.max(0,n.bond-1);later('f2_npc_ask2',rint(2,4),{n:n.n,c});return `${jo(n.n,'이/가')} 빚을 못 갚고 달아났다. 빚쟁이들이 당신에게서 ${money(c)}을 받아 갔다.`}},
     {l:'정중히 거절한다',req:()=>P.tmp.m==='alive',rq:'그가 살아 있을 때만',act:()=>{const n=P.tmp.n;n.bond=Math.max(0,n.bond-2);P.s.매-=1;return `${jo(n.n,'이/가')} 쓴웃음을 지었다. 그 뒤로 소식이 끊겼다. (인연 ${dots(n.bond)})`}},
     {l:'혼례 비용을 대 준다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{const q=P.tmp.q;P.wealth=Math.max(0,P.wealth-5);P.s.매+=3;kind(`${q.n}의 아들`,'혼례 비용을 대 준');return '혼례 날 신랑이 당신에게 먼저 절을 올렸다.'}},
     {l:'위로의 말만 전한다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.fame=Math.max(0,P.fame-1);return '아들은 빈손으로 돌아갔다. 고을에서 인정머리 없다는 말이 돌았다.'}}],
 to:()=>{const n=P.tmp.n;if(n&&n.alive)n.bond=Math.max(0,n.bond-1);return '답을 미루는 사이 사람이 돌아갔다.'}},

     {l:'그의 고향에 제물을 보낸다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.s.매+=3;P.fame+=2;return '적장의 제사에 제물을 보낸 일로 뒷말이 있었지만, 의롭다는 말이 더 컸다.'}},

   if(P.tmp.m==='war')return `혼전 속에서 적의 창이 당신을 향했다. 곁에 있던 ${jo(q.n,'이/가')} 몸을 날려 막았다.`;
   return `${jo(q.n,'이/가')} 공을 세워 ${jo(npcTitle(n),'이/가')} 되었다. 그날 보증해 준 덕이라며 사람을 보냈다.`},
 ch:[{l:'그를 업고 빠져나온다',req:()=>P.tmp.m==='war',rq:'전장에서만',st:'무',d:50,act:ok=>{const n=P.tmp.n;if(ok){n.bond=5;P.flags.guardian=n.n;return `둘 다 살았다. ${jo(n.n,'이/가')} "아직 빚이 남았네" 하며 곁을 지키겠다고 했다.`}n.alive=0;n.fate=`${P.year}년 ${P.name}을 지키다 전사`;hurt(20,'혼전');return '진영에 닿았을 때 그는 이미 숨이 없었다.'}},
     {l:'그가 연 틈으로 돌진한다',req:()=>P.tmp.m==='war',rq:'전장에서만',act:()=>{const n=P.tmp.n;n.alive=0;n.fate=`${P.year}년 ${P.name}을 지키다 전사`;P.fame+=8;return '적진을 뚫고 공을 세웠다. 돌아와 보니 그가 쓰러진 자리에 창이 꽂혀 있었다.'}},
     {l:'그의 집안과 혼사를 맺자고 한다',req:()=>P.tmp.m==='calm',rq:'전장 밖에서만',act:()=>{const n=P.tmp.n;n.bond=5;P.fame+=3;P.wealth+=4;return `${jo(n.n,'이/가')} 크게 웃으며 예물을 보냈다. 두 집안이 사돈을 약조했다.`}},
     {l:'술 한 독만 받는다',req:()=>P.tmp.m==='calm',rq:'전장 밖에서만',act:()=>{const n=P.tmp.n;n.bond=Math.min(5,n.bond+1);P.hp=Math.min(maxHp(),P.hp+5);return '보낸 술을 이웃과 나눠 마셨다. 욕심 없다는 말이 그에게 전해졌다.'}},
     {l:'편지를 읽는다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.s.매+=2;P.s.지+=1;return '"자네 덕에 이태를 더 살았네." 편지는 그 한 줄이었다.'}},
     {l:'편지를 태운다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.s.통+=1;return '읽지 않고 태웠다. 연기가 오래 눈을 따갑게 했다.'}}],
 to:()=>{if(P.tmp.m==='war'){hurt(20,'혼전');return '정신을 차렸을 때 그는 보이지 않았다.'}return '답을 보내지 못한 채 한 해가 갔다.'}},
{id:'f2_rival_grudge',w:1,when:()=>false,time:8,title:'라이벌의 앙갚음',han:'讐',hr:'수',
 text:()=>{const q=P.tmp.q;const n=(P.npcs||[]).find(x=>x.n===q.n);P.tmp.n=n;P.tmp.m=n&&n.alive?'alive':'dead';
   return P.tmp.m==='dead'?`좌천되었던 ${jo(q.n,'이/가')} 임지에서 병으로 죽었다. 그 집안이 당신을 원수로 여긴다.`:`좌천되었던 ${jo(q.n,'이/가')} 다시 일어섰다. 그때 고발한 사람이 당신이라는 것을 알아냈다.`},
 say:()=>P.tmp.m==='alive'?[P.tmp.q.n,'고향 사람끼리 이럴 줄은 몰랐네. 이제 내 차례일세.']:null,
 ch:[{l:'먼저 찾아가 화해를 청한다',req:()=>P.tmp.m==='alive',rq:'그가 살아 있을 때만',st:'매',d:60,act:ok=>{const n=P.tmp.n;if(ok){n.bond=1;return '그는 잔을 받았지만 웃지 않았다. 그래도 칼끝은 거두었다.'}P.wealth=Math.max(0,P.wealth-6);P.fame=Math.max(0,P.fame-3);return '문전박대를 당했다. 이튿날부터 세리들이 당신 집만 들락거렸다.'}},
     {l:'증거를 더 모아 다시 맞선다',req:()=>P.tmp.m==='alive',rq:'그가 살아 있을 때만',st:'지',d:55,act:ok=>{const n=P.tmp.n;if(ok){n.rank=Math.max(0,n.rank-2);P.fame+=5;return `${jo(n.n,'이/가')} 다시 쫓겨났다. 이번에는 돌아오지 못할 것이다.`}hurt(25,'라이벌의 보복');P.wealth=Math.floor(P.wealth*.7);return '그가 먼저 손을 썼다. 옥에 갇혔다가 재물을 바치고 나왔다.'}},
     {l:'고향을 떠나 몸을 피한다',req:()=>P.tmp.m==='alive',rq:'그가 살아 있을 때만',act:()=>{P.wealth=Math.floor(P.wealth*.8);const r=moveRandom();return `세간을 정리해 ${jo(r,'로')} 떠났다.`}},
     {l:'부의를 보내고 사과한다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.wealth=Math.max(0,P.wealth-5);P.s.매+=2;return '부의는 받았지만 답례는 없었다. 그래도 원망의 목소리는 잦아들었다.'}},
     {l:'무시한다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.s.매-=2;return '그 집안 사람들이 장터에서 당신을 손가락질했다.'}}],
 to:()=>{hurt(15,'라이벌의 보복');return '손을 쓰기도 전에 그쪽 사람들이 들이닥쳤다.'}},
{id:'f2_rival_again',w:1,when:()=>false,time:7,title:'다시 견주다',han:'較',hr:'교',
 text:()=>{const q=P.tmp.q;const n=(P.npcs||[]).find(x=>x.n===q.n);P.tmp.n=n;P.tmp.m=!n||!n.alive?'dead':P.fame>=(q.f||0)+10?'up':'down';
   if(P.tmp.m==='dead')return `평생 견주던 ${q.n}의 부음을 들었다. 이제 비교할 상대가 없다.`;
   return `${jo(q.n,'과/와')} 고향 잔치에서 다시 마주쳤다. ${P.tmp.m==='up'?'이번에는 사람들이 당신 쪽을 먼저 본다.':'그는 여전히 한발 앞서 있다.'}`},
 ch:[{l:'먼저 잔을 권한다',req:()=>P.tmp.m==='up',rq:'당신이 앞섰을 때만',act:()=>{const n=P.tmp.n;n.bond=Math.min(5,n.bond+2);P.s.매+=2;return `${jo(n.n,'이/가')} "자네가 이겼네" 하고 웃었다. 오랜 응어리가 풀렸다.`}},
     {l:'그때 들은 말을 그대로 돌려준다',req:()=>P.tmp.m==='up',rq:'당신이 앞섰을 때만',act:()=>{const n=P.tmp.n;n.bond=Math.max(0,n.bond-1);P.fame+=2;P.s.매-=2;return '"자네도 좀 분발하게." 좌중이 웃었다. 그의 얼굴이 붉어졌다.'}},
     {l:'가르침을 청한다',req:()=>P.tmp.m==='down',rq:'그가 앞섰을 때만',act:()=>{const n=P.tmp.n;const k=pick(['통','지','정']);P.s[k]+=3;n.bond=Math.min(5,n.bond+1);return `자존심을 접었다. 그가 의외로 성심껏 일러 주었다. ${jo(STK[k],'이/가')} 늘었다.`}},
     {l:'승부는 끝나지 않았다며 자리를 뜬다',req:()=>P.tmp.m==='down',rq:'그가 앞섰을 때만',act:()=>{P.fame+=2;hurt(5,'울화');return '그날 밤 또 잠을 이루지 못했다.'}},
     {l:'빈소를 찾는다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=2;return '영정 앞에서 오래 서 있었다. 이긴 것도 진 것도 아니었다.'}},
     {l:'그의 몫까지 살겠다고 다짐한다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.fame+=3;P.s.통+=1;return '이튿날부터 더 일찍 일어났다.'}}],
 to:()=>'인사만 나누고 헤어졌다.'},
{id:'f2_mentor_rec',w:1,when:()=>false,time:7,title:'상관의 천거',han:'薦',hr:'천',
 text:()=>{const q=P.tmp.q;const n=(P.npcs||[]).find(x=>x.n===q.n);P.tmp.n=n;P.tmp.m=!n||!n.alive?'dead':['군','관'].includes(P.path)?'in':'out';
   if(P.tmp.m==='dead')return `누명을 벗었던 옛 상관 ${jo(q.n,'이/가')} 세상을 떠나며 당신 앞으로 서책 상자를 남겼다.`;
   return P.tmp.m==='in'?`누명을 벗었던 ${jo(q.n,'이/가')} 그때의 의리를 잊지 않고 당신을 윗자리에 천거했다.`:`누명을 벗었던 ${jo(q.n,'이/가')} 사람을 보내 다시 벼슬길에 나서라고 권한다.`},
 ch:[{l:'천거를 받는다',req:()=>P.tmp.m==='in',rq:'군인이나 관리일 때만',act:()=>{P.rank=Math.min(RANKS[P.path].length-1,P.rank+1);P.fame+=4;return `${title()} 자리에 올랐다. 옛 상관의 사람이라는 꼬리표도 함께 붙었다.`}},
     {l:'아직 이르다며 사양한다',req:()=>P.tmp.m==='in',rq:'군인이나 관리일 때만',act:()=>{P.fame+=5;P.s.매+=2;return '겸손하다는 평이 돌았다. 상관은 아쉬워했다.'}},
     {l:'권유를 받아들인다',req:()=>P.tmp.m==='out',rq:'관직에 없을 때만',act:()=>{setPath('관');P.rank=Math.max(P.rank,1);return '그의 서신 한 장으로 현청에 자리가 났다.'}},
     {l:'지금 삶이 좋다며 예물만 받는다',req:()=>P.tmp.m==='out',rq:'관직에 없을 때만',act:()=>{P.wealth+=3;P.s.매+=1;return '그가 보낸 비단으로 아이 옷을 지었다.'}},
     {l:'서책을 읽는다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.s.지+=4;P.s.통+=1;return '책 여백마다 그의 글씨가 빼곡했다.'}},
     {l:'서책을 팔아 살림에 보탠다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.wealth+=6;P.s.매-=2;return '죽간 한 수레가 좁쌀 몇 섬이 되었다.'}}],
 to:()=>'답이 늦어 천거장은 다른 사람 이름으로 올라갔다.'},
{id:'f2_mentor_son',w:1,when:()=>false,time:8,title:'상관의 아들',han:'怨',hr:'원',
 text:()=>{const q=P.tmp.q;return `모반 혐의로 처형된 옛 상관 ${q.n}의 아들이 찾아왔다. 그날 아버지를 모른 척한 사람이 당신이라는 것을 안다.`},
 say:()=>[`${P.tmp.q.n}의 아들`,'아버지는 마지막까지 당신 이름을 불렀습니다.'],
 ch:[{l:'무릎 꿇고 사죄한다',act:()=>{P.fame=Math.max(0,P.fame-3);P.s.매+=3;return '아들은 오래 울다가 돌아갔다. 그 이야기가 고을에 돌았다.'}},
     {l:'먹고살 길을 마련해 준다',act:()=>{const q=P.tmp.q;const c=Math.max(8,Math.round(P.wealth*.15));P.wealth=Math.max(0,P.wealth-c);kind(`${q.n}의 아들`,'당신이 거두어 준');return `${money(c)}을 들여 밭과 집을 마련해 주었다. 아들은 말없이 받았다.`}},
     {l:'문을 닫는다',p:.5,act:ok=>{P.s.매-=2;if(ok)return '그는 다시 오지 않았다.';hurt(25,'원한의 칼');return '몇 달 뒤 밤길에서 누군가의 칼을 맞았다.'}}],
 to:()=>{P.s.매-=1;return '아무 말도 못 하는 사이 그가 돌아섰다.'}},
{id:'f2_need_back',w:1,when:()=>false,time:7,title:'동무의 답례',han:'答',hr:'답',
 text:()=>{const q=P.tmp.q;const n=(P.npcs||[]).find(x=>x.n===q.n);P.tmp.n=n;P.tmp.m=n&&n.alive?'alive':'dead';
   return P.tmp.m==='dead'?`${q.n}의 아내가 찾아왔다. 남편이 죽기 전에 당신 빚만은 꼭 갚으라 했다며 베 두 필을 내민다.`:`빚을 갚아 주었던 동무 ${jo(q.n,'이/가')} 찾아왔다. 소금 장사로 자리를 잡았다며 동업을 청한다.`},
 ch:[{l:'밑천을 댄다',req:()=>P.tmp.m==='alive'&&P.wealth>=10,rq:'그가 살아 있고 1만 전이 있을 때만',p:.6,act:ok=>{const n=P.tmp.n,q=P.tmp.q;n.bond=5;if(ok){const g=Math.max(15,q.c||15);P.wealth+=g;return `소금 수레가 세 번 오갔다. 첫해에 ${money(g)}을 남겼다.`}P.wealth=Math.max(0,P.wealth-10);return '관문 앞에서 소금 수레를 도적에게 털렸다. 동무는 면목이 없다며 울었다.'}},
     {l:'빌려준 돈만 돌려받는다',req:()=>P.tmp.m==='alive',rq:'그가 살아 있을 때만',act:()=>{const n=P.tmp.n,q=P.tmp.q;const g=Math.round((q.c||10)*.8);P.wealth+=g;n.bond=Math.max(0,n.bond-1);return `${money(g)}을 돌려받았다. 셈은 깔끔했지만 조금 서먹해졌다.`}},
     {l:'빚은 잊으라며 술만 마신다',req:()=>P.tmp.m==='alive',rq:'그가 살아 있을 때만',act:()=>{const n=P.tmp.n;n.bond=5;P.s.매+=2;P.flags.guardian=P.flags.guardian||n.n;return `${jo(n.n,'이/가')} "이 목숨은 자네 것일세" 하며 잔을 들었다.`}},
     {l:'베를 받는다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.wealth+=3;return '베를 받아 두었다. 과부는 홀가분한 얼굴로 돌아갔다.'}},
     {l:'베를 돌려주고 아이들 몫으로 쌀을 보탠다',req:()=>P.tmp.m==='dead',rq:'그가 세상을 떠났을 때만',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=3;P.fame+=2;return '과부가 문밖에서 세 번 절하고 갔다.'}}],
 to:()=>'답을 못 하는 사이 그가 돌아갔다.'},
{id:'f2_need_sold',w:1,when:()=>false,time:7,title:'장터의 아이',han:'奴',hr:'노',
 text:()=>{const q=P.tmp.q;const n=(P.npcs||[]).find(x=>x.n===q.n);P.tmp.n=n;return `장터 노비 시장에 낯익은 아이가 목에 팻말을 걸고 서 있다. 동무 ${q.n}의 딸이다.`},
 ch:[{l:'몸값을 치르고 데려온다',act:()=>{const n=P.tmp.n,q=P.tmp.q;const c=Math.max(8,Math.round(P.wealth*.12));P.wealth=Math.max(0,P.wealth-c);if(n&&n.alive)n.bond=Math.min(5,n.bond+3);kind(q.n,'당신이 딸을 되찾아 준 동무');return `${money(c)}을 치렀다. 아이 손을 잡고 동무 집까지 걸었다.`}},
     {l:'동무를 찾아가 함께 운다',act:()=>{const n=P.tmp.n;if(n&&n.alive)n.bond=Math.min(5,n.bond+1);P.s.매+=1;hurt(5,'상심');return '술잔만 기울였다. 아이는 이튿날 먼 고을로 팔려 갔다.'}},
     {l:'고개를 돌린다',act:()=>{const n=P.tmp.n;if(n&&n.alive)n.bond=0;P.s.매-=3;return '눈이 마주쳤지만 고개를 돌렸다. 동무는 다시 당신을 찾지 않았다.'}}],
 to:()=>{P.s.매-=1;return '머뭇거리는 사이 아이가 팔려 갔다.'}},
{id:'f2_greedy_riot',w:1,when:()=>false,time:7,title:'민란',han:'亂',hr:'란',
 text:()=>`태수 ${P.tmp.q.g}의 수탈이 해를 넘겼다. 견디다 못한 사람들이 몽둥이를 들고 관아로 몰려간다. 이웃들이 당신 집 문을 두드린다.`,
 ch:[{l:'앞장선다',st:'통',d:55,act:ok=>{if(ok){P.fame+=8;P.s.통+=2;later('f2_greedy_hunt',rint(1,2),{g:P.tmp.q.g});return '태수는 담을 넘어 달아났다. 관창을 열어 곡식을 나눴다. 조정은 주모자를 찾기 시작했다.'}hurt(35,'관군의 창');return '관군의 창끝이 맨 앞줄부터 쓸었다.'}},
     {l:'뒤따라만 간다',p:.6,act:ok=>{if(ok){P.wealth+=4;return '열린 관창에서 쌀 한 말을 지고 나왔다.'}hurt(20,'관군의 몽둥이');return '흩어지는 무리에 깔려 다쳤다.'}},
     {l:'문을 걸어 잠근다',act:()=>{P.s.매-=2;return '이웃들이 당신을 겁쟁이라 불렀다. 그래도 장부에 이름은 오르지 않았다.'}}],
 to:()=>{P.s.매-=1;return '나서지도 숨지도 못하는 사이 일이 끝났다.'}},
{id:'f2_greedy_hunt',w:1,when:()=>false,time:7,title:'주모자 수배',han:'捕',hr:'포',
 text:()=>'관아를 친 주모자를 잡으라는 영이 내려왔다. 당신 이름이 수배 명단 맨 위에 있다.',
 ch:[{l:'산으로 들어간다',act:()=>{setPath('적');P.fame+=3;return '산채 사람들이 민란의 우두머리라며 맞아 주었다.'}},
     {l:'자수하고 사정을 아뢴다',st:'정',d:55,act:ok=>{if(ok){P.fame+=6;return `새로 온 태수가 태수 ${P.tmp.q.g}의 죄상을 알고 당신을 풀어 주었다.`}hurt(40,'옥사');P.wealth=Math.floor(P.wealth*.5);return '옥에 갇혀 반년을 지냈다. 가산 절반이 몸값으로 나갔다.'}},
     {l:'다른 주로 달아난다',act:()=>{P.wealth=Math.floor(P.wealth*.6);const r=moveRandom();return `호적을 버리고 ${jo(r,'로')} 숨어들었다.`}}],
 to:()=>{hurt(30,'옥사');return '포졸들이 먼저 들이닥쳤다.'}},
{id:'f2_greedy_kin',w:1,when:()=>false,time:7,title:'파면된 태수',han:'仇',hr:'구',
 text:()=>`파면된 태수 ${P.tmp.q.g}의 일족이 다시 힘을 얻었다. 고발장을 쓴 사람을 찾는다는 말이 돈다.`,
 ch:[{l:'새 태수에게 몸을 의탁한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=3;P.s.정+=2;return '태수가 당신을 문하에 두었다. 그 집안도 손을 대지 못했다.'}hurt(20,'밤길의 몽둥이');return '태수는 남의 일에 끼지 않았다. 밤길에 몽둥이를 맞았다.'}},
     {l:'장정을 사서 집을 지킨다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=8;return '밤마다 횃불 든 장정들이 집을 돌았다. 그해 겨울 아무도 오지 않았다.'}},
     {l:'고향을 떠난다',act:()=>{P.wealth=Math.floor(P.wealth*.8);const r=moveRandom();return `조용히 ${jo(r,'로')} 옮겨 갔다.`}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.8);return '밤사이 곡간에 불이 났다.'}},
{id:'f2_spring_nb',w:1,when:()=>false,time:6,title:'보리 한 말',han:'麥',hr:'맥',
 text:()=>`몇 해 전 봄, 보리 한 말을 내주었던 ${jo(P.tmp.q.nb,'이/가')} 이번엔 쌀독이 비었다. 그 집 아이가 문 앞에서 머뭇거린다.`,
 ch:[{l:'보리 두 말로 갚는다',req:()=>P.wealth>=2,rq:'2천 전 필요',act:()=>{P.wealth-=2;P.s.매+=3;return '받은 것은 갑절로 돌려주는 법이다. 그 집에서 가을에 떡을 보내왔다.'}},
     {l:'받은 만큼만 돌려준다',act:()=>{P.wealth=Math.max(0,P.wealth-1);P.s.매+=1;return '한 말을 퍼 주었다. 셈은 깔끔했다.'}},
     {l:'우리도 어렵다며 돌려보낸다',act:()=>{P.s.매-=3;return '그 집 사람들은 다시는 당신과 말을 섞지 않았다.'}}],
 to:()=>{P.s.매-=1;return '아이는 빈손으로 돌아갔다.'}},
{id:'f2_autumn_check',w:1,when:()=>false,time:7,title:'안비',han:'比',hr:'비',
 text:()=>'팔월 안비(案比)다. 아전이 호적과 밭 장부를 들고 집집을 돈다. 지난번 숨긴 곡식 자루가 아직 헛간에 있다.',
 ch:[{l:'자루를 미리 이웃집으로 옮긴다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=2;return '아전은 빈 헛간만 보고 갔다. 이웃에게는 한 말을 떼어 주었다.'}hurt(15,'곤장');P.wealth=Math.max(0,P.wealth-6);return '옮기던 길에 아전과 마주쳤다.'}},
     {l:'아전에게 술을 대접한다',req:()=>P.wealth>=3,rq:'3천 전 필요',act:()=>{P.wealth-=2;return '아전은 헛간 쪽은 보지도 않았다. 내년에도 술을 기대하는 눈치였다.'}},
     {l:'자루를 내놓고 사정한다',act:()=>{P.wealth=Math.max(0,P.wealth-4);P.fame=Math.max(0,P.fame-1);P.s.정+=1;return '벌금만 물고 매는 피했다. 마음은 편했다.'}}],
 to:()=>{hurt(12,'곤장');P.wealth=Math.max(0,P.wealth-5);return '헛간을 뒤진 아전이 자루를 찾아냈다.'}},
{id:'f2_retire_call',w:1,when:()=>false,time:7,title:'다시 부르는 소리',han:'召',hr:'소',
 text:()=>{const q=P.tmp.q;return `낙향한 지 몇 해, ${q.l||'조정'}의 사자가 찾아왔다. 옛 ${q.t||'벼슬아치'}의 경험이 필요하다고 한다.`},
 ch:[{l:'다시 관복을 입는다',act:()=>{const q=P.tmp.q;setPath(q.p||'관');P.rank=Math.max(0,(q.r||1)-1);P.fame+=5;hurt(10,'노구의 출사');return '흰머리로 다시 길을 나섰다. 손주들이 동구 밖까지 따라 나왔다.'}},
     {l:'노인은 물러날 뿐이라며 사양한다',act:()=>{P.s.매+=2;P.wealth+=5;return '사자는 예물만 두고 돌아갔다. 사양한 일로 오히려 이름이 높아졌다.'}},
     {l:'아들을 대신 보낸다',req:()=>(P.kids||[]).some(k=>k.alive&&k.sex==='m'&&P.year-k.b>=16),rq:'장성한 아들이 있을 때만',act:()=>{const q=P.tmp.q;const k=P.kids.find(k=>k.alive&&k.sex==='m'&&P.year-k.b>=16);k.path=q.p||'관';P.fame+=3;return `아들 ${jo(k.n,'이/가')} 대신 길을 떠났다. 떠나는 등을 오래 보았다.`}}],
 to:()=>'대답을 미루는 사이 사자가 돌아갔다.'},
{id:'f2_danggu_back',w:1,when:()=>false,time:7,title:'숨겨 준 선비',han:'恩',hr:'은',
 text:()=>{const q=P.tmp.q;return `${P.year>=184?'당고가 풀리자':'당고가 아직 풀리지 않았는데도'} 예전에 광에 숨겨 주었던 선비 ${jo(q.sc,'이/가')} 사람을 보냈다. 당신을 천거하겠다고 한다.`},
 ch:[{l:'천거를 받는다',req:()=>P.age<=55,rq:'55세 이하',act:()=>{if(P.path==='관')P.rank=Math.min(RANKS.관.length-1,P.rank+1);else{setPath('관');P.rank=1;}P.fame+=5;return '청류의 천거로 벼슬길에 올랐다. 환관 쪽 사람들은 당신을 눈엣가시로 여겼다.'}},
     {l:'사양하고 글만 청한다',act:()=>{P.s.지+=4;P.fame+=2;return '선비가 손수 쓴 경서 주석을 보내왔다.'}},
     {l:'아직 위험하다며 연락을 끊는다',act:()=>{P.s.매-=2;P.s.지+=1;return '사자를 돌려보냈다. 몸은 편했지만 청류 사이에서 이름이 지워졌다.'}}],
 to:()=>'사자가 기다리다 돌아갔다.'},
{id:'f2_danggu_inf',w:1,when:()=>false,time:7,title:'밀고자',han:'密',hr:'밀',
 text:()=>{const q=P.tmp.q;return `당신이 고발했던 선비 ${q.sc}의 문생들이 그날 밀고한 자를 찾고 있다. 고을 사람들이 당신 쪽을 힐끔거린다.`},
 ch:[{l:'찾아가 사죄하고 재물을 바친다',act:()=>{const c=Math.max(8,Math.round(P.wealth*.3));P.wealth=Math.max(0,P.wealth-c);P.fame=Math.max(0,P.fame-2);return `${money(c)}을 바쳤다. 문생들은 침을 뱉고 받았다.`}},
     {l:'환관 쪽 사람에게 기댄다',st:'정',d:50,act:ok=>{if(ok){P.s.정+=2;P.s.매-=2;return '중상시 집안의 집사가 문생들을 쫓아 주었다. 대신 그 집 일을 거들게 되었다.'}hurt(30,'문생들의 몽둥이');return '아무도 당신을 지켜 주지 않았다.'}},
     {l:'고향을 떠난다',act:()=>{P.wealth=Math.floor(P.wealth*.7);const r=moveRandom();return `밤에 짐을 꾸려 ${jo(r,'로')} 떠났다.`}}],
 to:()=>{hurt(20,'문생들의 몽둥이');return '장터에서 둘러싸였다.'}},
{id:'f2_taixue_mate',w:1,when:()=>false,time:8,title:'쫓기는 동문',han:'友',hr:'우',
 text:()=>`태학 동문 ${jo(P.tmp.q.m,'이/가')} 밤중에 찾아왔다. 환관의 눈 밖에 나 쫓기는 몸이라며 며칠만 묵게 해 달라고 한다.`,
 ch:[{l:'재워 준다',st:'지',d:45,act:ok=>{const m=P.tmp.q.m;if(ok){P.fame+=5;P.flags.qingliu=1;later('f2_taixue_mate2',Math.max(1,Math.min(12,189-P.year)),{m});return `${jo(m,'이/가')} 무사히 떠났다. 떠나며 이 은혜는 반드시 갚겠다고 했다.`}hurt(25,'옥사');P.wealth=Math.floor(P.wealth*.7);return '관병이 들이닥쳤다. 동문은 끌려가고 당신도 옥에 갇혔다가 풀려났다.'}},
     {l:'노자를 주어 다른 곳으로 보낸다',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.s.매+=1;return '동문은 고개를 숙이고 떠났다. 그 뒤 소식은 끊겼다.'}},
     {l:'관에 알린다',act:()=>{P.wealth+=5;P.s.매-=5;P.fame=Math.max(0,P.fame-3);return '상금을 받았다. 태학 시절 동문들이 당신 이름을 지웠다.'}}],
 to:()=>'문을 열지 못하는 사이 발소리가 멀어졌다.'},
{id:'f2_taixue_mate2',w:1,when:()=>false,time:7,title:'동문의 부름',han:'招',hr:'초',
 text:()=>`${P.year>=189?'환관들이 몰살된 뒤':'세상이 바뀌어'} 그때 숨겨 주었던 동문 ${jo(P.tmp.q.m,'이/가')} 벼슬에 올랐다. 그 밤을 잊지 않았다며 당신을 불러 쓰겠다고 한다.`,
 ch:[{l:'그 밑으로 간다',req:()=>P.age<=55,rq:'55세 이하',act:()=>{if(P.path==='관')P.rank=Math.min(RANKS.관.length-1,P.rank+1);else{setPath('관');P.rank=2;}P.fame+=4;return `${title()} 자리를 얻었다. 동문은 술자리마다 그 밤 이야기를 했다.`}},
     {l:'정중히 사양한다',act:()=>{P.fame+=4;P.s.매+=2;return '사양하는 편지가 동문들 사이에 돌았다. 맑은 선비라는 말을 들었다.'}},
     {l:'벼슬 대신 재물을 청한다',act:()=>{P.wealth+=12;P.s.매-=2;return '동문은 잠시 말이 없더니 수레 하나 가득 재물을 보냈다.'}}],
 to:()=>'답장이 늦어 그 자리는 다른 사람에게 갔다.'},
{id:'f2_xiyuan_sq',w:1,when:()=>false,time:8,title:'벼슬값 독촉',han:'督',hr:'독',
 text:()=>P.path==='관'?'벼슬값 나머지를 갚을 기한이 왔다. 서원의 아전이 독촉장을 보냈다. 고을 창고와 백성의 주머니가 눈앞에 있다.':'벼슬에서 물러났는데도 서원에서 벼슬값 나머지를 내라는 독촉장이 날아왔다.',
 ch:[{l:'세금을 덧붙여 거둔다',req:()=>P.path==='관',rq:'관리만',act:()=>{P.wealth+=3;P.s.매-=5;P.flags.corrupt=1;later('f2_xiyuan_audit',rint(1,3),{});return '산부에 몇 전씩을 얹었다. 빚은 갚았고 원성은 쌓였다.'}},
     {l:'사재를 털어 갚는다',act:()=>{const c=Math.max(10,Math.round(P.wealth*.4));P.wealth=Math.max(0,P.wealth-c);P.fame+=3;return `${money(c)}을 바쳤다. 백성을 짜지 않았다는 말이 돌았다.`}},
     {l:'갚지 않고 버틴다',p:.4,act:ok=>{if(ok){P.s.지+=1;return '독촉은 흐지부지되었다. 서원의 장부가 너무 길었던 것이다.'}if(P.path==='관'){setPath('민');}P.fame=Math.max(0,P.fame-4);return '인끈을 빼앗기고 고향으로 쫓겨났다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-10);return '독촉하던 아전이 세간을 실어 갔다.'}},
{id:'f2_xiyuan_audit',w:1,when:()=>false,time:8,title:'자사의 감찰',han:'察',hr:'찰',
 text:()=>'자사부의 종사가 고을 장부를 감찰하러 왔다. 덧붙여 거둔 세금이 장부와 맞지 않는다.',
 ch:[{l:'종사에게 뇌물을 바친다',req:()=>P.wealth>=10,rq:'1만 전 필요',st:'매',d:50,act:ok=>{P.wealth-=10;if(ok)return '종사는 장부를 덮었다. 다음 고을로 가며 웃었다.';if(P.path==='관')setPath('민');hurt(25,'옥사');return '종사는 뇌물까지 장부에 적었다. 관직을 잃고 옥에 갇혔다.'}},
     {l:'아전에게 죄를 씌운다',st:'지',d:55,act:ok=>{if(ok){P.s.매-=3;return '아전 하나가 매를 맞고 쫓겨났다. 그 식구들이 관아 앞에서 울었다.'}if(P.path==='관')setPath('민');hurt(30,'옥사');return '아전이 장부 사본을 내밀었다. 모든 것이 드러났다.'}},
     {l:'관인을 풀어 놓고 달아난다',act:()=>{if(P.path==='관')setPath('민');P.wealth+=5;P.fame=Math.max(0,P.fame-6);const r=moveRandom();return `챙긴 돈을 들고 ${jo(r,'로')} 달아났다.`}}],
 to:()=>{if(P.path==='관')setPath('민');hurt(20,'곤장');return '변명도 하기 전에 인끈을 빼앗겼다.'}},
{id:'f2_fushui_call',w:1,when:()=>false,time:8,title:'누런 두건',han:'黃',hr:'황',
 text:()=>P.year>=184?'갑자년이다. 예전에 따라다니던 태평도 제자가 누런 두건을 들고 찾아왔다. "창천은 이미 죽었고 황천이 서리라"는 말이 마을에 돈다.':'태평도 제자가 다시 찾아왔다. 서른여섯 방(方)이 날을 정해 함께 일어날 것이라 귀띔한다.',
 ch:[{l:'누런 두건을 쓴다',req:()=>P.age>=15&&P.path!=='관',rq:'15세 이상, 관리 불가',act:()=>{setPath('적');P.flags.yellow=1;P.fame+=3;return '머리에 누런 두건을 둘렀다. 마을 장정 수십이 함께 일어섰다.'}},
     {l:'두건만 받아 숨겨 둔다',act:()=>{P.s.지+=1;P.s.매-=1;return '궤짝 바닥에 두건을 감췄다. 제자는 실망한 얼굴로 떠났다.'}},
     {l:'관아에 알린다',act:()=>{P.flags.taiping=0;P.wealth+=4;P.fame+=4;P.s.매-=4;return '현령이 상을 내렸다. 마을 사람 몇이 붙잡혀 갔다.'}}],
 to:()=>'제자는 대답을 기다리지 않고 떠났다.'},
{id:'f2_koufu_age',w:1,when:()=>false,time:6,title:'호적 대조',han:'籍',hr:'적',
 text:()=>'이정이 호적을 다시 대조한다. 어릴 적 줄여 올린 당신 나이가 장부에 그대로 남아 있다.',
 ch:[{l:'그대로 둔다',p:.6,act:ok=>{if(ok){P.wealth+=2;return '장부 나이가 어린 덕에 올해 부역 명단에서 빠졌다.'}hurt(15,'곤장');P.wealth=Math.max(0,P.wealth-4);return '대조 끝에 들통났다. 곤장에 벌금까지 물었다.'}},
     {l:'바로잡아 달라고 한다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.정+=1;return '벌금을 물고 장부를 고쳤다. 마음은 편했다.'}},
     {l:'이정에게 술을 받는다',st:'매',d:40,act:ok=>{if(ok){P.s.매+=1;return '이정이 붓을 들었다가 내려놓았다. 장부는 그대로 남았다.'}P.wealth=Math.max(0,P.wealth-3);return '술만 얻어 마시고 장부는 고쳐 놓았다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-2);return '이정이 알아서 고치고 벌금을 매겼다.'}},
{id:'f2_jianbing_buqu',w:1,when:()=>false,time:7,title:'장원의 창',han:'曲',hr:'곡',
 text:()=>'장원 주인이 소작인들을 마당에 모았다. 세상이 어지러우니 창을 들고 장원을 지키라 한다. 부곡(部曲)이 되면 세금은 장원이 대신 내 준다.',
 ch:[{l:'부곡이 된다',act:()=>{setPath('군');P.s.무+=3;P.flags.tenant=0;return '장원의 사병이 되었다. 세금 대신 창을 바쳤다.'}},
     {l:'농사만 짓겠다고 버틴다',p:.5,act:ok=>{if(ok){P.s.통+=1;return '주인이 혀를 차고 넘어갔다. 대신 소작료가 한 할 올랐다.'}P.wealth=Math.max(0,P.wealth-5);P.flags.tenant=0;return '부치던 밭을 빼앗겼다.'}},
     {l:'야반도주한다',act:()=>{P.flags.tenant=0;P.wealth=Math.floor(P.wealth*.7);const r=moveRandom();return `식구들을 이끌고 ${jo(r,'로')} 갔다. 호적 없는 떠돌이가 되었다.`}}],
 to:()=>{setPath('군');return '대답을 하기도 전에 창이 손에 쥐여졌다.'}},
{id:'f2_jianbing_back',w:1,when:()=>false,time:7,title:'다시 온 측량',han:'量',hr:'량',
 text:()=>'밭을 지켜 낸 지 몇 해, 그 호족 집안 자제가 현의 아전이 되어 당신 밭을 다시 측량하러 왔다.',
 ch:[{l:'측량 줄을 지켜본다',st:'지',d:50,act:ok=>{if(ok){P.fame+=3;return '줄이 비뚤게 놓인 것을 짚어 냈다. 구경꾼들 앞에서 아전이 얼굴을 붉혔다.'}P.wealth=Math.max(0,P.wealth-6);return '밭 한 귀퉁이가 장원 땅으로 넘어갔다.'}},
     {l:'밭 일부를 내주고 화해한다',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.s.매+=1;return '밭 한 뙈기를 내주었다. 더는 시비가 없었다.'}},
     {l:'이웃과 함께 태수에게 호소한다',st:'정',d:55,act:ok=>{if(ok){P.fame+=6;return '태수가 아전을 갈아 치웠다. 이웃들이 당신 집에 술을 들고 왔다.'}hurt(15,'곤장');P.wealth=Math.max(0,P.wealth-4);return '소란을 피웠다며 곤장을 맞았다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-5);return '집을 비운 사이 측량이 끝나 있었다.'}},
{id:'f2_xianbei_vil',w:1,when:()=>false,time:7,title:'이웃 마을의 답례',han:'禮',hr:'례',
 text:()=>`선비족이 왔을 때 말을 달려 알려 준 일을 ${jo(P.tmp.q.v,'이/가')} 잊지 않았다. 촌장이 예물을 싣고 찾아왔다.`,
 ch:[{l:'촌장의 딸과 혼인한다',req:()=>!P.married&&P.age>=16,rq:'혼인하지 않았을 때만',act:()=>{P.married=1;setSpouse(pick(SURN));P.s.매+=2;return '두 마을 사람들이 모여 사흘 동안 잔치를 벌였다.'}},
     {l:'곡식 몇 섬을 받는다',act:()=>{P.wealth+=6;return '수레에 실린 좁쌀로 겨울을 넉넉히 났다.'}},
     {l:'함께 봉수대를 지키자고 한다',st:'통',d:45,act:ok=>{if(ok){P.fame+=5;P.s.통+=2;return '두 마을 장정이 번갈아 봉수대에 올랐다. 다음 해 습격 때는 아무도 죽지 않았다.'}hurt(15,'봉수대 추위');return '한겨울 봉수대에서 동상을 입었다.'}}],
 to:()=>{P.wealth+=2;return '촌장은 예물만 두고 돌아갔다.'}},
{id:'f2_huanguan_fall',w:1,when:()=>false,time:8,title:'끈이 끊기다',han:'斷',hr:'단',
 text:()=>P.year>=189?'낙양에서 환관들이 몰살되었다. 중상시의 조카였던 현령도 붙잡혀 갔고, 그와 거래한 자들의 이름을 캔다.':'중상시의 조카인 현령이 탄핵을 받아 붙잡혔다. 그에게 뇌물을 바친 자들의 이름을 캔다.',
 ch:[{l:'장부와 서신을 태운다',st:'지',d:45,act:ok=>{if(ok){P.s.지+=1;return '불씨까지 재로 덮었다. 조사관은 빈손으로 돌아갔다.'}hurt(25,'옥사');P.wealth=Math.max(0,P.wealth-8);return '태우다 남은 죽간 한 조각이 발견되었다.'}},
     {l:'먼저 나서서 고변한다',act:()=>{P.wealth+=3;P.s.매-=3;P.fame=Math.max(0,P.fame-2);return '죄를 덜었다. 사람들은 변절자라 수군댔다.'}},
     {l:'재물을 싸 들고 달아난다',act:()=>{if(P.path==='관')setPath('민');P.wealth=Math.floor(P.wealth*.8);const r=moveRandom();return `${jo(r,'로')} 숨어들었다. 수배 명단에 이름이 올랐다.`}}],
 to:()=>{hurt(20,'옥사');P.wealth=Math.max(0,P.wealth-6);return '조사관이 먼저 문을 두드렸다.'}},
{id:'f2_yuedan_rec',w:1,when:()=>false,time:7,title:'공조의 부름',han:'辟',hr:'벽',
 text:()=>'월단평의 한마디가 아직 고을에 남아 있다. 태수가 당신을 군의 속리로 부르겠다고 한다.',
 ch:[{l:'부름에 응한다',req:()=>P.path!=='관',rq:'관리가 아닐 때만',act:()=>{setPath('관');P.rank=Math.max(P.rank,1);P.fame+=3;return '군청에 자리를 얻었다. 허소의 평 덕이라는 말이 따라다녔다.'}},
     {l:'더 높은 자리로 옮긴다',req:()=>P.path==='관',rq:'관리만',act:()=>{P.rank=Math.min(RANKS.관.length-1,P.rank+1);P.fame+=3;return `${title()} 자리로 옮겼다.`}},
     {l:'부름의 값을 바치라는 말에 거절한다',act:()=>{P.fame+=3;P.s.매+=2;return '태수의 집사가 사례를 바라는 눈치였다. 거절하자 그 자리에는 다른 이름이 올랐다.'}}],
 to:()=>'답이 늦어 다른 사람이 불려 갔다.'},
{id:'f2_lumu_xl',w:1,when:()=>false,time:7,title:'효렴 천거',han:'孝',hr:'효',
 text:()=>'여묘를 마친 효자의 이름이 군청까지 들렸다. 태수가 당신을 효렴으로 천거해 낙양에서 낭관으로 일하게 하겠다고 한다.',
 ch:[{l:'천거에 응해 낙양으로 간다',req:()=>P.path!=='관',rq:'관리가 아닐 때만',act:()=>{setPath('관');P.rank=Math.max(P.rank,2);moveTo('사례');P.fame+=5;return '효렴으로 뽑혀 낭관이 되었다. 고향을 떠나는 날 동구에 사람이 가득했다.'}},
     {l:'천거장을 받아 승진한다',req:()=>P.path==='관',rq:'관리만',act:()=>{P.rank=Math.min(RANKS.관.length-1,P.rank+1);P.fame+=4;return `효렴 출신이라는 이름을 달고 ${title()} 자리에 올랐다.`}},
     {l:'남은 부모를 모셔야 한다며 사양한다',act:()=>{P.fame+=6;P.s.매+=2;P.wealth+=2;return '사양한 일로 오히려 이름이 높아졌다. 태수가 쌀을 보내왔다.'}}],
 to:()=>'답이 늦어 천거는 다음 해로 미뤄졌다.'},
{id:'f2_zheng_mate',w:1,when:()=>false,time:7,title:'동문의 편지',han:'書',hr:'서',
 text:()=>{const y=P.year;P.tmp.w=y>=191?['기주의 원소','기주']:y>=190?['북해상 공융','청주']:['고을 태수',P.region];return `고밀에서 함께 배우던 동문 ${jo(P.tmp.q.m,'이/가')} 편지를 보냈다. 지금 ${P.tmp.w[0]} 밑에 있는데 글 아는 사람이 필요하다고 한다.`},
 ch:[{l:'편지를 따라 길을 나선다',req:()=>P.age<=55,rq:'55세 이하',act:()=>{const w=P.tmp.w;moveTo(w[1]);if(P.path!=='관'){setPath('관');P.rank=1;}else P.rank=Math.min(RANKS.관.length-1,P.rank+1);P.fame+=3;return `${w[0]} 밑에서 문서를 맡았다. 정 선생 제자라는 이름이 통했다.`}},
     {l:'스승의 학문을 잇겠다며 남는다',act:()=>{P.s.지+=4;P.fame+=2;P.wealth+=2;return '고향에 글방을 열었다. 아이들이 육포를 들고 찾아왔다.'}},
     {l:'답장에 다른 사람을 추천한다',act:()=>{P.s.매+=2;P.s.정+=1;return '고을의 젊은 선비를 대신 보냈다. 그 집안이 당신에게 고개를 숙였다.'}}],
 to:()=>'답장을 미루는 사이 그 자리가 찼다.'},
{id:'f2_myy_nb',w:1,when:()=>false,time:7,title:'돌아온 이웃',han:'巾',hr:'건',
 text:()=>`낙양에서 숨겨 주었던 이웃 ${jo(P.tmp.q.nb,'이/가')} 돌아왔다. 이제 황건 잔당의 소두목이 되어 있었다.`,
 say:()=>[P.tmp.q.nb,'그때 살려 준 은혜, 이 난리 통에 갚으러 왔소.'],
 ch:[{l:'그를 따라간다',req:()=>P.path!=='관'&&P.age>=15,rq:'15세 이상, 관리 불가',act:()=>{setPath('적');P.flags.yellow=1;P.fame+=3;return '누런 두건을 받았다. 무리는 당신을 형님이라 불렀다.'}},
     {l:'곡식을 주어 보낸다',act:()=>{const nb=P.tmp.q.nb;P.wealth=Math.max(0,P.wealth-4);P.s.매+=2;kind(nb,'당신이 낙양에서 숨겨 준 이웃');return `${jo(nb,'이/가')} 쌀자루를 지고 어둠 속으로 사라졌다.`}},
     {l:'관에 알린다',act:()=>{P.wealth+=5;P.fame+=4;P.s.매-=5;return '토벌군이 산을 뒤졌다. 그의 목이 성문에 걸렸다.'}}],
 to:()=>'그는 대답을 기다리지 않고 떠났다.'},
{id:'f2_heishan_tr',w:1,when:()=>false,time:7,title:'산채의 주문',han:'鐵',hr:'철',
 text:()=>'흑산 산채에서 또 사람이 내려왔다. 이번엔 곡식 말고 소금과 쇠붙이를 대 달라 한다. 값은 지난번의 곱절이다.',
 ch:[{l:'쇠붙이까지 대 준다',p:.5,act:ok=>{if(ok){P.wealth+=15;later('f2_heishan_end',rint(2,4),{});return '창날이 될 쇳덩이를 수레 밑에 깔아 보냈다. 돈은 많이 남았다.'}hurt(30,'관아의 형벌');P.wealth=Math.max(0,P.wealth-8);return '관문에서 쇳덩이가 들통났다.'}},
     {l:'소금만 판다',act:()=>{P.wealth+=5;return '소금 몇 섬만 넘겼다. 산채 사람은 아쉬운 얼굴이었다.'}},
     {l:'거래를 끊는다',p:.6,act:ok=>{if(ok){P.s.지+=1;return '산채는 더 오지 않았다.'}P.wealth=Math.floor(P.wealth*.7);return '산채 사람들이 앙갚음으로 곡간을 털었다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-3);return '답을 미루자 산채 사람이 곡식 몇 자루를 들고 가 버렸다.'}},
{id:'f2_heishan_end',w:1,when:()=>false,time:7,title:'쇳덩이 장부',han:'簿',hr:'부',
 text:()=>P.year>=193?'원소가 흑산을 치러 나섰다. 흑산과 쇠붙이를 거래한 자를 찾는다는 방이 붙었다. 장부가 아직 당신 손에 있다.':'흑산과 쇠붙이를 거래한 일이 소문났다. 관아에서 사람이 오기 전에 산채에서도 사람이 왔다. 장부가 아직 당신 손에 있다.',
 ch:[{l:'장부를 들고 관에 자수한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=4;P.wealth=Math.floor(P.wealth*.8);return '산채의 길목을 일러 준 공으로 죄를 덜었다. 벌금만 물었다.'}hurt(35,'옥사');P.wealth=Math.floor(P.wealth*.5);return '자수했는데도 옥에 갇혔다. 가산 절반이 날아갔다.'}},
     {l:'산채로 들어간다',req:()=>P.path!=='관',rq:'관리 불가',act:()=>{setPath('적');P.fame+=3;return '장부를 품고 산으로 들어갔다. 장연의 무리가 당신을 반겼다.'}},
     {l:'장부를 태우고 장사를 접는다',act:()=>{P.wealth=Math.max(0,P.wealth-5);P.s.지+=1;return '쌓아 둔 물건을 헐값에 넘기고 가게 문을 닫았다.'}}],
 to:()=>{hurt(25,'옥사');return '장부를 숨기기도 전에 포졸이 들이닥쳤다.'}},
{id:'f2_zhoumu_split',w:1,when:()=>false,time:7,title:'유우와 공손찬',han:'裂',hr:'렬',
 text:()=>{P.tmp.m=inR('유주')?'here':'far';return P.tmp.m==='here'?'유우와 공손찬의 사이가 끝내 갈라졌다. 유우가 군사 십만을 이끌고 공손찬의 성을 친다.':'유주에서 유우가 공손찬을 치다 붙잡혀 죽었다는 소식이 왔다. 옛 기병 동료가 다시 돌아오라 한다.'},
 ch:[{l:'공손찬 곁에서 성을 지킨다',req:()=>P.tmp.m==='here',rq:'유주에 있을 때만',st:'무',d:50,act:ok=>{if(P.path!=='군')setPath('군');if(ok){P.fame+=8;return '바람을 타고 불을 놓자 유우의 군이 무너졌다. 유우는 붙잡혀 죽었다.'}hurt(30,'유우군의 화살');return '성벽 위에서 화살을 맞았다.'}},
     {l:'유우 진영으로 넘어간다',req:()=>P.tmp.m==='here',rq:'유주에 있을 때만',p:.35,act:ok=>{if(ok){P.fame+=4;P.s.매+=2;return '유우는 졌지만 너그러운 주인이었다. 그 옛 부하들과 함께 공손찬에 맞설 날을 기다렸다.'}hurt(40,'공손찬의 기병');return '흰 말 탄 기병들에게 쫓겼다.'}},
     {l:'전장에서 빠져 고향에 숨는다',act:()=>{if(P.path==='군')setPath('민');P.fame=Math.max(0,P.fame-3);return '창을 묻고 밭으로 돌아갔다.'}},
     {l:'유주로 돌아간다',req:()=>P.tmp.m==='far',rq:'유주 밖에 있을 때만',act:()=>{moveTo('유주');setPath('군');P.fame+=2;return '공손찬의 기병 대열에 다시 섰다. 백성들은 유우를 그리워했다.'}}],
 to:()=>'어느 편에도 서지 못한 사이 싸움이 끝났다.'},
{id:'f2_dong_favor',w:1,when:()=>false,time:7,title:'동탁의 은총',han:'寵',hr:'총',
 text:()=>'동탁이 당신을 기억해 벼슬을 높여 주겠다고 한다. 관동에서 연합군이 일어나자 동탁은 천자를 끼고 장안으로 옮기려 한다.',
