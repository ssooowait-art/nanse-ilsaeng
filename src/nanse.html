 to:()=>{P.wealth=Math.max(0,P.wealth-3);return '가짜 돈을 쥔 채 장이 끝났다.'}},
{id:'e_f_coin_traced',w:1,when:()=>false,time:6,title:'돌아온 가짜 돈',han:'僞',hr:'위',
 text:()=>'시장 관리가 가짜 돈의 출처를 거슬러 올라오고 있다. 당신에게 돈을 받았다는 사람이 셋이나 나왔다.',
 ch:[{l:'처음 받은 손님 얼굴을 기억해 낸다',st:'지',d:50,act:ok=>{if(ok){P.fame+=3;return '그림을 그려 바쳤다. 위조범이 잡혔고 당신은 풀려났다.'}hurt(25,'위조범 혐의의 곤장');return '기억이 흐릿했다. 위조범 일당으로 몰렸다.'}},
     {l:'벌금을 물고 끝낸다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=10;return '벌금을 물었다. 가게 앞에 가짜 돈 판 집이라는 낙서가 생겼다.'}},
     {l:'가게를 접고 다른 고을로 간다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.7);return `${jo(r,'로')} 몸을 피했다.`}}],
 to:()=>{hurt(20,'곤장');return '관리가 먼저 당신 가게에 들이닥쳤다.'}},
{id:'e_toll',w:4,cd:5,when:()=>P.year>=160&&P.year<=260&&P.path==='상'&&P.age>=16,time:6,title:'관문 세금',han:'關',hr:'관',
 text:()=>{P.tmp.n=mkName();return `관문 수졸장 ${jo(P.tmp.n,'이/가')} 정해진 세금 말고 짐마다 한 꾸러미를 더 내라 한다. 뒤에 수레가 줄지어 섰다.`},
 ch:[{l:'달라는 대로 낸다',act:()=>{P.wealth=Math.max(0,P.wealth-5);return '관문을 넘었다. 이문이 반으로 줄었다.'}},
     {l:'율령을 들어 따진다',st:'정',d:50,act:ok=>{if(ok){P.fame+=4;later('e_f_toll_officer',rint(3,6),{n:P.tmp.n,g:0});return '뒤에 선 상인들이 거들었다. 수졸장이 얼굴을 붉히며 물러섰다.'}P.wealth=Math.max(0,P.wealth-8);hurt(10,'수졸의 창대');return '창대로 얻어맞고 갑절을 냈다.'}},
     {l:'술값을 따로 쥐여 주고 친해진다',st:'매',d:40,act:ok=>{P.wealth=Math.max(0,P.wealth-3);if(ok){later('e_f_toll_officer',rint(3,6),{n:P.tmp.n,g:1});return '수졸장이 당신 수레는 앞으로 그냥 넘겨 주겠다 했다.'}return '그는 술값만 챙겼다.'}},
     {l:'산길로 돌아간다',st:'무',d:45,act:ok=>{if(ok)return '이틀 더 걸렸지만 세금은 없었다.';hurt(20,'산길 낙상');P.wealth=Math.max(0,P.wealth-4);return '노새가 벼랑에서 굴렀다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-6);return '줄을 오래 선 값까지 물었다.'}},
{id:'e_f_toll_officer',w:1,when:()=>false,time:6,title:'출세한 수졸장',han:'吏',hr:'리',
 text:()=>P.tmp.q.g?`그때 관문의 ${jo(P.tmp.q.n,'이/가')} 군의 시장 관리가 되었다. 당신을 반갑게 불렀다.`:`그때 관문에서 당신에게 망신당한 ${jo(P.tmp.q.n,'이/가')} 군의 시장 관리가 되어 왔다.`,
 ch:[{l:'좋은 자리를 부탁한다',req:()=>P.tmp.q.g,rq:'그와 친할 때만',act:()=>{P.wealth+=12;return '장터 가장 목 좋은 자리를 받았다.'}},
     {l:'그와 손잡고 장터를 주무른다',req:()=>P.tmp.q.g,rq:'그와 친할 때만',st:'지',d:45,act:ok=>{if(ok){P.wealth+=25;P.flags.corrupt=1;return '물가를 둘이서 정했다. 돈이 쏟아졌다.'}P.wealth=Math.max(0,P.wealth-6);P.fame=Math.max(0,P.fame-4);return '다른 상인들이 고발했다. 둘 다 벌금을 물었다.'}},
     {l:'먼저 찾아가 그때 일을 사과한다',req:()=>!P.tmp.q.g,rq:'그와 사이가 나쁠 때만',st:'매',d:50,act:ok=>{if(ok){P.s.매+=2;return '그는 그때 일로 오히려 율령을 다시 읽었다며 웃었다.'}P.wealth=Math.max(0,P.wealth-10);return '그는 당신 가게 세금을 갑절로 매겼다.'}},
     {l:'다른 고을 장터로 옮긴다',act:()=>{const r=moveRandom();return `${jo(r,'로')} 가게를 옮겼다.`}}],
 to:()=>P.tmp.q.g?'인사만 나누고 지나갔다.':(P.wealth=Math.max(0,P.wealth-6),'세금 고지서가 먼저 왔다.')},
{id:'e_saltlicense',w:3,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='상'&&P.wealth>=20,time:7,title:'소금 전매',han:'鹽',hr:'염',
 text:()=>'관아가 염관(鹽官)의 소금을 받아 팔 상인을 뽑는다. 보증금을 크게 걸어야 하지만 이 고을 소금은 독차지다.',
 ch:[{l:'가진 것의 절반을 건다',act:()=>{const v=Math.floor(P.wealth*.5);P.wealth-=v;later('e_f_salt_profit',rint(2,4),{v});return `보증금 ${money(v)}을 걸고 소금 허가 패를 받았다.`}},
     {l:'다른 상인들과 돈을 모아 건다',st:'매',d:45,act:ok=>{if(ok){P.wealth-=5;later('e_f_salt_profit',rint(2,4),{v:10,s:1});return '다섯 집이 함께 패를 받았다. 위험도 이문도 나눴다.'}return '서로 몫을 다투다 입찰을 놓쳤다.'}},
     {l:'관과 엮이기 싫어 빠진다',act:()=>'다른 상인이 패를 받았다. 소금값이 그 집 마음대로 되었다.'}],
 to:()=>'입찰이 끝났다.'},
{id:'e_f_salt_profit',w:1,when:()=>false,time:7,title:'소금 패',han:'牌',hr:'패',
 text:()=>{P.tmp.r=R();return P.tmp.r<.5?'몇 해 동안 소금을 독차지해 팔았다. 새 태수가 와서 패를 다시 거두겠다고 한다.':'밀염꾼들이 싼 소금을 풀어 당신 소금이 창고에서 굳어 간다.'},
 ch:[{l:'새 태수에게 선물을 바쳐 패를 지킨다',req:()=>P.tmp.r<.5,rq:'태수가 바뀌었을 때만',st:'매',d:50,act:ok=>{if(ok){P.wealth+=P.tmp.q.v*3;P.fame+=3;return '패를 지켰다. 보증금이 세 배가 되어 돌아왔다.'}P.wealth+=P.tmp.q.v;return '태수는 선물만 받고 패를 거두었다. 보증금만 돌려받았다.'}},
     {l:'벌 만큼 벌었다며 패를 내놓는다',req:()=>P.tmp.r<.5,rq:'태수가 바뀌었을 때만',act:()=>{P.wealth+=Math.round(P.tmp.q.v*2);return '보증금에 이문을 더해 깔끔하게 빠졌다.'}},
     {l:'밀염꾼을 관에 고발한다',req:()=>P.tmp.r>=.5,rq:'밀염이 돌 때만',st:'정',d:45,act:ok=>{if(ok){P.wealth+=Math.round(P.tmp.q.v*1.5);return '관이 밀염꾼을 잡아들였다. 소금값이 다시 올랐다.'}hurt(25,'밀염꾼의 습격');return '밀염꾼들이 밤에 당신 창고를 털었다.'}},
     {l:'소금값을 내려 맞붙는다',req:()=>P.tmp.r>=.5,rq:'밀염이 돌 때만',act:()=>{P.wealth+=Math.round(P.tmp.q.v*.5);return '손해를 보고 팔았다. 보증금 반은 날렸다.'}}],
 to:()=>{P.wealth+=Math.round(P.tmp.q.v*.5);return '머뭇거리다 반만 건졌다.'}},
{id:'e_usury',w:4,cd:5,when:()=>P.year>=160&&P.year<=260&&P.path==='상'&&P.wealth>=12,time:6,title:'고리대',han:'息',hr:'식',
 text:()=>{P.tmp.n=mkName();return `농부 ${jo(P.tmp.n,'이/가')} 세금 낼 돈을 빌리러 왔다. 땅 문서를 담보로 내밀며 이자는 원하는 대로 하라 한다.`},
 ch:[{l:'해마다 갑절 이자로 빌려준다',act:()=>{P.wealth-=8;later('e_f_usury_due',rint(1,3),{n:P.tmp.n,hi:1});return '농부가 문서에 손도장을 찍었다.'}},
     {l:'낮은 이자로 빌려준다',act:()=>{P.wealth-=8;later('e_f_usury_due',rint(1,3),{n:P.tmp.n,hi:0});return '농부가 몇 번이나 고개를 숙였다.'}},
     {l:'돈이 없다며 돌려보낸다',act:()=>'그는 다른 대금업자를 찾아갔다.'}],
 to:()=>'농부는 기다리다 돌아갔다.'},
{id:'e_f_usury_due',w:1,season:2,when:()=>false,time:7,title:'빚 독촉',han:'督',hr:'독',
 text:()=>P.tmp.q.hi?`${jo(P.tmp.q.n,'이/가')} 빌려 간 돈이 갑절에 갑절로 불었다. 그는 갚을 길이 없다며 땅 문서만 내민다.`:`${jo(P.tmp.q.n,'이/가')} 빌려 간 돈을 갚으러 왔다. 올해 소출이 시원치 않아 반만 가져왔다고 한다.`,
 ch:[{l:'땅을 거둬들인다',act:()=>{P.wealth+=18;P.s.매-=2;if(P.tmp.q.hi)later('e_f_usury_mob',rint(1,3),{n:P.tmp.q.n});return '땅이 당신 것이 되었다. 농부는 그 땅의 소작인이 되었다.'}},
     {l:'빚을 줄여 주고 기한을 늘린다',act:()=>{P.wealth+=8;P.s.매+=2;later('e_f_usury_kind',rint(3,6),{n:P.tmp.q.n});return '농부의 얼굴이 펴졌다. 마을에 당신 소문이 좋게 났다.'}},
     {l:'빚 문서를 불살라 버린다',act:()=>{P.fame+=8;P.s.매+=3;hon('빚 문서를 태운 자',1/3000);later('e_f_usury_kind',rint(3,6),{n:P.tmp.q.n});return '맹상군의 풍훤처럼 문서를 태웠다. 고을 사람들이 그 이야기를 오래 했다.'}}],
 to:()=>{P.wealth+=4;return '반만 받고 나머지는 흐지부지되었다.'}},
{id:'e_f_usury_mob',w:1,when:()=>false,time:7,title:'불타는 장부',han:'燒',hr:'소',
 text:()=>`흉년 끝에 빚진 농부들이 몽둥이를 들고 몰려왔다. 앞장선 건 땅을 빼앗긴 ${P.tmp.q.n}이다. 장부를 내놓으라 한다.`,
 ch:[{l:'장부를 내주고 불태우게 한다',act:()=>{P.wealth=Math.floor(P.wealth*.5);P.fame+=2;return '장부가 불탔다. 빚도 원한도 함께 탔다.'}},
     {l:'가노들을 풀어 막는다',st:'통',d:55,act:ok=>{if(ok){P.s.매-=3;return '몽둥이들이 물러갔다. 이 고을에서 당신을 좋게 말하는 이는 없다.'}hurt(35,'성난 농부들');P.wealth=Math.floor(P.wealth*.4);return '담이 무너지고 곳간이 털렸다.'}},
     {l:'뒷문으로 달아난다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.4);return `세간을 버리고 ${jo(r,'로')} 달아났다.`}}],
 to:()=>{hurt(25,'성난 농부들');P.wealth=Math.floor(P.wealth*.5);return '대문이 부서졌다.'}},
{id:'e_f_usury_kind',w:1,when:()=>false,time:6,title:'빚진 사람의 보답',han:'報',hr:'보',
 text:()=>`난리가 났다. 당신 빚을 덜어 받았던 ${jo(P.tmp.q.n,'이/가')} 마을 장정들을 이끌고 와서 당신 집을 지키겠다 한다.`,
 ch:[{l:'고맙게 받는다',act:()=>{P.s.매+=2;return '난리가 지나갔다. 마을에서 당신 집만 멀쩡했다.'}},
     {l:'장정들을 묶어 마을 자위대를 만든다',st:'통',d:45,act:ok=>{if(ok){P.s.통+=3;P.fame+=6;return '자위대가 마을을 지켰다. 사람들이 당신을 오장처럼 따랐다.'}hurt(15,'난리');return '장정들이 우왕좌왕하다 흩어졌다.'}},
     {l:'그들 집부터 지키라 돌려보낸다',act:()=>{P.fame+=3;P.wealth=Math.floor(P.wealth*.8);return '당신 곳간 일부가 털렸다. 그들 집은 무사했다.'}}],
 to:()=>'그는 문 앞을 지키다 돌아갔다.'},
{id:'e_apprentice',w:()=>P.focus==='social'?5:3,cd:10,when:()=>P.year>=160&&P.year<=260&&P.path==='상'&&P.age>=25,time:6,title:'견습 아이',han:'徒',hr:'도',
 text:()=>{P.tmp.n=mkName();return `고아 ${jo(P.tmp.n,'이/가')} 가게 앞을 떠나지 않는다. 주판알을 한 번 보고 따라 튕긴다. 일을 배우고 싶다고 한다.`},
 ch:[{l:'거두어 장사를 가르친다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=1;later('e_f_apprentice_grown',rint(4,7),{n:P.tmp.n});return '아이는 새벽마다 가게 문을 열었다.'}},
     {l:'밥만 먹이고 잔심부름을 시킨다',act:()=>{P.wealth+=2;return '아이는 이태를 일하다 다른 가게로 옮겨 갔다.'}},
     {l:'쫓아낸다',act:()=>{P.s.매-=1;return '아이는 이튿날 건너편 가게 앞에 서 있었다.'}}],
 to:()=>'아이는 기다리다 사라졌다.'},
{id:'e_f_apprentice_grown',w:1,when:()=>false,time:6,title:'제자의 독립',han:'立',hr:'립',
 text:()=>`가르친 ${jo(P.tmp.q.n,'이/가')} 다 자랐다. 셈이 당신보다 빠르다. 자기 가게를 내고 싶다고 조심스레 말한다.`,
 ch:[{l:'밑천을 대어 내보낸다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=8;later('e_f_apprentice_end',rint(3,6),{n:P.tmp.q.n,g:1});return '그는 옆 고을에 가게를 냈다. 문 위에 당신 가게 이름 한 자를 붙였다.'}},
     {l:'사위나 양자로 삼아 붙잡는다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=8;P.s.매+=2;return '그는 당신 집안사람이 되었다. 가게 장부를 그가 맡았다.'}later('e_f_apprentice_end',rint(3,6),{n:P.tmp.q.n,g:0});return '그는 사양하고 떠났다. 서운함이 남았다.'}},
     {l:'안 된다며 붙잡아 둔다',act:()=>{P.wealth+=5;later('e_f_apprentice_end',rint(2,4),{n:P.tmp.q.n,g:0});return '그는 한 해를 더 있다 밤에 손님 장부를 들고 떠났다.'}}],
 to:()=>{later('e_f_apprentice_end',rint(3,6),{n:P.tmp.q.n,g:0});return '대답을 못 듣자 그는 짐을 쌌다.'}},
{id:'e_f_apprentice_end',w:1,when:()=>false,time:6,title:'옛 견습생',han:'師',hr:'사',
 text:()=>P.tmp.q.g?`${jo(P.tmp.q.n,'이/가')} 세 고을에 가게를 둔 큰 상인이 되었다. 당신이 어려울 때 갚겠다며 사람을 보냈다.`:`${jo(P.tmp.q.n,'이/가')} 맞은편에 큰 가게를 내고 당신 단골들을 빼 가고 있다.`,
 ch:[{l:'그의 상단에 몫을 싣는다',req:()=>P.tmp.q.g,rq:'좋게 헤어졌을 때만',act:()=>{P.wealth+=20;P.fame+=3;return '그의 수레가 당신 짐을 실어 날랐다. 스승 몫이라며 이문을 후하게 쳤다.'}},
     {l:'그 도움을 사양한다',req:()=>P.tmp.q.g,rq:'좋게 헤어졌을 때만',act:()=>{P.fame+=4;P.s.정+=1;return '그는 해마다 정월에 비단 한 필을 보냈다.'}},
     {l:'값을 내려 맞붙는다',req:()=>!P.tmp.q.g,rq:'사이가 틀어졌을 때만',st:'지',d:55,act:ok=>{if(ok){P.wealth+=6;P.s.지+=2;return '스승의 수가 한 수 위였다. 그가 가게를 접고 사과하러 왔다.'}P.wealth=Math.floor(P.wealth*.6);return '그는 당신이 가르친 수를 다 알고 있었다.'}},
     {l:'찾아가 화해한다',req:()=>!P.tmp.q.g,rq:'사이가 틀어졌을 때만',st:'매',d:50,act:ok=>{if(ok){P.wealth+=8;P.s.매+=2;return '둘이 술잔을 나누고 장터를 나누어 맡기로 했다.'}P.wealth=Math.max(0,P.wealth-4);return '그는 차만 한 잔 내고 돌려보냈다.'}}],
 to:()=>'소식만 들었다.'},
{id:'e_rainspoil',w:4,cd:4,season:1,when:()=>P.year>=160&&P.year<=260&&P.path==='상'&&P.age>=16,time:6,title:'장맛비',han:'霖',hr:'림',
 text:()=>'장맛비가 열흘째다. 창고 비단에 곰팡이 꽃이 피기 시작했다. 내일 장은 서지 않을 것 같다.',
 ch:[{l:'밤새 불을 피워 말린다',st:'통',d:40,act:ok=>{if(ok){P.wealth+=2;return '연기에 눈이 매웠지만 비단 대부분을 살렸다.'}P.wealth=Math.max(0,P.wealth-5);return '불똥이 튀어 한 필을 태웠다.'}},
     {l:'곰팡이 핀 것을 염색해 판다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=4;P.s.지+=1;return '쪽빛으로 물들이자 얼룩이 무늬가 되었다.'}P.wealth=Math.max(0,P.wealth-3);return '염료가 번져 걸레가 되었다.'}},
     {l:'헐값에 넘긴다',act:()=>{P.wealth=Math.max(0,P.wealth-3);return '반값에 넘겼다. 사 간 상인이 웃었다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-5);return '비단이 썩어 갔다.'}},
{id:'e_credit',w:3,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='상'&&P.wealth>=15,time:6,title:'외상 손님',han:'賒',hr:'사',
 text:()=>{P.tmp.n=pick(SURN)+'씨';return `이름난 ${P.tmp.n} 집안의 집사가 혼례에 쓸 비단 스무 필을 외상으로 달라 한다. 가을에 갚겠다는 증서를 내민다.`},
 ch:[{l:'믿고 외상을 준다',act:()=>{P.wealth-=10;later('e_f_credit_due',rint(1,3),{n:P.tmp.n});return '비단이 수레에 실려 나갔다. 증서가 손에 남았다.'}},
     {l:'절반만 외상으로 준다',st:'매',d:40,act:ok=>{P.wealth+=ok?4:1;return ok?'집사가 웃으며 절반 값을 먼저 냈다.':'집사가 불쾌한 얼굴로 절반만 가져갔다.'}},
     {l:'현금만 받는다고 한다',act:()=>{P.s.매-=1;return '집사가 코웃음을 치고 건너편 가게로 갔다.'}}],
 to:()=>'집사는 다른 가게로 갔다.'},
{id:'e_f_credit_due',w:1,when:()=>false,time:6,title:'외상값',han:'帳',hr:'장',
 text:()=>{P.tmp.r=R();return P.tmp.r<.5?`${P.tmp.q.n} 집안이 외상값 대신 추천장을 보내왔다. 군의 공조에게 당신을 소개하는 글이다.`:`${P.tmp.q.n} 집안이 당고(黨錮)에 걸려 몰락했다는 소식이 왔다. 외상 증서는 휴지가 될 판이다.`},
 ch:[{l:'추천장을 들고 관아에 간다',req:()=>P.tmp.r<.5&&P.age<=50,rq:'추천장이 왔을 때만',act:()=>{setPath('관');P.rank=0;P.fame+=4;return '비단 스무 필이 서리 자리가 되었다.'}},
     {l:'추천장을 팔아 돈으로 바꾼다',req:()=>P.tmp.r<.5,rq:'추천장이 왔을 때만',act:()=>{P.wealth+=15;return '벼슬 지망생이 비단 값보다 더 쳐서 샀다.'}},
     {l:'남은 식구를 찾아 받아 낸다',req:()=>P.tmp.r>=.5,rq:'그 집이 몰락했을 때만',st:'정',d:50,act:ok=>{if(ok){P.wealth+=6;return '숨은 며느리가 패물을 내놓았다.'}P.s.매-=2;return '빈집만 있었다. 이웃들은 당신을 인정 없는 자라 했다.'}},
     {l:'증서를 찢는다',req:()=>P.tmp.r>=.5,rq:'그 집이 몰락했을 때만',act:()=>{P.fame+=3;return '몇 해 뒤 사면된 그 집 아들이 당신을 찾았다는 소문이 들렸다.'}}],
 to:()=>'증서는 상자 속에서 누렇게 바랬다.'},
{id:'e_hostage',w:4,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.age>=16,time:7,title:'인질',han:'質',hr:'질',
 text:()=>{P.tmp.n=mkName();return `털어 온 수레에서 부잣집 아들 ${jo(P.tmp.n,'이/가')} 나왔다. 열다섯쯤 되었다. 졸개들은 몸값을 받자고 한다.`},
 ch:[{l:'몸값을 받아 낸다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=20;later('e_f_hostage_hunt',rint(2,5),{n:P.tmp.n});return '금 두 근이 왔다. 아이를 산 아래 내려 주었다.'}hurt(25,'몸값 교환 매복');return '몸값을 받으러 간 자리에 관병이 숨어 있었다.'}},
     {l:'잘 먹여 그냥 돌려보낸다',act:()=>{P.s.매+=3;later('e_f_hostage_grown',rint(6,10),{n:P.tmp.n});return '아이는 산채 밥을 먹고 글자 몇 개를 졸개들에게 가르쳐 주고 떠났다.'}},
     {l:'산채에 두고 부려 먹는다',act:()=>{P.wealth+=3;P.s.매-=2;return '아이는 이태 뒤 도망쳤다.'}}],
 to:()=>'졸개들이 멋대로 아이를 팔아 버렸다.'},
{id:'e_f_hostage_grown',w:1,when:()=>false,time:7,title:'자란 인질',han:'官',hr:'관',
 text:()=>`토벌군 깃발이 산 아래 섰다. 지휘하는 현령의 이름은 ${P.tmp.q.n}. 옛날 당신이 그냥 돌려보낸 그 아이다.`,
 ch:[{l:'옛정을 들어 귀순 편지를 보낸다',req:()=>P.path==='적',rq:'도적일 때만',st:'매',d:40,act:ok=>{if(ok){setPath('군');P.rank=2;P.fame+=8;hon('인질이 살린 도적',1/5000);return '그는 당신을 받아들여 자기 휘하 십장으로 삼았다.'}hurt(20,'토벌');return '그는 사사로운 정으로 법을 굽힐 수 없다고 답했다.'}},
     {l:'싸우지 않고 산채를 비운다',act:()=>{P.wealth=Math.floor(P.wealth*.7);return '그는 빈 산채만 불태웠다. 길을 일부러 하나 열어 두었다.'}},
     {l:'그를 찾아가 술을 청한다',req:()=>P.path!=='적',rq:'이미 산을 떠났을 때만',act:()=>{P.fame+=5;P.s.매+=2;return '그는 당신을 알아보고 웃었다. 그 산채 밥이 평생 제일 맛있었다고 했다.'}}],
 to:()=>{hurt(20,'토벌');return '깃발이 산을 타고 올라왔다.'}},
{id:'e_f_hostage_hunt',w:1,when:()=>false,time:7,title:'협객의 칼',han:'俠',hr:'협',
 text:()=>`몸값을 냈던 ${P.tmp.q.n}의 아비가 협객을 샀다. 그가 당신 얼굴을 그린 그림을 들고 근방을 돈다.`,
 ch:[{l:'먼저 그를 찾아 맞선다',st:'무',d:55,act:ok=>{if(ok){P.fame+=6;P.s.무+=2;return '협객을 쓰러뜨렸다. 그 칼은 당신 것이 되었다.'}hurt(40,'협객의 칼');return '협객의 칼은 소문보다 빨랐다.'}},
     {l:'협객에게 더 많은 돈을 준다',req:()=>P.wealth>=25,rq:'2만 5천 전 필요',act:()=>{P.wealth-=25;return '협객은 돈을 세어 보고 고개를 끄덕였다. 그림을 불에 던졌다.'}},
     {l:'멀리 달아난다',act:()=>{const r=moveRandom();return `${jo(r,'로')} 떠났다. 등 뒤가 늘 서늘했다.`}}],
 to:()=>{hurt(30,'협객의 칼');return '어둠 속에서 칼이 들어왔다.'}},
{id:'e_traitor',w:4,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.age>=16,time:7,title:'배신자',han:'叛',hr:'반',
 text:()=>{P.tmp.n=mkName();return `${jo(P.tmp.n,'이/가')} 관에 산채 길을 알려 주고 돈을 받은 것이 드러났다. 졸개들이 그를 묶어 당신 앞에 꿇렸다.`},
 say:()=>[P.tmp.n,'노모가 옥에 갇혔소. 어쩔 수 없었소.'],
 ch:[{l:'졸개들 앞에서 목을 벤다',act:()=>{P.s.통+=2;P.s.매-=1;P.fame+=3;return '산채가 조용해졌다. 다시는 배신 이야기가 없었다.'}},
     {l:'노모 이야기를 믿고 살려 준다',act:()=>{P.s.매+=2;later('e_f_traitor_again',rint(1,4),{n:P.tmp.n});return '졸개들이 웅성거렸다. 그는 바닥에 이마를 찧었다.'}},
     {l:'그를 이용해 거짓 길을 흘린다',st:'지',d:50,act:ok=>{if(ok){P.fame+=6;P.wealth+=6;return '관군이 엉뚱한 골짜기로 들어갔다. 그 틈에 관군 군량을 털었다.'}hurt(25,'관군 기습');return '그가 거짓을 들켰다. 관군이 진짜 길로 왔다.'}}],
 to:()=>'졸개들이 기다리다 제멋대로 그를 죽였다.'},
{id:'e_f_traitor_again',w:1,when:()=>false,time:7,title:'살려 준 배신자',han:'忠',hr:'충',
 text:()=>{P.tmp.ok=R()<.55;return P.tmp.ok?`관군이 산채를 에워싼 밤, 살려 준 ${jo(P.tmp.q.n,'이/가')} 숨이 턱에 차 달려왔다. 아무도 모르는 뒷길이 있다고 한다.`:`관군이 산채를 에워싼 밤, 살려 준 ${jo(P.tmp.q.n,'이/가')} 보이지 않는다. 그 사이 관군이 뒷길로 들어오고 있다.`},
 ch:[{l:'그를 따라 뒷길로 빠진다',req:()=>P.tmp.ok,rq:'그가 달려왔을 때만',act:()=>{P.fame+=4;P.s.매+=2;return '산채 사람 대부분이 살아 나왔다. 그는 그날로 당신의 오른팔이 되었다.'}},
     {l:'의심하고 정면을 뚫는다',req:()=>P.tmp.ok,rq:'그가 달려왔을 때만',st:'무',d:60,act:ok=>{if(ok){P.fame+=5;return '정면을 뚫었다. 뒤돌아보니 그가 뒷길로 사람들을 데리고 나오고 있었다.'}hurt(40,'관군의 창');return '그를 믿지 않은 대가였다.'}},
     {l:'남은 무리로 뒷길을 막는다',req:()=>!P.tmp.ok,rq:'그가 사라졌을 때만',st:'통',d:55,act:ok=>{if(ok){P.s.통+=2;return '좁은 뒷길에서 관군을 막아 냈다. 같은 사람을 두 번 믿지 않기로 했다.'}hurt(40,'관군의 창');return '뒷길이 뚫렸다.'}},
     {l:'산채를 버리고 흩어진다',act:()=>{P.wealth=Math.floor(P.wealth*.5);return '각자 흩어졌다. 산채는 불탔다.'}}],
 to:()=>{hurt(30,'관군의 창');return '불길이 산채를 덮었다.'}},
{id:'e_campfamine',w:()=>P.gun&&gunState(P.gun,P.year).harvest==='흉년'?7:3,cd:5,season:3,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.age>=16,time:7,title:'산채 기근',han:'饉',hr:'근',
 text:()=>'눈이 산길을 막았다. 산채 곳간이 바닥났다. 졸개들이 아랫마을을 털자고 웅성거린다.',
 ch:[{l:'아랫마을을 턴다',st:'무',d:40,act:ok=>{if(ok){P.wealth+=5;P.s.매-=2;later('e_f_famine_village',rint(1,3),{});return '곡식 서른 섬을 털었다. 마을에서 아이 우는 소리가 산채까지 들렸다.'}hurt(25,'마을 장정들의 쇠스랑');return '마을 장정들이 쇠스랑을 들고 막아섰다.'}},
     {l:'말을 잡아먹으며 버틴다',act:()=>{P.hp=Math.max(1,P.hp-5);P.s.통+=1;return '말 다섯 필이 겨울을 넘겼다. 봄에 털이를 나갈 말이 없다.'}},
     {l:'졸개 절반을 내려보낸다',st:'통',d:45,act:ok=>{if(ok){P.s.통+=2;return '남은 자들끼리 아껴 먹으며 버텼다. 봄에 절반이 돌아왔다.'}P.fame=Math.max(0,P.fame-4);return '내려간 졸개들이 관에 잡혀 산채 위치를 불었다.'}}],
 to:()=>{hurt(20,'굶주림');return '굶주린 졸개들이 서로 싸웠다.'}},
{id:'e_f_famine_village',w:1,when:()=>false,time:7,title:'마을의 의병',han:'團',hr:'단',
 text:()=>'그 겨울 털린 아랫마을이 장정을 모아 산을 오른다. 횃불이 서른 개다. 앞장선 이는 아이를 잃은 아비다.',
 ch:[{l:'곡식을 갚겠다고 사신을 보낸다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=10;P.s.매+=2;return '곡식을 돌려주었다. 장정들은 아비를 말려 산을 내려갔다.'}},
     {l:'매복해 쫓아낸다',st:'통',d:45,act:ok=>{if(ok){P.s.통+=2;P.s.매-=2;return '장정들이 흩어졌다. 이제 아랫마을은 대놓고 관군을 부를 것이다.'}hurt(30,'쇠스랑');return '분노한 장정들은 생각보다 셌다.'}},
     {l:'산채를 옮긴다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.7);return `${jo(r,'로')} 산채를 옮겼다.`}}],
 to:()=>{hurt(25,'횃불 든 장정들');return '횃불이 산채에 닿았다.'}},
{id:'e_govspy',w:3,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.rank>=1,time:7,title:'관군 첩자',han:'探',hr:'탐',
 text:()=>{P.tmp.n=mkName();return `새로 들어온 ${jo(P.tmp.n,'은/는')} 손바닥에 굳은살이 없다. 밤에 몰래 화살대에 무언가를 매어 날리는 것을 졸개가 보았다.`},
 ch:[{l:'잡아서 매질한다',st:'무',d:35,act:ok=>{if(ok){P.wealth+=4;return '그가 관군 진채 위치를 불었다. 먼저 털러 갔다.'}P.s.매-=2;return '그는 혀를 깨물었다.'}},
     {l:'모른 척 거짓 정보를 흘린다',st:'지',d:50,act:ok=>{if(ok){P.fame+=6;return '관군이 엉뚱한 날 엉뚱한 골짜기를 쳤다.'}hurt(25,'관군 기습');return '그는 거짓을 알아채고 진짜를 보냈다.'}},
     {l:'불러서 편이 되라 꾄다',st:'매',d:50,act:ok=>{if(ok){later('e_f_govspy_double',rint(1,3),{n:P.tmp.n});return '그는 오래 생각하다 고개를 끄덕였다. 관군 품삯은 형편없다고 했다.'}hurt(20,'첩자의 단도');return '그는 단도를 휘두르고 달아났다.'}}],
 to:()=>'그는 그날 밤 사라졌다.'},
{id:'e_f_govspy_double',w:1,when:()=>false,time:7,title:'이중 첩자',han:'間',hr:'간',
 text:()=>`편으로 돌린 ${jo(P.tmp.q.n,'이/가')} 다시 관군 진채에 들어가 있다. 이번 겨울 대토벌이 있다는 소식을 보내왔다.`,
 ch:[{l:'그의 말대로 미리 산채를 옮긴다',act:()=>{P.fame+=4;return '토벌군은 빈 산채만 찾았다. 그는 관군에게서도 상을 받았다고 웃었다.'}},
     {l:'토벌군 군량고를 거꾸로 친다',st:'통',d:55,act:ok=>{if(ok){P.wealth+=20;P.fame+=10;return '토벌군이 군량을 잃고 물러갔다. 근방에 당신 이름이 퍼졌다.'}hurt(35,'토벌군의 화살');return '그의 정보가 하루 어긋났다.'}},
     {l:'그의 정보를 관군에 팔고 귀순한다',req:()=>P.path==='적',rq:'도적일 때만',st:'지',d:50,act:ok=>{if(ok){setPath('군');P.rank=1;P.fame+=4;return '산채 사람들을 넘기고 오장 자리를 받았다. 그는 그 뒤로 보이지 않았다.'}hurt(30,'배신의 칼');return '그가 먼저 눈치채고 산채에 알렸다.'}}],
 to:()=>{hurt(20,'토벌');return '소식을 미처 쓰지 못했다.'}},
{id:'e_quit',w:()=>P.focus==='rest'?5:2,once:1,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.age>=35,time:7,title:'손을 씻다',han:'洗',hr:'세',
 text:()=>'칼 쥐던 손이 떨린다. 아랫마을에 빈집이 하나 났다. 이름을 바꾸고 내려가 밭을 갈 수도 있다.',
 ch:[{l:'이름을 바꾸고 산을 내려간다',act:()=>{setPath('민');P.hp=Math.min(100,P.hp+10);P.tmp.alias=mkName();later('e_f_quit_found',rint(2,5),{a:P.tmp.alias});return `${jo(P.tmp.alias,'이/가')} 되어 산을 내려갔다. 손에 굳은살이 칼자국을 덮어 갔다.`}},
     {l:'재물을 챙겨 먼 고을로 간다',act:()=>{setPath('상');const r=moveRandom();P.wealth+=5;return `${jo(r,'로')} 가서 장사를 시작했다. 산채의 재물이 밑천이 되었다.`}},
     {l:'산에 남는다',act:()=>{P.s.통+=1;return '칼을 다시 쥐었다. 떨림은 술로 눌렀다.'}}],
 to:()=>'생각만 하다 또 한 해가 갔다.'},
{id:'e_f_quit_found',w:1,when:()=>false,time:7,title:'알아본 얼굴',han:'識',hr:'식',
 text:()=>`${P.tmp.q.a}로 살아온 지 몇 해, 옛 산채 졸개가 장터에서 당신을 알아보았다. 입을 다물 값을 달라 한다.`,
 ch:[{l:'달라는 대로 준다',act:()=>{P.wealth=Math.max(0,P.wealth-8);later('e_f_quit_end',rint(1,3),{a:P.tmp.q.a,paid:1});return '그는 돈을 받고 웃었다. 또 올 얼굴이다.'}},
     {l:'옛 솜씨로 입을 막는다',st:'무',d:50,act:ok=>{P.s.매-=3;if(ok)return '그는 다시 나타나지 않았다. 당신 손은 다시 떨렸다.';hurt(30,'옛 졸개의 칼');later('e_f_quit_end',rint(1,2),{a:P.tmp.q.a,paid:0});return '그도 옛 솜씨가 남아 있었다.'}},
     {l:'스스로 관아에 자수한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=5;P.s.정+=3;return '현령은 몇 해 착하게 산 것을 보고 노역 한 해로 죄를 덮었다.'}hurt(35,'옥살이');P.wealth=Math.floor(P.wealth*.5);return '옥에서 한 해를 보냈다.'}}],
 to:()=>{later('e_f_quit_end',rint(1,2),{a:P.tmp.q.a,paid:0});return '그는 화를 내며 사라졌다.'}},
{id:'e_f_quit_end',w:1,when:()=>false,time:7,title:'정장의 방문',han:'捕',hr:'포',
 text:()=>P.tmp.q.paid?'옛 졸개가 또 돈을 달라 하다 뜻대로 안 되자 관아에 당신 옛 이름을 고했다. 정장이 문 앞에 섰다.':'옛 졸개가 관아에 당신 옛 이름을 고했다. 정장이 문 앞에 섰다.',
 ch:[{l:'마을 사람들이 증언해 주길 기다린다',st:'매',d:45,act:ok=>{if(ok){P.fame+=4;return `${P.tmp.q.a}는 이 마을의 착한 이웃이라고 스무 명이 말했다. 정장이 돌아갔다.`}hurt(30,'옥살이');return '아무도 나서지 않았다. 옥에 갇혔다.'}},
     {l:'다시 산으로 달아난다',act:()=>{setPath('적');return '밭을 버리고 산으로 돌아갔다. 칼은 녹슬어 있었다.'}},
     {l:'옛 일을 다 털어놓고 처분을 기다린다',p:.5,act:ok=>{if(ok){P.s.정+=3;return '태수가 대사면 조서를 들어 죄를 없애 주었다.'}hurt(40,'형장');return '곤장 백 대를 맞았다. 살아남은 것이 다행이었다.'}}],
 to:()=>{hurt(30,'옥살이');return '정장이 포승을 꺼냈다.'}},
{id:'e_roadtoll',w:3,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.rank>=1,time:6,title:'통행세',han:'稅',hr:'세',
 text:()=>'모사 노릇 하는 졸개가 말한다. 털면 한 번이지만 받으면 해마다라고. 고갯길 상단에 통행세를 받자는 것이다.',
 ch:[{l:'통행세를 정해 받는다',st:'통',d:45,act:ok=>{if(ok){P.wealth+=8;later('e_f_roadtoll',rint(2,4),{});return '상단들이 투덜대며 냈다. 털 때보다 사람이 덜 죽었다.'}P.wealth+=2;return '졸개들이 정한 값보다 더 뜯다 싸움이 났다.'}},
     {l:'하던 대로 턴다',st:'무',d:40,act:ok=>{if(ok){P.wealth+=10;return '한 번에 크게 털었다. 그 길로 상단이 끊겼다.'}hurt(25,'상단 호위의 칼');return '상단이 호위를 데리고 있었다.'}},
     {l:'모사를 꾸짖는다',act:()=>{P.s.매-=1;return '모사는 입을 다물었다. 그는 몇 달 뒤 다른 산채로 갔다.'}}],
 to:()=>'졸개들이 기다리다 각자 털이를 나갔다.'},
{id:'e_f_roadtoll',w:1,when:()=>false,time:6,title:'상단의 셈',han:'約',hr:'약',
 text:()=>'통행세를 받은 지 몇 해, 고갯길 상단들이 모여 사람을 보냈다. 세를 올려 낼 테니 다른 도적도 막아 달라 한다.',
 ch:[{l:'받아들여 고갯길을 지킨다',st:'통',d:45,act:ok=>{if(ok){P.wealth+=15;P.fame+=6;return '이웃 산채를 몰아냈다. 상인들은 당신을 고개의 주인이라 불렀다.'}hurt(30,'이웃 산채와의 싸움');return '이웃 산채가 만만치 않았다.'}},
     {l:'상단 하나를 통째로 턴다',act:()=>{P.wealth+=20;P.fame=Math.max(0,P.fame-4);return '큰 한 번이었다. 그 뒤로 상단들은 관군 호위를 사서 다녔다.'}},
     {l:'관에 세를 바치고 아예 관문이 된다',st:'매',d:55,act:ok=>{if(ok){setPath('군');P.rank=2;P.fame+=5;return '현령이 당신을 고갯길 수비로 삼았다. 하던 일은 같고 이름만 바뀌었다.'}hurt(25,'관군의 의심');return '관은 도적과 거래하지 않았다.'}}],
 to:()=>'사람은 대답을 못 듣고 돌아갔다.'},
{id:'e_mountaingod',w:3,cd:6,season:0,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.age>=16,time:6,title:'산신제',han:'祭',hr:'제',
 text:()=>'봄 털이를 앞두고 졸개들이 산신제를 지내자고 한다. 제물로 바칠 소가 없다.',
 ch:[{l:'아랫마을 소를 훔쳐 제를 지낸다',st:'지',d:40,act:ok=>{if(ok){P.s.통+=2;return '소를 잡아 제를 지냈다. 졸개들 눈빛이 달라졌다.'}hurt(15,'소 주인의 쇠스랑');return '소 주인에게 들켰다.'}},
     {l:'멧돼지를 잡아 대신 바친다',st:'무',d:45,act:ok=>{if(ok){P.s.무+=2;P.fame+=2;return '직접 잡은 멧돼지를 바쳤다. 산신도 졸개들도 만족했다.'}hurt(25,'멧돼지 엄니');return '멧돼지에게 받혔다. 흉조라며 졸개들이 수군댔다.'}},
     {l:'제사 따위 필요 없다고 한다',act:()=>{P.s.통-=1;return '졸개 몇이 몰래 제를 지냈다. 당신 몰래.'}}],
 to:()=>'졸개들이 저마다 다른 신을 모셨다.'},
{id:'e_hometown',w:3,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='적'&&P.age>=18,time:7,title:'고향 사람',han:'鄕',hr:'향',
 text:()=>{P.tmp.n=mkName();return `털어 세운 행인 중에 고향 이웃 ${jo(P.tmp.n,'이/가')} 있다. 그가 복면 너머 당신 눈을 알아보았다.`},
 say:()=>[P.tmp.n,'너... 아무개네 아들 아니냐?'],
 ch:[{l:'짐을 돌려주고 보낸다',act:()=>{P.s.매+=2;later('e_f_hometown',rint(1,3),{n:P.tmp.n,g:1});return '그는 고개를 끄덕이고 떠났다. 무슨 말을 고향에 할지 모른다.'}},
     {l:'돈을 쥐여 주며 입을 막는다',req:()=>P.wealth>=5,rq:'5천 전 필요',act:()=>{P.wealth-=5;later('e_f_hometown',rint(1,3),{n:P.tmp.n,g:0});return '그는 돈을 받았다. 눈빛이 묘했다.'}},
     {l:'모른 척 다른 행인과 똑같이 턴다',act:()=>{P.wealth+=3;P.s.매-=2;later('e_f_hometown',rint(1,3),{n:P.tmp.n,g:0});return '그는 끝까지 당신을 쳐다보았다.'}}],
 to:()=>{later('e_f_hometown',rint(1,3),{n:P.tmp.n,g:0});return '졸개들이 그를 털어 보냈다.'}},
{id:'e_f_hometown',w:1,when:()=>false,time:7,title:'고향의 소식',han:'聞',hr:'문',
 text:()=>P.tmp.q.g?`${jo(P.tmp.q.n,'이/가')} 고향에 소식을 전한 모양이다. 늙은 친척이 산 아래 와서 당신을 찾는다는 기별이 왔다.`:`${jo(P.tmp.q.n,'이/가')} 관아에 당신 고향과 이름을 고했다. 고향 집에 관리들이 들이닥쳤다는 소식이다.`,
 ch:[{l:'산을 내려가 친척을 만난다',req:()=>P.tmp.q.g,rq:'좋은 소식일 때만',act:()=>{P.s.매+=2;P.hp=Math.min(100,P.hp+5);return '친척은 보자기에 싼 떡을 내밀고 울었다. 집안이 아직 당신을 기다린다고 했다.'}},
     {l:'친척 손에 돈을 보내 집을 돕는다',req:()=>P.wealth>=8,rq:'8천 전 필요',act:()=>{P.wealth-=8;P.fame+=2;return '도적 돈이라도 고향 집의 겨울을 났다.'}},
     {l:'고향 식구를 산채로 데려온다',req:()=>!P.tmp.q.g,rq:'고향이 위험할 때만',st:'지',d:50,act:ok=>{if(ok){P.s.매+=2;return '관리들보다 먼저 닿았다. 식구들을 산채로 피신시켰다.'}hurt(30,'관병의 화살');return '관병이 기다리고 있었다.'}},
     {l:'모른 척한다',act:()=>{P.s.매-=2;return '고향과의 끈이 하나 더 끊어졌다.'}}],
 to:()=>{P.s.매-=1;return '소식만 들었다.'}},
{id:'e_petition',w:()=>P.focus==='work'?5:3,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.age>=18,time:7,title:'노파의 소장',han:'冤',hr:'원',
 text:()=>{P.tmp.n=pick(SURN)+'씨';return `해마다 같은 소장을 들고 오는 노파가 있다. 아들이 ${P.tmp.n} 집 아들에게 맞아 죽었는데 아무도 받아 주지 않았다고 한다.`},
 ch:[{l:'옛 문서를 뒤져 다시 조사한다',st:'지',d:50,act:ok=>{if(ok){P.s.지+=2;later('e_f_petition',rint(1,3),{n:P.tmp.n});return '검시 기록이 지워진 자국을 찾았다. 일이 커질 것 같다.'}return '십 년 묵은 문서는 쥐가 다 쏠았다.'}},
     {l:'노파에게 곡식을 주어 달랜다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=1;return '노파는 곡식을 받고도 소장은 놓지 않았다.'}},
     {l:'관아 문에 들이지 말라 한다',act:()=>{P.s.매-=2;return '노파는 관아 문 앞에 앉아 겨울을 났다. 백성들이 그것을 보았다.'}}],
 to:()=>'노파는 내년에 또 오겠다며 돌아갔다.'},
{id:'e_f_petition',w:1,when:()=>false,time:7,title:'십 년 묵은 죄',han:'獄',hr:'옥',
 text:()=>`그 노파의 아들을 죽인 자는 지금 ${P.tmp.q.n} 집안의 가장이다. 검시를 덮은 옛 현리는 당신의 상관이 되어 있다.`,
 ch:[{l:'자사에게 직접 올린다',st:'정',d:60,act:ok=>{if(ok){P.fame+=12;hon('묵은 원한을 푼 관리',1/5000);return '살인자가 옥에 갇혔다. 노파가 관아 앞에서 큰절을 했다.'}P.fame=Math.max(0,P.fame-4);if(P.path==='관')P.rank=Math.max(0,P.rank-1);return '자사가 상관과 호족 편을 들었다. 당신 자리가 깎였다.'}},
     {l:'상관과 거래해 노파에게 보상만 받아 준다',st:'매',d:45,act:ok=>{if(ok){P.s.매+=2;return '호족이 노파에게 밭과 곡식을 주었다. 죄는 묻히고 노파는 굶지 않게 되었다.'}P.s.매-=1;return '상관은 당신이 옛일을 들춘다며 눈을 흘겼다.'}},
     {l:'문서를 덮고 노파에게 미안하다고만 한다',act:()=>{P.s.정-=2;P.wealth+=4;return '호족 집에서 고맙다는 인사가 왔다. 노파는 그해 겨울 세상을 떠났다.'}}],
 to:()=>'문서는 다시 서고로 들어갔다.'},
/* ---- 직무 사건 ---- */
{id:'o_shangji',season:3,w:6,cd:3,when:()=>P.path==='관'&&P.rank>=3&&P.post&&P.post.hu,time:8,title:'상계',han:'計',hr:'계',
 text:()=>`해가 저문다. 올해 ${P.post.where}의 호구와 곡식, 도적의 수를 적은 계부(計簿)를 조정에 올려야 한다. 민심은 ${P.post.minsim}, 창고는 ${(P.post.grain||0).toLocaleString()}석이다.`,
 ch:[{l:'있는 그대로 적어 올린다',act:()=>{const g=P.post.minsim>=55;P.fame+=g?6:1;return g?'정직하고 실적도 좋다는 평을 받았다.':'숫자는 초라했지만 거짓은 없었다.'}},
     {l:'호구와 곡식을 부풀린다',st:'지',d:55,act:ok=>{if(ok){P.fame+=9;later('o_shangji_x',rint(2,5),{});return '실적이 뛰어나다며 조정에서 칭찬하는 글이 내려왔다.'}P.fame=Math.max(0,P.fame-8);return '숫자가 앞뒤가 맞지 않았다. 상계리가 고개를 저었다.'}},
     {l:'상계리 편에 뇌물을 실어 보낸다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=15;P.fame+=5;return '조정의 상서랑이 계부를 대충 넘겼다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-3);return '계부가 늦게 올라가 문책을 받았다.'}},
{id:'o_shangji_x',when:()=>false,time:7,title:'부풀린 장부',han:'虛',hr:'허',
 text:()=>'몇 해 전 부풀려 올린 호구 수만큼 세금을 내라는 명이 내려왔다. 실제 백성으로는 채울 수 없다.',
 ch:[{l:'백성에게서 억지로 거둔다',act:()=>{P.post.minsim=c100(P.post.minsim-15);P.fame+=2;return '기한은 맞췄지만 고을 곳곳에서 원망이 터져 나왔다.'}},
     {l:'창고를 털어 채운다',act:()=>{P.post.grain=Math.round((P.post.grain||0)*.5);return '창고가 반으로 줄었다.'}},
     {l:'사실을 털어놓는다',act:()=>{P.fame=Math.max(0,P.fame-12);P.s.매+=2;return '거짓 보고의 죄로 녹봉이 깎였다.'}}],
 to:()=>{P.post.minsim=c100(P.post.minsim-10);return '아전들이 알아서 백성을 쥐어짰다.'}},
{id:'o_xingxian',season:0,w:5,cd:3,when:()=>P.path==='관'&&P.rank>=5&&P.rank<=6,time:8,title:'순행',han:'巡',hr:'순',

{id:'o_yuan',w:4,cd:5,when:()=>P.path==='관'&&P.rank>=2,time:8,title:'옥사 재심',han:'獄',hr:'옥',

function gunState(g,y){
  const key=g+':'+y;if(GS_CACHE[key])return GS_CACHE[key];
  const G=GUNMAP[g];const r=frac(Math.sin(hstr(key)*12.9898+y)*43758.5453);

function postYear(){
  if(!P.post||P.age<15)return;const q=P.post,g=P.gun?gunState(P.gun,P.year):{};
  if(P.path==='관'){q.minsim=c100(q.minsim+(g.harvest==='흉년'?-6:g.harvest==='풍년'?3:0)+(g.war?-8:0)+(50-q.minsim)*.08);
    q.chian=c100(q.chian+(g.war?-10:2)+(50-q.chian)*.06);
    if(q.grain!=null)q.grain=Math.max(0,Math.round(q.grain*(g.harvest==='흉년'?.8:1.05)+(g.war?-q.grain*.15:0)));
    if(q.lv>=2){const fm=Math.round((q.minsim-50)/20);if(fm)P.fame=Math.max(0,P.fame+fm);}}
  if(P.path==='군'){q.troops=Math.round(q.troops+(q.cap-q.troops)*.35);q.supply=c100(q.supply+(g.war?-12:8)+(g.harvest==='흉년'?-8:0));q.morale=c100(q.morale+(q.supply-60)/10+(55-q.morale)*.2);}
  if(P.path==='상'){q.credit=c100(q.credit+(55-q.credit)*.05);}
  if(P.path==='적'){q.heat=c100(q.heat-6);q.food=c100(q.food-8+(g.harvest==='흉년'?-6:0));if(q.food<15){q.men=Math.round(q.men*.85);}}
}
function postSeason(f){
  const q=P.post;if(!q)return;
  if(P.path==='관'){if(f==='work'){q.minsim=c100(q.minsim+1.2);q.chian=c100(q.chian+1);}}
  if(P.path==='군'){if(f==='work')q.train=c100(q.train+(100-q.train)*.045);else q.train=c100(q.train-.8);}
  if(P.path==='상'&&f==='work'&&R()<.06)q.partners=Math.min(20,q.partners+1);
  if(P.path==='적'&&f==='work'){q.men+=rint(0,3);q.heat=c100(q.heat+2);q.food=c100(q.food+3);}
}

function schedule(){

  const base=(P.away?4000:P.age<14?3500:14000)/4;tickT=setTimeout(tick,base/speed);
}
function tick(){
  if(!P||!P.alive||curEv)return;
  P.season=((P.season==null?3:P.season)+1)%4;
  if(P.season===0){
    P.year++;P.age++;
    if(eraName(P.year)!==eraName(P.year-1))addLog(`시대가 바뀌었다. ${eraName(P.year)}의 시대.`,'world');
    if(P.away&&P.year>=P.away.until){const yn=P.year-P.away.start;addLog(`${['','한 해','두 해','삼 년','네 해','다섯 해'][yn]||yn+'년'} ${jo(P.away.label,'을/를')} 마쳤다. ${P.away.end}`.trim(),'key');P.away=null;}
    dueLater();
    worldYear();
    yearly();
    P.evSeason=rint(0,3);
  }
  if(P.alive&&P.season===3&&P.age>=6)for(const w of [WORLD[P.year]].concat(NEWS[P.year]||[]))if(w)addLog(w,'world');
  if(P.alive&&P.season===2&&P.flags.debt){P.wealth=Math.max(0,P.wealth-P.flags.debt);addLog(`가을걷이 뒤 봄에 빌린 장리쌀 ${money(P.flags.debt)}어치를 갚았다.`,'flow');P.flags.debt=0;}

    let ev=null;
    const away=!!P.away;
    if(!away&&P.queue&&P.queue.length&&P.age>=12){const q=P.queue.shift();P.tmp.q=q;if(!(q.id==='marry'&&P.married))ev=EV.find(x=>x.id===q.id)||null;}
    if(P.alive&&!away)applySeason();

    if(away){if(!ev){const has=id=>P.done.includes(id);ev=EV.find(e=>e.prio&&!has(e.id)&&e.when())||null;
      if(ev){addLog(`난리가 닥쳐 ${jo(P.away.label,'을/를')} 다 마치지 못하고 움막을 나섰다.`,'key');P.away=null;}}}
    else if(!ev&&(P.age>=16?R()<.55:P.season===P.evSeason))ev=pickEvent();
    if(ev){render();return showEvent(ev);}
    if(R()<(P.age<14?.12:.18)){const fl=seasonFlow();if(!P.log.slice(-30).some(e=>e.k==='flow'&&e.t===fl))addLog(fl,'flow');}

}

/* 가산 1 = 1,000전. 한나라 때 중산층 한 집 재산이 약 10만 전, 대부호는 억 전 단위 */
function money(w){const n=Math.round(w*1000);if(n>=1e8)return (n/1e8).toFixed(n>=1e9?0:1).replace(/\.0$/,'')+'억 전';if(n>=1e4)return Math.round(n/1e4).toLocaleString()+'만 전';if(n>=1000)return Math.round(n/1000)+'천 전';return n+'전';}

function pickEvent(){

  newLife();show('game');render();
  const go=()=>{if(P.legend)schedule();else showNaming();};
  if(VS_DELAY===0)return go();
  rollIntro(go);
}
/* 출생 슬롯: 해·고을·집안·타고난 것이 차례로 멈춘다 */
function rollIntro(done){
  const box=$('#roll'),dl=$('#rollRows');let fin=false;const T=[];
  const gift=P.legend?['역사에 이름을 남길 사람',1]:P.genius?['남다른 그릇',1]:P.gifted?[`타고난 ${STK[P.gifted]}`,1]:P.traits.length?[`특기 ${P.traits.join('·')}`,0]:['평범한 아이',0];
  const rows=[['태어난 해',()=>`${rint(155,182)}년`,`${P.born}년`,0],
    ['고을',()=>{const r=wpick(REGIONS,x=>x.w);return `${r.id} ${wpick(gunsOf(r.id),g=>GUNPOP[g[0]]||1e5)[0]}`;},`${P.region} ${P.gun}`,0],
    ['집안',()=>wpick(STATUS,x=>x.p).id,P.status,['명문 사족','한실 종친','지방 호족'].includes(P.status)?1:0],
    ['타고난 것',()=>pick(['평범한 아이','평범한 아이','특기 궁술','특기 언변','특기 기마','타고난 지력','특기 의술','평범한 아이']),gift[0],gift[1]]];
  dl.innerHTML=rows.map(r=>`<div class="rr"><dt>${r[0]}</dt><dd>—</dd></div>`).join('');
  const dds=[...dl.querySelectorAll('dd')];box.hidden=false;
  const end=()=>{if(fin)return;fin=true;T.forEach(clearTimeout);box.hidden=true;box.onclick=null;done();};
  box.onclick=end;
  rows.forEach((r,i)=>{const stop=700+i*650;let t=0;
    const spin=()=>{if(fin)return;if(t>=stop){dds[i].textContent=r[2];dds[i].className='hit'+(r[3]?' rare':'');if(i===rows.length-1)T.push(setTimeout(end,r[3]?1600:1100));return;}
      dds[i].textContent=r[1]();const gap=t<stop-400?45:t<stop-150?90:160;t+=gap;T.push(setTimeout(spin,gap));};
    spin();});
}
/* 이름 짓기: 이름 없는 백성으로 태어났을 때만. 시간은 멈춰 있다 */
function showNaming(){
  const sur=P.surname,cur=P.name.slice(sur.length);curEv={id:'_name',title:'이름'};
  $('#evSeal').innerHTML='名<small>명</small>';$('#evTitle').textContent='이름 짓기';$('#evSecs').textContent='';$('#evBar').style.transform='scaleX(0)';
  $('#say').hidden=true;$('#vs').hidden=true;
  $('#evText').innerHTML=`${esc(P.region)} ${esc(P.gun)}의 ${esc(P.status)} 집안에 아이가 태어났다. 성은 <b>${esc(sur)}</b>. 이름을 지어 주세요.`;
  const sug=[cur];for(let i=0;i<20&&sug.length<3;i++){const g=given(sur);if(!sug.includes(g))sug.push(g);}
  const box=$('#evChoices');
  box.innerHTML=`<div class="namebox"><span class="nsur">${esc(sur)}</span><input id="nameIn" type="text" maxlength="3" value="${esc(cur)}" autocomplete="off" aria-label="이름"><button type="button" class="btn nameok" id="nameOk">이 이름으로</button></div><div class="namehint" id="nameHint">한글 1~3자. 아래 추천 이름을 눌러도 됩니다.</div>`
    +sug.map((g,i)=>`<button type="button" class="choice" data-g="${esc(g)}"><span class="key">${i+1}</span><span class="txt">${esc(sur+g)}</span><span class="tag">${i?'추천':'지금 이름'}</span></button>`).join('');
  $('#sheet').hidden=false;
  box.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{$('#nameIn').value=b.dataset.g;applyName();}));
  $('#nameOk').addEventListener('click',applyName);
  $('#nameIn').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')applyName();});
}
function applyName(){
  const v=($('#nameIn').value||'').trim();
  if(!/^[가-힣]{1,3}$/.test(v)){$('#nameHint').textContent='이름은 한글 1~3자로 지어 주세요.';return;}
  const old=P.name,nw=P.surname+v;
  if(nw!==old){P.name=nw;for(const e of P.log){if(e.html)e.html=e.html.split(old).join(nw);if(e.t)e.t=e.t.split(old).join(nw);}$('#log').innerHTML='';P.log.forEach(drawLog);}
  curEv=null;$('#sheet').hidden=true;render();schedule();
}

/* ===================== 입력 ===================== */
$('#oddsTable').innerHTML=STATUS.slice().sort((a,b)=>b.p-a.p).map(s=>`<tr class="${s.p<.01?'rare':''}"><td>${gl(s.id)}</td><td>${(s.p*100).toString().replace(/(\.\d{2})\d+/,'$1')}%</td></tr>`).join('');
$('#startBtn').addEventListener('click',start);
$('#againBtn').addEventListener('click',start);
$('#speedBtn').addEventListener('click',()=>{speed=speed===.5?1:speed===1?2:speed===2?4:.5;$('#speedBtn').textContent=speed===.5?'×½':'×'+speed;schedule();});
$('#pauseBtn').addEventListener('click',()=>{paused=!paused;$('#pauseBtn').textContent=paused?'진행':'멈춤';schedule();});
const SHARE_URL='';
/* 다른 플레이어의 흔적: 실제 배포 주소에서만 서버와 주고받는다 */
const API_ON=()=>!!SHARE_URL&&/^https?:$/.test(location.protocol);
async function postLife(odds,seal){
  if(!API_ON())return;
  try{
    const body={name:P.name,born:P.born,died:P.deathYear,age:P.age,region:P.region,gun:P.gun||'',status:P.status,title:(P.best&&P.best.t)||fullTitle(),
      cause:P.deathCause||'병',grade:seal,odds:Math.max(1,Math.min(Math.round(odds),1e13)),legend:P.legend||''};
    const r=await fetch('/api/life',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return;
    const d=await r.json();const box=$('#tidings');if(!box)return;
    box.innerHTML=`<h3>천하 소식 天下</h3><p>오늘 천하에서 <b>${d.today.toLocaleString()}번째</b>로 한평생을 마친 사람입니다.</p>`+
      `<p>오늘 ${esc(jo(P.deathCause||'병','로'))} 세상을 떠난 사람 <b>${d.sameToday.toLocaleString()}명</b>, 지금까지 ${d.sameAll.toLocaleString()}명.</p>`+
      `<p>오늘 당신보다 드문 삶을 산 사람 ${d.rarer.toLocaleString()}명.</p>`;
    box.hidden=false;
  }catch(_){}
}
async function loadWall(){
  if(!API_ON())return;
  try{
    const r=await fetch('/api/stats');if(!r.ok)return;const d=await r.json();const w=$('#wall');
    const cs=(d.causes||[]).map(([c,n])=>`${esc(c)} ${n}명`).join(' · ');
    const rs=(d.rarest||[]).map(x=>`<li><b>${esc(x.name)}</b> · ${esc(x.title)} <span class="mut">${kor(x.odds)}명 중 한 사람</span></li>`).join('');
    const rc=(d.recent||[]).map(x=>`<li><b>${esc(x.name)}</b> <span class="mut">${x.born}–${x.died}</span> · ${esc(x.region)} ${esc(x.gun||'')} · ${esc(x.title)} · ${esc(x.cause)}</li>`).join('');
    w.innerHTML=`<h2>천하 소식 · 오늘 ${(d.today||0).toLocaleString()}명이 살다 갔다 · 지금까지 ${(d.total||0).toLocaleString()}명</h2>`+
      (cs?`<p>오늘의 사인: ${cs}</p>`:'')+(rs?`<h3>오늘 가장 드문 삶</h3><ol>${rs}</ol>`:'')+(rc?`<h3>묘비 벽 墓碑</h3><ul>${rc}</ul>`:'<p>아직 이 세상을 다녀간 사람이 없습니다. 첫 번째가 되어 보십시오.</p>');
    w.hidden=false;
  }catch(_){}
}
if(SHARE_URL&&navigator.share)$('#copyBtn').textContent='행장 공유';
$('#copyBtn').addEventListener('click',async()=>{
  const t=(P&&P.share||'')+(SHARE_URL?`\n${SHARE_URL}`:'');
  const fb=()=>{const a=$('#copyArea');a.hidden=false;a.value=t;a.focus();a.select();$('#toast').textContent='선택된 글을 복사하세요.';};
  if(SHARE_URL&&navigator.share){try{await navigator.share({title:'난세일생',text:P&&P.share||'',url:SHARE_URL});$('#toast').textContent='공유했습니다.';return;}catch(e){if(e&&e.name==='AbortError')return;}}
  try{navigator.clipboard.writeText(t).then(()=>{$('#toast').textContent='복사했습니다.';},fb);}catch(_){fb();}
});
$('#focus').addEventListener('click',e=>{const b=e.target.closest('button[data-f]');if(!b||!P)return;const k=b.dataset.f;if(P.focus===k)return;P.focus=k;addLog(`방침을 ${jo(focusLabel(k),'로')} 바꾸었다.`,'flow');render();});
$('#mapBtn').addEventListener('click',()=>{const p=$('#mapPane');p.hidden=!p.hidden;$('#mapBtn').classList.toggle('on',!p.hidden);drawGameMap(true);});
function showGloss(t){
  const k=t.dataset.t,g=$('#gloss');g.dataset.k=k;const tk=k.startsWith('특기 ')?k.slice(3):null;$('#glT').textContent=tk?`특기 · ${tk}`:k;$('#glD').textContent=tk?(TR[tk]?TR[tk].d:''):(GL[k]||'');g.hidden=false;
  const r=t.getBoundingClientRect(),gw=g.offsetWidth,gh=g.offsetHeight;
  let x=Math.min(Math.max(16,r.left),innerWidth-16-gw),y=r.bottom+6;if(y+gh>innerHeight-8)y=Math.max(8,r.top-6-gh);
  g.style.left=x+'px';g.style.top=y+'px';
}
document.addEventListener('click',e=>{const t=e.target.closest('.term');const g=$('#gloss');
  if(t){e.preventDefault();e.stopPropagation();if(!g.hidden&&g.dataset.k===t.dataset.t){g.hidden=true;return;}showGloss(t);return;}
  if(!g.hidden&&!e.target.closest('#gloss'))g.hidden=true;},true);
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.term');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showGloss(t);}if(e.key==='Escape')$('#gloss').hidden=true;});
document.addEventListener('keydown',ev=>{
  if(!curEv)return;const n=parseInt(ev.key,10);if(!n)return;
  const btns=[...document.querySelectorAll('#evChoices .choice')];const b=btns[n-1];if(b&&!b.disabled)b.click();
});

/* ===================== 부팅 / 핫리로드 ===================== */
window.claude?.hot?.snapshot?.(()=>({P:P&&P.alive?Object.assign({},P,{tmp:{}}):null,speed}));
function boot(d){
  drawBest();initAtlas();loadWall();
  if(d&&d.P&&d.P.alive){
    P=d.P;if(P.season==null)P.season=0;if(!P.kids)P.kids=(P.children||[]).map(n=>({n,sex:'m',b:P.year-10,alive:1,path:null,rank:0,fate:''}));if(P.traits)P.traits=P.traits.map(t=>t==='장수'?'무병장수':t);if(P.pseed==null)P.pseed=rint(0,9999);if(!P.gun){const g=gunsOf(P.region);if(g.length)P.gun=pick(g)[0];}if(P.s.덕!=null){P.s.매=P.s.덕;delete P.s.덕;}SK.forEach(k=>{if(P.s[k]==null)P.s[k]=50;});P.traits=P.traits||[];P.bonds=P.bonds||{};P.seen=P.seen||[];P.county=P.county||'';speed=d.speed||1;$('#speedBtn').textContent=speed===.5?'×½':'×'+speed;
    $('#log').innerHTML='';P.log.forEach(drawLog);show('game');render();schedule();
  } else show('title');
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
window.__nanse={get P(){return P},get VS(){return VS},set delay(v){VS_DELAY=v},resolve,start,tick,vsAct:x=>vsAct(x)};
})();
