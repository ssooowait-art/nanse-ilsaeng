       if(r.draw){P.fame+=2;return '팽팽했다. 좌중은 둘 다 대단하다고 했다.'}P.fame=Math.max(0,P.fame-3);P.s.매-=1;return '말문이 막혀 얼굴이 붉어졌다.'}},
     {l:'웃으며 술잔을 권한다',st:'매',d:50,act:ok=>{if(ok){P.fame+=2;return '좌중이 웃음을 터뜨렸다. 싸움은 없던 일이 되었다.'}P.fame=Math.max(0,P.fame-2);return '피한다는 수군거림이 들렸다.'}},
     {l:'자리를 뜬다',act:()=>{P.fame=Math.max(0,P.fame-2);return '뒤에서 비웃음 소리가 들렸다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-3);return '대답을 못 하는 사이 상대가 승리를 선언했다.'}},
{id:'sanlao',w:6,once:1,when:()=>P.path==='민'&&P.age>=50&&P.s.매>=55&&P.fame>=8,time:8,title:'삼로 추대',han:'鄕',hr:'향',
 text:()=>'고을 사람들이 당신을 삼로(三老)로 추대하려 한다. 마을의 다툼을 가르고 젊은이들을 가르치는 자리다.',
 ch:[{l:'추대를 받아들인다',act:()=>{hon(`${P.gun} 삼로`,1/3000);P.fame+=6;later('f1_sanlao_case',rint(1,3),{});return '현령도 당신 앞에서는 예를 갖추었다.'}},
     {l:'사양한다',act:()=>{P.s.매+=2;return '겸손하다는 평이 더해졌다.'}}],
 to:()=>'추대는 다른 노인에게 돌아갔다.'},
{id:'hermit',w:5,once:1,when:()=>['민','상'].includes(P.path)&&P.age>=40&&P.s.지>=68&&P.fame>=12,time:8,title:'은거',han:'隱',hr:'은',
 text:()=>'벼슬을 권하는 사람이 끊이지 않는다. 그러나 초가에서 책을 읽는 삶이 좋다.',
 ch:[{l:'초야에 남아 제자를 기른다',act:()=>{hon('은거 명사',1/20000);P.fame+=8;const n=mkName();later('f1_hermit_pupil',rint(3,6),{n});return `사마휘처럼 제자들이 문 앞에 줄을 섰다. 그중 ${jo(n,'이/가')} 가장 영리했다.`}},
     {l:'끝내 출사한다',act:()=>{setPath('관');P.rank=Math.max(P.rank,3);P.fame+=4;return '늦은 나이에 현령으로 나갔다.'}}],
 to:()=>'답을 미루는 사이 또 한 해가 갔다.'},
{id:'healer',w:6,once:1,when:()=>(P.traits||[]).includes('의술')&&P.age>=30&&P.fame>=6&&P.path!=='적',time:8,title:'의원의 길',han:'藥',hr:'약',
 text:()=>'고을마다 당신을 찾는 환자가 줄을 잇는다. 아예 의업에 몸을 바칠까.',
 ch:[{l:'의업에 전념한다',st:'지',d:50,act:ok=>{if(ok){hon('명의',1/10000);P.fame+=8;later('f1_healer_noble',rint(2,4),{});return '이웃 군에서까지 환자를 업고 찾아왔다. 명의라 불렸다.'}P.fame+=2;return '성실했지만 이름이 크게 나지는 않았다.'}},
     {l:'본업으로 돌아간다',act:()=>{P.wealth+=2;return '약방 문을 닫았다. 가끔 이웃이 찾아오면 약초 몇 뿌리를 쥐여 보냈다.'}}],
 to:()=>'환자들은 다른 의원을 찾아갔다.'},
{id:'magnate',w:7,once:1,when:()=>P.path==='상'&&P.wealth>=500&&P.age>=25,time:8,title:'거부',han:'富',hr:'부',
 text:()=>'창고에는 곡식과 비단이 넘치고, 노비와 식객이 천을 헤아린다.',
 ch:[{l:'땅을 사들이고 사병을 기른다',act:()=>{hon('장원의 주인',1/5000);P.fame+=6;later('f1_magnate_levy',rint(1,3),{});return '장원은 작은 성과 같아졌다. 태수도 함부로 못 하는 집안이 되었다.'}},
     {l:'군주에게 재산을 바친다',req:()=>ruler()!=='한',rq:'섬길 군주 없음',act:()=>{const f=ruler();hon(`${f}의 후원자`,1/50000);P.wealth=Math.floor(P.wealth*.4);P.fame+=12;setPath('관');P.rank=Math.max(P.rank,4);return `${jo(f,'이/가')} 당신의 재물로 군을 일으켰다. 유비를 도운 미축처럼 높은 대우를 받았다.`}},
     {l:'흉년에 곳간을 연다',act:()=>{P.wealth=Math.floor(P.wealth*.6);P.s.매+=6;P.fame+=10;hon('의로운 부자',1/8000);return '굶주린 이들이 당신의 이름을 비석에 새겼다.'}}],
 to:()=>'재물은 쌓이기만 했다.'},
{id:'xia',w:6,once:1,when:()=>P.flags.xia&&P.fame>=20&&P.s.무>=60&&P.path!=='관',time:7,title:'협명',han:'俠',hr:'협',
 text:()=>'의리를 지키고 약자를 돕는다는 소문에 천하의 협객들이 당신을 찾아온다.',
 ch:[{l:'협객들의 맹주가 된다',st:'매',d:55,act:ok=>{if(ok){hon('천하의 협객',1/30000);P.fame+=8;later('f1_xia_revenge',rint(1,3),{n:mkName()});return '"그의 한마디는 천금보다 무겁다"는 말이 돌았다.'}P.fame=Math.max(0,P.fame-2);return '따르는 이는 몇 되지 않았다. 오히려 허세라는 말을 들었다.'}},
     {l:'조용히 칼을 거둔다',act:()=>{P.s.정+=2;return '칼을 벽에 걸었다. 찾아오는 이들에게는 밥만 먹여 보냈다.'}}],
 to:()=>'찾아온 이들은 실망하고 돌아갔다.'},
{id:'bandit_surrender',w:9,once:1,when:()=>P.path==='적'&&P.rank>=2&&P.year>=185,time:8,title:'귀순 권유',han:'招',hr:'초',
 text:()=>{const f=ruler()==='한'?'조정':ruler();P.tmp.f=f;return `${f}의 사자가 산채에 왔다. "무리를 이끌고 귀순하면 장수의 인수를 내리겠소."`;},
 ch:[{l:'무리를 이끌고 귀순한다',act:()=>{const r=P.rank;setPath('군');P.rank=r>=3?6:5;P.fame=Math.max(P.fame,TH.군[P.rank])+5;P.flags.yellow=0;hon('귀순한 도적 두목',1/30000);return `${P.tmp.f} 밑에서 ${RANKS.군[P.rank]}이 되었다. 흑산의 장연처럼 도적에서 장수가 되었다.`}},
     {l:'사자의 목을 벤다',st:'무',d:50,act:ok=>{P.fame+=8;later('f1_bandit_siege',1,{});if(ok)return '산채의 사기가 하늘을 찔렀다. 이제 토벌군이 올 것이다.';hurt(30,'토벌군의 창');return '사자의 호위병과 칼부림이 났다. 이제 토벌군이 올 것이다.'}},
     {l:'시간을 끈다',act:()=>{P.fame=Math.max(0,P.fame-2);return '사자는 빈손으로 돌아갔다. 두령들 사이에 두목이 겁을 먹었다는 말이 돌았다.'}}],
 to:()=>'사자는 빈손으로 돌아갔다.'},
{id:'bandit_king',w:9,once:1,when:()=>P.path==='적'&&P.rank>=3&&P.year>=184&&P.year<=230,time:8,title:'칭왕',han:'王',hr:'왕',
 text:()=>'무리가 수만을 헤아린다. 두령들이 무릎을 꿇고 왕을 칭하라 권한다.',
 ch:[{l:'왕을 칭한다',st:'통',d:60,act:ok=>{if(ok){P.flags.king=1;hon(`${P.region}의 자칭 왕`,1/2e6);P.fame+=15;return '엄백호가 동오덕왕을 칭했듯, 한 지방의 왕이 되었다. 조정은 반드시 토벌군을 보낼 것이다.'}hurt(35,'산채의 내분');P.fame=Math.max(0,P.fame-10);return '두령들 사이에 내분이 일어났다.'}},
     {l:'군벌과 손을 잡는다',st:'지',d:55,act:ok=>{if(ok){setPath('군');P.rank=6;P.fame=Math.max(P.fame,TH.군[6])+5;hon('도적 출신 군벌',1/500000);return '군벌의 동맹이 되어 한 고을을 다스리게 되었다.'}P.fame=Math.max(0,P.fame-5);return '협상은 깨졌다.'}},
     {l:'때가 아니다',act:()=>'두령들은 실망한 눈치였다.'}],
 to:()=>'결정을 못 내리는 사이 두령 몇이 떨어져 나갔다.'},
{id:'bandit_purge',w:12,once:1,when:()=>P.flags.king&&P.path==='적',time:6,title:'토벌군',han:'討',hr:'토',
 text:()=>`${ruler()==='한'?'관':ruler()}의 대군이 당신의 왕국을 치러 왔다.`,
 ch:[{l:'정면으로 맞선다',st:'통',d:70,act:ok=>{if(ok){P.fame+=15;hon(`${P.region}의 자칭 왕`,1/5e6);return '토벌군을 물리쳤다. 왕국은 한동안 더 버텼다.'}die('토벌군의 칼');return '왕국은 하루아침에 무너졌다.'}},
     {l:'왕관을 버리고 산으로 숨는다',p:.6,act:ok=>{P.flags.king=0;if(ok)return '왕관을 버리고 살아남았다.';hurt(40,'토벌군의 화살');return '도망치다 화살을 맞았다.'}}],
 to:()=>{hurt(45,'토벌군의 칼');P.flags.king=0;return '왕국이 무너졌다.'}},
/* ---- 가족·사람·고을·계절 사건 ---- */
{id:'mourn',when:()=>false,time:8,title:'상례',han:'喪',hr:'상',
 text:()=>`${P.tmp.q.who} ${jo(P.tmp.q.n,'이/가')} 세상을 떠났다. 상주로서 장례를 치러야 한다.`,
 ch:[{l:'장례를 성대히 치른다',act:()=>{const c=Math.max(5,Math.round(P.wealth*.2));P.wealth=Math.max(0,P.wealth-c);P.fame+=4;P.s.매+=2;return `${money(c)}을 들여 장례를 치렀다. 효자라는 칭송이 돌았다.`}},
     {l:'무덤 곁에서 삼 년 여묘살이를 한다',act:()=>{spend(3,'여묘살이','상복을 벗고 집으로 돌아왔다. 고을에 효행이 알려져 있었다.');P.fame+=7;P.s.매+=3;hurt(8,'여묘살이');P.wealth=Math.max(0,P.wealth-3);if(P.path==='민'||P.path==='상')later('f1_mourn_filial',3,{});return '베옷을 입고 무덤 곁 움막으로 들어갔다.'}},
     {l:'형편대로 간소하게 치른다',act:()=>{P.wealth+=1;return '조촐하게 보내 드렸다. 남은 돈으로 식구들 겨울 양식을 샀다.'}}],
 to:()=>'경황이 없어 이웃들이 대신 장례를 치렀다.'},
{id:'kid_wed',when:()=>false,time:7,title:'딸의 혼례',han:'嫁',hr:'가',
 text:()=>{const c=(P.kids||[])[P.tmp.q.i]||{n:'딸',wed:'이웃'};c.wed=c.wed||'이웃';P.tmp.c=c;return `딸 ${c.n}에게 ${c.wed} 집안에서 혼담이 들어왔다.`},
 ch:[{l:'혼수를 넉넉히 해 보낸다',act:()=>{const c=Math.max(3,Math.round(P.wealth*.15));P.wealth=Math.max(0,P.wealth-c);P.fame+=2;P.s.매+=1;return `${money(c)}어치 혼수를 실어 보냈다. 시댁에서 딸을 귀히 여긴다는 소식이 왔다.`}},
     {l:'더 좋은 집안을 찾는다',st:'매',d:55,act:ok=>{const c=P.tmp.c;if(ok){c.wed=pick(['원','양','순','사마','진','최'])+'씨';c.fate=`명문 ${c.wed} 집안에 시집갔다`;P.fame+=5;later('f1_kidwed_inlaw',rint(2,5),{i:P.tmp.q.i,h:c.wed});return `명문 ${c.wed} 집안과 사돈을 맺었다.`}P.fame=Math.max(0,P.fame-1);return '더 나은 혼처는 없었다. 혼담은 그대로 진행되었고, 사돈은 언짢아했다.'}},
     {l:'딸의 뜻을 묻는다',act:()=>{P.s.매+=2;return '딸은 수줍게 고개를 끄덕였다. 혼례 날 딸은 내내 웃었다.'}}],
 to:()=>'혼례는 예정대로 치러졌다.'},
{id:'son_war',w:6,cd:5,when:()=>P.gun&&gunState(P.gun,P.year).war&&(P.kids||[]).some(c=>c.alive&&c.sex==='m'&&P.year-c.b>=16&&P.year-c.b<=30&&c.path==='민'),time:7,title:'아들의 징발',han:'丁',hr:'정',
 text:()=>{const c=P.kids.find(c=>c.alive&&c.sex==='m'&&P.year-c.b>=16&&P.year-c.b<=30&&c.path==='민');P.tmp.c=c;return `관리가 아들 ${jo(c.n,'을/를')} 군졸로 끌고 가려 한다.`},
 ch:[{l:'보낸다',act:()=>{P.tmp.c.path='군';later('f1_son_return',rint(2,5),{i:P.kids.indexOf(P.tmp.c)});return `${jo(P.tmp.c.n,'이/가')} 창을 메고 떠났다. 뒷모습이 작아 보였다.`}},
     {l:'내가 대신 간다',req:()=>P.age<=50&&P.path!=='관',rq:'50세 이하, 관리 제외',act:()=>{setPath('군');return '아들 대신 창을 받았다. 아들은 당신의 밭을 맡았다.'}},
     {l:'관리에게 돈을 쥐여준다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=15;return '관리가 못 본 척 지나갔다. 대신 이웃집 아들이 끌려갔다.'}}],
 to:()=>{P.tmp.c.path='군';later('f1_son_return',rint(2,5),{i:P.kids.indexOf(P.tmp.c)});return '머뭇거리는 사이 아들이 끌려갔다.'}},
{id:'npc_meet',w:6,cd:4,when:()=>P.age>=18&&(P.npcs||[]).some(n=>n.alive&&n.path&&n.met<3&&n.role!=='상관'&&(n.region===P.region||R()<.25)),time:8,title:'옛 얼굴',han:'舊',hr:'구',
 text:()=>{const n=pick(P.npcs.filter(n=>n.alive&&n.path&&n.met<3&&n.role!=='상관'));P.tmp.n=n;n.met++;return `${n.role==='동무'?'어릴 적 동무':'고향의 라이벌'} ${jo(n.n,'을/를')} ${n.region===P.region?'장터에서':'먼 길 위에서'} 다시 만났다. 그는 ${jo(npcTitle(n),'이/가')} 되어 있었다.`},
 say:()=>[P.tmp.n.n,P.tmp.n.role==='라이벌'?pick(['자네는 아직도 그 모양인가?','이번엔 내가 한발 앞섰군.','언젠가 결판을 내세.']):pick(NPCLINE[P.tmp.n.path]||NPCLINE.민)],
 ch:[{l:'술잔을 나누며 옛이야기를 한다',act:()=>{const n=P.tmp.n;n.bond=Math.min(5,n.bond+1);P.s.매+=1;P.wealth=Math.max(0,P.wealth-1);return `밤새 이야기를 나눴다. 술값은 당신이 냈다. (${n.n} 인연 ${dots(n.bond)})`}},
     {l:'도움을 청한다',req:()=>P.tmp.n.rank>=2&&P.tmp.n.bond>=2,rq:'인연 2 이상, 상대가 출세했을 때',act:()=>{const n=P.tmp.n;later('f2_npc_ask',rint(3,6),{n:n.n});
       if(n.path==='관'&&['민','상'].includes(P.path)){setPath('관');P.rank=1;return `${n.n}의 추천으로 현청에 자리를 얻었다. 언젠가 이 빚을 갚아야 할 것이다.`}
       if(n.path==='군'){P.fame+=6;return `${n.n}의 주선으로 공을 세울 기회를 얻었다. 언젠가 이 빚을 갚아야 할 것이다.`}
       const g=Math.max(10,n.rank*8);P.wealth+=g;return `${jo(n.n,'이/가')} 선뜻 ${money(g)}을 내주었다. 차용증은 받지 않았다.`}},
     {l:'모른 척 지나간다',act:()=>{const n=P.tmp.n;n.bond=Math.max(0,n.bond-1);if(n.rank>=2)later('f2_npc_snub',rint(3,6),{n:n.n});return '등 뒤에서 이름을 부르는 소리가 들렸지만 돌아보지 않았다.'}}],
 to:()=>'인사를 나눌 틈도 없이 엇갈렸다.'},
{id:'npc_foe',w:12,cd:5,when:()=>P.path==='군'&&(P.npcs||[]).some(n=>n.alive&&n.path==='군'&&n.rank>=2&&ruler(n.region,P.year)!==ruler()),time:8,title:'낯익은 적장',han:'仇',hr:'구',
 text:()=>{const n=pick(P.npcs.filter(n=>n.alive&&n.path==='군'&&n.rank>=2&&ruler(n.region,P.year)!==ruler()));P.tmp.n=n;return `적진에서 나선 장수의 얼굴이 낯익다. ${n.role==='동무'?'어릴 적 동무':n.role==='라이벌'?'고향의 라이벌':'옛 상관'} ${jo(n.n,'이/가')} ${jo(npcTitle(n),'이/가')} 되어 있었다.`},
 say:()=>[P.tmp.n.n,P.tmp.n.bond>=2?'…너였구나. 이렇게 만날 줄은 몰랐다.':'네가 감히 내 앞을 막느냐!'],
 ch:[{l:'일기토로 끝을 본다',vs:()=>duelCfg(P.tmp.n.n,45+P.tmp.n.rank*5+(P.tmp.n.pseed%10),null),after:r=>{const n=P.tmp.n;P.hp=Math.max(0,Math.round(r.me));
       if(r.win){n.alive=0;n.fate=`${P.year}년 ${P.name}의 손에 죽음`;P.fame+=14;if(n.bond>=2){P.s.매-=4;return `${jo(n.n,'을/를')} 베었다. 평생 그날을 잊지 못했다.`}return `${jo(n.n,'을/를')} 베었다. 오랜 승부가 끝났다.`}
       if(r.draw){P.fame+=4;P.hp=Math.max(P.hp,5);return '승부가 나지 않았다. 서로 말머리를 돌렸다.'}
       if(r.koMe){if(R()<.45){die(`${n.n}의 칼`);return `${n.n}의 칼이 먼저 닿았다.`}P.hp=6;return `${jo(n.n,'이/가')} 마지막 일격을 거두었다. 옛정이었을까.`}
       P.hp=Math.max(P.hp,5);return '밀려서 물러났다.'}},
     {l:'길을 비켜 준다',act:()=>{const n=P.tmp.n;n.bond=Math.min(5,n.bond+2);P.fame=Math.max(0,P.fame-3);later('f2_foe_spare',rint(2,5),{n:n.n});return `${jo(n.n,'이/가')} 고개를 끄덕이며 지나갔다. 아군 사이에 뒷말이 돌았다. (인연 ${dots(n.bond)})`}},
     {l:'우리 편에 서라고 설득한다',st:'매',d:()=>P.tmp.n.bond>=2?45:62,act:ok=>{const n=P.tmp.n;if(ok){n.region=P.region;n.bond=Math.min(5,n.bond+1);P.fame+=8;later('f2_foe_turn',rint(1,3),{n:n.n});return `${jo(n.n,'이/가')} 칼을 거두고 우리 진영으로 넘어왔다.`}P.fame=Math.max(0,P.fame-2);return '"닥쳐라!" 설득은 통하지 않았다.'}}],
 to:()=>{hurt(15,'적장의 화살');return '머뭇거리는 사이 화살이 날아왔다.'}},
{id:'rival_up',w:5,cd:5,when:()=>P.age>=20&&(P.npcs||[]).some(n=>n.alive&&n.role==='라이벌'&&n.rank>=2&&n.rank>(['군','관','적'].includes(P.path)?P.rank:0)),time:7,title:'라이벌의 출세',han:'競',hr:'경',
 text:()=>{const n=P.npcs.find(n=>n.alive&&n.role==='라이벌'&&n.rank>=2);P.tmp.n=n;return `고향의 라이벌 ${jo(n.n,'이/가')} ${jo(npcTitle(n),'이/가')} 되어 금의환향했다. 잔칫상 앞에서 모두가 당신과 그를 견준다.`},
 say:()=>[P.tmp.n.n,'자네도 좀 분발하게. 허허.'],
 ch:[{l:'축하 선물을 보낸다',act:()=>{P.tmp.n.bond=Math.min(5,P.tmp.n.bond+1);P.s.매+=2;P.wealth=Math.max(0,P.wealth-2);return '닭 두 마리와 술 한 동이를 보냈다. 너그럽다는 말을 들었지만 속은 쓰렸다.'}},
     {l:'그의 비리를 캐내 고발한다',st:'지',d:58,act:ok=>{const n=P.tmp.n;if(ok){n.rank=Math.max(0,n.rank-2);P.fame+=3;P.s.매-=5;n.bond=0;later('f2_rival_grudge',rint(3,6),{n:n.n});return `${jo(n.n,'이/가')} 좌천되었다. 고향 사람들의 눈빛이 차가워졌다.`}P.fame=Math.max(0,P.fame-6);hurt(15,'무고죄');return '증거가 모자랐다. 무고죄로 몰려 곤장을 맞았다.'}},
     {l:'이를 악물고 분발한다',act:()=>{P.s.통+=1;P.s.지+=1;hurt(5,'과로');later('f2_rival_again',rint(4,7),{n:P.tmp.n.n,f:P.fame});return '그날부터 밤잠을 줄였다. 몇 해 뒤를 두고 보자고 다짐했다.'}}],
 to:()=>{P.tmp.n.bond=Math.max(0,P.tmp.n.bond-1);return '잔치 소식을 못 들은 척했다. 그쪽에서도 서운해했다.'}},
{id:'mentor',w:5,cd:6,when:()=>['군','관'].includes(P.path)&&(P.npcs||[]).some(n=>n.alive&&n.role==='상관'),time:8,title:'옛 상관',han:'師',hr:'사',
 text:()=>{const n=P.npcs.find(n=>n.role==='상관'&&n.alive);P.tmp.n=n;P.tmp.fall=n.rank>=3&&R()<.45;
   return P.tmp.fall?`처음 일을 가르쳐 준 상관 ${jo(n.n,'이/가')} 모반에 연루되었다는 혐의로 끌려갔다.`:`처음 일을 가르쳐 준 상관 ${jo(n.n,'이/가')} 당신을 불렀다. 그는 지금 ${npcTitle(n)}이다.`},
 say:()=>[P.tmp.n.n,P.tmp.fall?'…나를 아는 척하지 말게. 자네까지 다친다.':'자네가 이만큼 클 줄 알았지. 하나 더 가르쳐 주마.'],
 ch:[{l:()=>P.tmp.fall?'상관을 변호한다':'가르침을 청한다',st:()=>P.tmp.fall?'정':'지',d:()=>P.tmp.fall?60:30,act:ok=>{const n=P.tmp.n;
       if(P.tmp.fall){if(ok){n.bond=Math.min(5,n.bond+3);P.fame+=8;later('f2_mentor_rec',rint(2,4),{n:n.n});return `${jo(n.n,'이/가')} 누명을 벗었다. 의리 있는 사람이라는 평이 돌았다.`}
         n.alive=0;n.fate=`${P.year}년 모반 혐의로 처형됨`;hurt(25,'연좌');P.fame=Math.max(0,P.fame-4);return `변호는 실패했다. ${jo(n.n,'은/는')} 처형되고 당신도 매를 맞았다.`}
       const k=pick(['통','지','정']);P.s[k]+=rint(3,6);n.bond=Math.min(5,n.bond+1);return `밤늦도록 그의 이야기를 들었다. ${jo(STK[k],'이/가')} 늘었다.`}},
     {l:()=>P.tmp.fall?'모른 척한다':'정중히 인사만 한다',act:()=>{const n=P.tmp.n;if(P.tmp.fall){n.alive=0;n.fate=`${P.year}년 모반 혐의로 처형됨`;P.s.매-=2;later('f2_mentor_son',rint(4,8),{n:n.n});return `${jo(n.n,'은/는')} 처형되었다. 당신은 무사했다.`}n.bond=Math.max(0,n.bond-1);P.s.정+=1;return '짧게 인사하고 물러났다. 그는 조금 섭섭한 얼굴이었다.'}}],
 to:()=>{const n=P.tmp.n;if(P.tmp.fall){n.alive=0;n.fate=`${P.year}년 모반 혐의로 처형됨`;later('f2_mentor_son',rint(4,8),{n:n.n});return '머뭇거리는 사이 판결이 났다.'}n.bond=Math.max(0,n.bond-1);return '바쁜 일로 찾아가지 못했다.'}},
{id:'npc_need',w:4,cd:6,when:()=>P.age>=20&&P.wealth>=30&&(P.npcs||[]).some(n=>n.alive&&n.role==='동무'&&['민','상','적'].includes(n.path)),time:7,title:'동무의 부탁',han:'救',hr:'구',
 text:()=>{const n=P.npcs.find(n=>n.alive&&n.role==='동무'&&['민','상','적'].includes(n.path));P.tmp.n=n;return `어릴 적 동무 ${jo(n.n,'이/가')} 찾아왔다. 빚을 못 갚아 처자식이 노비로 팔려 갈 처지라고 한다.`},
 say:()=>[P.tmp.n.n,'염치없지만… 자네밖에 없네.'],
 ch:[{l:'빚을 다 갚아 준다',act:()=>{const n=P.tmp.n,c=Math.max(20,Math.round(P.wealth*.25));P.wealth-=c;n.bond=Math.min(5,n.bond+2);kind(n.n,'빚을 갚아 준 동무');later('f2_need_back',rint(4,7),{n:n.n,c});return `${money(c)}을 내주었다. ${jo(n.n,'이/가')} 땅에 엎드려 울었다.`}},
     {l:'아이 몸값만 대 준다',act:()=>{const n=P.tmp.n,c=Math.max(8,Math.round(P.wealth*.1));P.wealth-=c;n.bond=Math.min(5,n.bond+1);return `${money(c)}으로 아이만 되찾았다. 아내는 끝내 남의 집 종이 되었다.`}},
     {l:'형편이 안 된다며 거절한다',act:()=>{const n=P.tmp.n;n.bond=Math.max(0,n.bond-2);later('f2_need_sold',rint(1,3),{n:n.n});return `${jo(n.n,'이/가')} 말없이 돌아섰다.`}}],
 to:()=>{P.tmp.n.bond=Math.max(0,P.tmp.n.bond-1);return '대답을 못 하는 사이 동무가 떠났다.'}},
{id:'stranger',w:3,cd:6,when:()=>P.age>=16&&P.path!=='적',time:6,title:'길가의 사람',han:'仁',hr:'인',
 text:()=>{const war=P.gun&&gunState(P.gun,P.year).war;P.tmp.st={n:mkName(),what:war?'다친 병사':'굶주린 아이'};return `길가에 ${jo(P.tmp.st.what,'이/가')} 쓰러져 있다. 숨이 가쁘다.`},
 ch:[{l:'업고 가서 돌본다',act:()=>{const s=P.tmp.st;P.wealth=Math.max(0,P.wealth-3);P.s.매+=2;kind(s.n,`당신이 길에서 살려 준 ${s.what}`);return `며칠을 먹이고 재웠다. 기운을 차린 그는 떠나면서 이름을 일러 주었다. ${s.n}.`}},
     {l:'죽 한 그릇만 먹이고 간다',act:()=>{P.wealth=Math.max(0,P.wealth-1);P.s.매+=1;return '죽을 떠먹여 주고 길을 재촉했다. 뒷일은 알 수 없다.'}},
     {l:'지나친다',act:()=>{P.s.매-=1;return '못 본 척 지나쳤다. 며칠 뒤 그 자리에 거적이 덮여 있었다.'}}],
 to:()=>'머뭇거리는 사이 누군가 먼저 데려갔다.'},
{id:'repay',w:7,cd:5,when:()=>(P.kind||[]).some(k=>!k.repaid&&P.year-k.y>=5),time:8,title:'은혜 갚음',han:'恩',hr:'은',
 text:()=>{const k=P.kind.find(k=>!k.repaid&&P.year-k.y>=5);k.repaid=1;P.tmp.k=k;return `${k.what} ${jo(k.n,'이/가')} 찾아왔다. ${P.year-k.y}년 전의 일이다.`},
 say:()=>[P.tmp.k.n,'그날의 은혜를 하루도 잊은 적이 없습니다.'],
 ch:[{l:'반갑게 맞는다',act:()=>{const k=P.tmp.k;
       if(P.hp<50){P.hp=Math.min(maxHp(),P.hp+35);return `${jo(k.n,'이/가')} 귀한 약재를 가져왔다. 몸이 한결 나아졌다.`}
       if(R()<.45){P.flags.guardian=k.n;return `${jo(k.n,'이/가')} "언제든 목숨을 걸고 돕겠다"며 곁에 머물기로 했다.`}
       const g=Math.max(10,Math.round(P.wealth*.2));P.wealth+=g;P.fame+=3;return `${jo(k.n,'이/가')} ${money(g)}을 내놓았다.`}},
     {l:'은혜를 바라고 한 일이 아니라며 돌려보낸다',act:()=>{P.s.매+=3;P.fame+=4;return '그가 고을 사람들에게 그 이야기를 하고 다녔다.'}}],
 to:()=>'그는 문밖에서 절만 하고 돌아갔다.'},
{id:'gov_greedy',w:5,cd:4,when:()=>P.gov&&P.gov.trait==='탐욕'&&['민','상'].includes(P.path)&&P.age>=16,time:7,title:'탐관',han:'貪',hr:'탐',
 text:()=>`태수 ${jo(P.gov.n,'이/가')} 없던 세금을 만들어 걷는다. 이웃 몇 집은 벌써 밤에 도망쳤다.`,
 ch:[{l:'달라는 대로 바친다',act:()=>{const c=Math.max(2,Math.round(P.wealth*.15));P.wealth-=c;later('f2_greedy_riot',rint(1,2),{g:P.gov.n});return `${money(c)}을 뜯겼다. 이것으로 끝나지 않으리라는 것을 다들 알았다.`}},
     {l:'자사에게 고발장을 올린다',st:'정',d:55,act:ok=>{if(ok){const g=P.gov.n;P.gov={n:mkName(),trait:'청렴',since:P.year,term:rint(5,9)};P.fame+=8;later('f2_greedy_kin',rint(3,5),{g});return '태수가 파면되고 청렴한 새 태수가 왔다. 고을 사람들이 당신을 칭송했다.'}hurt(25,'태수의 보복');return '고발장이 태수 손에 들어갔다. 곤장을 맞았다.'}},
     {l:'고향을 떠난다',act:()=>{P.wealth=Math.floor(P.wealth*.7);const r=moveRandom();return `헐값에 밭을 넘기고 ${jo(r,'로')} 떠났다.`}}],
 to:()=>{const c=Math.max(2,Math.round(P.wealth*.2));P.wealth-=c;return `대답이 늦다며 ${money(c)}을 뜯겼다.`}},
{id:'s_spring',season:0,w:4,cd:3,when:()=>['민','적'].includes(P.path)&&P.wealth<25&&P.age>=12,time:6,title:'춘궁기',han:'春',hr:'춘',
 text:()=>'보리가 익기 전에 쌀독이 바닥났다. 아이들이 배고프다고 운다.',
 ch:[{l:'부잣집에서 장리쌀을 빌린다',act:()=>{P.wealth+=6;P.flags.debt=(P.flags.debt||0)+9;return '가을에 갑절 가까이 갚기로 하고 쌀을 받아 왔다.'}},
     {l:'산에서 나물과 칡뿌리를 캔다',st:'무',d:35,act:ok=>{if(ok){P.s.무+=1;return '배는 곯았지만 버텼다. 칡뿌리 캐는 요령이 늘었다.'}hurt(12,'춘궁기');return '헛걸음만 하고 비탈에서 굴렀다.'}},
     {l:'이웃에게 손을 벌린다',st:'매',d:40,act:ok=>{if(ok){const nb=pick(SURN)+'씨네';P.wealth+=3;later('f2_spring_nb',rint(2,4),{nb});return `이웃 ${jo(nb,'이/가')} 보리 한 말을 내주었다.`}P.fame=Math.max(0,P.fame-1);return '문전박대를 당했다.'}}],
 to:()=>{hurt(10,'춘궁기');return '굶으며 봄을 넘겼다.'}},
{id:'s_autumn',season:2,w:4,cd:3,when:()=>['민','상'].includes(P.path)&&P.age>=15,time:6,title:'세곡',han:'稅',hr:'세',
 text:()=>{const g=P.gun?gunState(P.gun,P.year):{};return `추수가 끝났다. ${g.harvest==='흉년'?'흉년인데도 ':''}현청 아전이 전조(田租)와 산부(算賦)를 거두러 나왔다.`},
 ch:[{l:'정해진 대로 바친다',act:()=>{const c=Math.max(1,Math.round(P.wealth*.08));P.wealth-=c;return `${money(c)}어치를 바쳤다. 장부에 붉은 점이 찍혔다.`}},
     {l:'곡식 일부를 헛간에 숨긴다',p:.6,act:ok=>{if(ok){P.wealth+=2;later('f2_autumn_check',1,{});return '들키지 않았다. 숨긴 자루는 헛간 짚 밑에 그대로 있다.'}hurt(12,'곤장');P.wealth=Math.max(0,P.wealth-5);return '들켜서 곤장을 맞고 더 뜯겼다.'}},
     {l:'아전에게 뒷돈을 준다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=3;return '장부의 숫자가 줄었다. 아전은 내년에도 오겠다고 했다.'}}],
 to:()=>{const c=Math.max(1,Math.round(P.wealth*.12));P.wealth-=c;return '아전이 멋대로 더 걷어 갔다.'}},
{id:'s_winter',season:3,w:3,cd:3,when:()=>P.age>=10&&P.path!=='관',time:6,title:'혹한',han:'寒',hr:'한',
 text:()=>'칼바람이 분다. 우물이 얼고 땔감이 떨어졌다.',
 ch:[{l:'산에 가서 나무를 해 온다',st:'무',d:35,act:ok=>{if(ok){P.wealth+=1;return '등짐 가득 나무를 해 왔다. 남은 장작은 장터에 내다 팔았다.'}hurt(15,'혹한');return '눈길에 미끄러져 다쳤다.'}},
     {l:'이웃과 한 방에 모여 지낸다',act:()=>{P.s.매+=1;if(R()<.25){hurt(8,'고뿔');return '좁았지만 따뜻했다. 다만 기침이 온 방에 옮았다.'}return '좁았지만 따뜻했다. 밤마다 옛이야기가 이어졌다.'}},
     {l:'숯을 사 온다',req:()=>P.wealth>=5,rq:'5천 전 필요',act:()=>{P.wealth-=3;return '숯 한 짐을 샀다. 숯 장수가 값을 두 배로 불렀다.'}}],
 to:()=>{hurt(12,'혹한');return '떨면서 겨울을 났다.'}},
{id:'s_newyear',season:0,w:3,cd:4,when:()=>P.age>=10,time:7,title:'정월',han:'正',hr:'정',
 text:()=>'정월 초하루다. 집집마다 조상께 제사를 올리고 복숭아나무 부적을 문에 건다.',
 ch:[{l:'점쟁이에게 올해 운수를 묻는다',p:.5,act:ok=>{P.wealth=Math.max(0,P.wealth-1);if(ok){P.flags.omen=P.year;return '"올해는 귀인을 만날 운이오." 왠지 힘이 났다. (올해 운 판정 +5%p)'}return '"올해는 몸조심하시오." 복채만 날렸다.'}},
     {l:'정성껏 제사를 올린다',act:()=>{P.s.매+=1;P.s.정+=1;P.wealth=Math.max(0,P.wealth-1);return '제수를 넉넉히 차렸다. 친척 어른들이 예를 안다고 했다.'}},
     {l:'친척들과 초백주를 마신다',act:()=>{P.hp=Math.min(maxHp(),P.hp+5);return '산초 띄운 술을 나이 어린 사람부터 마셨다. 얼큰하게 취했다.'}}],
 to:()=>'바쁜 일로 정월을 그냥 넘겼다.'},
/* ---- 가업과 방침의 전환점 ---- */
{id:'kagup',w:8,once:1,when:()=>P.age>=10&&P.age<=14&&P.fam&&P.fam.fa&&P.fam.fa.alive&&P.fam.fa.job,time:8,title:'가업',han:'業',hr:'업',
 text:()=>{const j=P.fam.fa.job;return `${P.status==='유민'?'아버지가':`아버지 ${jo(P.fam.fa.n,'이/가')}`} ${j[0]} 일을 가르쳐 주겠다고 한다.`},
 say:()=>[P.status==='유민'?'아버지':P.fam.fa.n,'이 일로 우리 식구가 먹고살았다. 너도 배워 두어라.'],
 ch:[{l:'가업을 배운다',act:()=>{const j=P.fam.fa.job;const b=j[3]||{정:1};for(const k in b)P.s[k]+=b[k]+1;let extra='';if(j[4]&&!P.traits.includes(j[4])&&R()<.5){P.traits.push(j[4]);extra=` 특기 ${jo(j[4],'을/를')} 얻었다.`}P.flags.kagup=j[0];P.wealth+=2;return `${j[0]} 일을 손에 익혔다.${extra}`}},
     {l:'글을 배우고 싶다고 조른다',act:()=>{P.s.지+=3;return '아버지는 한숨을 쉬었지만 서당에 보내 주었다.'}},
     {l:'몰래 무예를 익힌다',p:.7,act:ok=>{P.s.무+=3;if(ok)return '뒷산에서 몰래 목검을 휘둘렀다.';hurt(8,'아버지의 매');return '들켜서 종아리를 맞았다.'}}],
 to:()=>'대답을 미루는 사이 아버지는 혼자 일하러 나갔다.'},
{id:'m_arms',when:()=>false,time:8,title:'무예 겨루기',han:'武',hr:'무',
 text:()=>'무예를 닦은 지 세 해. 고을에서 무예 겨루기가 열렸다. 사람들이 당신 이름을 부른다.',
 ch:[{l:'겨루기에 나선다',vs:()=>{P.tmp.fmu=rint(48,72);return duelCfg('고을의 장사',P.tmp.fmu,'이 고을에서 나를 이긴 자는 없다.');},after:r=>{P.hp=Math.max(1,Math.round(r.me));
       if(r.win){P.fame+=8;hon(`${P.gun} 제일의 무사`,1/3000);if(['민','상'].includes(P.path)){later('m_arms_offer',1,{});}return '고을의 장사를 꺾었다. 군관들이 눈여겨보았다.'}
       if(r.draw){P.fame+=3;return '승부가 나지 않았다. 박수가 쏟아졌다.'}P.fame+=1;return '졌다. 그래도 이름은 알렸다.'}},
     {l:'아이들에게 무예를 가르친다',act:()=>{P.s.매+=3;P.wealth+=4;P.fame+=3;return '사범 노릇을 하며 수업료를 받았다.'}},
     {l:'더 깊이 수련한다',act:()=>{P.s.무+=3;return '산속 절벽 아래서 한 철을 보냈다.'}}],
 to:()=>'구경만 하고 돌아왔다.'},
{id:'m_arms_offer',when:()=>false,time:8,title:'군관의 제안',han:'招',hr:'초',
 text:()=>`작년 겨루기를 본 ${ruler()==='한'?'관군':ruler()}의 군관이 찾아왔다. "그 솜씨를 나라를 위해 쓰지 않겠나?"`,
 ch:[{l:'군문에 들어간다',act:()=>{setPath('군');P.rank=Math.max(P.rank,2);P.fame=Math.max(P.fame,TH.군[2])+2;return '십장으로 군문에 들었다.'}},
     {l:'고향을 지키겠다며 사양한다',act:()=>{P.s.매+=2;return '군관은 아쉬워하며 돌아갔다.'}}],
 to:()=>'군관은 답을 기다리다 떠났다.'},
{id:'m_arms2',when:()=>false,time:8,title:'검의 경지',han:'劍',hr:'검',
 text:()=>'아홉 해를 하루같이 칼을 갈았다. 천하의 고수들이 당신 이름을 입에 올린다.',
 ch:[{l:'이름난 고수와 겨룬다',vs:()=>duelCfg('천하의 고수',rint(75,90),'소문만큼인지 보자.'),after:r=>{P.hp=Math.max(1,Math.round(r.me));if(r.win){hon('천하의 검객',1/100000);P.fame+=15;return '고수가 칼을 내려놓고 고개를 숙였다.'}if(r.draw){P.fame+=6;hon('이름난 검객',1/20000);return '하루 종일 겨뤄도 승부가 나지 않았다.'}P.fame+=2;return '한 수 배웠다.'}},
     {l:'의병을 모아 난세를 바로잡는다',req:()=>P.path!=='관',rq:'관리 제외',act:()=>{setPath('군');P.rank=Math.max(P.rank,3);P.fame+=10;return '칼 한 자루에 사람들이 모여들었다.'}},
     {l:'칼을 거두고 제자를 기른다',act:()=>{hon('무예의 스승',1/10000);P.s.매+=3;return '문하에 제자가 수십을 헤아렸다.'}}],
 to:()=>'소문은 소문으로 끝났다.'},
{id:'m_study',when:()=>false,time:8,title:'글 읽는 사람',han:'書',hr:'서',
 text:()=>'세 해 동안 책을 놓지 않았다. 고을 선비들 사이에서 당신 이름이 오르내린다.',
 ch:[{l:'낙양의 태학에 간다',req:()=>P.wealth>=10&&P.year<220,rq:'1만 전과 한 조정이 있어야',act:()=>{P.wealth-=10;P.s.지+=3;later('m_study_exam',2,{});return '책 상자를 지고 태학에 들어갔다.'}},
     {l:'고을에 글방을 연다',act:()=>{P.s.매+=2;P.fame+=5;P.wealth+=3;later('m_study_pupil',rint(6,10),{n:mkName()});return '아이들이 하나둘 글을 배우러 왔다.'}},
     {l:'이름난 명사에게 인물평을 청한다',st:'매',d:55,act:ok=>{if(ok){P.fame+=10;return '"난세를 다스릴 인재"라는 평을 받았다. 고을이 떠들썩했다.'}P.fame=Math.max(0,P.fame-3);return '"책만 읽은 샌님"이라는 평을 받았다.'}}],
 to:()=>'책장만 넘기다 한 해가 갔다.'},
{id:'m_study_exam',when:()=>false,time:8,title:'태학의 시험',han:'試',hr:'시',
 text:()=>'태학에서 두 해. 경전 시험을 통과하면 낭관으로 뽑힐 수 있다.',
 ch:[{l:'시험을 치른다',st:'지',d:60,act:ok=>{if(ok){setPath('관');P.rank=Math.max(P.rank,2);P.fame+=6;return '시험에 붙어 낭관이 되었다.'}P.fame+=1;return '떨어졌다. 고향으로 돌아왔다.'}},
     {l:'당고에 연루된 선비들과 어울린다',act:()=>{P.s.매+=3;P.fame+=4;if(R()<.4){hurt(20,'옥사');return '당인으로 몰려 옥에 갇혔다가 풀려났다.'}return '청류 선비들과 이름을 나란히 했다.'}}],
 to:()=>'시험장에 늦었다.'},
{id:'m_study_pupil',when:()=>false,time:8,title:'옛 제자',han:'弟',hr:'제',
 text:()=>`글방에서 가르친 ${jo(P.tmp.q.n,'이/가')} 관리가 되어 인사를 왔다.`,
 say:()=>[P.tmp.q.n,'스승님 덕분에 오늘이 있습니다.'],
 ch:[{l:'반갑게 맞는다',act:()=>{P.fame+=6;P.s.매+=2;if(['민','상'].includes(P.path)&&R()<.5){setPath('관');P.rank=Math.max(P.rank,1);return '제자의 추천으로 현청에 자리를 얻었다.'}return '제자가 고을 사람들 앞에서 큰절을 올렸다.'}},
     {l:'청탁을 넣는다',act:()=>{P.wealth+=12;P.s.매-=3;return '제자가 난처해하며 들어주었다.'}}],
 to:()=>'제자는 선물만 두고 돌아갔다.'},
{id:'m_study2',when:()=>false,time:8,title:'붓으로 남긴 것',han:'著',hr:'저',
 text:()=>'아홉 해의 공부가 글로 쌓였다. 이를 책으로 엮을지 고민한다.',
 ch:[{l:'경전 주석서를 쓴다',st:'지',d:65,act:ok=>{if(ok){hon('경학자',1/50000);P.fame+=12;return '주석서가 필사되어 이웃 군까지 퍼졌다.'}P.fame+=3;return '원고는 집안에만 남았다.'}},
     {l:'고을의 역사를 기록한다',act:()=>{hon(`${P.gun}의 기록자`,1/20000);P.fame+=6;return '고을 사람들의 이야기를 죽간에 남겼다.'}},
     {l:'붓을 꺾고 세상에 나선다',act:()=>{if(['민','상'].includes(P.path)){setPath('관');P.rank=Math.max(P.rank,2);}P.fame+=5;return '글보다 세상을 바꾸고 싶었다.'}}],
 to:()=>'원고는 상자 속에 잠들었다.'},
{id:'m_social',when:()=>false,time:8,title:'모여드는 사람들',han:'結',hr:'결',
 text:()=>{const f=(P.npcs||[]).find(n=>n.alive&&n.role==='동무');P.tmp.fr=f;return `교유가 넓어져 집에 호걸들이 모여든다.${f?` 동무 ${f.n}도 왔다.`:''} 다들 술잔을 들고 의형제를 맺자고 한다.`},
 ch:[{l:'의형제를 맺는다',act:()=>{P.flags.sworn=1;if(P.tmp.fr)P.tmp.fr.bond=5;P.fame+=6;later('m_social_sworn',rint(3,7),{});return '하늘에 맹세했다. "한날한시에 죽기를 바란다."'}},
     {l:'식객을 거둔다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',act:()=>{P.wealth-=10;P.fame+=8;later('m_social_guest',rint(2,5),{n:mkName()});return '식객 수십 명이 집을 드나들었다.'}},
     {l:'모임을 줄인다',act:()=>{P.wealth+=3;return '조용히 지내기로 했다.'}}],
 to:()=>'술자리는 밤늦게 흩어졌다.'},
{id:'m_social_sworn',when:()=>false,time:8,title:'의형제의 맹세',han:'盟',hr:'맹',
 text:()=>'의형제들이 찾아왔다. "형님께 어려움이 있다 들었소. 우리가 함께하겠소."',
 ch:[{l:'함께 의병을 일으킨다',req:()=>P.path!=='관',rq:'관리 제외',act:()=>{setPath('군');P.rank=Math.max(P.rank,3);P.fame+=10;return '의형제들과 함께 군사를 일으켰다.'}},
     {l:'형제들의 도움으로 집안을 일으킨다',act:()=>{P.wealth+=20;P.hp=Math.min(maxHp(),P.hp+15);return '형제들이 곡식과 돈을 싸 들고 왔다.'}},
     {l:'형제의 어려움을 먼저 돕는다',act:()=>{P.wealth=Math.max(0,P.wealth-10);P.s.매+=4;P.flags.guardian=P.flags.guardian||'의형제';return '형제를 위해 재물을 내놓았다. 형제는 목숨을 걸고 갚겠다고 했다.'}}],
 to:()=>'형제들은 술만 마시고 돌아갔다.'},
{id:'m_social_guest',when:()=>false,time:8,title:'식객',han:'客',hr:'객',
 text:()=>`거두어 먹이던 식객 ${jo(P.tmp.q.n,'이/가')} 할 말이 있다며 찾아왔다.`,
 say:()=>[P.tmp.q.n,R()<.5?'주인의 은혜를 갚을 때가 왔습니다.':'주인께서 저를 믿어 주신다면 큰일을 해 보이겠습니다.'],
 ch:[{l:'믿고 큰돈을 맡긴다',p:.55,act:ok=>{if(ok){P.wealth+=25;P.fame+=4;return `${jo(P.tmp.q.n,'이/가')} 장사로 큰돈을 벌어 돌아왔다.`}P.wealth=Math.max(0,P.wealth-15);return `${jo(P.tmp.q.n,'이/가')} 돈을 들고 사라졌다.`}},
     {l:'그의 재주를 시험해 본다',st:'지',d:50,act:ok=>{if(ok){P.flags.guardian=P.flags.guardian||P.tmp.q.n;return '재주가 진짜였다. 그는 평생 당신 곁을 지키기로 했다.'}return '허풍이었다.'}},
     {l:'내보낸다',act:()=>'식객이 한 명 줄었다.'}],
 to:()=>'식객은 말을 꺼내지 못하고 물러났다.'},
{id:'m_social2',when:()=>false,time:7,title:'고을의 여론',han:'論',hr:'론',
 text:()=>'고을의 크고 작은 일이 당신의 한마디로 정해진다. 태수도 당신의 눈치를 본다.',
 ch:[{l:'여론을 모아 태수를 갈아 치운다',st:'정',d:55,act:ok=>{if(ok){P.gov={n:mkName(),trait:'청렴',since:P.year,term:rint(5,9)};hon('고을의 여론을 움직인 사람',1/20000);P.fame+=10;return '고을 사람들의 상소로 태수가 바뀌었다.'}hurt(15,'태수의 보복');return '태수의 미움을 샀다.'}},
     {l:'다툼을 중재하며 덕을 쌓는다',act:()=>{P.s.매+=3;P.fame+=6;hon('고을의 어른',1/5000);return '사람들이 당신을 어른이라 불렀다.'}}],
 to:()=>'이번에는 나서지 않았다.'},
{id:'m_work',when:()=>false,time:8,title:'한길을 걸어온 세월',han:'勤',hr:'근',
 text:()=>({민:'네 해 동안 땅만 보고 살았다. 이웃의 땅을 살 기회가 왔다.',군:'네 해 동안 군무에 힘썼다. 상관이 당신을 눈여겨본다.',관:'네 해 동안 공무에 힘썼다. 근면하다는 평이 위에 닿았다.',상:'네 해 동안 장사에 매달렸다. 단골이 늘어 가게를 낼 만하다.',적:'네 해 동안 산채를 지켰다. 무리가 갑절로 늘었다.'}[P.path]||'한길을 걸어온 세월이 쌓였다.'),
 ch:[{l:()=>({민:'빚을 내서라도 땅을 산다',군:'어려운 임무를 자청한다',관:'더 큰 고을로 보내 달라 청한다',상:'큰 가게를 낸다',적:'이웃 산채를 친다'}[P.path]||'더 크게 벌인다'),p:.6,act:ok=>{
       if(P.path==='민'){if(ok){P.wealth+=30;later('m_work_land',rint(4,8),{});return '논밭이 갑절이 되었다.'}P.wealth=Math.max(0,P.wealth-10);P.flags.debt=(P.flags.debt||0)+8;return '흉년이 겹쳐 빚만 남았다.'}
       if(P.path==='상'){if(ok){P.wealth=Math.round(P.wealth*1.5)+20;later('m_work_shop',rint(3,6),{});return '가게 앞이 손님으로 붐볐다.'}P.wealth=Math.round(P.wealth*.6);return '자리를 잘못 잡았다.'}
       if(ok){P.fame+=10;if(P.path==='적')P.rank=Math.min(3,P.rank+1);return '보란 듯이 해냈다.'}hurt(25,'무리한 임무');return '무리했다가 크게 다쳤다.'}},
     {l:'지금 자리를 다진다',act:()=>{P.fame+=3;P.wealth+=4;return '서두르지 않기로 했다.'}}],
 to:()=>'기회는 다른 사람에게 갔다.'},
{id:'m_work_land',when:()=>false,time:7,title:'땅 부자',han:'田',hr:'전',
 text:()=>'사들인 땅에서 해마다 소출이 늘었다. 소작인들이 당신 땅을 부치겠다고 찾아온다.',
 ch:[{l:'소작을 주고 지주가 된다',act:()=>{P.wealth+=40;hon('고을의 지주',1/3000);return '이제 남이 당신 땅을 부친다.'}},
     {l:'소작료를 낮게 받는다',act:()=>{P.wealth+=15;P.s.매+=4;P.fame+=6;return '"인정 많은 지주"라는 말이 돌았다.'}}],
 to:()=>'땅은 묵혀 둔 채 한 해가 갔다.'},
{id:'m_work_shop',when:()=>false,time:7,title:'번창',han:'昌',hr:'창',
 text:()=>'가게가 번창해 이웃 군에 분점을 낼 만하다. 관청에서는 세금을 더 내라고 한다.',
 ch:[{l:'분점을 낸다',p:.65,act:ok=>{if(ok){P.wealth=Math.round(P.wealth*1.6);return '분점도 손님으로 붐볐다.'}P.wealth=Math.round(P.wealth*.7);return '분점이 망했다.'}},
     {l:'관리에게 뇌물을 주고 세금을 피한다',act:()=>{P.wealth+=10;P.flags.bribe=1;later('f_bribe_out',rint(3,6),{});return '장부가 가벼워졌다.'}}],
 to:()=>'관리가 와서 세금을 더 걷어 갔다.'},
{id:'f_bribe_out',when:()=>false,time:7,title:'들통',han:'露',hr:'로',
 text:()=>'몇 해 전 세리에게 준 뇌물이 새 태수의 조사에서 드러났다.',
 ch:[{l:'더 큰 뇌물로 막는다',req:()=>P.wealth>=30,rq:'3만 전 필요',act:()=>{P.wealth-=30;return '새 태수도 돈 앞에서는 같았다.'}},
     {l:'죄를 인정하고 벌금을 낸다',act:()=>{P.wealth=Math.round(P.wealth*.6);P.s.매+=2;return '재산의 상당 부분을 벌금으로 냈다.'}},
     {l:'달아난다',act:()=>{const r=moveRandom();P.wealth=Math.round(P.wealth*.4);return `가게를 버리고 ${jo(r,'로')} 달아났다.`}}],
 to:()=>{P.wealth=Math.round(P.wealth*.5);hurt(15,'곤장');return '곤장을 맞고 재산을 빼앗겼다.'}},
{id:'m_work2',when:()=>false,time:7,title:'한길의 달인',han:'匠',hr:'장',
 text:()=>`열두 해를 ${WORK_L[P.path]||'한길'}만 바라보았다. 사람들이 당신을 그 길의 달인이라 부른다.`,
 ch:[{l:'후배들에게 길을 열어 준다',act:()=>{hon(`${WORK_L[P.path]||'한길'}의 달인`,1/150);P.s.매+=3;P.fame+=5;return '찾아오는 젊은이들에게 아는 것을 다 가르쳤다.'}},
     {l:'더 높은 곳을 노린다',act:()=>{P.fame+=8;hon(`${WORK_L[P.path]||'한길'}의 달인`,1/150);return '아직 멈출 때가 아니었다.'}}],
 to:()=>'칭찬을 들은 척도 하지 않았다.'},
{id:'t_nongsang',season:0,w:7,cd:3,when:()=>P.path==='관'&&P.rank>=5,time:8,title:'권농',han:'農',hr:'농',
 text:()=>`봄이다. ${P.gun}의 ${title()}로서 올해 고을 살림의 방침을 정해야 한다. 아전들이 죽간을 들고 기다린다.`,
 ch:[{l:'둑과 도랑을 고친다',st:'정',d:50,act:ok=>{if(ok){msim(+1);P.fame+=5;later('t_songdeok',rint(3,5),{});return '봇물이 논마다 닿았다. 가을 소출이 늘었다.'}P.fame+=1;return '공사가 장마 전에 끝나지 못했다.'}},
     {l:'둔전을 넓혀 군량을 쌓는다',st:'통',d:50,act:ok=>{if(ok){P.fame+=8;return `군량 창고가 찼다. ${ruler()==='한'?'조정':ruler()}에서 칭찬하는 글이 내려왔다.`}P.fame+=2;return '유민들이 둔전에서 달아났다.'}},
     {l:'세금을 줄여 백성을 쉬게 한다',act:()=>{msim(+1);P.s.매+=2;P.fame+=2;later('t_songdeok',rint(3,5),{});return '달아났던 백성들이 돌아와 호적에 다시 올랐다.'}},
     {l:'호족들과 연회를 열어 친분을 다진다',act:()=>{P.wealth+=15;msim(-1);return '호족들이 비단과 금을 들고 왔다. 백성들은 관아 담장 너머로 풍악 소리를 들었다.'}}],
 to:()=>'아전들이 작년 방침대로 꾸렸다.'},
{id:'t_songdeok',when:()=>false,time:8,title:'송덕비',han:'碑',hr:'비',
 text:()=>(P.flags.minsim||0)>=2?'고을 노인들이 돈을 모아 당신의 덕을 기리는 비석을 세우겠다고 한다.':'고을 노인들이 찾아와 지난 몇 해의 다스림에 고마움을 전했다.',
 ch:[{l:'고맙게 받는다',act:()=>{if((P.flags.minsim||0)>=2){hon('송덕비가 선 목민관',1/300000);P.fame+=8;return '관아 앞에 비석이 섰다. 지나는 이마다 그 글을 읽었다.'}P.fame+=3;return '노인들이 술 한 동이를 두고 갔다.'}},
     {l:'비석 세울 돈으로 우물을 파게 한다',act:()=>{P.s.매+=3;P.fame+=6;hon('우물을 남긴 목민관',1/200000);return '비석 대신 우물 셋이 생겼다. 사람들은 그 우물을 당신 성을 따서 불렀다.'}}],
 to:()=>'노인들은 뜻만 전하고 돌아갔다.'},
{id:'t_haozu',w:5,cd:6,when:()=>P.path==='관'&&P.rank>=5,time:8,title:'호족의 담장',han:'豪',hr:'호',
 text:()=>{P.tmp.hz=pick(SURN);return `${P.tmp.hz}씨 일족이 높은 담장 안에 부곡 수백을 두고 세금도 부역도 내지 않는다. 고을이 지켜본다.`},
 ch:[{l:'군사를 내어 담장을 헌다',st:'통',d:60,act:ok=>{if(ok){P.fame+=10;msim(+1);later('t_haozu_rev',rint(2,5),{h:P.tmp.hz});return '부곡은 흩어지고 숨겼던 백 호가 호적에 올랐다.'}hurt(25,'부곡의 화살');P.fame=Math.max(0,P.fame-4);return '담장 위에서 화살이 쏟아졌다. 물러날 수밖에 없었다.'}},
     {l:'그 집안과 혼인으로 묶는다',st:'매',d:50,act:ok=>{if(ok){P.wealth+=20;P.fame+=3;return '사돈이 된 뒤로 세금이 꼬박꼬박 들어왔다.'}return '격이 맞지 않는다며 거절당했다.'}},
     {l:'눈감아 준다',act:()=>{P.wealth+=10;msim(-1);return '해마다 명절이면 그 집에서 수레가 왔다.'}}],
 to:()=>'결정을 미루는 사이 그 집 담장은 한 자 더 높아졌다.'},
{id:'t_haozu_rev',when:()=>false,time:7,title:'호족의 앙갚음',han:'讐',hr:'수',
 text:()=>`담장이 헐린 ${P.tmp.q.h||'호족'}씨 일족이 낙양과 업의 연줄을 움직였다. 당신을 탄핵하는 글이 올라갔다고 한다.`,
 ch:[{l:'백성들의 연명 상소로 맞선다',st:'매',d:50,act:ok=>{if(ok){P.fame+=8;return '고을 사람 수백이 이름을 적었다. 탄핵은 물리쳐졌다.'}P.rank=Math.max(0,P.rank-1);return '탄핵이 받아들여져 한 계급 깎였다.'}},
     {l:'윗선에 뇌물을 쓴다',req:()=>P.wealth>=40,rq:'4만 전 필요',act:()=>{P.wealth-=40;return '탄핵 글은 어느 서랍에선가 사라졌다.'}},
     {l:'벼슬을 던지고 물러난다',act:()=>{P.flags.retired=title();setPath('민');P.s.매+=3;return '인수를 풀어 관아 기둥에 걸어 두고 떠났다. 백성들이 십 리 밖까지 따라 나왔다.'}}],
 to:()=>{P.rank=Math.max(0,P.rank-1);return '변명할 틈도 없이 한 계급 깎였다.'}},
{id:'t_levy',w:6,cd:4,when:()=>P.path==='관'&&P.rank>=5&&ruler()!=='한'&&P.year>=190,time:7,title:'군량 독촉',han:'糧',hr:'량',
 text:()=>`${ruler()}의 사자가 왔다. 전선에 보낼 군량 삼만 석을 한 달 안에 내라 한다. 창고에는 그 절반뿐이다.`,
 ch:[{l:'백성의 씨곡식까지 긁어 채운다',act:()=>{P.fame+=8;msim(-2);return '기한을 맞췄다. 그해 봄 고을에는 뿌릴 씨앗이 없었다.'}},
     {l:'형편을 적어 감해 달라 청한다',st:'정',d:55,act:ok=>{if(ok){P.fame+=4;msim(+1);return '이만 석으로 줄었다. 사자는 못마땅한 얼굴로 돌아갔다.'}P.fame=Math.max(0,P.fame-6);return '"전선의 병사는 굶는데 태수는 장부나 따지는가." 문책이 내려왔다.'}},
     {l:'사재를 털어 모자란 만큼 사들인다',req:()=>P.wealth>=30,rq:'3만 전 필요',act:()=>{P.wealth=Math.round(P.wealth*.5);P.fame+=6;P.s.매+=3;msim(+1);return '집안 살림은 기울었지만 백성의 곳간은 건드리지 않았다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-6);return '기한을 넘겼다. 문책이 내려왔다.'}},
{id:'t_talent',w:4,cd:6,when:()=>P.path==='관'&&P.rank>=5,time:8,title:'천거',han:'薦',hr:'천',
 text:()=>{P.tmp.tn=mkName();return `올해 천거할 사람을 정해야 한다. 가난하지만 재주가 뛰어난 ${P.tmp.tn}, 그리고 호족 집안의 평범한 자제가 물망에 올랐다.`},
 ch:[{l:()=>`${jo(P.tmp.tn,'을/를')} 천거한다`,st:'지',d:45,act:ok=>{if(ok){P.fame+=6;later('t_talent_back',rint(5,9),{n:P.tmp.tn});return `${jo(P.tmp.tn,'은/는')} 낙양으로 떠나며 세 번 절했다.`}P.fame+=1;return '천거는 했지만 윗선에서 받아들이지 않았다.'}},
     {l:'호족의 자제를 천거한다',act:()=>{P.wealth+=25;P.s.매-=2;return '그 집에서 수레 두 대가 왔다. 재주 있는 젊은이는 고을을 떠났다.'}},
     {l:'올해는 천거하지 않는다',act:()=>'마땅한 사람이 없다고 적어 올렸다.'}],
 to:()=>'기한이 지나 천거 없이 넘어갔다.'},
{id:'t_talent_back',when:()=>false,time:8,title:'천거한 사람',han:'報',hr:'보',
 text:()=>`옛날 당신이 천거한 ${jo(P.tmp.q.n,'이/가')} 조정의 높은 자리에 올랐다는 소식이다. 그가 사람을 보내왔다.`,
 say:()=>[P.tmp.q.n,'저를 알아봐 주신 은혜를 잊은 적이 없습니다.'],
 ch:[{l:'그의 주선을 받아들인다',act:()=>{P.fame+=12;hon('인재를 알아본 사람',1/50000);return '그의 말 한마디에 당신의 이름이 조정에 올랐다.'}},
     {l:'사사로운 보답은 사양한다',act:()=>{P.s.매+=4;P.fame+=6;hon('인재를 알아본 사람',1/50000);return '"나라를 위해 천거했을 뿐이오." 그 말이 널리 퍼졌다.'}}],
 to:()=>'사자는 선물만 두고 돌아갔다.'},
{id:'g_supply',w:5,cd:5,when:()=>P.path==='군'&&P.rank>=6&&P.year>=190,time:7,title:'끊긴 군량',han:'餉',hr:'향',
 text:()=>'보급로가 끊긴 지 열흘이다. 병사들이 말먹이 콩을 삶아 먹는다. 가까운 마을에는 가을걷이한 곡식이 있다.',
 ch:[{l:'마을에서 곡식을 거둔다',act:()=>{P.s.매-=4;P.fame+=3;return '군은 살았다. 마을 사람들은 그해 겨울을 넘기지 못했다.'}},
     {l:'군마를 잡아 버틴다',st:'통',d:55,act:ok=>{if(ok){P.fame+=8;P.s.매+=2;return '장수의 말부터 잡았다. 병사들은 한 명도 달아나지 않았다.'}P.fame=Math.max(0,P.fame-4);return '사흘 만에 탈영이 줄을 이었다.'}},
     {l:'군을 물린다',act:()=>{P.fame=Math.max(0,P.fame-5);return '싸워 보지도 못하고 물러났다. 군은 온전했다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-6);return '결정을 못 내리는 사이 굶주린 병사들이 흩어졌다.'}},
{id:'g_surrender',w:5,cd:6,when:()=>P.path==='군'&&P.rank>=6&&P.year>=190,time:8,title:'항장',han:'降',hr:'항',
 text:()=>{P.tmp.hj=mkName();return `싸움에 진 적장 ${jo(P.tmp.hj,'이/가')} 묶여 왔다. 무릎은 꿇었지만 눈빛은 꺾이지 않았다.`},
 say:()=>[P.tmp.hj,'죽이려거든 어서 죽여라. 살려 둔다면 그 은혜는 잊지 않겠다.'],
 ch:[{l:'결박을 풀고 부장으로 삼는다',st:'매',d:50,act:ok=>{if(ok){P.fame+=8;P.flags.guardian=P.flags.guardian||P.tmp.hj;return `${jo(P.tmp.hj,'은/는')} 그날부터 당신의 앞을 지켰다.`}later('g_surrender_x',rint(1,3),{n:P.tmp.hj});return `${jo(P.tmp.hj,'은/는')} 고개를 숙였다. 속마음은 알 수 없다.`}},
     {l:'주군에게 보낸다',act:()=>{P.fame+=5;return '함거에 실어 보냈다. 처분은 주군의 몫이다.'}},
     {l:'목을 벤다',act:()=>{P.fame+=3;P.s.매-=3;return '진문 앞에 목이 걸렸다. 항복하려던 다른 적장들이 마음을 돌렸다.'}}],
 to:()=>'결정을 미루는 사이 그는 옥에서 스스로 목숨을 끊었다.'},
{id:'g_surrender_x',when:()=>false,time:6,title:'배반',han:'反',hr:'반',
 text:()=>`부장으로 삼았던 항장 ${jo(P.tmp.q.n,'이/가')} 한밤에 진문을 열고 옛 주인의 군사를 끌어들였다.`,
 ch:[{l:'칼을 들고 맞선다',st:'무',d:60,act:ok=>{if(ok){P.fame+=10;return '난전 속에서 그를 베었다.'}hurt(40,`${P.tmp.q.n}의 배반`);return '등에 칼을 맞았다.'}},
     {l:'진을 버리고 물러난다',act:()=>{P.fame=Math.max(0,P.fame-8);return '군량과 깃발을 버리고 달아났다.'}}],
 to:()=>{hurt(35,`${P.tmp.q.n}의 배반`);return '잠결에 불길을 보았다.'}},
{id:'retire',w:3,once:1,when:()=>P.age>=55&&['군','관'].includes(P.path),time:7,title:'흰머리',han:'老',hr:'로',
 text:()=>'거울 속 머리가 하얗다. 칼도 붓도 예전 같지 않다.',
 ch:[{l:'벼슬을 내려놓고 낙향한다',act:()=>{const p=P.path,r=P.rank;P.flags.retired=title();later('f2_retire_call',rint(2,4),{t:P.flags.retired,p,r,l:ruler()});setPath('민');P.wealth+=10;P.hp=Math.min(maxHp(),P.hp+15);return '고향으로 돌아가 손주들과 지냈다.'}},
     {l:'죽을 때까지 섬긴다',act:()=>{P.fame+=3;P.s.통+=1;hurt(5,'노쇠');return '흰 수염으로 다시 일터에 나갔다. 젊은 것들이 길을 비켰다.'}}],
 to:()=>'결정을 미루는 사이 또 한 해가 갔다.'},
/* ---- 확장 사건 (시대별) ---- */
/* ===== 1시대 난세 전야 (150~183) ===== */
{id:'a_danggu',w:4,once:1,when:()=>P.year>=166&&P.year<=172&&P.age>=12,time:8,title:'당인의 문객',han:'錮',hr:'고',
 text:()=>{P.tmp.sc=mkName();return `환관에게 당인(黨人)으로 몰린 선비 ${jo(P.tmp.sc,'이/가')} 한밤중 문을 두드린다. 당인을 숨긴 집은 멸문된다는 방이 붙어 있다.`},
 ch:[{l:'광에 숨겨 준다',st:'지',d:45,act:ok=>{if(ok){P.fame+=8;P.s.매+=4;P.flags.qingliu=1;later('f2_danggu_back',Math.max(2,Math.min(12,184-P.year)),{sc:P.tmp.sc});return '사흘 뒤 선비는 무사히 떠났다. 청류 사이에 당신 집안의 이름이 돌았다.'}hurt(30,'옥사');P.wealth=Math.floor(P.wealth*.5);return '이웃의 밀고로 관리가 들이닥쳤다. 가산을 털어 겨우 목숨을 샀다.'}},
     {l:'노자만 쥐여 보낸다',act:()=>{P.wealth=Math.max(0,P.wealth-4);P.s.매+=2;return '선비는 고개를 숙이고 어둠 속으로 사라졌다.'}},
     {l:'관아에 고발한다',act:()=>{P.wealth+=8;P.s.매-=6;later('f2_danggu_inf',Math.max(2,Math.min(12,184-P.year)),{sc:P.tmp.sc});return '상금을 받았다. 고을 사람들이 당신 집 앞을 돌아서 다녔다.'}}],
 to:()=>'문을 열지 못하는 사이 발소리가 멀어졌다. 이튿날 선비가 붙잡혔다는 소식이 들렸다.'},
{id:'a_taixue',w:4,once:1,when:()=>P.year>=168&&P.year<=183&&P.age>=14&&P.age<=22&&(['명문 사족','지방 호족','아전'].includes(P.status)||P.s.지>=55),time:8,title:'태학생',han:'學',hr:'학',
 text:()=>'낙양 태학에 들어갔다. 학생이 삼만이 넘는다. 학사 담벼락에는 환관을 비난하는 글이 몰래 나붙는다.',
 ch:[{l:'경서 공부에만 매달린다',act:()=>{P.s.지+=6;P.s.매-=1;return '오경을 외우며 밤을 새웠다. 시험에 붙어 이름이 올랐다. 동문들은 책벌레라 불렀다.'}},
     {l:'청의(淸議)에 이름을 보탠다',st:'매',d:50,act:ok=>{if(ok){const m=mkName();P.fame+=8;P.s.매+=3;later('f2_taixue_mate',rint(3,6),{m});return `선배 태학생 ${jo(m,'이/가')} 당신을 동지라 불렀다.`}hurt(25,'옥사');P.fame+=3;return `${P.year===172?'사례교위 단경':'관병'}의 군사가 태학을 뒤져 학생들을 잡아갔다. 당신도 끌려갔다 풀려났다.`}},
     {l:'환관 집안 자제와 사귄다',act:()=>{P.s.정+=5;P.s.매-=3;P.wealth+=4;return '연회에 자주 불려 갔다. 동문들의 눈길이 싸늘해졌다.'}}],
 to:()=>{P.s.지+=2;return '이것저것 기웃거리다 한 해가 갔다.'}},
{id:'a_hongdu',w:3,once:1,when:()=>P.year>=178&&P.year<=183&&P.age>=16&&P.s.지>=45,time:7,title:'홍도문학',han:'鴻',hr:'홍',
 text:()=>'천자가 홍도문에 학교를 세워 척독과 사부, 조전(鳥篆)에 능한 자를 모은다. 들어가면 자사나 태수 자리도 준다는 소문이다.',
 ch:[{l:'조전 솜씨를 들고 지원한다',st:'지',d:50,act:ok=>{if(ok){setPath('관');P.rank=Math.max(P.rank,1);P.s.매-=3;return '천자의 눈에 들어 벼슬을 받았다. 사대부들은 당신과 같은 자리에 앉기를 꺼렸다.'}P.s.지+=1;return '붓끝이 떨려 낙방했다. 이튿날부터 다시 붓을 잡았다.'}},
     {l:'선비의 수치라며 외면한다',act:()=>{P.s.매+=3;P.fame+=2;return '양구 같은 대신들도 홍도문학을 그만두라고 상소했다. 당신의 말도 그 틈에 섞여 돌았다.'}}],
 to:()=>'모집은 이미 끝나 있었다.'},
{id:'a_xiyuan',w:4,once:1,when:()=>P.year>=178&&P.year<=183&&(P.path==='관'||P.wealth>=40)&&P.age>=18,time:8,title:'서원의 값표',han:'賣',hr:'매',
 text:()=>'서원(西園)에 벼슬 값이 붙었다. 이천 석은 이천만 전, 사백 석은 사백만 전이다. 외상으로 사면 부임한 뒤 곱절로 갚아야 한다.',
 ch:[{l:'가산을 털어 작은 현의 자리를 산다',req:()=>P.wealth>=35,rq:'3만 5천 전 필요',act:()=>{P.wealth-=30;setPath('관');P.rank=Math.max(P.rank,2);P.flags.boughtOffice=1;later('f2_xiyuan_sq',rint(1,2),{});return '현장(縣長)의 인끈을 받았다. 나머지 값은 부임해서 갚기로 했다.'}},
     {l:'외상으로 산다',st:'정',d:50,act:ok=>{setPath('관');P.rank=Math.max(P.rank,1);if(ok){P.wealth+=6;return '세곡을 잘 굴려 빚을 갚고도 남았다.'}P.wealth=Math.max(0,P.wealth-20);P.s.매-=4;return '빚 독촉에 시달려 백성을 쥐어짰다. 원성이 자자했다.'}},
     {l:'돈으로 사는 벼슬은 싫다',act:()=>{P.s.매+=3;P.s.정-=1;return '친구들이 고지식하다고 혀를 찼다. 훗날 최열은 오백만 전을 내고 사도가 되어 동취(銅臭)라는 말을 들었다.'}}],
 to:()=>'망설이는 사이 그 자리는 더 비싸게 팔렸다.'},
{id:'a_fushui',w:5,once:1,when:()=>P.year>=172&&P.year<=183&&P.age>=7&&inR('기주','청주','연주','예주','서주','유주','형주','양주'),time:7,title:'부적 물',han:'符',hr:'부',
 text:()=>'아홉 마디 지팡이를 든 태평도 제자가 마을에 왔다. 앓는 이에게 죄를 고백하게 하고 부적 태운 물을 마시게 한다.',
 ch:[{l:'부적 물을 받아 마신다',p:.6,act:ok=>{P.flags.taiping=1;if(ok){P.hp=Math.min(maxHp(),P.hp+8);return '열이 내렸다. 집안 어른들이 대현량사의 이름을 받들기 시작했다.'}hurt(12,'고뿔');return '낫지 않았다. 제자는 믿음이 부족한 탓이라 했다.'}},
     {l:'제자를 따라다니며 일을 돕는다',act:()=>{P.flags.taiping=1;P.s.매+=4;later('f2_fushui_call',Math.max(1,Math.min(12,184-P.year)),{});return '누런 천을 머리에 두르는 법과 주문 몇 구절을 배웠다. 제자는 때가 오면 다시 찾겠다고 했다.'}},
     {l:'요망한 술수라며 피한다',act:()=>{P.s.지+=2;P.s.매-=2;return '마을 사람 절반이 그를 따랐다. 당신 집은 외톨이가 되었다.'}}],
 to:()=>'제자는 다음 마을로 떠났다.'},
{id:'a_koufu',w:4,once:1,when:()=>P.year>=150&&P.year<=183&&P.age>=7&&P.age<=13&&['유민','소작농','자작농','장인'].includes(P.status),time:7,title:'구전 스물셋',han:'賦',hr:'부',
 text:()=>'일곱 살이 넘은 아이에게는 해마다 구전(口錢) 스물세 전이 붙는다. 아버지가 빈 돈궤를 들여다보며 한숨을 쉰다.',
 ch:[{l:'나무를 해다 팔아 보탠다',act:()=>{P.s.무+=3;P.wealth+=1;return '겨울 내내 산을 오르내렸다. 손이 갈라졌지만 세금을 채웠다.'}},
     {l:'장터에서 심부름을 한다',st:'매',d:35,act:ok=>{if(ok){P.s.매+=3;P.wealth+=3;return '포목전 주인이 셈 빠른 아이라며 품삯을 넉넉히 주었다.'}P.s.매+=1;return '하루 종일 뛰고 엽전 몇 닢을 받았다.'}},
     {l:'호적에 나이를 줄여 올린다',p:.6,act:ok=>{if(ok){P.s.지+=2;later('f2_koufu_age',rint(5,8),{});return '이정(里正)이 눈감아 주었다. 한 해 치 구전을 벌었다.'}P.wealth=Math.max(0,P.wealth-4);hurt(10,'곤장');return '들통나 아버지가 곤장을 맞고 벌금을 물었다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-3);return '집안의 송아지를 팔아 세금을 냈다.'}},
{id:'a_jianbing',w:4,once:1,when:()=>P.year>=155&&P.year<=183&&P.age>=15&&P.path==='민'&&P.status!=='지방 호족'&&P.status!=='명문 사족',time:7,title:'호족의 땅값',han:'倂',hr:'병',
 text:()=>'고을 호족의 장원이 해마다 넓어진다. 집사가 와서 밭을 넘기라 한다. 넘기면 소작으로 부쳐 먹게 해 주겠다고 한다.',
 ch:[{l:'밭을 팔고 소작인이 된다',act:()=>{P.wealth+=6;P.s.매-=1;P.flags.tenant=1;later('f2_jianbing_buqu',rint(3,8),{});return '수확의 절반을 바치는 소작인이 되었다. 대신 부역은 장원이 막아 주었다.'}},
     {l:'끝까지 버틴다',st:'통',d:45,act:ok=>{if(ok){P.fame+=4;later('f2_jianbing_back',rint(2,4),{});return '이웃 자작농들과 뜻을 모았다. 집사가 물러갔다.'}hurt(18,'장원 하인들의 몽둥이');P.wealth=Math.max(0,P.wealth-6);return '밤에 장원의 하인들이 들이닥쳐 밭두렁을 갈아엎었다.'}},
     {l:'현청에 호소한다',st:'정',d:55,act:ok=>{if(ok){P.wealth+=3;return '청렴한 현령이 장원의 경계를 바로잡았다.'}P.wealth=Math.max(0,P.wealth-3);return '현령은 호족의 사돈이었다. 소장 값만 날렸다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-8);return '답을 미루는 사이 밭 경계 말뚝이 옮겨져 있었다.'}},
{id:'a_qiang',w:5,once:1,when:()=>P.year>=165&&P.year<=172&&P.age>=8&&inR('량주','사례','병주'),time:7,title:'동강의 불길',han:'羌',hr:'강',
 text:()=>'강족 기병이 계곡을 따라 내려온다. 단경이 강족과 백팔십 번을 싸웠다는데 불길은 끝이 없다.',
 ch:[{l:'단경의 군에 길잡이로 나선다',req:()=>P.age>=15,rq:'15세 이상',st:'무',d:45,act:ok=>{setPath('군');if(ok){P.fame+=7;P.s.무+=3;return '산길을 앞장서 강족의 진채를 찾아냈다.'}hurt(30,'강족의 화살');return '매복에 걸려 어깨에 화살을 맞았다.'}},
     {l:'가축을 몰고 성안으로 피한다',p:.7,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-2);return '성문이 닫히기 직전에 들어갔다. 성안 꼴값으로 양 몇 마리를 팔았다.'}P.wealth=Math.max(0,P.wealth-8);return '소와 양을 다 잃었다.'}},
     {l:'산속 토굴에 숨는다',st:'지',d:35,act:ok=>{if(ok){P.s.지+=1;return '연기 냄새가 사라질 때까지 숨어 있었다. 내려와 보니 집은 반쯤 타 있었다.'}hurt(25,'강족의 칼');return '말발굽 소리가 토굴 앞에서 멈췄다.'}}],
 to:()=>{hurt(22,'강족의 습격');P.wealth=Math.floor(P.wealth*.6);return '마을이 불탔다.'}},
{id:'a_xianbei',w:5,cd:5,when:()=>P.year>=168&&P.year<=181&&P.age>=8&&inR('유주','병주'),time:6,title:'선비족 기병',han:'胡',hr:'호',
 text:()=>'단석괴의 선비족이 또 장성을 넘었다. 봉화가 오르고 마을마다 징이 울린다.',
 ch:[{l:'성벽에 올라 돌을 나른다',p:.75,act:ok=>{P.s.통+=2;if(ok){P.fame+=3;return '해가 질 때까지 버텼다. 기병들은 약탈물을 싣고 돌아갔다.'}hurt(20,'선비족의 화살');return '성벽 너머에서 날아온 화살에 맞았다.'}},
     {l:'말을 타고 이웃 마을에 알린다',req:()=>P.age>=12,rq:'12세 이상',st:'무',d:45,act:ok=>{if(ok){const v=pick(SURN)+'가촌';P.fame+=6;P.s.무+=3;later('f2_xianbei_vil',rint(1,3),{v});return `덕분에 이웃 ${jo(v,'은/는')} 성문을 닫을 수 있었다.`}hurt(30,'선비족의 화살');return '추격하는 기병에게 따라잡혔다.'}},
     {l:'곡식을 땅에 묻고 달아난다',act:()=>{P.wealth=Math.max(0,P.wealth-4);return '돌아와 보니 묻어 둔 항아리 하나만 남아 있었다.'}}],
 to:()=>{hurt(20,'선비족의 습격');P.wealth=Math.floor(P.wealth*.6);return '미처 피하지 못했다.'}},
{id:'a_xianbei177',w:5,once:1,when:()=>P.year===177&&P.age>=16&&P.age<=45&&inR('유주','병주','사례')&&['민','군'].includes(P.path),time:7,title:'출새 원정',han:'塞',hr:'새',
 text:()=>'하육, 전안, 장민이 각각 기병 일만을 이끌고 장성 밖으로 선비를 치러 간다. 모병관이 장정을 고른다.',
 ch:[{l:'원정군에 든다',st:'무',d:55,act:ok=>{setPath('군');if(ok){P.fame+=6;hurt(15,'원정길');return '세 갈래 군이 모두 크게 졌다. 열에 일고여덟이 죽었지만 당신은 살아 돌아왔다.'}if(R()<.3){die('선비 원정');return '초원에서 단석괴의 기병에게 포위되었다.'}hurt(45,'선비 원정');return '말을 잃고 걸어서 장성까지 돌아왔다.'}},
     {l:'군량 수송 부역만 진다',act:()=>{hurt(8,'부역');P.wealth+=2;return '장성 아래까지만 수레를 끌고 돌아왔다. 품삯으로 좁쌀 몇 말을 받았다.'}},
     {l:'병을 핑계로 빠진다',p:.6,act:ok=>{if(ok){P.s.매-=1;return '이듬해 돌아온 이가 거의 없다는 말을 들었다. 마을에서는 당신을 곁눈질했다.'}hurt(12,'곤장');return '꾀병이 들통나 곤장을 맞았다.'}}],
 to:()=>{setPath('군');hurt(30,'선비 원정');return '이름이 불려 끌려갔다. 대패 속에서 겨우 살아왔다.'}},
{id:'a_huanguan',w:4,cd:6,when:()=>P.year>=160&&P.year<=183&&P.age>=14,time:7,title:'환관의 조카',han:'宦',hr:'환',
 text:()=>'중상시의 조카가 우리 고을 현령으로 왔다. 부임 첫 달에 세금이 갑절로 오르고 장터 좌판마다 자릿세가 붙었다.',
 ch:[{l:'고분고분 바친다',act:()=>{P.wealth=Math.max(0,P.wealth-8);return '살림이 쪼그라들었지만 탈은 없었다.'}},
     {l:'뇌물을 바쳐 끈을 댄다',req:()=>P.wealth>=20,rq:'2만 전 필요',st:'매',d:40,act:ok=>{P.wealth-=12;if(ok){later('f2_huanguan_fall',Math.max(1,Math.min(12,189-P.year)),{});if(P.path==='상')P.wealth+=22;else P.s.정+=4;return P.path==='상'?'관아 납품을 도맡게 되었다.':'현령이 당신을 아전 자리에 불러 앉혔다.'}return '돈만 받고 모른 척했다.'}},
     {l:'태수에게 고발장을 올린다',st:'지',d:55,act:ok=>{if(ok){P.fame+=9;return '청류 태수가 현령을 잡아 옥에 가두었다.'}hurt(30,'옥사');P.wealth=Math.max(0,P.wealth-10);return '고발장이 도리어 현령 손에 들어갔다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-10);return '대답이 늦다며 곱으로 뜯겼다.'}},
{id:'a_wenyi',w:5,once:1,when:()=>[171,173,179,182].includes(P.year)&&P.age>=6,time:7,title:'봄 역병',han:'瘟',hr:'온',
 text:()=>'정월부터 마을에 역병이 돈다. 앞집은 상여가 나갔고 뒷집은 문에 쑥을 걸었다.',
 ch:[{l:'식구들을 데리고 산막으로 간다',p:.75,act:ok=>{P.wealth=Math.max(0,P.wealth-3);if(ok)return '봄이 다 갈 때까지 산에서 지냈다. 농사는 놓쳤지만 온 식구가 무사했다.';hurt(35,'역병');return '이미 병이 옮아 있었다.'}},
     {l:'의원 일을 거든다',p:.55,act:ok=>{P.s.지+=4;P.s.매+=3;if(ok){P.fame+=4;return '탕약 달이는 법을 익혔다. 사람들이 고마워했다.'}hurt(40,'역병');return '사흘 만에 같은 열이 올랐다.'}},
     {l:'태평도 제자의 부적을 구한다',p:.5,act:ok=>{P.flags.taiping=1;if(ok)return '열병이 비켜 갔다. 부적 덕이라 믿게 되었다.';hurt(35,'역병');return '부적은 아무 힘이 없었다.'}}],
 to:()=>{if(R()<.5){hurt(35,'역병');return '열이 올랐다.'}return '운 좋게 비켜 갔다.'}},
{id:'a_yuedan',w:4,once:1,when:()=>P.year>=175&&P.year<=183&&P.age>=16&&inR('예주'),time:7,title:'월단평',han:'評',hr:'평',
 text:()=>'여남의 허소가 사촌형 허정과 함께 매달 초하루 인물을 품평한다. 그 한마디에 벼슬길이 열리고 닫힌다.',
 ch:[{l:'평을 청하러 간다',st:'매',d:50,act:ok=>{if(ok){P.fame+=10;later('f2_yuedan_rec',rint(1,3),{});return '"쓸 만한 그릇이다." 그 한마디가 군 전체에 퍼졌다.'}P.fame=Math.max(0,P.fame-3);return '"허명만 좇는 자로다." 한동안 고개를 들고 다니지 못했다.'}},
     {l:'구경꾼 틈에서 듣기만 한다',act:()=>{P.s.지+=3;return '사람을 보는 눈에 대해 많은 것을 배웠다. 젊은 조조도 여기서 평을 받았다는 이야기를 들었다.'}},
     {l:'남의 입에 이름을 맡기지 않는다',act:()=>{P.s.통+=2;P.fame=Math.max(0,P.fame-1);return '그날 저녁 혼자 칼을 갈았다. 고을에서는 오만하다는 말이 돌았다.'}}],
 to:()=>'초하루 모임은 이미 파했다.'},
{id:'a_lumu',w:3,once:1,when:()=>P.year>=150&&P.year<=183&&P.age>=15&&P.age<=28&&P.fam&&['fa','mo'].some(k=>P.fam[k]&&P.fam[k].alive),time:8,title:'여묘살이',han:'孝',hr:'효',
 text:()=>{const k=pick(['fa','mo'].filter(k=>P.fam[k]&&P.fam[k].alive));P.fam[k].alive=0;P.fam[k].d=P.year;return `${k==='fa'?'아버지':'어머니'}가 세상을 떠났다. 효렴이 벼슬길인 세상이라 무덤 곁 움막에서 삼 년을 사는 이도 많다.`},
 ch:[{l:'삼 년 여묘를 산다',act:()=>{spend(3,'여묘살이','삼 년 만에 움막을 나섰다. 고을에 효자 소문이 나 있었다.');P.wealth=Math.max(0,P.wealth-8);P.fame+=7;P.s.매+=3;hurt(8,'여묘살이');later('f2_lumu_xl',rint(2,4),{});return '거친 베옷을 입고 죽만 먹으며 무덤을 지키기로 했다.'}},
     {l:'예법대로만 장례를 치른다',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.wealth+=2;return '조용히 곡을 하고 집안일로 돌아갔다. 그해 농사는 거르지 않았다.'}},
     {l:'이십 년 여묘를 내세운다',st:'지',d:55,act:ok=>{if(ok){P.fame+=12;return '효자 정문(旌門)이 섰다.'}P.fame=Math.max(0,P.fame-8);P.s.매-=4;return '움막에서 아이까지 낳은 것이 들통났다. 진번이 조선(趙宣)을 벌한 이야기가 다시 돌았다.'}}],
 to:()=>'장례를 마치고 나니 한 해가 갔다.'},
{id:'a_zhengxuan',w:4,once:1,when:()=>P.year>=170&&P.year<=183&&P.age>=12&&P.age<=25&&inR('청주','서주','연주','기주'),time:7,title:'고밀의 스승',han:'經',hr:'경',
 text:()=>'당고로 벼슬이 막힌 정현이 북해 고밀에서 경학을 가르친다. 문하생이 천 명을 넘는다고 한다.',
 ch:[{l:'책 보따리를 지고 찾아간다',st:'지',d:40,act:ok=>{moveTo('청주');if(ok){const m=mkName();P.s.지+=8;P.fame+=4;later('f2_zheng_mate',rint(4,8),{m});return `삼 년을 머물며 주석 다는 법을 배웠다. 동문 ${jo(m,'과/와')} 한 방을 썼다.`}P.s.지+=3;return '문하생이 너무 많아 선생 얼굴은 멀리서만 보았다.'}},
     {l:'고향 훈장에게 배운다',act:()=>{P.s.지+=3;P.s.정+=2;return '논어와 효경을 뗐다.'}},
     {l:'글보다 활이 좋다',act:()=>{P.s.무+=4;P.s.지-=1;return '산에서 꿩을 쫓았다. 아버지는 혀를 찼다.'}}],
 to:()=>'길을 나설 때를 놓쳤다.'},
{id:'a_mayuanyi',w:6,once:1,when:()=>P.year===184&&P.age>=12&&inR('사례'),time:7,title:'낙양의 거열',han:'告',hr:'고',
 text:()=>'장각의 제자 당주가 고변해 태평도 대방 마원의가 낙양에서 거열을 당했다. 그와 내통한 자를 찾는 수색이 집집을 돈다.',
 ch:[{l:'태평도와 얽힌 이웃을 숨긴다',st:'지',d:50,act:ok=>{if(ok){const nb=mkName();P.s.매+=4;later('f2_myy_nb',rint(1,3),{nb});return `이웃 ${jo(nb,'은/는')} 무사히 성을 빠져나갔다.`}hurt(35,'옥사');return '연좌되어 매질을 당했다. 이 일로 죽은 사람이 천여 명이었다.'}},
     {l:'수색에 앞장선다',act:()=>{P.fame+=3;P.s.매-=5;return '아는 얼굴들이 끌려가는 것을 보았다.'}},
     {l:'부적과 누런 천을 아궁이에 태운다',req:()=>P.flags.taiping,rq:'태평도 인연',act:()=>{P.flags.taiping=0;return '연기가 다 빠질 때까지 숨을 죽였다.'}}],
 to:()=>{hurt(20,'수색대의 몽둥이');return '수색대가 문을 부수고 들어왔다.'}},
{id:'a_lushi',w:6,once:1,when:()=>P.year===184&&P.path==='군'&&inR('기주','유주','연주'),time:7,title:'광종의 함거',han:'檻',hr:'함',
 text:()=>'북중랑장 노식이 광종에서 장각을 에워싸고 참호를 파며 운제(雲梯)를 짓는다. 시찰 온 소황문 좌풍이 뇌물을 바라는 눈치다.',
 ch:[{l:'운제를 짓고 참호를 판다',st:'통',d:50,act:ok=>{moveTo('기주');if(ok){P.fame+=8;return '성이 곧 떨어질 듯했다. 그러나 노 장군은 함거에 실려 낙양으로 끌려갔다.'}hurt(30,'광종의 화살');return '성벽에서 쏟아진 화살에 맞았다.'}},
     {l:'좌풍에게 뇌물을 보내자고 권한다',st:'정',d:45,act:ok=>{if(ok){P.s.정+=2;return '노 장군은 끝내 뇌물을 보내지 않았다. 그 강직함을 곁에서 보았다.'}P.s.매-=2;return '장군의 노여움을 사 진영 끝으로 밀려났다.'}},
     {l:'후임 동탁의 군에 남는다',act:()=>{hurt(15,'하곡양 전투');return '후임 동탁은 장각을 이기지 못했다. 다시 황보숭이 왔다.'}}],
 to:()=>{hurt(20,'광종 전투');return '명령이 바뀌는 사이 대열을 잃었다.'}},
{id:'a_changshe',w:6,once:1,when:()=>P.year===184&&P.age>=14&&inR('예주'),time:7,title:'장사의 불',han:'焚',hr:'분',
 text:()=>'영천의 황건 파재가 장사성을 에워쌌다. 성안의 황보숭은 풀숲에 친 적 진채를 보고 큰바람을 기다린다.',
 ch:[{l:'횃불을 들고 성을 나선다',st:'무',d:50,act:ok=>{if(P.path!=='관')setPath('군');if(ok){P.fame+=10;return '바람을 타고 불길이 번졌다. 때마침 기도위 조조의 군도 와서 함께 수만을 베었다.'}hurt(35,'장사의 혼전');return '불길 속 혼전에서 창에 찔렸다.'}},
     {l:'성벽 위에서 함성을 지른다',act:()=>{P.fame+=3;P.s.통+=1;return '성 밖 불길에 맞춰 함성이 울렸다. 목이 쉬도록 북을 쳤다.'}},
     {l:'황건 무리에 섞여 있다가 달아난다',req:()=>P.path==='적'||P.flags.yellow,rq:'황건만',p:.5,act:ok=>{if(ok){P.flags.yellow=0;setPath('민');return '두건을 버리고 들판으로 흩어졌다.'}hurt(45,'장사의 불길');return '불길이 퇴로를 막았다.'}}],
 to:()=>{hurt(25,'장사의 불길');return '연기에 휩싸여 정신을 잃었다.'}},
{id:'a_wancheng',w:6,once:1,when:()=>P.year===184&&P.age>=14&&inR('형주'),time:7,title:'완성 공방',han:'宛',hr:'완',
 text:()=>'남양의 황건이 완성에 들어앉았다. 우두머리가 장만성에서 조홍, 다시 한충으로 바뀌는 사이 주준이 성을 에워쌌다.',
 ch:[{l:'성벽 오르기에 자원한다',st:'무',d:55,act:ok=>{setPath('군');if(ok){P.fame+=12;return '좌군사마 손견이 첫째로 성벽에 올랐다. 당신이 그 뒤를 따랐다.'}hurt(40,'완성의 돌');return '사다리에서 떨어졌다.'}},
     {l:'한충의 항복을 받아 주자고 한다',st:'지',d:50,act:ok=>{P.s.지+=2;if(ok){P.fame+=3;return '"항복을 받으면 도적이 늘 뿐이다." 주준은 항복은 거절했지만 포위를 풀어 적을 끌어내자는 말은 받아들였다.'}return '"항복을 받으면 도적이 늘 뿐이다." 주준이 고개를 저었다.'}},
     {l:'고을을 떠나 산으로 피한다',act:()=>{P.wealth=Math.floor(P.wealth*.7);return '반년 넘게 이어진 포위를 피했다. 돌아와 보니 세간이 반은 없어졌다.'}}],
 to:()=>{hurt(25,'완성 공방');return '성 밖에서 화살이 비처럼 날았다.'}},
{id:'a_bianzhang',prio:1,when:()=>P.year>=184&&P.year<=185&&P.age>=12&&inR('량주'),time:7,title:'금성의 반란',han:'叛',hr:'반',
 text:()=>'황중 의종호 북궁백옥이 선령강과 함께 들고일어나 변장과 한수를 우두머리로 세웠다. 금성 태수가 죽고 반군이 삼보로 향한다.',
 ch:[{l:'반군에 가담한다',req:()=>P.path!=='관',rq:'관리는 불가',act:()=>{setPath('적');P.fame+=4;return '량주 반군의 깃발 아래 들었다. 얼마 뒤 한수가 실권을 쥐었다.'}},
     {l:'관군에 들어 맞선다',st:'무',d:50,act:ok=>{if(P.path!=='관')setPath('군');if(ok){P.fame+=8;return '미양에서 별똥별이 떨어진 밤, 놀라 흩어진 반군을 동탁과 함께 쳤다.'}hurt(35,'량주 반군의 창');return '강족 기병의 돌격에 진이 무너졌다.'}},
     {l:'가족을 데리고 익주로 넘어간다',p:.7,act:ok=>{moveTo('익주');P.wealth=Math.floor(P.wealth*.6);if(ok)return '험한 산길을 넘어 한중 땅에 닿았다.';hurt(25,'피난길');return '도중에 짐을 털렸다.'}}],
 to:()=>{hurt(25,'량주의 난리');P.wealth=Math.floor(P.wealth*.5);return '반군이 마을을 휩쓸고 지나갔다.'}},
{id:'a_xiugong',w:4,once:1,when:()=>P.year>=185&&P.year<=187&&P.age>=16&&['민','관'].includes(P.path),time:7,title:'수궁전',han:'錢',hr:'전',
 text:()=>P.path==='관'?'남궁이 불탄 뒤로 벼슬을 받거나 옮기는 자는 조군수궁전(助軍修宮錢)을 내야 한다. 당신 몫이 내려왔다.':'남궁이 불탔다. 궁을 고친다며 밭 한 무마다 열 전씩 세금이 붙었다.',
 ch:[{l:'백성에게서 거둬 메운다',req:()=>P.path==='관',rq:'관리만',act:()=>{P.wealth+=4;P.s.매-=5;P.flags.corrupt=1;return '고을 사람들이 당신 이름을 욕했다.'}},
     {l:'사직하겠다는 상소를 올린다',req:()=>P.path==='관',rq:'관리만',st:'정',d:50,act:ok=>{if(ok){P.fame+=10;return '거록 태수 사마직이 이 일로 독을 마셨다는 소식과 함께 당신 상소도 돌았다.'}P.fame+=3;setPath('민');return '파직되어 고향으로 돌아갔다.'}},
     {l:'밭 일부를 팔아 낸다',req:()=>P.path==='민',rq:'백성만',act:()=>{P.wealth=Math.max(0,P.wealth-7);return '세금을 냈다. 궁은 끝내 다 고치지 못했다.'}},
     {l:'경작 면적을 줄여 신고한다',req:()=>P.path==='민',rq:'백성만',st:'지',d:45,act:ok=>{if(ok){P.wealth+=2;return '장부 위의 밭이 절반으로 줄었다.'}hurt(15,'곤장');P.wealth=Math.max(0,P.wealth-8);return '들통나 곤장을 맞고 벌금까지 냈다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-8);return '독촉하던 관리가 소를 끌고 갔다.'}},
{id:'a_heishan',w:5,once:1,when:()=>P.year>=185&&P.year<=188&&P.age>=15&&inR('기주','병주')&&['민','적'].includes(P.path),time:7,title:'태항산 무리',han:'黑',hr:'흑',
 text:()=>'상산의 장연이 태항산 골짜기마다 무리를 모았다. 흑산이라 불리며 백만이라 한다. 산채에서 사람이 내려왔다.',
 ch:[{l:'흑산에 든다',act:()=>{setPath('적');P.fame+=4;return '날래다 하여 비연(飛燕)이라 불리는 장연을 따라 산을 탔다. 그는 곧 조정에 사자를 보내 평난중랑장이 되었다.'}},
     {l:'산채와 몰래 곡식을 바꾼다',st:'정',d:45,act:ok=>{if(ok){P.wealth+=10;later('f2_heishan_tr',rint(1,3),{});return '산채는 값을 후하게 쳐주었다. 다음에도 오겠다고 했다.'}hurt(20,'관아의 매질');return '관아에 걸려 도적과 내통했다며 매를 맞았다.'}},
     {l:'마을 장정을 모아 지킨다',st:'통',d:50,act:ok=>{if(ok){P.fame+=6;P.s.통+=3;return '흑산의 무리는 우리 마을을 비켜 갔다.'}hurt(30,'흑산적의 칼');return '수가 너무 많았다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.6);return '산채 사람들이 곡식을 쓸어 갔다.'}},
{id:'a_baibo',prio:1,when:()=>P.year===188&&P.age>=10&&inR('병주','사례'),time:7,title:'백파곡',han:'波',hr:'파',
 text:()=>'황건 잔당 곽태가 서하의 백파곡에서 일어났다. 백파적이 태원과 하동을 휩쓸며 내려온다.',
 ch:[{l:'백파적에 몸을 던진다',req:()=>P.age>=15&&P.path!=='관',rq:'15세 이상, 관리 불가',act:()=>{setPath('적');P.flags.yellow=1;P.fame+=3;return '백파의 깃발 아래 들었다.'}},
     {l:'성을 지키는 데 나선다',req:()=>P.age>=15,rq:'15세 이상',st:'무',d:50,act:ok=>{if(P.path==='민')setPath('군');if(ok){P.fame+=7;return '성벽 아래 백파의 무리를 몰아냈다.'}hurt(35,'백파적의 창');return '성문이 깨지는 날 크게 다쳤다.'}},
     {l:'황하를 건너 남쪽으로 간다',p:.7,act:ok=>{const r=moveTo(inR('병주')?'사례':'연주');P.wealth=Math.floor(P.wealth*.8);if(ok)return `뱃삯을 치르고 ${jo(r,'로')} 무사히 건너갔다.`;hurt(25,'황하 나루');return `${jo(r,'로')} 건너다 배가 뒤집힐 뻔했다.`}}],
 to:()=>{hurt(25,'백파적의 습격');P.wealth=Math.floor(P.wealth*.5);return '도망칠 틈도 없었다.'}},
{id:'a_zhoumu',w:5,once:1,when:()=>P.year>=187&&P.year<=188&&P.age>=12&&inR('유주'),time:7,title:'유주목 유우',han:'牧',hr:'목',
 text:()=>'장순과 장거가 오환의 구력거와 손잡고 난을 일으켰다. 조정은 자사 대신 주목을 두고 종친 유우를 유주목으로 보냈다.',
 ch:[{l:'유우의 둔전 모집에 응한다',act:()=>{P.wealth+=6;if(P.path==='적')setPath('민');return '유우는 군사를 물리고 은혜로 오환을 달랬다. 상곡의 호시(互市)가 다시 열려 소금과 철이 돌았다.'}},
     {l:'공손찬의 기병에 든다',req:()=>P.age>=16,rq:'16세 이상',st:'무',d:50,act:ok=>{setPath('군');if(ok){P.fame+=8;P.s.무+=3;later('f2_zhoumu_split',Math.max(1,Math.min(12,193-P.year)),{});return '흰 말을 탄 공손찬을 따라 오환을 쫓았다.'}hurt(35,'오환의 화살');return '석문의 추격전에서 화살을 맞았다.'}},
     {l:'장순의 반군에 가담한다',req:()=>P.age>=16&&P.path!=='관',rq:'16세 이상, 관리 불가',p:.4,act:ok=>{setPath('적');if(ok){P.wealth+=10;return '노략질로 한몫 챙겼다. 반군은 오래가지 못했다.'}hurt(40,'토벌군의 칼');return '반군은 무너졌고 당신은 쫓겼다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.7);return '난리 통에 가축을 잃었다.'}},
{id:'a_jingguan',w:5,once:1,when:()=>P.year>=185&&P.year<=186&&P.age>=10&&inR('기주'),time:7,title:'하곡양의 무덤',han:'骨',hr:'골',
 text:()=>'지난겨울 황보숭이 하곡양에서 황건 십여만을 베어 성 남쪽에 경관(京觀)을 쌓았다. 장각의 관도 파헤쳐졌다.',

{id:'b_shouchun',w:4,once:1,when:()=>inR('양주','예주')&&P.year>=197&&P.year<=199&&P.age>=14&&P.path!=='군',time:7,title:'강회의 기근',han:'奢',hr:'사',
 text:()=>'수춘 궁궐에는 비단옷 입은 후궁이 수백이고 쌀과 고기가 남아돈다. 성 밖 강회 사이에서는 사람이 사람을 먹는다.',
 ch:[{l:'궁궐 부엌에 일자리를 구한다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=10;return '남은 음식을 몰래 식구들에게 날랐다.'}hurt(20,'궁궐의 곤장');return '훔친 떡이 들켜 곤장을 맞았다.'}},
     {l:'식구를 데리고 북쪽으로 간다',p:.7,act:ok=>{const r=moveTo(inR('양주')?'예주':'연주');if(ok)return `${jo(r,'로')} 넘어갔다. 그곳에는 둔전이 있었다.`;hurt(25,'피난길');return `${jo(r,'로')} 가는 길에 굶주린 무리에게 쫓겼다.`}},
     {l:'관창을 터는 무리에 낀다',st:'무',d:50,act:ok=>{if(ok){P.wealth+=15;if(P.path==='민')setPath('적');return '쌀 두 섬을 지고 회수 갈대밭으로 숨었다.'}hurt(40,'창고 수비병의 창');return '수비병의 창이 먼저 닿았다.'}}],
 to:()=>{hurt(30,'강회의 기근');return '풀뿌리마저 동이 났다.'}},
{id:'b_xiapi',prio:1,when:()=>inR('서주')&&P.year===198&&P.age>=12,time:7,title:'하비 수공',han:'水',hr:'수',
 text:()=>'조조가 하비를 에워싸고 기수와 사수를 터 성에 물을 댔다. 한 달 넘게 성안이 물에 잠겨 있다.',
 ch:[{l:'성문을 열자는 무리에 낀다',st:'지',d:45,act:ok=>{if(ok){P.fame+=6;return '후성, 송헌, 위속이 진궁을 묶어 성문을 열었다. 당신도 그 뒤에 있었다.'}hurt(35,'여포의 군율');return '모의가 새어 나가 매를 맞았다.'}},
     {l:'끝까지 여포를 지킨다',req:()=>P.path==='군',rq:'군인만',st:'무',d:60,act:ok=>{if(ok){P.fame+=5;hurt(15,'하비의 물');return '백문루에서 여포가 묶이는 것을 보았다. 졸병인 당신은 풀려났다.'}hurt(50,'하비의 물');return '무너진 성벽 틈으로 물과 함께 적이 들어왔다.'}},
     {l:'지붕 위에서 물이 빠지길 기다린다',act:()=>{hurt(15,'하비의 물');P.wealth=Math.floor(P.wealth*.8);return '세간이 다 젖어 썩었다. 성이 떨어지던 날, 여포가 백문루에서 목이 졸렸다는 소식을 들었다.'}}],
 to:()=>{hurt(30,'하비 수공');return '물에 잠긴 골목에서 병이 돌았다.'}},
{id:'b_yijing',w:5,once:1,when:()=>inR('유주')&&P.year>=198&&P.year<=199&&P.age>=14,time:7,title:'역경의 누대',han:'京',hr:'경',
 text:()=>'공손찬이 역경에 높은 누대를 겹겹이 쌓고 곡식 삼백만 곡(斛)을 쟁였다. 원소의 군사가 땅굴을 파 들어온다.',
 ch:[{l:'누대를 지킨다',st:'무',d:50,act:ok=>{if(P.path==='민')setPath('군');if(ok){P.fame+=8;return '땅굴이 누대 밑까지 왔다. 무너지기 직전에 빠져나왔다.'}hurt(45,'역경루의 불길');return '누대가 불길 속에 무너졌다.'}},
     {l:'원소군의 땅굴 인부가 된다',act:()=>{P.wealth+=4;hurt(10,'땅굴');return '흙을 퍼내고 나무 기둥을 받쳤다. 기둥에 불을 놓자 누대가 내려앉았다.'}},
     {l:'몰래 기주로 빠져나간다',st:'지',d:45,act:ok=>{if(ok){moveTo('기주');P.wealth=Math.floor(P.wealth*.8);return '원소의 땅에 숨어들었다. 짐 절반은 길에 버렸다.'}hurt(30,'원소군의 창');return '포위망에 걸렸다.'}}],
 to:()=>{hurt(25,'역경 포위');return '포위 속에서 한 해를 보냈다.'}},
{id:'b_niuzhu',w:6,once:1,when:()=>inR('양주')&&P.year===195&&P.path==='군',time:6,title:'우저 기습',han:'曲',hr:'곡',
 text:()=>'손책이 장강을 건너 우저의 군량고를 빼앗았다. 양주자사 유요의 군이 곡아로 무너져 간다.',
 ch:[{l:'추격에 나선다',st:'무',d:50,act:ok=>{if(ok){P.fame+=10;P.wealth+=5;return '곡아까지 쫓아가 군량과 병장기를 거두었다.'}hurt(35,'유요군의 창');return '태사자라는 장수가 홀로 돌아서 창을 휘둘렀다.'}},
     {l:'항복한 병사를 수습한다',st:'매',d:45,act:ok=>{if(ok){P.fame+=6;return '"항복한 자는 묻지 않는다"는 영이 돌자 열흘 만에 이만이 모였다.'}P.fame+=1;return '항졸들이 밤사이 달아났다.'}},
     {l:'군량을 몰래 빼돌린다',p:.6,act:ok=>{if(ok){P.wealth+=12;P.s.매-=3;return '쌀 몇 가마를 집으로 보냈다.'}hurt(25,'군율');return '손책의 군율은 엄했다.'}}],
 to:()=>{hurt(20,'우저 전투');return '명령을 놓치고 강가에 남겨졌다.'}},
{id:'b_wanglang',w:5,once:1,when:()=>inR('양주')&&P.year===196&&P.path==='관'&&P.age>=18,time:7,title:'회계 태수',han:'降',hr:'항',
 text:()=>'회계태수 왕랑이 고릉에서 손책에게 무너졌다. 속관들에게 바닷길로 동야까지 함께 가자고 한다.',
 ch:[{l:'왕랑을 따라 배에 오른다',p:.6,act:ok=>{if(ok){P.fame+=6;P.s.매+=3;later('f2_wanglang_call',rint(2,3),{});return '동야에서 함께 붙잡혔다. 손책은 학자인 왕랑을 죽이지 않았다. 당신도 살았다.'}hurt(30,'풍랑');return '바다에서 풍랑을 만났다.'}},
     {l:'손책에게 투항한다',st:'정',d:40,act:ok=>{if(ok){P.fame+=4;return '손책은 회계의 관리를 그대로 썼다.'}P.fame=Math.max(0,P.fame-3);return '항복이 늦었다며 한직으로 밀려났다.'}},
     {l:'관인을 버리고 고향으로 간다',act:()=>{setPath('민');P.wealth+=3;return '붓을 내려놓고 산음에서 밭을 갈았다.'}}],
 to:()=>'배는 이미 떠났다. 손책의 군사가 관아로 들어왔다.'},
{id:'b_yanbaihu',w:5,once:1,when:()=>inR('양주')&&P.year>=195&&P.year<=196&&P.age>=15&&['민','적'].includes(P.path),time:7,title:'동오덕왕',han:'虎',hr:'호',
 text:()=>'오군의 엄백호가 무리 만여 명을 모아 동오덕왕이라 일컫는다. 산채에서 사람을 모은다.',
 ch:[{l:'엄백호 무리에 든다',req:()=>P.path==='민',rq:'백성만',act:()=>{setPath('적');P.wealth+=6;return '말 위의 동오덕왕은 생각보다 늙어 보였다.'}},
     {l:'무리를 이끌고 손책에게 항복한다',req:()=>P.path==='적',rq:'도적만',st:'매',d:50,act:ok=>{if(ok){setPath('군');P.fame+=4;return '손책은 항복한 도적을 군에 넣었다.'}hurt(35,'손책군의 칼');return '항복하러 가는 길에 손책군과 부딪쳤다.'}},
     {l:'손책군의 길잡이가 된다',st:'지',d:45,act:ok=>{if(ok){setPath('군');P.fame+=7;later('f2_baihu_rev',rint(1,2),{});return '산채로 가는 샛길을 알려 주었다. 엄백호는 여항의 허소(許昭)에게로 달아났다.'}hurt(30,'엄백호 무리의 칼');return '길잡이인 것이 들통났다.'}}],
 to:()=>{hurt(15,'산채의 난리');P.wealth=Math.max(0,P.wealth-5);return '양쪽에게 곡식을 빼앗겼다.'}},
{id:'b_taoqian',w:5,once:1,when:()=>inR('서주')&&P.year===194&&P.age>=18&&['관','군'].includes(P.path),time:7,title:'서주를 넘기다',han:'讓',hr:'양',
 text:()=>'서주목 도겸이 죽으며 "유비가 아니면 이 주를 편안히 할 수 없다" 했다. 별가 미축이 유비를 맞으러 간다.',
 ch:[{l:'유비를 설득하는 글을 쓴다',st:'지',d:50,act:ok=>{P.flags.liu=1;if(ok){P.fame+=8;return '진등과 공융도 같은 뜻을 전했다. 유비가 마침내 서주를 받았다.'}P.fame+=1;return '글은 읽히지 않았다. 그래도 유비는 서주를 받았다.'}},
     {l:'도겸의 아들을 세우자고 한다',st:'정',d:55,act:ok=>{if(ok){P.fame+=3;P.s.매+=2;return '도겸의 아들들은 벼슬을 원치 않았다. 그래도 의리는 기억되었다.'}P.fame=Math.max(0,P.fame-3);return '혼자만 다른 소리를 한 셈이 되었다.'}},
     {l:'몰래 원술에게 사람을 보낸다',st:'지',d:55,act:ok=>{if(ok){P.wealth+=10;later('f2_tq_secret',2,{});return '원술이 후한 답례를 보냈다. 원술은 서주를 노리고 있었다.'}hurt(25,'밀통의 죄');return '밀서가 들켜 매를 맞았다.'}}],
 to:()=>'논의는 이미 끝나 있었다. 서주의 주인이 바뀌었다.'},
{id:'b_wancheng',w:5,once:1,when:()=>P.year===197&&P.path==='군'&&ruler()==='조조'&&P.age<=50,time:6,title:'완성의 밤',han:'宛',hr:'완',
 text:()=>'완성의 장수가 항복한 지 열흘 남짓, 한밤에 군영이 기습당했다. 전위가 홀로 영문을 막고 있다.',
 ch:[{l:'전위 곁에서 영문을 막는다',st:'무',d:60,act:ok=>{if(ok){P.fame+=14;later('f2_dianwei',1,{});return '전위는 그 자리에서 죽었다. 당신은 살아서 그 이야기를 전했다.'}hurt(55,'완성의 영문');return '창 여러 자루가 한꺼번에 들어왔다.'}},
     {l:'말을 몰아 주공의 퇴로를 연다',st:'통',d:50,act:ok=>{if(ok){P.fame+=8;return '조조는 빠져나갔다. 장남 조앙이 말을 내주고 죽었다고 한다.'}hurt(35,'장수군의 화살');return '어둠 속에서 화살이 쏟아졌다.'}},
     {l:'어둠 속으로 달아난다',p:.7,act:ok=>{P.fame=Math.max(0,P.fame-3);if(ok)return '살았다. 육수 강가에서 동료들의 시신을 지나쳤다.';hurt(30,'장수군의 창');return '달아나다 추격병에게 찔렸다.'}}],
 to:()=>{hurt(35,'완성의 기습');return '잠에서 깨기도 전에 군막이 불탔다.'}},
{id:'b_guanzhong',w:4,once:1,when:()=>inR('량주','사례')&&P.year>=194&&P.year<=199&&P.age>=15&&P.path!=='관',time:7,title:'관중 제장',han:'關',hr:'관',
 text:()=>'의형제를 맺었던 마등과 한수가 원수가 되었다. 한수가 마등의 처자를 죽였다고 한다. 양쪽이 관중 사람들을 끌어모은다.',
 ch:[{l:'마등 편에 선다',st:'무',d:50,act:ok=>{setPath('군');if(ok){P.fame+=7;return '마등의 기병 틈에서 공을 세웠다. 강족 병사들이 당신 이름을 외웠다.'}hurt(35,'한수군의 창');return '한수군 강족 기병의 창에 옆구리를 찔렸다.'}},
     {l:'한수 편에 선다',st:'무',d:50,act:ok=>{setPath('군');if(ok){P.fame+=7;return '한수의 진영에서 공을 세웠다. 늙은 한수는 공을 세운 자를 잊지 않았다.'}hurt(35,'마등군의 창');return '마등의 기병에게 쫓기다 말에서 떨어졌다.'}},
     {l:'양쪽에 말을 대 준다',req:()=>P.path==='상'||P.wealth>=20,rq:'상인이거나 2만 전 필요',st:'정',d:50,act:ok=>{if(ok){P.wealth+=15;return '양쪽에 말을 대며 값을 올려 받았다. 싸움이 길어질수록 말값이 뛰었다.'}P.wealth=Math.floor(P.wealth*.6);return '양쪽 모두 말만 끌고 가고 값을 치르지 않았다.'}},
     {l:'강족 마을로 숨어든다',act:()=>{moveTo('량주');P.wealth+=3;P.s.무+=2;return '양떼와 말 사이에서 몇 해를 보냈다. 말 타는 솜씨만은 늘었다.'}}],
 to:()=>{hurt(20,'관중의 난리');return '양쪽 군대가 번갈아 마을을 휩쓸고 지나갔다.'}},
{id:'b_xuexiao',w:4,once:1,when:()=>inR('형주')&&P.year>=192&&P.year<=199&&P.age>=14&&P.path!=='적',time:7,title:'양양 학관',han:'學',hr:'학',
 text:()=>'유표가 양양에 학관을 열고 송충과 기무개에게 오경의 장구를 새로 정리하게 했다. 난리를 피한 선비들이 사방에서 모여든다.',
 ch:[{l:'학관에 들어간다',st:'지',d:45,act:ok=>{if(ok){P.s.지+=6;P.fame+=4;return '송충에게 태현경을 배웠다. 북쪽에서 온 선비들과 밤새 글을 논했다.'}P.s.지+=2;P.wealth=Math.max(0,P.wealth-5);return '강론은 반도 알아듣지 못했다. 책값과 먹값에 가산만 줄었다.'}},
     {l:'선비들에게 붓과 종이를 판다',act:()=>{if(P.path==='민')setPath('상');P.wealth+=6;P.s.정+=1;return '학관 앞에 붓 가게를 냈다. 외상 장부에 이름난 선비들의 이름이 쌓였다.'}},
     {l:'유표의 막부에 자리를 구한다',st:'정',d:50,act:ok=>{if(ok){setPath('관');P.fame+=5;return '말단 자리를 얻었다. 유표는 글 아는 사람을 곁에 두기를 좋아했다.'}P.fame+=1;return '유표는 선비를 아꼈지만 쓰지는 않았다. 문객 명부에 이름만 올렸다.'}}],
 to:()=>'학관 문 앞에서 머뭇거리다 해가 졌다.'},
{id:'b_barter',w:3,cd:5,when:()=>P.year>=192&&P.year<=199&&inR('기주','청주','연주','예주','서주','사례','량주')&&P.age>=14&&['민','상'].includes(P.path),time:6,title:'돈 없는 장터',han:'布',hr:'포',
 text:()=>'동탁이 작은 돈을 마구 찍어 낸 뒤로 동전은 쓸모가 없어졌다. 장터에서는 쌀 몇 되, 베 한 필로 물건을 바꾼다.',
 ch:[{l:'베를 짜서 쌓아 둔다',act:()=>{P.wealth+=4;hurt(5,'과로');return '베 한 필이 곧 돈이었다. 손이 갈라지도록 베틀을 밟았다.'}},
     {l:'고을마다 다른 시세를 노린다',st:'정',d:50,act:ok=>{if(ok){P.wealth+=12;if(P.path==='민')setPath('상');return '곡식이 흔한 고을과 베가 흔한 고을을 오가며 이문을 남겼다.'}P.wealth=Math.floor(P.wealth*.7);return '받아 온 곡식 자루를 열어 보니 물에 불린 쭉정이였다.'}},
     {l:'곡식에 물을 먹이고 베를 얇게 짠다',st:'지',d:45,act:ok=>{if(ok){const n=mkName();P.wealth+=10;P.s.매-=4;later('f3_barter_mark',rint(2,4),{n});return `물 먹인 곡식으로 ${n}이라는 농부에게서 베 세 필을 받아 냈다. 다들 그렇게 했다.`}hurt(15,'장터의 매질');P.fame=Math.max(0,P.fame-3);return '속임수가 들켜 장터 한복판에서 매를 맞았다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-5);return '바꿀 물건을 찾아 헤매다 장이 파했다.'}},
{id:'b_halberd',w:5,once:1,when:()=>inR('서주','예주')&&P.year===196&&['군','민'].includes(P.path)&&P.age>=15,time:7,title:'원문의 화극',han:'戟',hr:'극',
 text:()=>'여포가 원술의 장수 기령과 유비를 함께 불렀다. 영문에 화극을 세우고 "작은 가지를 맞히면 양쪽 모두 군사를 물리라" 한다.',
 ch:[{l:'"맞힌다"에 돈을 건다',p:.85,act:ok=>{if(ok){P.wealth+=8;return '화살이 가지 끝을 맞혔다. 기령도 유비도 군을 물렸고 당신은 판돈을 챙겼다.'}P.wealth=Math.max(0,P.wealth-2);return '화살은 맞혔는데 판돈을 쥔 자가 달아났다.'}},
     {l:'"못 맞힌다"에 돈을 건다',act:()=>{P.wealth=Math.max(0,P.wealth-6);return '화살이 가지를 맞혔다. 장수들이 "장군은 하늘의 위엄을 지녔다"며 놀랐다. 판돈을 잃었다.'}},
     {l:'나도 쏘아 보겠다고 나선다',st:'무',d:65,act:ok=>{if(ok){P.fame+=8;later('f3_halberd_call',1,{});return '같은 거리에서 당신의 화살도 가지를 스쳤다. 여포가 웃으며 술을 내리고 이름을 물었다.'}P.fame=Math.max(0,P.fame-3);return '빗나간 화살에 웃음이 터졌다. 여포의 친병이 당신을 영문 밖으로 내몰았다.'}}],
 to:()=>'구경꾼 틈을 비집고 들어가지 못했다. 함성만 들었다.'},
{id:'b_yangcheng',w:6,once:1,when:()=>inR('사례','예주')&&P.year===190&&P.age>=12,time:6,title:'양성의 사일',han:'社',hr:'사',

     {l:'시체 사이에 엎드려 죽은 척한다',p:.55,act:ok=>{if(ok){hurt(5,'양성의 학살');return '피 냄새 속에서 해가 지기만 기다렸다. 마을 사내 가운데 살아남은 이가 드물었다.'}hurt(45,'양성의 학살');return '병사가 시체마다 창을 찔러 보았다.'}},
     {l:'제기를 들고 맞선다',st:'무',d:60,act:ok=>{if(ok){P.fame+=8;hurt(15,'양성의 학살');return '병사 둘을 쓰러뜨리고 피투성이로 빠져나왔다.'}die('양성의 학살');return '제사 그릇으로 창을 막을 수는 없었다.'}}],
 to:()=>{hurt(50,'양성의 학살');return '얼어붙은 사이 칼이 내려왔다.'}},
{id:'b_xiapi196',w:5,once:1,when:()=>inR('서주')&&P.year===196&&P.age>=15,time:6,title:'하비의 밤',han:'奪',hr:'탈',

 ch:[{l:'장비를 따라 성을 빠져나간다',st:'무',d:50,act:ok=>{if(ok){P.fame+=6;P.flags.liu=1;if(P.path==='민')setPath('군');return '장비를 따라 어둠 속을 달렸다. 유비의 처자는 성에 남겨졌다.'}hurt(35,'여포군의 창');return '성문 앞에서 여포의 기병과 부딪쳤다.'}},
     {l:'단양병과 함께 성문을 연다',act:()=>{P.fame+=2;P.wealth+=3;P.s.매-=3;P.flags.lubu=1;return '문을 연 단양병들은 상을 받았다. 새 주인 여포는 유비의 처자를 붙잡아 두었다.'}},
     {l:'집에 숨어 날이 밝기를 기다린다',p:.7,act:ok=>{if(ok){P.s.지+=1;return '아침이 되니 성벽의 깃발이 바뀌어 있었다. 장터는 그날도 열렸다.'}hurt(20,'하비의 밤');P.wealth=Math.floor(P.wealth*.7);return '밤새 병사들이 문을 두드리더니 끝내 들이닥쳤다.'}}],
 to:()=>{hurt(20,'하비의 밤');return '거리로 나섰다가 난병에 휩쓸렸다.'}},
{id:'c_yuanbro',w:5,once:1,when:()=>P.year>=202&&P.year<=203&&inR('기주','청주')&&['군','관'].includes(P.path)&&P.age>=16,time:7,title:'형제의 다툼',han:'鬩',hr:'혁',

     {l:'청주의 원담을 따른다',st:'무',d:45,act:ok=>{moveTo('청주');if(ok){P.fame+=6;return '평원으로 밀려났지만 원담 곁에서 끝까지 버텼다.'}hurt(25,'형제의 싸움');return '원상군에 쫓겨 평원성에 갇혔다.'}},
     {l:'조조에게 귀순한다',st:'지',d:50,act:ok=>{if(ok){moveTo('예주');P.fame+=8;return '형제가 싸우는 틈에 여양의 조조 진영으로 넘어갔다. 허도로 보내져 하북 사정을 묻는 말에 밤새 답했다.'}hurt(30,'군율');return '길목에서 붙잡혀 매를 맞았다.'}}],
 to:()=>{hurt(15,'형제의 싸움');return '어느 편도 들지 못하는 사이 양쪽 모두에게 의심을 샀다.'}},
{id:'c_yecity',prio:1,when:()=>P.year===204&&inR('기주')&&P.age>=8,time:7,title:'업성 수공',han:'鄴',hr:'업',

     {l:'성문을 열자는 무리에 낀다',p:.5,act:ok=>{if(ok){P.fame+=6;return '심영이 동문을 열었다. 조조군이 들어오고 포위가 풀렸다.'}hurt(35,'심배의 문초');return '모의가 새어 나가 심배의 병사들에게 끌려갔다. 성이 떨어지는 날에야 풀려났다.'}},
     {l:'끝까지 성을 지킨다',st:'무',d:50,act:ok=>{if(P.path==='민')setPath('군');if(ok){P.fame+=5;hurt(15,'업성의 굶주림');return '성은 떨어졌지만 살아남았다. 조조는 원소의 무덤에 곡을 하고 남은 이들을 놓아주었다.'}die('업성 공방');return '말가죽까지 삶아 먹던 여름, 성벽 위에서 쓰러졌다.'}}],
 to:()=>{hurt(35,'업성의 굶주림');return '굶주림 속에 계절이 지나갔다. 팔월, 성이 떨어졌다.'}},
{id:'c_hudiao',w:5,once:1,when:()=>P.year>=204&&P.year<=206&&ruler()==='조조'&&inR('기주','청주','연주','예주')&&['민','상'].includes(P.path)&&P.age>=15,time:7,title:'호조령',han:'調',hr:'조',

 ch:[{l:'밭을 사실대로 신고한다',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.s.매+=2;return '원씨 시절보다 한결 가벼웠다. 처음으로 세금이 정해진 만큼만 나갔다.'}},
     {l:'호족 장부에 밭을 숨긴다',st:'지',d:45,act:ok=>{if(ok){const h=pick(['최','견','노','진','왕'])+'씨';P.wealth+=6;later('f3_hudiao_haozu',rint(2,4),{h});return `${h} 집안의 소작으로 이름을 올려 세를 피했다.`}P.wealth=Math.max(0,P.wealth-10);hurt(12,'곤장');return '감찰하던 관리에게 걸려 밭을 몰수당하고 곤장을 맞았다.'}},
     {l:'비단을 사 모아 되판다',req:()=>P.path==='상'||P.wealth>=25,rq:'상인이거나 2만 5천 전 필요',st:'정',d:45,act:ok=>{if(P.path==='민')setPath('상');if(ok){P.wealth+=12;return '집마다 비단이 필요해지자 값이 뛰었다.'}P.wealth=Math.max(0,P.wealth-8);return '너도나도 비단을 사들여 값이 꺾였다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-5);return '이장이 대신 적어 넣은 밭은 실제보다 넓었다.'}},

     {l:'호족의 사례를 받고 눈감는다',act:()=>{P.wealth+=15;P.s.매-=4;later('f3_huji_audit',rint(2,4),{h:P.tmp.h||'호족'});return '비단 다섯 필이 들어왔다. 장부에는 빈집만 늘었다.'}},
     {l:'떠돌이들을 달래 호적에 올린다',st:'매',d:45,act:ok=>{if(ok){P.fame+=6;P.s.매+=3;return '유민들이 하나둘 이름을 적었다. 그해 마을에 밥 짓는 연기가 늘었다.'}P.fame=Math.max(0,P.fame-1);return '부역이 무서운 유민들은 산으로 흩어졌다.'}}],

{id:'c_zhangyan',w:5,once:1,when:()=>P.year>=204&&P.year<=206&&inR('기주','병주','유주')&&P.path==='적'&&P.age>=15,time:7,title:'흑산의 항복',han:'黑',hr:'흑',

     {l:'남은 무리를 모아 산에 버틴다',st:'통',d:50,act:ok=>{if(ok){P.fame+=8;P.wealth+=6;return '태항산 골짜기에 새 산채를 세웠다. 졸개들이 당신을 두목이라 불렀다.'}hurt(35,'토벌군의 창');return '토벌군이 골짜기를 훑고 지나갔다.'}},
     {l:'몰래 고향으로 돌아간다',st:'지',d:40,act:ok=>{setPath('민');if(ok){P.wealth+=2;return '이름을 바꾸고 둔전민 틈에 섞였다.'}hurt(15,'곤장');return '관문에서 붙잡혀 곤장을 맞고 둔전으로 보내졌다.'}}],

{id:'c_gaogan',w:5,once:1,when:()=>P.year>=205&&P.year<=206&&inR('병주')&&P.path==='군'&&P.age>=16,time:7,title:'호관',han:'壺',hr:'호',

 ch:[{l:'관문을 굳게 지킨다',st:'통',d:55,act:ok=>{if(ok){P.fame+=6;hurt(10,'호관 공방');return '석 달을 버텼다. 고간은 흉노에게 구원을 청하러 떠났고 관은 결국 열렸다.'}hurt(40,'호관 공방');return '조조군이 쌓은 토산이 성벽보다 높아졌다.'}},
     {l:'조조군에 투항한다',st:'매',d:45,act:ok=>{if(ok){P.fame+=4;return '항복한 병사로 받아들여졌다. 고간은 형주로 달아나다 상락에서 죽었다고 한다.'}hurt(25,'군율');return '항복병 무리에 섞여 한겨울 성벽 쌓는 부역에 끌려갔다.'}},
     {l:'흉노 땅으로 달아난다',p:.5,act:ok=>{if(ok){moveTo('량주');return '북쪽 초원을 돌아 서쪽 량주로 흘러들었다.'}hurt(30,'북방의 추위');return '선우는 고간을 받아 주지 않았다. 추위 속에 되돌아왔다.'}}],
