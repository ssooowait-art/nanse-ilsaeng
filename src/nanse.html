 ch:[{l:'벼슬을 받고 장안으로 따라간다',act:()=>{if(P.path!=='관')setPath('관');P.rank=Math.min(RANKS.관.length-1,P.rank+1);moveTo('사례');P.flags.dong=2;P.s.매-=2;later('f2_dong_fall',Math.max(1,Math.min(12,192-P.year)),{});return '불타는 낙양을 뒤로하고 서쪽으로 갔다. 백성 수백만이 함께 끌려갔다.'}},
     {l:'병을 핑계로 낙양에 남는다',p:.5,act:ok=>{if(ok){P.fame+=2;P.flags.dong=0;return '동탁의 군사가 궁궐에 불을 지르기 전에 빠져나왔다.'}hurt(25,'동탁군의 매');return '꾀병이 들통나 매를 맞고 끌려갔다.'}},
     {l:'관동 연합군에 몰래 줄을 댄다',st:'지',d:55,act:ok=>{if(ok){P.flags.dong=0;P.fame+=8;moveTo('연주');return '밤길을 달려 산조의 연합군 진영에 닿았다. 동탁의 내막을 아는 자라며 반겼다.'}hurt(40,'동탁의 형벌');return '밀서가 들켰다. 살아난 것이 기적이었다.'}}],
 to:()=>{moveTo('사례');return '머뭇거리는 사이 장안으로 가는 행렬에 휩쓸렸다.'}},
{id:'f2_dong_fall',w:1,when:()=>false,time:8,title:'동탁의 죽음',han:'誅',hr:'주',
 text:()=>'왕윤과 여포가 동탁을 죽였다. 백성들이 춤을 추고, 동탁의 사람이라 불리던 이들은 하나씩 끌려간다.',
 ch:[{l:'동탁의 시신 앞에서 탄식한다',act:()=>{hurt(35,'옥사');if(P.path==='관')setPath('민');P.s.매+=2;return '채옹처럼 탄식했다가 옥에 갇혔다. 채옹은 끝내 옥에서 죽었고 당신은 관직을 잃고 풀려났다.'}},
     {l:'왕윤에게 먼저 고개를 숙인다',st:'정',d:50,act:ok=>{if(ok){P.flags.dong=0;return '자리를 지켰다. 그러나 몇 달 뒤 이각과 곽사가 장안으로 몰려왔다.'}if(P.path==='관')setPath('민');P.fame=Math.max(0,P.fame-4);return '동탁의 은총을 받은 자라며 관직에서 쫓겨났다.'}},
     {l:'량주 장수들에게 몸을 의탁한다',act:()=>{setPath('군');P.fame=Math.max(0,P.fame-3);P.s.매-=2;return '이각의 진영에 들었다. 그들은 곧 장안을 치러 갈 것이다.'}}],
 to:()=>{hurt(20,'옥사');return '머뭇거리는 사이 포졸이 문을 두드렸다.'}},
{id:'f2_coin_threat',w:1,when:()=>false,time:7,title:'입막음 값',han:'錢',hr:'전',
 text:()=>'함께 소전을 찍던 대장장이가 붙잡혔다. 그 아내가 찾아와, 옥에서 당신 이름을 대지 않게 하려면 몸값을 보태라고 한다.',
 ch:[{l:'돈을 주어 입을 막는다',act:()=>{const c=Math.max(8,Math.round(P.wealth*.3));P.wealth=Math.max(0,P.wealth-c);return `${money(c)}을 건넸다. 대장장이는 끝내 당신 이름을 대지 않았다.`}},
     {l:'거푸집을 강물에 버리고 잡아뗀다',st:'지',d:50,act:ok=>{if(ok){P.s.지+=1;return '관아가 집을 뒤졌지만 아무것도 나오지 않았다.'}hurt(30,'사주전의 형벌');P.wealth=Math.floor(P.wealth*.6);return '거푸집이 하류 모래톱에서 발견되었다.'}},
     {l:'먼저 관아에 자수한다',act:()=>{P.wealth=Math.floor(P.wealth*.5);P.fame=Math.max(0,P.fame-3);return '벌금으로 가산 절반을 바쳤다. 대장장이의 아내가 당신 집에 침을 뱉었다.'}}],
 to:()=>{hurt(25,'사주전의 형벌');return '대답을 미루는 사이 대장장이가 당신 이름을 댔다.'}},
{id:'f2_ruins_jade',w:1,when:()=>false,time:7,title:'무덤의 옥',han:'玉',hr:'옥',
 text:()=>'능에서 가져온 옥 조각을 살 사람이 나섰다. 무덤 물건인 줄 알면서도 값을 후하게 부른다.',
 ch:[{l:'팔아넘긴다',p:.6,act:ok=>{if(ok){P.wealth+=20;return '옥을 넘기고 돈 자루를 받았다. 산 사람은 다음 날 사라졌다.'}hurt(30,'도굴의 죄');return '산 사람은 관아의 끄나풀이었다.'}},
     {l:'제자리에 돌려놓는다',act:()=>{P.s.매+=5;P.hp=Math.min(maxHp(),P.hp+5);return '밤에 능으로 돌아가 옥을 묻었다. 그 뒤로 꿈자리가 편해졌다.'}},
     {l:'갈아서 장신구로 만들어 판다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=12;return '모양을 바꾸어 장터에 내놓았다. 아무도 출처를 묻지 않았다.'}P.wealth=Math.max(0,P.wealth-2);return '옥이 갈다가 쪼개졌다. 품삯만 날렸다.'}}],
 to:()=>{P.wealth+=5;return '흥정이 길어지자 산 사람이 값을 깎아 후려쳤다.'}},
{id:'f2_donggui_xu',w:1,when:()=>false,time:7,title:'허도의 조정',han:'許',hr:'허',
 text:()=>'천자가 허현으로 옮겨 갔다. 동귀 길을 끝까지 따른 신하들에게 벼슬이 내려진다. 조정의 실권은 조조에게 있다.',
 ch:[{l:'조조 밑에서 일한다',act:()=>{moveTo('예주');if(P.path!=='관'){setPath('관');P.rank=1;}else P.rank=Math.min(RANKS.관.length-1,P.rank+1);P.fame+=3;return '사공부(司空府)에 들어갔다. 일은 많고 녹은 확실했다.'}},
     {l:'천자 곁 한직에 남는다',act:()=>{moveTo('예주');if(P.path!=='관')setPath('관');P.fame+=4;P.s.정+=1;later('f2_yidai',Math.max(1,Math.min(12,200-P.year)),{});return '궁궐 시위를 맡았다. 천자 곁에는 사람이 적었다.'}},
     {l:'벼슬을 사양하고 고향으로 간다',act:()=>{setPath('민');P.wealth+=4;P.fame+=2;return '천자가 내린 비단 몇 필을 들고 고향에 돌아갔다.'}}],
 to:()=>'머뭇거리는 사이 자리가 정해졌다.'},
{id:'f2_yidai',w:1,when:()=>false,time:8,title:'옷띠 속 밀조',han:'帶',hr:'대',
 text:()=>'거기장군 동승이 천자의 밀조를 받았다며 조조를 벨 사람을 모은다. 이름을 적은 비단이 당신 앞에 놓였다.',
 ch:[{l:'이름을 올린다',p:.3,act:ok=>{if(ok){P.fame+=10;P.s.매+=3;return '정월에 모의가 드러나 동승 등이 삼족을 멸당했다. 장부에서 당신 이름만은 빠져 있었다.'}if(R()<.5){die('의대조 사건');return '모의가 드러났다. 이름이 적힌 자는 모두 끌려갔다.'}hurt(45,'옥사');setPath('민');return '모의가 드러났다. 옥에서 반쯤 죽어 나왔다.'}},
     {l:'모른 척 물러난다',act:()=>{P.s.매-=2;P.s.지+=1;return '정월, 동승의 집안이 멸족되었다. 당신은 그 자리에 없었던 사람이 되었다.'}},
     {l:'조조에게 귀띔한다',act:()=>{if(P.path==='관')P.rank=Math.min(RANKS.관.length-1,P.rank+1);P.fame+=2;P.s.매-=6;return '조조가 당신을 따로 불러 술을 내렸다. 천자는 그 뒤로 당신을 보지 않았다.'}}],
 to:()=>{P.s.매-=1;return '대답을 미루는 사이 비단은 다른 사람 앞으로 넘어갔다.'}},
{id:'f2_qz_tuntian',w:1,when:()=>false,time:7,title:'둔전',han:'屯',hr:'둔',
 text:()=>'조조가 허현에서 시작한 둔전을 연주에도 넓혔다. 관의 소를 빌려 쓰면 수확의 여섯을, 제 소를 쓰면 다섯을 바친다.',
 ch:[{l:'관의 소를 빌린다',act:()=>{P.wealth+=3;return '네 몫만 남았지만 굶지는 않았다. 둔전관은 군대처럼 사람을 부렸다.'}},
     {l:'제 소를 사서 부친다',req:()=>P.wealth>=8,rq:'8천 전 필요',act:()=>{P.wealth+=4;P.s.통+=1;return '소값이 아까웠지만 몫이 한 할 늘었다. 이웃이 소를 빌리러 왔다.'}},
     {l:'둔전을 떠나 고향 청주로 간다',p:.5,act:ok=>{if(ok){moveTo('청주');return '둔전관의 눈을 피해 고향으로 돌아갔다. 밭은 쑥대밭이었다.'}hurt(15,'곤장');return '둔전민은 함부로 떠날 수 없었다. 붙잡혀 곤장을 맞았다.'}}],
 to:()=>{P.wealth+=1;return '둔전관이 정해 주는 대로 소를 받았다.'}},
{id:'f2_yz_after',w:1,when:()=>false,time:7,title:'연주 수복',han:'復',hr:'복',
 text:()=>'조조가 연주를 되찾았다. 여포를 맞아들였던 자들을 가려낸다. 장막의 옹구성은 포위되었다.',
 ch:[{l:'자수하고 용서를 빈다',p:.55,act:ok=>{P.flags.lubu=0;if(ok){P.fame=Math.max(0,P.fame-2);return '조조는 위세에 눌려 따른 자들을 대부분 놓아주었다.'}hurt(35,'옥사');return '본보기로 매를 맞았다.'}},
     {l:'여포를 따라 서주로 간다',act:()=>{moveTo('서주');setPath('군');return '여포는 서주의 유비에게 몸을 의탁했다. 당신도 그 기병 꽁무니를 따랐다.'}},
     {l:'이웃에게 누명을 씌운다',act:()=>{P.flags.lubu=0;P.s.매-=6;return '이웃이 대신 끌려갔다. 그 집 아이들이 당신 집 앞에 돌을 던졌다.'}}],
 to:()=>{hurt(20,'옥사');return '이웃의 밀고로 먼저 끌려갔다.'}},
{id:'f2_zhong_end',w:1,when:()=>false,time:7,title:'중씨의 몰락',han:'崩',hr:'붕',
 text:()=>'중씨 황제의 나라가 무너지고 있다. 창고가 빈 원술은 청주의 원담에게 가려 했으나 유비가 길을 막았다.',
 ch:[{l:'끝까지 원술을 따른다',act:()=>{P.fame+=3;hurt(15,'굶주림');P.flags.zhong=0;return '강정에서 원술이 꿀물을 찾다 피를 토하고 죽었다. 그 곁에 있었다.'}},
     {l:'관복을 벗고 조조의 땅으로 넘어간다',st:'정',d:50,act:ok=>{moveTo('예주');P.flags.zhong=0;if(ok){if(P.path!=='관')setPath('관');P.rank=Math.max(0,P.rank-1);return '죄를 묻지 않는 대신 한 등급 낮은 자리를 받았다.'}setPath('민');P.fame=Math.max(0,P.fame-4);return '역적의 벼슬을 지냈다는 이유로 쓰이지 못했다.'}},
     {l:'강동의 손책에게 간다',act:()=>{moveTo('양주');P.flags.zhong=0;P.fame+=2;return '원술의 옛 부하들 틈에 섞여 강을 건넜다.'}}],
 to:()=>{hurt(20,'굶주림');return '흩어지는 무리 속에서 길을 잃었다.'}},
{id:'f2_wanglang_call',w:1,when:()=>false,time:7,title:'허도로 가는 길',han:'徵',hr:'징',
 text:()=>'조조가 표를 올려 왕랑을 조정으로 불렀다. 왕랑이 함께 곡아를 떠나 허도로 가자고 한다. 길은 강과 바다를 돌아 한 해가 넘게 걸린다.',
 ch:[{l:'왕랑을 따라 허도로 간다',act:()=>{moveTo('예주');if(P.path!=='관')setPath('관');P.rank=Math.max(P.rank,2);hurt(10,'먼 길');return '긴 길 끝에 허도에 닿았다. 왕랑은 간의대부가 되었고 당신도 벼슬을 받았다.'}},
     {l:'강동에 남아 손씨를 섬긴다',act:()=>{P.s.정+=2;P.fame+=1;return '손씨 밑에서 다시 붓을 잡았다. 강동 선비들과 사귀었다.'}},
     {l:'고향 산음으로 돌아간다',act:()=>{setPath('민');P.wealth+=4;return '왕랑이 떠나며 책 몇 상자를 남겨 주었다.'}}],
 to:()=>'배가 떠날 때 당신은 선창에 없었다.'},
{id:'f2_baihu_rev',w:1,when:()=>false,time:7,title:'잔당의 불',han:'火',hr:'화',
 text:()=>'엄백호의 잔당이 산에서 내려왔다. 산채로 가는 샛길을 알려 준 자를 찾는다며 마을에 불을 지른다.',
 ch:[{l:'잔당과 맞선다',st:'무',d:50,act:ok=>{if(ok){P.fame+=6;P.s.무+=2;return '앞장선 자를 베자 나머지가 흩어졌다.'}hurt(35,'잔당의 칼');return '불길 속에서 칼을 맞았다.'}},
     {l:'손책군 진영으로 몸을 피한다',act:()=>{P.wealth=Math.floor(P.wealth*.7);P.fame=Math.max(0,P.fame-1);return '목숨은 건졌지만 집은 잿더미가 되었다.'}},
     {l:'재물을 내주고 빈다',act:()=>{P.wealth=Math.floor(P.wealth*.5);P.s.매-=1;return '가진 것을 다 내주고 무릎을 꿇었다. 그들은 침을 뱉고 떠났다.'}}],
 to:()=>{hurt(25,'잔당의 불');P.wealth=Math.floor(P.wealth*.6);return '자다가 연기에 눈을 떴다.'}},
{id:'f2_tq_secret',w:1,when:()=>false,time:7,title:'밀서의 그림자',han:'影',hr:'영',
 text:()=>'원술이 서주로 쳐들어왔다. 유비 진영에 예전 당신의 밀서를 아는 자가 있다는 말이 돈다.',
 ch:[{l:'원술 진영으로 달아난다',act:()=>{moveTo('양주');P.fame=Math.max(0,P.fame-2);P.wealth+=4;return '원술이 옛 정을 기억하고 자리를 내주었다.'}},
     {l:'유비에게 먼저 털어놓는다',st:'정',d:55,act:ok=>{if(ok){P.fame+=4;P.s.매+=2;return '유비는 지난 일을 묻지 않았다. 그 너그러움이 소문났다.'}hurt(30,'군율');setPath('민');return '장비가 당신을 끌어내 매질했다. 관직도 잃었다.'}},
     {l:'밀서를 아는 자의 입을 막는다',act:()=>{P.wealth=Math.max(0,P.wealth-8);P.s.매-=3;return '재물로 입을 막았다. 그 뒤로 그 사람을 볼 때마다 등골이 서늘했다.'}}],
 to:()=>{hurt(20,'군율');return '소문이 먼저 장수들 귀에 들어갔다.'}},
{id:'f2_dianwei',w:1,when:()=>false,time:7,title:'전위의 제사',han:'祭',hr:'제',
 text:()=>'조조가 지난해 완성에서 죽은 전위를 위해 제사를 지낸다. 그의 아들 전만을 낭중으로 삼았다. 그날 영문을 함께 지킨 당신이 불려 나왔다.',
 ch:[{l:'전위의 마지막을 증언한다',act:()=>{P.fame+=5;P.s.매+=1;return '말을 마치자 조조가 소리 내어 울었다.'}},
     {l:'전만을 돌보겠다고 나선다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=3;kind('전만','당신이 돌봐 준 전위의 아들');return '어린 전만이 당신 소매를 붙들었다.'}},
     {l:'공을 내세워 상을 청한다',act:()=>{P.wealth+=10;P.s.매-=2;return '상은 받았다. 제사 자리에서 공을 따졌다며 뒷말이 돌았다.'}}],
 to:()=>'제사 자리 끝에서 고개만 숙였다.'},
{id:'f3_barter_mark',when:()=>false,time:7,title:'그때의 농부',han:'債',hr:'채',
 text:()=>{const q=P.tmp.q||{};return `${jo(q.n||'그 농부','이/가')} 장터에서 당신을 알아보았다. "몇 해 전 물 먹인 곡식을 주고 내 베를 가져간 자가 바로 저 사람이오!" 사람들이 모여든다.`},
 ch:[{l:'그때 값을 쳐서 돌려준다',req:()=>P.wealth>=8,rq:'8천 전 필요',act:()=>{const q=P.tmp.q||{};P.wealth-=8;P.s.매+=2;P.fame+=1;return `${jo(q.n||'농부','은/는')} 돈을 쥐고 한참 말이 없었다. 장터 사람들이 당신을 다시 보았다.`}},
     {l:'처음 보는 사람이라고 잡아뗀다',st:'지',d:50,act:ok=>{if(ok){P.s.매-=1;return '증인이 없었다. 농부는 땅에 침을 뱉고 돌아섰다.'}hurt(10,'장터의 몰매');P.fame=Math.max(0,P.fame-4);return '그때 곡식 자루를 본 이웃이 나섰다. 장터에서 몰매를 맞았다.'}},
     {l:'술을 사며 사정을 털어놓는다',st:'매',d:45,act:ok=>{if(ok){P.fame+=2;P.wealth=Math.max(0,P.wealth-1);return '그해 다들 그렇게 살았다는 말에 농부도 쓴웃음을 지었다. 둘은 술잔을 나눴다.'}P.wealth=Math.max(0,P.wealth-3);return '술값만 냈다. 농부의 눈빛은 그대로였다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-3);return '대꾸할 틈도 없이 소문이 장터에 퍼졌다.'}},
{id:'f3_halberd_call',when:()=>false,time:7,title:'여포의 부름',han:'召',hr:'소',
 text:()=>'원문에서 활을 쏘던 당신을 여포가 기억했다. 하비에서 사람이 와 "장군께서 활 잘 쏘는 자를 찾으신다" 한다.',
 ch:[{l:'하비로 가서 여포의 군에 든다',act:()=>{setPath('군');moveTo('서주');P.fame+=4;P.flags.lubu=1;later('f3_halberd_siege',1,{});return '여포의 기병대에 이름을 올렸다. 장군은 용맹했지만 진궁의 말을 자주 흘려들었다.'}},
     {l:'활 솜씨만 팔고 군적에는 오르지 않는다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=6;return '군사들에게 활을 가르치고 비단 몇 필을 받았다.'}P.fame=Math.max(0,P.fame-2);return '여포의 장수 위속이 당신을 겁쟁이라 비웃었다.'}},
     {l:'노모를 핑계로 사양한다',act:()=>{P.s.지+=2;P.fame=Math.max(0,P.fame-1);return '사자는 혀를 차고 돌아갔다. 이듬해 조조가 하비로 몰려왔다는 소식을 들었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-1);return '대답을 미루는 사이 사자가 떠났다.'}},
{id:'f3_halberd_siege',when:()=>false,time:7,title:'하비 수공',han:'水',hr:'수',
 text:()=>'조조가 하비를 에워싸고 기수와 사수를 터 성에 물을 댔다. 석 달째, 여포의 장수들이 서로 눈치를 본다.',
 ch:[{l:'후성·송헌과 함께 진궁을 묶어 항복한다',st:'지',d:45,act:ok=>{P.flags.lubu=0;if(ok){P.fame+=6;return '조조군에 항복해 목숨을 건졌다. 백문루에서 여포가 "묶은 끈이 너무 조인다" 했다는 말을 들었다.'}hurt(30,'하비의 수공');return '모의를 눈치챈 고순의 병사들과 칼을 섞었다.'}},
     {l:'끝까지 여포 곁을 지킨다',st:'무',d:60,act:ok=>{if(ok){P.fame+=8;hurt(20,'하비 공방');return '백문루가 떨어지는 날까지 싸웠다. 조조는 항복한 졸병까지 죽이지는 않았다.'}die('하비 공방');return '물에 잠긴 성벽 위에서 화살을 맞았다.'}},
     {l:'밤에 해자를 헤엄쳐 빠져나간다',p:.6,act:ok=>{if(ok){setPath('민');const r=moveRandom();return `군복을 벗어 던지고 물을 건넜다. ${jo(r,'로')} 흘러가 이름을 바꾸었다.`}hurt(25,'하비의 물');return '물살에 떠밀려 조조군 진영 앞에 닿았다. 포로가 되어 노역에 끌려갔다.'}}],
 to:()=>{hurt(25,'하비 수공');return '성안에서 물이 빠지기만 기다리다 병이 들었다.'}},
{id:'f3_yangcheng_saved',when:()=>false,time:7,title:'숲의 은혜',han:'恩',hr:'은',
 text:()=>{const q=P.tmp.q||{};return `양성의 숲으로 함께 달아났던 ${q.n||'이웃'} 부인이 아들을 데리고 찾아왔다. "그날 당신이 아니었으면 이 아이도 없었습니다."`},
 ch:[{l:'아들을 거두어 일을 가르친다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=2;P.fame+=3;return '아이는 부지런했다. 몇 해 뒤 제 몫을 하는 일꾼이 되었다.'}},
     {l:'사례를 받는다',act:()=>{P.wealth+=5;return '부인은 베 다섯 필을 내려놓고 갔다. 다시 오지 않았다.'}},
     {l:'그날 일은 묻어 두자고 한다',act:()=>{P.s.지+=1;P.hp=Math.min(maxHp(),P.hp+5);return '둘은 그날 이야기를 끝내 꺼내지 않았다. 부인은 해마다 사일이면 술 한 병을 보냈다.'}}],
 to:()=>'부인은 문 앞에서 머뭇거리다 돌아갔다.'},
{id:'f3_hudiao_haozu',when:()=>false,time:7,title:'소작의 값',han:'佃',hr:'전',
 text:()=>{const q=P.tmp.q||{};return `세를 피하려 ${q.h||'호족'} 집안 장부에 밭을 올린 지 몇 해. 호족의 집사가 와서 "이제 이 밭은 우리 것"이라며 소작료를 내라 한다.`},
 ch:[{l:'현청에 가서 밭을 되찾겠다고 호소한다',st:'정',d:55,act:ok=>{if(ok){P.wealth+=5;P.fame+=3;return '현령이 묵은 문서를 뒤져 밭을 돌려주었다. 대신 밀린 세를 물었다.'}P.wealth=Math.max(0,P.wealth-6);hurt(10,'호족 하인의 몽둥이');return '현리는 호족 편이었다. 돌아오는 길에 하인들에게 맞았다.'}},
     {l:'소작료를 내고 버틴다',act:()=>{P.wealth=Math.max(0,P.wealth-4);P.s.매-=1;return '수확의 절반이 호족 창고로 갔다. 이름만 남은 내 밭이었다.'}},
     {l:'밭을 버리고 다른 고을로 간다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.7);return `세간을 싣고 ${jo(r,'로')} 떠났다. 조상 무덤만 남겨 두었다.`}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-4);return '대답을 못 하는 사이 집사가 문서에 손도장을 받아 갔다.'}},
{id:'f3_huji_haozu',when:()=>false,time:7,title:'호족의 앙갚음',han:'讎',hr:'수',
 text:()=>{const q=P.tmp.q||{};return `몇 해 전 호적 정리로 소작 호를 잃은 ${q.h||'호족'} 집안이 당신을 고발했다. "호적을 꾸미며 뇌물을 받았다"는 것이다.`},
 ch:[{l:'그때의 장부를 증거로 내놓는다',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;P.s.정+=2;return '장부의 숫자가 당신 편이 되었다. 고발한 호족이 도리어 무고죄로 벌을 받았다.'}P.fame=Math.max(0,P.fame-5);hurt(15,'옥중의 매');return '장부 한 권이 사라져 있었다. 옥에서 한 달을 보냈다.'}},
     {l:'호족과 화해하고 고발을 거두게 한다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=10;P.s.매-=2;return '비단을 보내고 술자리를 마련했다. 고발장은 조용히 사라졌다.'}},
     {l:'벼슬을 내놓고 물러난다',req:()=>P.path==='관',rq:'관리만',act:()=>{setPath('민');P.fame=Math.max(0,P.fame-2);P.s.지+=1;return '조사가 시작되기 전에 인끈을 풀었다. 호족은 더 쫓아오지 않았다.'}}],
 to:()=>{hurt(15,'옥중의 매');P.fame=Math.max(0,P.fame-4);return '해명할 틈도 없이 옥리가 들이닥쳤다.'}},
{id:'f3_huji_audit',when:()=>false,time:7,title:'장부 대조',han:'核',hr:'핵',
 text:()=>{const q=P.tmp.q||{};return `감찰관이 기주 호적을 다시 맞춰 본다. ${q.h||'호족'} 집안 마을에 빈집만 늘었던 그해 장부에 당신의 인장이 찍혀 있다.`},
 ch:[{l:'호족에게 책임을 떠넘긴다',st:'지',d:55,act:ok=>{const q=P.tmp.q||{};if(ok){P.fame=Math.max(0,P.fame-1);later('f3_huji_haozu',rint(2,4),{h:q.h||'호족'});return '호족이 장부를 꾸몄다고 둘러댔다. 그 집안 가장이 대신 끌려갔다. 호족의 아들들이 이를 갈았다.'}hurt(25,'문책');P.fame=Math.max(0,P.fame-6);return '거짓이 드러났다. 곤장을 맞고 녹봉을 깎였다.'}},
     {l:'받은 것을 내놓고 죄를 청한다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',act:()=>{P.wealth-=15;P.fame=Math.max(0,P.fame-2);P.s.매+=2;return '받은 비단을 다 내놓고 머리를 조아렸다. 감찰관은 벌을 한 등 낮춰 주었다.'}},
     {l:'감찰관에게도 사례한다',req:()=>P.wealth>=10,rq:'1만 전 필요',p:.5,act:ok=>{P.wealth-=10;if(ok)return '감찰관도 사람이었다. 장부는 그대로 넘어갔다.';hurt(20,'옥사');setPath('민');return '이번 감찰관은 청렴했다. 뇌물까지 얹은 죄로 관직을 잃었다.'}}],
 to:()=>{hurt(15,'문책');P.fame=Math.max(0,P.fame-5);return '해명을 미루다 장부가 위로 올라갔다.'}},
{id:'f3_wuhuan_rider',when:()=>false,time:7,title:'오환 돌기',han:'騎',hr:'기',
 text:()=>{const q=P.tmp.q||{};return `백랑산에서 데려온 오환 소년 ${jo(q.n||'그 소년','이/가')} 장성했다. 오환 돌기에 뽑혀 이름을 날리더니, 당신을 찾아와 절을 한다.`},
 ch:[{l:'그를 내 부대로 거둔다',req:()=>P.path==='군',rq:'군인만',act:()=>{P.s.무+=2;P.fame+=4;P.flags.wuhuan=1;return '그는 말 위에서 몸을 돌려 뒤로 활을 쏘았다. 부대의 기병들이 그를 따라 배웠다.'}},
     {l:'말 다루는 법을 배운다',act:()=>{P.s.무+=3;hurt(5,'낙마');return '두 계절을 함께 말을 탔다. 다리 안쪽이 다 벗겨지고 두 번 떨어졌다.'}},
     {l:'고향 유성의 소식을 수소문해 준다',st:'매',d:40,act:ok=>{if(ok){P.s.매+=2;return '그의 어미가 살아 있다는 소식이었다. 그는 말없이 술잔을 비웠다.'}P.fame=Math.max(0,P.fame-1);return '전해 들은 소식은 모두 죽었다는 것이었다. 그는 다시 찾아오지 않았다.'}}],
 to:()=>{P.wealth+=3;return '그는 문밖에 말 한 필을 매어 두고 갔다.'}},
{id:'f3_xinye_debt',when:()=>false,time:7,title:'신야의 외상',han:'償',hr:'상',
 text:()=>`${P.year>=214?'익주를 얻은':'형주 남쪽을 차지한'} 유비의 진영에서 사람이 왔다. 신야 시절 군량 외상값을 미축이 장부에 적어 두었다고 한다.`,
 ch:[{l:'갚는 돈을 받는다',act:()=>{const a=(P.tmp.q&&P.tmp.q.amt)||10;P.wealth+=a+5;P.fame+=2;return '외상값에 이자까지 쳐서 받았다. 유비가 사람을 잃지 않는 까닭을 알 것 같았다.'}},
     {l:'돈 대신 벼슬길을 청한다',st:'정',d:50,act:ok=>{const a=(P.tmp.q&&P.tmp.q.amt)||10;if(ok){setPath('관');moveTo(P.year>=214?'익주':'형주');P.fame+=5;return '미축의 천거로 말단 자리를 얻었다. 장부 보는 눈을 인정받았다.'}P.wealth+=a;return '빈자리는 없었다. 외상값만 받았다.'}},
     {l:'굶던 군사들에게 준 것이라며 사양한다',act:()=>{P.fame+=6;P.s.매+=3;return '"그 시절 굶던 군사들에게 준 것이오." 당신 이름이 유비 진영에 퍼졌다.'}}],
 to:()=>{const a=(P.tmp.q&&P.tmp.q.amt)||10;P.wealth+=Math.round(a/2);return '사자는 빚의 절반만 놓고 서둘러 떠났다.'}},
{id:'f3_yanguan_buyer',when:()=>false,time:7,title:'사염의 꼬리',han:'鹽',hr:'염',
 text:()=>{const q=P.tmp.q||{};return `사염을 받아 가던 ${jo(q.n||'큰손','이/가')} 염관에게 붙잡혔다. 매를 이기지 못하고 거래한 이들의 이름을 대고 있다고 한다.`},
 ch:[{l:'염관 군졸에게 뇌물을 쓴다',req:()=>P.wealth>=12,rq:'1만 2천 전 필요',p:.65,act:ok=>{P.wealth-=12;if(ok)return '당신 이름이 문서에서 지워졌다.';hurt(20,'염관의 형벌');return '뇌물을 받고도 군졸은 당신을 끌고 갔다.'}},
     {l:'먼저 자수하고 관염 장사로 돌아선다',st:'정',d:45,act:ok=>{if(ok){setPath('상');P.fame+=2;P.wealth=Math.max(0,P.wealth-6);return '벌금을 물고 관염 허가를 얻었다. 이문은 줄었지만 밤길은 끝났다.'}P.wealth=Math.floor(P.wealth*.5);hurt(15,'곤장');return '벌금에 곤장까지 맞았다.'}},
     {l:'산으로 몸을 피한다',act:()=>{setPath('적');const r=moveRandom();P.wealth=Math.floor(P.wealth*.7);return `밤에 집을 버리고 ${jo(r,'로')} 숨어들었다. 이제 쫓기는 몸이다.`}}],
 to:()=>{hurt(30,'염관의 형벌');P.wealth=Math.floor(P.wealth*.6);return '이름이 불린 날 군졸이 대문을 부쉈다.'}},
{id:'f3_huatuo_book',when:()=>false,time:7,title:'의서를 펴다',han:'醫',hr:'의',
 text:()=>'고을에 돌림병이 돈다. 허도 옥에서 받아 감춘 화타의 의서를 몰래 꺼내 펼쳐 본다.',
 ch:[{l:'책대로 이웃들을 치료한다',st:'지',d:50,act:ok=>{if(ok){P.fame+=8;P.s.매+=3;P.traits=P.traits||[];if(!P.traits.includes('의술'))P.traits.push('의술');later('f3_huatuo_pupil',rint(3,5),{n:mkName()});return '책에 적힌 대로 약을 달였다. 살아난 이웃들이 당신 집 문 앞에 쌀을 두고 갔다.'}hurt(25,'역병');return '병자들 곁을 지키다 당신도 열병에 걸렸다.'}},
     {l:'약방을 열어 처방을 판다',st:'정',d:45,act:ok=>{if(ok){P.wealth+=14;P.traits=P.traits||[];if(!P.traits.includes('의술'))P.traits.push('의술');return '처방 한 장에 비단 한 필을 받았다. 의원이라는 소리를 듣기 시작했다.'}P.wealth=Math.max(0,P.wealth-5);return '약재값만 들고 효험은 없었다. 책만 읽어서는 의원이 될 수 없었다.'}},
     {l:'화를 부를 책이라며 태운다',act:()=>{P.flags.medbook=0;P.s.지+=1;P.fame=Math.max(0,P.fame-1);return '불길 속에서 의원의 글씨가 말려 들어갔다. 이웃 몇이 그해 겨울을 넘기지 못했다.'}}],
 to:()=>{hurt(15,'역병');return '책을 펼치기도 전에 병이 집 안까지 들어왔다.'}},
{id:'f3_huatuo_pupil',when:()=>false,time:7,title:'제자',han:'徒',hr:'도',
 text:()=>{const q=P.tmp.q||{};return `돌림병 때 살린 집의 아들 ${jo(q.n||'소년','이/가')} 찾아와 의술을 배우겠다며 무릎을 꿇는다. 화타의 제자 오보와 번아도 그렇게 배웠다고 한다.`},
 ch:[{l:'책을 함께 읽으며 가르친다',act:()=>{P.fame+=5;P.s.지+=2;P.hp=Math.min(maxHp(),P.hp+10);return '함께 오금희를 익히며 몸도 가벼워졌다. 몇 해 뒤 그는 이웃 고을에서도 부르는 의원이 되었다.'}},
     {l:'책을 베껴 주고 떠나보낸다',act:()=>{P.s.매+=2;P.fame+=2;return '그는 베낀 책을 품고 남쪽으로 떠났다. 의원의 글이 하나 더 세상에 남았다.'}},
     {l:'거절하고 책을 감춘다',act:()=>{P.s.지+=1;P.s.매-=2;return '책은 당신 대에서 끝날 것이다. 소년은 울며 돌아갔다.'}}],
 to:()=>'대답을 미루는 사이 소년은 다른 의원을 찾아갔다.'},
{id:'f3_sijun_zhuge',when:()=>false,time:7,title:'성도의 부름',han:'蜀',hr:'촉',
 text:()=>'익주를 얻은 제갈량이 임증에서 장부를 맡았던 당신을 기억하고 성도로 부른다. 새 법을 만드는 데 손이 모자란다고 한다.',
 ch:[{l:'성도로 들어간다',act:()=>{moveTo('익주');setPath('관');P.rank=Math.max(P.rank,2);P.fame+=6;return '촉과(蜀科)를 만드는 일을 거들었다. 법정은 법이 너무 엄하다 했고 제갈량은 물러서지 않았다.'}},
     {l:'형주에 남아 관우 밑에서 일한다',st:'정',d:45,act:ok=>{setPath('관');if(ok){P.fame+=3;P.s.정+=2;return '형주 장부를 맡았다. 군량 셈은 언제나 모자랐다.'}P.fame=Math.max(0,P.fame-1);return '관우는 병졸에게는 후했지만 선비에게는 거만했다. 한직으로 밀려났다.'}},
     {l:'벼슬을 그만두고 고향에 머문다',act:()=>{setPath('민');P.wealth+=4;return '장부 대신 쟁기를 잡았다. 몇 해 뒤 형주가 손권에게 넘어갔다는 소식을 들었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-1);return '사자가 기다리다 돌아갔다.'}},
{id:'f3_tongque_again',when:()=>false,time:7,title:'누대를 또',han:'臺',hr:'대',
 text:()=>`동작대 처마를 다듬던 솜씨를 기억한 감독관이 다시 왔다. 이번에는 ${P.year<=213?'남쪽에 금호대':'북쪽에 빙정대'}를 세운다고 한다.`,
 ch:[{l:'도편수 자리를 맡는다',st:'지',d:50,act:ok=>{if(ok){P.wealth+=14;P.fame+=4;return '목수 수십을 부렸다. 누대가 서던 날 위공의 막료가 술을 내렸다.'}hurt(20,'추락');P.wealth+=3;return '비계가 무너졌다. 다리를 절며 품삯만 받았다.'}},
     {l:'제자들을 보내고 품삯을 나눈다',act:()=>{P.wealth+=6;P.s.매+=1;return '이름은 당신 것, 땀은 제자들 것이었다.'}},
     {l:'집안일을 핑계로 거절한다',act:()=>{P.s.지+=1;hurt(10,'부역');return '감독관이 언짢아했다. 그해 성 쌓는 부역 명단 맨 위에 당신 이름이 올랐다.'}}],
 to:()=>{hurt(10,'누대 부역');return '대답하기도 전에 연장 꾸러미를 들고 끌려갔다.'}},
{id:'f3_xiangshui_white',when:()=>false,time:7,title:'흰옷의 상인',han:'白',hr:'백',
 text:()=>'늦가을, 흰옷 입은 상인들이 큰 배를 옛 나루에 댄다. 노 젓는 손이 굳은살투성이고 배 밑창이 유난히 묵직하다.',
 ch:[{l:'모른 척 배를 대게 해 준다',act:()=>{P.wealth+=10;return '이튿날 강가의 봉화대가 하나씩 꺼졌다. 강릉과 공안이 싸움 없이 손권에게 넘어갔다.'}},
     {l:'관우의 봉화대에 알린다',st:'지',d:60,act:ok=>{if(ok){P.fame+=8;moveTo('익주');return '봉화를 올렸지만 형주를 구하지는 못했다. 서쪽으로 달아난 군사들과 함께 촉에 닿았다.'}hurt(35,'여몽군의 칼');return '배에서 뛰어내린 갑사들이 당신부터 묶었다.'}},
     {l:'상인들에게 길잡이를 자청한다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=8;P.fame+=3;return '여몽은 백성의 삿갓 하나 건드린 고향 사람도 베었다. 길잡이에게는 상이 후했다.'}hurt(15,'첩자 의심');return '첩자로 의심받아 배 밑창에 갇힌 채 강을 건넜다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-5);return '아침에 보니 나루가 갑사로 가득했다.'}},
{id:'f3_weiwang_plot',when:()=>false,time:7,title:'한실의 밀약',han:'密',hr:'밀',
 text:()=>{const q=P.tmp.q||{};return `한실을 그리던 당신 글을 베껴 읽은 ${jo(q.n||'선비','이/가')} 찾아왔다. "${P.year<=218?'허도의 경기·위황 공':'업의 위풍 공'}이 거사를 꾀하오. 이름 하나만 보태 주시오."`},
 ch:[{l:'이름을 올린다',p:.2,act:ok=>{if(ok){P.fame+=6;return '거사는 실패했다. 명단이 불에 타 당신 이름은 남지 않았다.'}hurt(50,'모반 연좌');setPath('민');P.fame=Math.max(0,P.fame-5);return '거사가 새어 나갔다. 수천 명이 연좌되었고 당신도 옥에 끌려갔다.'}},
     {l:'고변한다',act:()=>{const q=P.tmp.q||{};P.fame+=5;P.wealth+=8;P.s.매-=4;later('f3_weiwang_grudge',rint(3,6),{n:q.n||'그 선비'});return `거사 전날 밀고했다. 붙잡힌 이들 가운데 ${q.n||'그 선비'}의 얼굴도 있었다. 상이 내렸다.`}},
     {l:'편지를 태우고 문을 닫는다',st:'지',d:45,act:ok=>{if(ok){P.s.지+=2;return '며칠 뒤 거사가 무너졌다. 당신 집 대문은 끝내 두드려지지 않았다.'}hurt(20,'옥사');P.fame=Math.max(0,P.fame-3);return '찾아온 자를 본 이웃이 있었다. 한 달 동안 문초를 받았다.'}}],
 to:()=>{hurt(25,'옥사');return '머뭇거리는 사이 거사가 터졌다. 오간 자 명단에 당신 이름도 있었다.'}},
{id:'f3_weiwang_grudge',when:()=>false,time:7,title:'고변의 그림자',han:'影',hr:'영',
 text:()=>{const q=P.tmp.q||{};return `당신의 밀고로 죽은 ${q.n||'그 선비'}의 아들이 장성해 고을에 나타났다. 아버지를 판 사람을 찾는다고 한다.`},
 ch:[{l:'찾아가 무릎을 꿇는다',st:'매',d:55,act:ok=>{if(ok){P.s.매+=3;P.fame+=2;return '젊은이는 칼을 뽑았다가 도로 넣었다. "아버지도 원망하지 말라 하셨소." 그는 떠났다.'}hurt(30,'원수의 칼');return '젊은이의 칼이 어깨를 갈랐다.'}},
     {l:'관에 알려 그를 잡게 한다',st:'정',d:45,act:ok=>{if(ok){P.fame+=1;P.s.매-=3;return '역적의 자식이라 하자 관리들이 곧 그를 잡아갔다. 당신은 또 한 사람을 팔았다.'}hurt(20,'원수의 칼');return '관리들이 오기 전에 그가 먼저 왔다.'}},
     {l:'고을을 떠난다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.8);return `${jo(r,'로')} 집을 옮겼다. 밤마다 대문 빗장을 두 번씩 확인했다.`}}],
 to:()=>{hurt(25,'원수의 칼');return '어느 장날 사람들 틈에서 칼이 들어왔다.'}},
{id:'f3_fancheng_yujin',when:()=>false,time:7,title:'돌아온 포로',han:'歸',hr:'귀',
 text:()=>'손권이 위에 신하를 칭하며 우금과 항복한 군사들을 돌려보낸다고 한다. 수염과 머리가 하얗게 센 우금이 배에 오른다.',
 ch:[{l:'우금을 따라 위로 돌아간다',act:()=>{moveTo('예주');setPath('군');P.fame=Math.max(0,P.fame-2);later('f3_fancheng_painting',1,{});return '조비는 우금을 안원장군에 봉했다. 그러나 항복한 장수를 보는 눈길은 차가웠다.'}},
     {l:'오에 남아 둔전에 이름을 올린다',act:()=>{moveTo('양주');setPath('민');P.wealth+=3;return '강동 둔전에 이름을 올렸다. 북쪽 고향 이야기는 꺼내지 않았다.'}},
     {l:'오군에 들어간다',st:'무',d:45,act:ok=>{moveTo('양주');setPath('군');if(ok){P.fame+=4;return '오의 군적에 이름을 올렸다. 위군 포로 출신이라 늘 앞줄에 섰다.'}hurt(20,'고된 군역');return '항졸 출신이라 고된 일만 돌아왔다.'}}],
 to:()=>{moveTo('양주');return '배가 떠난 뒤에야 나루에 닿았다. 오에 남게 되었다.'}},
{id:'f3_fancheng_painting',when:()=>false,time:7,title:'고릉의 그림',han:'畵',hr:'화',
 text:()=>'조비가 우금을 업의 고릉에 보내 조조의 무덤에 절하게 했다. 능 안 벽에는 관우가 이기고 방덕이 성내며 우금이 항복하는 그림이 있다.',
 ch:[{l:'우금 곁을 지킨다',act:()=>{P.s.매+=2;P.fame+=1;return '우금은 그림을 보고 부끄러움과 분을 이기지 못해 앓아누웠다. 곁에서 죽을 떠먹였지만 그는 곧 세상을 떠났다.'}},
     {l:'방덕의 아들들을 찾아간다',st:'매',d:50,act:ok=>{if(ok){P.fame+=5;return '방회 형제에게 둑 위의 마지막 날을 들려주었다. 형제는 당신을 손님으로 대했다.'}P.fame=Math.max(0,P.fame-3);return '항복한 자가 무슨 낯으로 왔느냐며 문전박대를 당했다.'}},
     {l:'그 길로 군적을 떠난다',act:()=>{setPath('민');P.wealth+=4;return '그림 속 항복한 군사들 가운데 당신도 있었다. 다시는 칼을 잡지 않았다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '그림 앞에서 고개를 들지 못했다.'}},
{id:'f3_jiupin_gift',when:()=>false,time:7,title:'중정관의 몰락',han:'劾',hr:'핵',
 text:()=>{const q=P.tmp.q||{};return `좋은 품을 매겨 주었던 중정관 ${jo(q.n||'아무개','이/가')} 탄핵을 받았다. 그 집에서 나온 예물 장부에 당신 이름도 적혀 있다.`},
 ch:[{l:'받은 품을 스스로 내려놓는다',act:()=>{P.fame=Math.max(0,P.fame-3);P.s.매+=3;return '스스로 품을 낮춰 달라 청했다. 비웃는 이도 있고 칭찬하는 이도 있었다.'}},
     {l:'그저 인사였다고 버틴다',st:'정',d:50,act:ok=>{if(ok){P.s.정+=1;return '예물은 다들 보냈다는 것이 드러났다. 장부는 덮였다.'}P.fame=Math.max(0,P.fame-6);if(P.path==='관')setPath('민');return '품이 깎이고 벼슬길이 막혔다.'}},
     {l:'새 중정관에게 다시 예물을 보낸다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',p:.5,act:ok=>{P.wealth-=15;if(ok){P.fame+=3;return '새 중정관도 예물을 마다하지 않았다. 품이 그대로 남았다.'}P.fame=Math.max(0,P.fame-4);return '이번 중정관은 깐깐했다. 예물을 돌려보내며 장부에 적었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-4);return '해명할 기회도 없이 품이 한 단계 깎였다.'}},
{id:'f3_wuzhu_dig',when:()=>false,time:7,title:'묻어 둔 동전',han:'甕',hr:'옹',
 text:()=>'조정이 오수전을 다시 쓰게 했다. 몇 해 전 뒷마당에 묻은 동전 항아리가 생각났다.',
 ch:[{l:'항아리를 파낸다',p:.7,act:ok=>{const a=(P.tmp.q&&P.tmp.q.amt)||5;if(ok){P.wealth+=a*2;return '녹은 슬었지만 동전은 동전이었다. 묻을 때보다 값이 올라 있었다.'}P.wealth+=Math.round(a/2);return '항아리가 깨져 있었다. 누군가 먼저 다녀간 듯했다.'}},
     {l:'파낸 동전으로 묵은 밭을 산다',st:'정',d:45,act:ok=>{const a=(P.tmp.q&&P.tmp.q.amt)||5;if(ok){P.wealth+=Math.round(a*2.5);P.fame+=2;return '이웃들은 아직 곡식만 쥐고 있었다. 묵은 밭 몇 마지기를 헐값에 샀다.'}P.wealth+=a;return '밭 주인이 값을 곡식으로 달라 했다. 동전은 그대로 남았다.'}},
     {l:'자식 몫으로 그대로 묻어 둔다',act:()=>{const a=(P.tmp.q&&P.tmp.q.amt)||5;P.flags.buried=(P.flags.buried||0)+a;P.s.지+=1;return '항아리를 다시 덮었다. 언젠가 자식들이 파낼 것이다.'}}],
 to:()=>{const a=(P.tmp.q&&P.tmp.q.amt)||5;P.wealth+=a;return '정신을 차려 보니 아이들이 벌써 마당을 파헤쳐 놓았다.'}},
{id:'f3_corvee_mate',when:()=>false,time:7,title:'부역 동무',han:'伴',hr:'반',
 text:()=>{const q=P.tmp.q||{};return `${q.work||'부역'}에서 함께 흙짐을 졌던 ${jo(q.n||'옛 동무','이/가')} 찾아왔다. 흉년에 식구가 굶는다며 곡식을 꾸어 달라 한다.`},
 ch:[{l:'곡식을 넉넉히 꾸어 준다',req:()=>P.wealth>=6,rq:'6천 전 필요',act:()=>{const q=P.tmp.q||{};P.wealth-=6;later('f3_corvee_repay',rint(2,4),{n:q.n||'옛 동무'});return '쌀 두 섬을 지워 보냈다. 그는 몇 번이고 돌아보며 절했다.'}},
     {l:'보리 한 말만 쥐여 보낸다',act:()=>{P.wealth=Math.max(0,P.wealth-2);return '그도 더 말하지 않았다. 문을 나서는 등이 굽어 있었다.'}},
     {l:'나도 형편이 어렵다며 돌려보낸다',act:()=>{P.s.매-=2;return '그는 고개를 끄덕이고 돌아섰다. 그 뒤로 장터에서 마주쳐도 눈을 피했다.'}}],
 to:()=>{P.s.매-=1;return '대답을 망설이는 사이 그는 말없이 떠났다.'}},
{id:'f3_corvee_repay',when:()=>false,time:7,title:'갚으러 온 사람',han:'報',hr:'보',
 text:()=>{const q=P.tmp.q||{};P.tmp.g=R()<.6;return P.tmp.g?`${jo(q.n||'옛 동무','이/가')} 수레 가득 곡식을 싣고 왔다. "그때 쌀 두 섬이 우리 식구를 살렸소."`:`${jo(q.n||'옛 동무','이/가')} 빈손으로 찾아왔다. 밭을 호족에게 넘기고 떠돌게 되었다며 하룻밤만 재워 달라 한다.`},
 ch:[{l:'고맙게 받는다',req:()=>P.tmp.g,rq:'곡식을 싣고 왔을 때만',act:()=>{P.wealth+=10;P.s.매+=2;return '꾸어 준 것의 두 배였다. 그해 겨울 두 집이 함께 제사를 지냈다.'}},
     {l:'반만 받고 나머지는 돌려준다',req:()=>P.tmp.g,rq:'곡식을 싣고 왔을 때만',act:()=>{P.wealth+=5;P.fame+=3;return '고을에 두 사람 이야기가 퍼졌다.'}},
     {l:'집에 머물게 하고 일손으로 쓴다',req:()=>!P.tmp.g,rq:'빈손으로 왔을 때만',act:()=>{P.wealth+=5;P.s.매+=2;return '그는 머슴처럼 일했다. 이듬해 당신 밭의 소출이 늘었다.'}},
     {l:'빚은 잊으라며 노자를 쥐여 준다',req:()=>!P.tmp.g,rq:'빈손으로 왔을 때만',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.fame+=3;P.s.매+=3;return '그는 울며 떠났다. 몇 해 뒤 먼 고을에서 자리 잡았다는 말을 들었다.'}},
     {l:'문을 닫아건다',act:()=>{P.s.매-=3;return '대문 밖에서 한참 인기척이 나다 멎었다.'}}],
 to:()=>{P.wealth+=2;return '그는 문 앞에 무언가를 두고 갔다.'}},
{id:'f3_grave_robbed',when:()=>false,time:7,title:'파헤친 무덤',han:'盜',hr:'도',
 text:()=>'아버지 무덤이 파헤쳐졌다. 함께 묻은 옥 장식이 사라지고 관 뚜껑이 열려 있다.',
 ch:[{l:'도굴꾼을 쫓는다',st:'무',d:50,act:ok=>{if(ok){P.fame+=4;P.wealth+=5;return '장터에서 옥을 팔려던 자를 붙잡았다. 옥 장식을 되찾았다.'}hurt(20,'도굴꾼의 칼');return '어두운 무덤가에서 도굴꾼 패거리와 맞닥뜨렸다.'}},
     {l:'관에 고발한다',st:'정',d:45,act:ok=>{if(ok){P.fame+=2;return '현리가 도굴꾼 일당을 잡아 저잣거리에서 매질했다.'}P.wealth=Math.max(0,P.wealth-3);return '현리는 수고비만 받고 움직이지 않았다.'}},
     {l:'조용히 다시 묻고 봉분을 낮춘다',act:()=>{P.s.지+=2;P.wealth=Math.max(0,P.wealth-2);return '이번에는 아무것도 넣지 않았다. 장례는 검소한 것이 낫다는 옛말을 곱씹었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '손쓸 틈도 없이 소문이 퍼졌다. 친척들이 당신을 탓했다.'}},
{id:'f3_salt_boss',when:()=>false,time:7,title:'소금 배',han:'舟',hr:'주',
 text:()=>{const q=P.tmp.q||{};return `밀염 짐을 대 주던 ${jo(q.n||'소금 두목','이/가')} 판을 키우자 한다. 바닷가에서 배 한 척 가득 소금을 싣고 강을 거슬러 오르자는 것이다.`},
 ch:[{l:'밑천을 대고 배에 오른다',req:()=>P.wealth>=10,rq:'1만 전 필요',st:'지',d:55,act:ok=>{const q=P.tmp.q||{};if(ok){P.wealth+=25;later('f3_salt_crackdown',rint(2,3),{n:q.n||'소금 두목'});return '배 한 척이 집 한 채가 되었다. 강가 나루마다 당신 이름을 아는 이가 생겼다.'}P.wealth=Math.max(0,P.wealth-10);hurt(20,'관선의 화살');return '관선에 쫓겨 소금을 강에 쏟아부었다.'}},
     {l:'짐꾼으로만 따라간다',p:.7,act:ok=>{if(ok){P.wealth+=8;return '품삯은 짐 무게만큼이었다.'}hurt(15,'뱃길');return '배가 여울에 걸려 소금 짐에 깔렸다.'}},
     {l:'이쯤에서 손을 씻는다',act:()=>{P.s.정+=1;P.s.지+=1;return '번 돈으로 밭을 샀다. 그는 혀를 차며 다른 사람을 찾아갔다.'}}],
 to:()=>'그는 대답을 기다리다 떠났다.'},
{id:'f3_salt_crackdown',when:()=>false,time:7,title:'염관의 그물',han:'網',hr:'망',
 text:()=>{const q=P.tmp.q||{};return `${jo(q.n||'소금 두목','이/가')} 염관에게 붙잡혔다. 배와 장부가 함께 넘어갔다는 소문이다. 장부에는 당신 몫도 적혀 있다.`},
 ch:[{l:'옥리에게 뇌물을 써서 그를 빼낸다',req:()=>P.wealth>=20,rq:'2만 전 필요',st:'매',d:50,act:ok=>{P.wealth-=20;if(ok){P.fame+=5;P.s.매+=3;return '그가 풀려났다. "이 은혜는 잊지 않겠소." 그는 강남으로 떠났다.'}hurt(25,'염관의 형벌');return '뇌물 쓴 일까지 들통났다. 함께 묶여 매를 맞았다.'}},
     {l:'장부를 빼돌려 태운다',st:'지',d:55,act:ok=>{if(ok){P.s.매-=2;return '불에 탄 장부와 함께 당신 이름도 사라졌다. 그는 홀로 죄를 졌다.'}hurt(30,'염관의 형벌');P.wealth=Math.floor(P.wealth*.4);return '불을 지르다 붙잡혔다. 재산 대부분을 몰수당했다.'}},
     {l:'번 돈을 챙겨 멀리 달아난다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.7);setPath('상');return `소금 배로 번 돈을 지고 ${jo(r,'로')} 갔다. 다시는 소금에 손대지 않았다.`}}],
 to:()=>{hurt(30,'염관의 형벌');P.wealth=Math.floor(P.wealth*.5);return '군졸이 대문을 부수고 들어왔다.'}},
{id:'f3_salt_revenge',when:()=>false,time:7,title:'밀고의 값',han:'刃',hr:'인',
 text:()=>'몇 해 전 당신이 밀고한 밀염꾼 하나가 풀려났다고 한다. 밤길에 누가 뒤를 밟는 기척이 있다.',
 ch:[{l:'먼저 찾아가 술을 산다',st:'매',d:50,act:ok=>{if(ok){P.s.매+=2;P.wealth=Math.max(0,P.wealth-2);return '"그때는 다들 살려고 한 짓이지." 그가 잔을 받았다.'}hurt(25,'밀염꾼의 칼');return '술잔이 엎어지고 칼이 나왔다.'}},
     {l:'장정을 사서 몸을 지킨다',req:()=>P.wealth>=8,rq:'8천 전 필요',act:()=>{P.wealth-=8;return '장정 둘을 곁에 두고 한 계절을 보냈다. 그 사이 그는 다른 고을로 떠났다.'}},
     {l:'관에 다시 알린다',st:'정',d:45,act:ok=>{if(ok){P.fame+=2;P.s.매-=1;return '그는 다시 잡혀갔다. 원한은 한 겹 더 쌓였다.'}hurt(20,'밀염꾼의 칼');return '관이 움직이기 전에 그가 먼저 움직였다.'}}],
 to:()=>{hurt(20,'밀염꾼의 몽둥이');return '어두운 골목에서 몽둥이가 날아왔다.'}},
{id:'f3_guosuo_son',when:()=>false,time:7,title:'과소의 아이',han:'印',hr:'인',
 text:()=>{const q=P.tmp.q||{};return `낯선 젊은이가 찾아와 절을 한다. "${q.n||'그 집 막내'}입니다. 그때 써 주신 과소 한 장으로 저희 식구가 살았습니다."`},
 ch:[{l:'사정을 묻고 힘이 되어 준다',act:()=>{P.fame+=4;P.s.매+=2;P.wealth+=4;return '그는 먼 고을에 땅을 일궈 자리를 잡았다고 했다. 해마다 햇곡식을 보내왔다.'}},
     {l:'함께 일하자고 붙잡는다',st:'통',d:45,act:ok=>{if(ok){P.wealth+=8;P.fame+=2;return '그는 셈이 밝고 입이 무거웠다. 당신의 오른팔이 되었다.'}P.wealth+=2;return '그는 고향 땅에 묻힌 아비 곁으로 돌아가겠다며 떠났다.'}},
     {l:'그런 일은 없었다며 돌려보낸다',act:()=>{P.s.지+=2;P.s.매-=1;return '과소 위조는 아직도 죄였다. 젊은이는 영문을 모른 채 돌아갔다.'}}],
 to:()=>{P.wealth+=3;return '그는 문 앞에 햇곡식 한 자루를 두고 갔다.'}},
{id:'f3_guosuo_audit',when:()=>false,time:7,title:'관인 장부',han:'簿',hr:'부',
 text:()=>'감찰관이 관문의 과소 원장을 대조한다. 몇 해 전 비단 두 필을 받고 써 준 과소 한 장이 원장과 맞지 않는다.',
 ch:[{l:'서리의 실수로 돌린다',st:'지',d:55,act:ok=>{if(ok){P.s.매-=2;return '서리 하나가 곤장을 맞았다. 당신 이름은 장부 밖으로 빠졌다.'}hurt(20,'문책');P.fame=Math.max(0,P.fame-6);return '서리가 당신을 가리켰다. 곤장을 맞고 녹봉을 깎였다.'}},
     {l:'받은 비단을 내놓고 죄를 청한다',act:()=>{P.wealth=Math.max(0,P.wealth-12);P.fame=Math.max(0,P.fame-2);P.flags.corrupt=0;return '벌은 가벼웠다. 장부의 흔적도 지워졌다.'}},
     {l:'감찰관에게 비단 넉 필을 보낸다',req:()=>P.wealth>=12,rq:'1만 2천 전 필요',p:.5,act:ok=>{P.wealth-=12;if(ok)return '감찰관은 장부를 덮었다. 받은 비단 두 필이 넉 필이 되어 나갔다.';setPath('민');hurt(15,'문책');return '감찰관은 비단과 함께 당신을 고발했다. 관직을 잃었다.'}}],
 to:()=>{hurt(10,'문책');P.fame=Math.max(0,P.fame-4);return '해명을 미루다 장부가 위로 올라갔다.'}},
{id:'f3_heir_second',when:()=>false,time:7,title:'오른팔의 자리',han:'寨',hr:'채',
 text:()=>{const q=P.tmp.q||{};return `두목 ${jo(q.n||'둘째','이/가')} 관의 사면령을 받고 산을 내려가려 한다며 함께 가자고 사람을 보냈다. 졸개들은 "오른팔의 목을 선물로 바친다더라" 수군댄다.`},
 ch:[{l:'함께 산을 내려가 투항한다',p:.6,act:ok=>{if(ok){setPath('민');P.wealth+=4;return '사면은 진짜였다. 둘 다 호적에 이름을 올리고 묵은 밭을 받았다.'}hurt(35,'관군의 칼');return '관청 앞에서 당신만 묶였다. 소문이 맞았다.'}},
     {l:'먼저 두목을 치고 산채를 차지한다',req:()=>P.path==='적',rq:'도적만',st:'통',d:55,act:ok=>{if(ok){P.fame+=10;P.wealth+=10;return '그를 쓰러뜨리고 두목의 칼을 쥐었다. 졸개들이 무릎을 꿇었다.'}hurt(40,'두목의 칼');return '그가 먼저 알고 기다리고 있었다.'}},
     {l:'졸개 몇을 데리고 따로 산채를 연다',req:()=>P.path==='적',rq:'도적만',st:'매',d:45,act:ok=>{if(ok){P.fame+=5;P.wealth+=4;return '골짜기 하나 너머에 새 산채를 세웠다. 따라온 이는 열둘이었다.'}setPath('민');return '따라오겠다던 졸개들이 아무도 오지 않았다. 홀로 산을 내려왔다.'}},
     {l:'사자를 돌려보내고 인연을 끊는다',req:()=>P.path!=='적',rq:'산채를 떠난 사람만',act:()=>{P.s.지+=1;P.wealth=Math.max(0,P.wealth-2);return '사자에게 노잣돈을 쥐여 돌려보냈다. 옛 산채 이야기는 다시 꺼내지 않았다.'}}],
 to:()=>{hurt(25,'졸개들의 몽둥이');return '밤중에 졸개들이 움막을 덮쳤다.'}},
{id:'e_watergate',w:()=>P.gun&&gunState(P.gun,P.year).harvest==='흉년'?6:3,cd:6,season:1,when:()=>P.year>=160&&P.year<=260&&P.path==='민'&&P.age>=16,time:6,title:'물꼬 다툼',han:'渠',hr:'거',
 text:()=>{P.tmp.n=mkName();return `가물어 봇물이 줄었다. 윗논 ${jo(P.tmp.n,'이/가')} 물꼬를 막아 당신 논에는 물이 한 방울도 내려오지 않는다.`},
 say:()=>[P.tmp.n,'우리 논부터 살아야 할 것 아닌가.'],
 ch:[{l:'밤에 몰래 물꼬를 튼다',st:'지',d:45,act:ok=>{if(ok){P.wealth+=5;later('e_f_water_feud',rint(2,4),{n:P.tmp.n});return '새벽까지 물을 대었다. 아침에 윗논 사람이 터진 둑을 보고 이를 갈았다.'}hurt(15,'물꼬 싸움의 삽자루');return '물꼬를 트다 들켜 삽자루로 얻어맞았다.'}},
     {l:'삼로에게 중재를 청한다',st:'정',d:45,act:ok=>{if(ok){P.wealth+=3;P.s.정+=1;return '삼로가 사흘씩 번갈아 물을 대라고 정해 주었다.'}P.s.매-=1;return '삼로는 윗논 집과 사돈 사이였다. 물은 여전히 오지 않았다.'}},
     {l:'올해는 물을 양보한다',act:()=>{P.wealth=Math.max(0,P.wealth-4);P.s.매+=2;later('e_f_water_repay',rint(2,5),{n:P.tmp.n});return '논 절반이 말라 갈라졌다. 윗논 사람은 고개를 들지 못했다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-4);return '머뭇거리는 사이 벼 잎이 노랗게 말랐다.'}},
{id:'e_f_water_feud',w:1,when:()=>false,time:7,title:'묵은 원한',han:'怨',hr:'원',
 text:()=>`${jo(P.tmp.q.n,'이/가')} 몇 해 전 물꼬 일을 잊지 않았다. 그 아들들이 당신 집 앞을 지나며 침을 뱉는다.`,
 ch:[{l:'술 한 동이를 들고 사과하러 간다',st:'매',d:45,act:ok=>{P.wealth=Math.max(0,P.wealth-2);if(ok){P.s.매+=2;return '늦은 사과였지만 받아들여졌다. 그 집과 다시 품앗이를 하게 되었다.'}later('e_f_water_fire',rint(1,3),{n:P.tmp.q.n});return '술동이가 마당에 내던져졌다.'}},
     {l:'몽둥이를 들고 맞선다',st:'무',d:50,act:ok=>{if(ok){P.s.무+=2;P.fame+=2;return '그 집 장남을 때려눕혔다. 마을에서 당신을 건드리는 이가 없어졌다.'}hurt(25,'이웃과의 싸움');later('e_f_water_fire',rint(1,3),{n:P.tmp.q.n});return '셋에게 둘러싸여 실컷 맞았다.'}},
     {l:'못 본 척 참는다',act:()=>{P.s.매-=1;later('e_f_water_fire',rint(2,4),{n:P.tmp.q.n});return '참았다. 원한은 삭지 않고 가라앉았을 뿐이다.'}}],
 to:()=>{later('e_f_water_fire',rint(2,4),{n:P.tmp.q.n});return '말 한마디 못 하고 지나갔다.'}},
{id:'e_f_water_fire',w:1,when:()=>false,time:6,title:'한밤의 불',han:'火',hr:'화',
 text:()=>`한밤에 곳간 쪽이 환하다. 불길 너머로 ${P.tmp.q.n}네 아들이 달아나는 뒷모습이 보였다.`,
 ch:[{l:'불부터 끈다',st:'무',d:45,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-3);return '이웃들과 물동이를 날라 곳간 반쪽을 살렸다.'}P.wealth=Math.floor(P.wealth*.6);hurt(15,'불길');return '곳간이 통째로 탔다. 손에 화상을 입었다.'}},
     {l:'현의 정장에게 고발한다',st:'정',d:50,act:ok=>{P.wealth=Math.max(0,P.wealth-4);if(ok){P.fame+=3;return `${P.tmp.q.n}네 아들이 곤장을 맞고 부역에 끌려갔다. 원한은 거기서 끝났다.`}return '증인이 없다며 고발이 물려졌다. 그 집은 보란 듯이 웃었다.'}},
     {l:'그 집 볏가리에 똑같이 불을 놓는다',st:'지',d:50,act:ok=>{P.wealth=Math.max(0,P.wealth-4);if(ok){P.s.매-=3;return '두 집 곳간이 모두 재가 되었다. 그 집은 이듬해 다른 고을로 떠났다.'}hurt(30,'방화죄의 곤장');P.fame=Math.max(0,P.fame-5);return '현리에게 붙잡혀 당신만 방화범이 되었다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.5);return '불길이 곳간을 다 삼켰다.'}},
{id:'e_f_water_repay',w:1,when:()=>false,time:6,title:'갚은 물',han:'報',hr:'보',
 text:()=>`그때 물을 양보받았던 ${jo(P.tmp.q.n,'이/가')} 찾아왔다. 올해는 자기 논이 남는다며 무엇이든 돕겠다고 한다.`,
 ch:[{l:'소를 빌려 달라고 한다',act:()=>{P.wealth+=5;return '그 집 소로 남의 집보다 열흘 먼저 밭을 갈았다.'}},
     {l:'딸이나 아들 혼사를 넌지시 꺼낸다',req:()=>(P.kids||[]).some(c=>c.alive&&P.year-c.b>=14),rq:'혼기 찬 자식이 있을 때만',act:()=>{P.s.매+=2;P.wealth+=3;return '두 집이 사돈을 맺기로 했다. 물길도 한 집 것이 되었다.'}},
     {l:'됐다며 사양한다',act:()=>{P.fame+=3;return '마을에 당신이 군자라는 말이 돌았다.'}}],
 to:()=>{P.s.매+=1;return '그는 쌀 한 말을 두고 갔다.'}},
{id:'e_oxthief',w:4,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='민'&&P.age>=16,time:6,title:'소도둑',han:'牛',hr:'우',
 text:()=>{P.tmp.n=mkName();return `새벽에 외양간에서 소를 끌고 나가던 자를 붙잡았다. 뼈만 남은 열여섯 살 ${P.tmp.n}다. 어머니가 사흘째 굶는다고 한다.`},
 ch:[{l:'좁쌀 한 자루를 주어 보낸다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=2;later('e_f_oxthief_back',rint(4,8),{n:P.tmp.n});return '소년은 몇 번이고 절을 하고 산을 내려갔다.'}},
     {l:'정장에게 끌고 간다',act:()=>{P.fame+=1;later('e_f_oxthief_grudge',rint(4,8),{n:P.tmp.n});return '소년은 곤장 서른 대를 맞고 부역에 넘겨졌다.'}},
     {l:'일을 시켜 소 값을 치르게 한다',st:'통',d:40,act:ok=>{if(ok){P.wealth+=4;later('e_f_oxthief_back',rint(4,8),{n:P.tmp.n});return '소년은 한 해 동안 당신 밭을 갈았다. 떠날 때 큰절을 했다.'}P.wealth=Math.max(0,P.wealth-3);return '소년은 사흘 만에 닭 두 마리를 들고 달아났다.'}}],
 to:()=>'소년은 틈을 타 달아났다. 소는 되찾았다.'},
{id:'e_f_oxthief_back',w:1,when:()=>false,time:6,title:'돌아온 소년',han:'恩',hr:'은',
 text:()=>`말 탄 사내가 집 앞에 섰다. 옛날 소를 훔쳤던 ${P.tmp.q.n}이다. 지금은 어느 장수 밑의 군관이라 한다.`,
 say:()=>[P.tmp.q.n,'그때 좁쌀 한 자루로 어머니가 사셨습니다.'],
 ch:[{l:'그가 내미는 비단을 받는다',act:()=>{P.wealth+=12;return '비단 세 필이었다. 소 열 마리 값이었다.'}},
     {l:'자식 하나를 그 밑에 맡긴다',req:()=>(P.kids||[]).some(c=>c.alive&&c.sex==='m'&&P.year-c.b>=15),rq:'장성한 아들이 있을 때만',act:()=>{const c=P.kids.find(c=>c.alive&&c.sex==='m'&&P.year-c.b>=15);c.path='군';P.s.매+=2;return `아들 ${jo(c.n,'이/가')} 그를 따라 군문에 들어갔다.`}},
     {l:'그를 따라 군에 들어간다',req:()=>P.age<=40&&P.path!=='군',rq:'마흔 이하만',act:()=>{setPath('군');P.rank=1;return '그의 천거로 오장 자리를 받았다.'}}],
 to:()=>{P.wealth+=5;return '그는 돈꿰미를 마루에 두고 떠났다.'}},
{id:'e_f_oxthief_grudge',w:1,when:()=>false,time:6,title:'고갯길의 얼굴',han:'讎',hr:'수',
 text:()=>`고갯길에서 칼 찬 무리가 길을 막았다. 앞장선 자의 얼굴이 낯익다. 그때 소도둑 ${P.tmp.q.n}이다.`,
 say:()=>[P.tmp.q.n,'곤장 서른 대, 기억하시오?'],
 ch:[{l:'그때 일을 사과한다',st:'매',d:50,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-3);return '그는 한참 노려보다 짐 하나만 빼앗고 보내 주었다.'}P.wealth=Math.floor(P.wealth*.5);hurt(20,'도적의 매');return '빈말로 들렸다. 가진 것을 다 털리고 맞았다.'}},
     {l:'몸을 날려 달아난다',st:'무',d:50,act:ok=>{if(ok)return '비탈을 굴러 숲으로 빠져나갔다.';hurt(35,'도적의 칼');return '등에 칼을 맞았다.'}},
     {l:'가진 것을 다 내놓는다',act:()=>{P.wealth=Math.floor(P.wealth*.4);return '그는 돈을 세어 보더니 침을 뱉고 사라졌다.'}}],
 to:()=>{hurt(25,'도적의 몽둥이');P.wealth=Math.floor(P.wealth*.5);return '대답도 못 하고 얻어맞았다.'}},
{id:'e_landdeed',w:4,once:1,when:()=>P.year>=160&&P.year<=260&&P.path==='민'&&P.age>=20,time:7,title:'땅 문서',han:'券',hr:'권',
 text:()=>{P.tmp.n=pick(SURN)+'씨';return `호족 ${P.tmp.n} 집 가노가 문서를 흔든다. 당신 밭이 할아버지 때 그 집에 팔렸다는 매매 문서다.`},
 ch:[{l:'현에 소송을 건다',st:'정',d:55,act:ok=>{P.wealth=Math.max(0,P.wealth-4);if(ok){P.fame+=5;later('e_f_deed_revenge',rint(2,4),{n:P.tmp.n});return '현령이 문서의 날짜가 새 율령보다 늦은 것을 짚어 냈다. 밭을 지켰다.'}P.wealth=Math.floor(P.wealth*.6);return '현령은 호족 편이었다. 밭이 넘어갔다.'}},
     {l:'옛 문서를 꾸며 맞선다',req:()=>P.s.지>=8||P.focus==='study',rq:'지력 8 이상이거나 학문에 힘쓸 때만',st:'지',d:45,act:ok=>{if(ok){P.wealth+=4;later('e_f_deed_exposed',rint(3,6),{n:P.tmp.n});return '더 오래된 것처럼 그을린 문서를 내밀었다. 가노가 물러갔다.'}hurt(20,'위조죄의 곤장');P.wealth=Math.floor(P.wealth*.5);return '먹이 덜 말라 있었다. 곤장을 맞고 밭도 잃었다.'}},
     {l:'밭을 넘기고 소작인이 된다',act:()=>{P.wealth=Math.floor(P.wealth*.6);P.s.매+=1;return '내 밭에서 남의 곡식을 거두게 되었다. 수확의 절반이 그 집으로 갔다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.6);return '답을 못 하는 사이 가노들이 말뚝을 박았다.'}},
{id:'e_f_deed_revenge',w:1,when:()=>false,time:6,title:'호족의 보복',han:'報',hr:'보',
 text:()=>`부역 명단 맨 위에 당신 이름이 있다. ${P.tmp.q.n} 집안이 향리를 움직였다는 말이 돈다.`,
 ch:[{l:'묵묵히 부역에 나간다',st:'무',d:45,act:ok=>{if(ok){P.s.무+=2;return '먼 변경 성벽 공사였다. 살아서 돌아왔다.'}hurt(30,'변경 부역');return '변경의 겨울에 발가락 둘을 잃었다.'}},
     {l:'마을 사람들을 모아 연명장을 쓴다',st:'매',d:50,act:ok=>{if(ok){P.fame+=6;return '스무 집이 이름을 올렸다. 향리가 슬그머니 명단을 고쳤다.'}P.s.매-=1;return '다들 호족 눈치를 보며 이름을 빼 달라 했다.'}},
     {l:'고향을 버리고 떠난다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.5);return `지킨 밭을 헐값에 팔고 ${jo(r,'로')} 떠났다.`}}],
 to:()=>{hurt(20,'부역');return '끌려가듯 부역에 나갔다.'}},
{id:'e_f_deed_exposed',w:1,when:()=>false,time:6,title:'들통난 문서',han:'僞',hr:'위',
 text:()=>`${P.tmp.q.n} 집안이 낙양에서 서리 하나를 데려왔다. 그가 그때 당신 문서의 종이가 요즘 것이라 짚었다.`,
 ch:[{l:'끝까지 진짜라고 우긴다',st:'정',d:60,act:ok=>{if(ok){P.s.정+=2;return '서리도 확신하지 못했다. 일은 흐지부지되었다.'}hurt(30,'위조죄의 곤장');P.wealth=Math.floor(P.wealth*.4);P.fame=Math.max(0,P.fame-6);return '곤장과 함께 밭도 이름도 잃었다.'}},
     {l:'뒷돈으로 덮는다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=18;return '서리는 돈을 받고 눈이 침침하다며 돌아갔다.'}},
     {l:'밭을 넘기고 죄를 면한다',act:()=>{P.wealth=Math.floor(P.wealth*.5);return '밭을 내주는 대신 고발은 없던 일이 되었다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.5);P.fame=Math.max(0,P.fame-4);return '말이 막혀 그대로 죄가 되었다.'}},
{id:'e_neighborwed',w:4,cd:6,when:()=>P.year>=160&&P.year<=260&&['민','상'].includes(P.path)&&P.age>=18,time:6,title:'이웃 혼사',han:'婚',hr:'혼',
 text:()=>{P.tmp.n=mkName();return `이웃 ${P.tmp.n}네 아들이 장가를 든다. 빙례 비단이 모자란다며 그가 당신 집 문을 두드렸다.`},
 ch:[{l:'돈을 빌려준다',req:()=>P.wealth>=8,rq:'8천 전 필요',act:()=>{P.wealth-=6;later('e_f_wed_debt',rint(2,5),{n:P.tmp.n});return '그는 가을에 꼭 갚겠다며 손을 잡았다.'}},
     {l:'잔치 일을 거든다',st:'매',d:35,act:ok=>{if(ok){P.s.매+=2;return '사흘 동안 돼지를 잡고 국을 끓였다. 마을 어른들이 당신 이름을 기억했다.'}P.s.매+=1;return '술상을 엎어 신부 집 사람에게 핀잔을 들었다.'}},
     {l:'핑계를 대고 빠진다',act:()=>{P.s.매-=2;return '그 집 사람들이 당신 앞에서 말을 줄였다.'}}],
 to:()=>{P.s.매-=1;return '문 밖에서 기다리던 그가 돌아섰다.'}},
{id:'e_f_wed_debt',w:1,when:()=>false,time:6,title:'혼사 빚',han:'債',hr:'채',
 text:()=>`몇 해 전 혼사 비단 값을 빌려 간 ${jo(P.tmp.q.n,'이/가')} 아직 빚을 갚지 않았다. 그 집 며느리는 벌써 아이를 업고 다닌다.`,
 ch:[{l:'정중히 갚으라 한다',p:.5,act:ok=>{if(ok){P.wealth+=8;return '그가 머리를 긁으며 이자까지 쳐서 갚았다.'}later('e_f_wed_debt2',rint(1,3),{n:P.tmp.q.n});return '올해도 흉작이라며 그가 사정했다.'}},
     {l:'빚을 탕감해 준다',act:()=>{P.s.매+=3;P.fame+=2;return '그는 아이 이름에 당신 집 글자를 하나 넣었다.'}},
     {l:'그 집 밭 한 뙈기를 대신 받는다',st:'정',d:40,act:ok=>{if(ok){P.wealth+=10;P.s.매-=2;return '밭을 받았다. 그 집과는 그 뒤로 말을 섞지 않았다.'}P.s.매-=3;return '마을 사람들이 몰인정하다며 그 집 편을 들었다.'}}],
 to:()=>'빚 이야기는 또 한 해 미뤄졌다.'},
{id:'e_f_wed_debt2',w:1,when:()=>false,time:6,title:'갚지 못한 빚',han:'償',hr:'상',
 text:()=>`${jo(P.tmp.q.n,'이/가')} 결국 빚을 갚지 못하고 밤에 식구를 데리고 떠나려 한다는 말이 들렸다.`,
 ch:[{l:'길목에서 막아선다',st:'무',d:45,act:ok=>{if(ok){P.wealth+=6;return '그는 소를 내놓고 갔다. 빚은 소로 셈했다.'}P.s.매-=2;return '그의 아들과 멱살잡이를 하다 놓쳤다.'}},
     {l:'노잣돈을 쥐여 보낸다',act:()=>{P.wealth=Math.max(0,P.wealth-2);P.s.매+=3;P.fame+=3;return '그는 울면서 떠났다. 몇 해 뒤 먼 고을에서 갚을 날을 기다린다는 편지가 왔다.'}},
     {l:'그냥 둔다',act:()=>'빈집만 남았다. 빌려준 돈은 바람이 되었다.'}],
 to:()=>'다음 날 아침 그 집은 비어 있었다.'},
{id:'e_corveeboss',w:3,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='민'&&P.age>=30&&(P.s.통>=6||P.fame>=10),time:7,title:'부역 감독',han:'督',hr:'독',
 text:()=>'이장이 당신을 부역 감독으로 세웠다. 장정 서른 명을 데리고 한 달 안에 제방을 쌓아야 한다.',
 ch:[{l:'엄하게 몰아친다',st:'통',d:45,act:ok=>{if(ok){P.s.통+=2;P.fame+=4;return '기한 안에 제방을 쌓았다. 현에서 술과 고기를 내렸다.'}P.s.매-=3;hurt(10,'장정들과의 다툼');return '장정 둘이 쓰러지자 나머지가 연장을 내던졌다.'}},
     {l:'몰래 쉬엄쉬엄 하게 둔다',act:()=>{P.s.매+=3;later('e_f_corvee_flood',rint(1,3),{});return '장정들이 고마워했다. 제방은 겉만 번듯했다.'}},
     {l:'돈을 받고 몇 명을 빼 준다',act:()=>{P.wealth+=8;later('e_f_corvee_exposed',rint(1,3),{});return '부잣집 아들 셋이 명단에서 빠졌다. 남은 이들의 짐이 늘었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '우왕좌왕하는 사이 기한을 넘겼다.'}},
{id:'e_f_corvee_flood',w:1,season:1,when:()=>false,time:6,title:'무너진 둑',han:'堤',hr:'제',
 text:()=>'장마에 당신이 감독한 제방 한쪽이 무너졌다. 아랫마을 논이 잠기고 현리가 감독을 찾는다.',
 ch:[{l:'솔직히 내 탓이라 말한다',st:'정',d:40,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-5);P.fame+=2;return '현리가 정직함을 봐서 벌금만 물렸다.'}hurt(25,'곤장');return '곤장 쉰 대를 맞았다.'}},
     {l:'그때 장정들에게 증언을 부탁한다',st:'매',d:45,act:ok=>{if(ok){P.s.매+=2;return '장정들이 흙이 나빴다고 입을 모았다. 그때 베푼 인정이 돌아왔다.'}hurt(20,'곤장');return '아무도 나서지 않았다.'}},
     {l:'흙을 팔아먹은 서리 탓으로 돌린다',st:'지',d:50,act:ok=>{if(ok)return '서리가 대신 끌려갔다. 서리 집안이 당신을 노려본다.';hurt(30,'무고죄의 곤장');return '무고였다는 것이 드러났다.'}}],
 to:()=>{hurt(20,'곤장');return '변명할 틈도 없이 끌려갔다.'}},
{id:'e_f_corvee_exposed',w:1,when:()=>false,time:6,title:'빠진 이름',han:'簿',hr:'부',
 text:()=>'그때 부역 명단에서 빠졌던 부잣집 아들 일이 현에 투서로 들어갔다. 투서를 쓴 건 같이 일한 장정이다.',
 ch:[{l:'받은 돈을 그 장정에게 나눈다',req:()=>P.wealth>=8,rq:'8천 전 필요',act:()=>{P.wealth-=8;return '장정이 투서를 거두었다. 돈은 돌고 돌아 사라졌다.'}},
     {l:'부잣집에 책임을 미룬다',st:'지',d:50,act:ok=>{if(ok)return '부잣집이 현리에게 다시 돈을 썼다. 일은 덮였다.';hurt(25,'곤장');P.fame=Math.max(0,P.fame-5);return '부잣집은 발을 뺐다. 혼자 죄를 뒤집어썼다.'}},
     {l:'죄를 인정한다',act:()=>{P.wealth=Math.max(0,P.wealth-10);P.fame=Math.max(0,P.fame-3);return '받은 돈의 갑절을 벌금으로 물었다.'}}],
 to:()=>{hurt(20,'곤장');return '현리가 당신을 불러냈다.'}},
{id:'e_villageschool',w:()=>P.focus==='study'?6:2,cd:10,when:()=>P.year>=160&&P.year<=260&&['민','상'].includes(P.path)&&P.age>=22&&P.s.지>=6,time:7,title:'마을 글방',han:'塾',hr:'숙',
 text:()=>{P.tmp.n=mkName();return `마을 아이들이 당신이 글을 안다는 것을 알았다. 그중 ${P.tmp.n}라는 아이는 땅바닥에 글자를 베껴 쓰고 있다.`},
 ch:[{l:'겨울마다 아이들을 가르친다',act:()=>{P.s.지+=2;P.s.매+=2;P.wealth=Math.max(0,P.wealth-2);later('e_f_pupil',rint(5,9),{n:P.tmp.n});return '아이들은 좁쌀과 땔감을 들고 왔다. 그 아이가 가장 빨랐다.'}},
     {l:'수업료를 받고 가르친다',st:'정',d:35,act:ok=>{if(ok){P.wealth+=5;P.s.지+=1;return '부잣집 아이 몇이 왔다. 가난한 그 아이는 문밖에서 들었다.'}P.wealth+=2;return '아이들이 사흘을 못 버티고 떠났다.'}},
     {l:'농사일이 바쁘다며 사양한다',act:()=>{P.wealth+=2;return '그 아이는 한동안 당신 집 앞을 서성이다 발길을 끊었다.'}}],
 to:()=>'아이들이 흩어졌다.'},
{id:'e_f_pupil',w:1,when:()=>false,time:6,title:'옛 제자',han:'弟',hr:'제',
 text:()=>`옛날 글방에서 가르친 ${jo(P.tmp.q.n,'이/가')} 현의 서리가 되어 찾아왔다. 효렴에 천거될지도 모른다고 한다.`,
 say:()=>[P.tmp.q.n,'선생님 아니었으면 지금도 소를 몰았을 겁니다.'],
 ch:[{l:'남은 책을 모두 물려준다',act:()=>{P.s.매+=2;later('e_f_pupil_fame',rint(4,7),{n:P.tmp.q.n,g:1});return '그는 책 보따리를 안고 큰절을 올렸다.'}},
     {l:'천거 길에 내 이름도 넣어 달라 한다',st:'매',d:50,act:ok=>{if(ok){P.fame+=5;later('e_f_pupil_fame',rint(4,7),{n:P.tmp.q.n,g:1});return '그는 기꺼이 당신을 스승으로 적어 올렸다.'}P.s.매-=2;later('e_f_pupil_fame',rint(4,7),{n:P.tmp.q.n,g:0});return '그의 얼굴이 굳었다. 그 뒤로 발길이 뜸해졌다.'}},
     {l:'벼슬길은 험하다고 타이른다',act:()=>{P.s.지+=1;later('e_f_pupil_fame',rint(4,7),{n:P.tmp.q.n,g:1});return '그는 말없이 고개를 숙였다. 그래도 낙양으로 갔다.'}}],
 to:()=>{later('e_f_pupil_fame',rint(4,7),{n:P.tmp.q.n,g:1});return '그는 쌀 한 섬을 두고 갔다.'}},
{id:'e_f_pupil_fame',w:1,when:()=>false,time:7,title:'이름난 제자',han:'名',hr:'명',
 text:()=>P.tmp.q.g?`${jo(P.tmp.q.n,'이/가')} 군의 공조가 되었다. 사람들은 그를 가르친 시골 선생이 당신이라는 것을 안다.`:`${jo(P.tmp.q.n,'이/가')} 군의 공조가 되었다. 그는 시골 스승 이야기를 하지 않는다고 한다.`,
 ch:[{l:'그의 부름을 받아 관아로 간다',req:()=>P.tmp.q.g&&P.path!=='관'&&P.age<=55,rq:'옛정이 남았을 때만',act:()=>{setPath('관');P.rank=1;P.fame+=6;hon('제자 덕에 벼슬한 선생',1/5000);return '그의 천거로 현리 자리를 얻었다.'}},
     {l:'그의 명성을 빌려 글방을 넓힌다',req:()=>P.tmp.q.g,rq:'옛정이 남았을 때만',act:()=>{P.fame+=8;P.wealth+=6;return '아이들이 이웃 현에서까지 몰려왔다.'}},
     {l:'찾아가 섭섭함을 토로한다',req:()=>!P.tmp.q.g,rq:'사이가 멀어졌을 때만',st:'매',d:55,act:ok=>{if(ok){P.fame+=4;P.s.매+=2;return '그가 얼굴을 붉히며 사과하고 큰 잔치를 열어 주었다.'}P.fame=Math.max(0,P.fame-3);return '문지기가 당신을 막아섰다.'}},
     {l:'멀리서 기뻐만 한다',act:()=>{P.s.정+=2;P.fame+=2;return '가르친 보람이 그것으로 충분했다.'}}],
 to:()=>{P.fame+=2;return '소문은 소문대로 퍼졌다.'}},
{id:'e_wildboar',w:()=>P.focus==='arms'?5:3,cd:5,season:2,when:()=>P.year>=160&&P.year<=260&&P.path==='민'&&P.age>=16,time:6,title:'멧돼지',han:'彘',hr:'체',
 text:()=>'밤마다 멧돼지 떼가 조밭을 뒤집는다. 추수 앞둔 이삭이 절반은 짓밟혔다.',
 ch:[{l:'창을 들고 밤을 새운다',st:'무',d:()=>P.focus==='arms'?35:50,act:ok=>{if(ok){P.s.무+=2;P.wealth+=4;P.fame+=2;return '큰 수놈을 찔러 잡았다. 고기를 마을에 나누었다.'}hurt(30,'멧돼지 엄니');return '엄니에 허벅지를 받혔다.'}},
     {l:'함정을 판다',st:'지',d:40,act:ok=>{if(ok){P.wealth+=3;return '새끼 둘이 빠졌다. 떼가 다른 골짜기로 옮겨 갔다.'}P.wealth=Math.max(0,P.wealth-2);return '이웃집 개가 빠졌다. 개 값을 물어 주었다.'}},
     {l:'서둘러 덜 여문 이삭을 벤다',act:()=>{P.wealth=Math.max(0,P.wealth-2);return '쭉정이가 반이었지만 멧돼지 몫은 남기지 않았다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-4);return '이튿날 밭은 쑥대밭이었다.'}},
{id:'e_seedloan',w:()=>P.gun&&gunState(P.gun,P.year-1).harvest==='흉년'?6:3,cd:6,season:0,when:()=>P.year>=160&&P.year<=260&&P.path==='민'&&P.age>=18&&P.wealth<20,time:6,title:'씨나락',han:'種',hr:'종',
 text:()=>'지난겨울 씨나락까지 먹어 버렸다. 호족 집 창고지기가 가을에 갑절로 갚는 조건으로 종자를 빌려주겠다 한다.',
 ch:[{l:'갑절 빚을 지고 빌린다',act:()=>{P.wealth+=4;later('e_f_seed_due',1,{});return '씨를 뿌렸다. 가을이 무섭다.'}},
     {l:'산나물로 버티며 남의 밭 품을 판다',st:'무',d:45,act:ok=>{if(ok){P.s.무+=1;return '품삯으로 씨 몇 되를 겨우 샀다.'}hurt(20,'굶주림');return '배가 고파 쓰러졌다.'}},
     {l:'이웃과 씨를 나누자고 한다',st:'매',d:45,act:ok=>{if(ok){P.s.매+=2;return '세 집이 씨를 모아 번갈아 심었다.'}return '다들 제 코가 석 자였다. 밭 반을 묵혔다.'}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-3);return '밭이 묵어 풀만 자랐다.'}},
{id:'e_f_seed_due',w:1,season:2,when:()=>false,time:6,title:'갑절 빚',han:'倍',hr:'배',
 text:()=>{const h=P.gun?gunState(P.gun,P.year).harvest:'평년';P.tmp.h=h;return `가을이다. 올해는 ${h}이다. 창고지기가 장부를 들고 와서 봄에 빌린 종자의 갑절을 내라 한다.`},
 ch:[{l:'곡식으로 갚는다',act:()=>{if(P.tmp.h==='흉년'){P.wealth=Math.max(0,P.wealth-10);hurt(15,'겨울 굶주림');return '갚고 나니 독이 비었다. 겨울이 길었다.'}P.wealth=Math.max(0,P.wealth-4);return P.tmp.h==='풍년'?'풍년이라 갚고도 남았다.':'갚고 나니 겨우 겨울 날 양식이 남았다.'}},
     {l:'내년으로 미뤄 달라 빈다',st:'매',d:45,act:ok=>{if(ok){later('e_f_seed_tenant',1,{});return '창고지기가 이자에 이자를 얹어 적었다.'}P.wealth=Math.max(0,P.wealth-8);return '가노들이 독을 털어 갔다.'}},
     {l:'밤에 식구를 데리고 달아난다',act:()=>{const r=moveRandom();P.wealth=Math.floor(P.wealth*.4);return `빚을 두고 ${jo(r,'로')} 떠났다. 호적도 버렸다.`}}],
 to:()=>{P.wealth=Math.max(0,P.wealth-8);return '가노들이 마당에서 곡식을 퍼 갔다.'}},
{id:'e_f_seed_tenant',w:1,when:()=>false,time:6,title:'빚에 묶인 땅',han:'佃',hr:'전',
 text:()=>'불어난 빚이 밭값을 넘었다. 호족 집에서 밭을 넘기고 그 집 전객(佃客)이 되면 빚을 없애 주겠다 한다.',
 ch:[{l:'전객이 된다',act:()=>{P.wealth=Math.floor(P.wealth*.5);hurt(5,'고된 소작');return '밭은 남의 것이 되었다. 대신 난리 때는 그 집 담 안에 숨을 수 있다.'}},
     {l:'가진 것을 다 팔아 갚는다',act:()=>{P.wealth=Math.max(0,Math.floor(P.wealth*.2));P.s.정+=2;return '세간을 다 팔았다. 밭 한 뙈기만은 지켰다.'}},
     {l:'이웃들과 함께 현에 호소한다',st:'정',d:()=>P.gov&&P.gov.trait==='청렴'?40:65,act:ok=>{if(ok){P.fame+=6;return '태수가 갑절 이자를 금하는 영을 내렸다.'}hurt(20,'곤장');P.wealth=Math.floor(P.wealth*.4);return '도리어 소란죄로 곤장을 맞고 밭도 잃었다.'}}],
 to:()=>{P.wealth=Math.floor(P.wealth*.5);return '도장을 찍으라는 말에 손이 떨렸다.'}},
{id:'e_grainskim',w:4,cd:6,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.age>=16,time:7,title:'군량 착복',han:'糧',hr:'량',
 text:()=>{P.tmp.n=mkName();return `군량 자루에 모래가 반이다. 군량관 ${jo(P.tmp.n,'이/가')} 빼돌린 쌀을 밤마다 수레로 장터에 낸다는 걸 당신은 안다.`},
 ch:[{l:'장수에게 고발한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;later('e_f_grain_revenge',rint(2,5),{n:P.tmp.n});return `${jo(P.tmp.n,'이/가')} 목이 베였다. 병사들 밥그릇이 다시 찼다.`}hurt(25,'무고죄의 군곤');return '군량관이 장부를 먼저 고쳐 놓았다. 무고로 군곤을 맞았다.'}},
     {l:'입을 다무는 대가로 몫을 받는다',act:()=>{P.wealth+=10;later('e_f_grain_audit',rint(1,3),{n:P.tmp.n});return '쌀 다섯 섬 값이 손에 들어왔다.'}},
     {l:'제 몫의 군량만 따로 챙긴다',st:'지',d:35,act:ok=>{if(ok){P.hp=Math.min(100,P.hp+5);return '모래를 일어 내고 먹었다. 배는 곯지 않았다.'}hurt(10,'배앓이');return '모래 섞인 밥에 배앓이를 했다.'}}],
 to:()=>{hurt(10,'배앓이');return '모래 섞인 밥을 그대로 먹었다.'}},
{id:'e_f_grain_revenge',w:1,when:()=>false,time:6,title:'군량관의 아우',han:'弟',hr:'제',
 text:()=>`그때 목 베인 군량관 ${P.tmp.q.n}의 아우가 출세해 이 근방 관아에 왔다. 당신 이름을 묻고 다닌다고 한다.`,
 ch:[{l:'먼저 찾아가 그때 일을 설명한다',st:'정',d:55,act:ok=>{if(ok){P.s.정+=2;P.fame+=3;return '그는 형의 장부를 보고 오래 말이 없었다. 그 뒤로 당신을 찾지 않았다.'}hurt(20,'트집 잡힌 매');P.wealth=Math.floor(P.wealth*.7);return '그는 끝내 형의 원수로만 보았다. 트집을 잡혀 매를 맞았다.'}},
     {l:'윗사람에게 기대 몸을 피한다',req:()=>(P.npcs||[]).some(x=>x.alive&&x.role==='상관'),rq:'상관이 있을 때만',act:()=>{const m=P.npcs.find(x=>x.alive&&x.role==='상관');m.bond=Math.max(0,(m.bond||0)-1);return `${jo(m.n,'이/가')} 말을 넣어 주었다. 빚을 하나 진 셈이다.`}},
     {l:'다른 고을로 옮겨 간다',act:()=>{const r=moveRandom();return `${jo(r,'로')} 옮겨 갔다. 원한은 먼 데 두고 왔다.`}}],
 to:()=>{hurt(15,'트집 잡힌 매');return '그가 먼저 당신을 찾아냈다.'}},
{id:'e_f_grain_audit',w:1,when:()=>false,time:7,title:'군량 감찰',han:'察',hr:'찰',
 text:()=>`감찰이 내려와 군량 장부를 뒤진다. 군량관 ${jo(P.tmp.q.n,'이/가')} 살려고 공모자 이름을 하나씩 대고 있다.`,
 ch:[{l:'먼저 자수해 군량관을 고발한다',st:'정',d:45,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-10);return '받은 몫을 토해 내고 죄를 면했다.'}hurt(30,'군곤');P.wealth=Math.max(0,P.wealth-10);return '자수가 늦었다. 군곤 백 대를 맞았다.'}},
     {l:'감찰에게 뇌물을 쓴다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',st:'매',d:45,act:ok=>{P.wealth-=12;if(ok)return '감찰이 장부에서 당신 이름에 먹을 그었다.';hurt(35,'뇌물죄의 군곤');return '감찰이 청렴한 자였다. 뇌물까지 죄목에 붙었다.'}},
     {l:'끝까지 모른다고 버틴다',p:.45,act:ok=>{if(ok)return '증거가 모자랐다. 군량관 혼자 목이 베였다.';hurt(30,'군곤');P.rank=Math.max(0,P.rank-1);return '증인이 나왔다. 계급이 깎이고 군곤을 맞았다.'}}],
 to:()=>{hurt(30,'군곤');return '이름이 불렸다.'}},
{id:'e_lastwill',w:4,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.age>=16,time:7,title:'전우의 유언',han:'遺',hr:'유',
 text:()=>{const f=(P.npcs||[]).find(x=>x.role==='동무'&&x.alive&&x.path==='군');if(f&&R()<.5){f.alive=0;P.tmp.n=f.n;}else P.tmp.n=mkName();P.tmp.home=pick(['유주','기주','청주','연주','예주','서주','형주','양주','익주']);return `${jo(P.tmp.n,'이/가')} 배에 화살을 맞고 죽어 간다. 품에서 돈주머니를 꺼내 ${P.tmp.home}의 어머니께 전해 달라 한다.`},
 say:()=>[P.tmp.n,'어머니께... 내가 굶지 않았다고만...'],
 ch:[{l:'반드시 전하겠다고 약속한다',act:()=>{P.s.매+=2;later('e_f_will_mother',rint(1,3),{n:P.tmp.n,home:P.tmp.home});return '그는 웃는 얼굴로 숨을 거두었다. 돈주머니가 무겁다.'}},
     {l:'돈은 챙기고 고향엔 가지 않는다',act:()=>{P.wealth+=8;later('e_f_will_brother_x',rint(3,6),{n:P.tmp.n});return '죽은 사람은 말이 없다. 주머니를 허리에 찼다.'}},
     {l:'돈으로 그의 장례를 치른다',act:()=>{P.fame+=3;P.s.매+=1;return '관을 짜고 이름을 새긴 나무를 세웠다. 같은 부대 병사들이 고개를 숙였다.'}}],
 to:()=>{P.s.매-=1;return '대답하기 전에 그의 손이 떨어졌다.'}},
{id:'e_f_will_mother',w:1,when:()=>false,time:7,title:'늙은 어머니',han:'母',hr:'모',
 text:()=>`${P.tmp.q.home}의 작은 마을에서 ${P.tmp.q.n}의 늙은 어머니를 찾았다. 돈주머니를 받아 들고 아들이 어떻게 죽었냐고 묻는다.`,
 ch:[{l:'싸우다 장하게 죽었다고 말한다',act:()=>{P.s.매+=2;later('e_f_will_brother',rint(2,5),{n:P.tmp.q.n,g:1});return '노모가 울다가 웃었다. 열네 살 막내가 그 말을 귀 기울여 들었다.'}},
     {l:'있는 그대로 말한다',act:()=>{P.s.정+=2;later('e_f_will_brother',rint(2,5),{n:P.tmp.q.n,g:0});return '노모는 한참 말이 없더니 당신 손을 잡고 고맙다 했다.'}},
     {l:'내 돈을 보태어 드린다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=8;P.fame+=5;later('e_f_will_brother',rint(2,5),{n:P.tmp.q.n,g:1});return '그 돈으로 노모는 밭을 다시 샀다.'}}],
 to:()=>{later('e_f_will_brother',rint(2,5),{n:P.tmp.q.n,g:1});return '말을 잇지 못하고 주머니만 건넸다.'}},
{id:'e_f_will_brother',w:1,when:()=>false,time:7,title:'전우의 아우',han:'義',hr:'의',
 text:()=>`앳된 청년이 당신을 찾아왔다. ${P.tmp.q.n}의 막내아우다. 형처럼 당신 곁에서 싸우고 싶다고 한다.`,
 ch:[{l:'곁에 두고 무예를 가르친다',st:'통',d:40,act:ok=>{if(ok){P.s.통+=2;P.fame+=4;hon('전우의 아우를 거둔 자',1/3000);return '그는 이태 만에 당신의 등을 지키는 칼이 되었다.'}hurt(20,'아우를 감싸다 입은 상처');return '첫 싸움에서 그를 감싸다 대신 칼을 맞았다. 둘 다 살았다.'}},
     {l:'고향에 돌아가 노모를 모시라 한다',act:()=>{P.s.정+=2;P.s.매+=1;return '그는 서운해했지만 돌아갔다. 해마다 정월이면 마른 고기가 왔다.'}},
     {l:'좋은 자리에 천거해 준다',req:()=>P.rank>=3||P.path==='관',rq:'둔장이나 관리일 때만',act:()=>{P.fame+=3;return '그는 다른 부대의 오장이 되었다. 당신 이름을 어디서든 높였다.'}}],
 to:()=>'그는 문 앞에서 한참 기다리다 돌아갔다.'},
{id:'e_f_will_brother_x',w:1,when:()=>false,time:6,title:'형의 돈주머니',han:'囊',hr:'낭',
 text:()=>`낯선 청년이 칼을 차고 앞을 막았다. 죽은 ${P.tmp.q.n}의 아우다. 형이 남긴 돈이 끝내 집에 오지 않았다고 한다.`,
 say:()=>[`${P.tmp.q.n}의 아우`,'같은 부대 사람이 다 말해 주었소.'],
 ch:[{l:'갑절로 갚고 무릎을 꿇는다',req:()=>P.wealth>=16,rq:'1만 6천 전 필요',act:()=>{P.wealth-=16;P.s.매+=1;return '그는 돈을 받고 침을 뱉었다. 그래도 칼은 뽑지 않았다.'}},
     {l:'칼로 맞선다',st:'무',d:50,act:ok=>{if(ok){P.s.매-=3;return '그를 쓰러뜨렸다. 형제를 둘 다 저버린 셈이다.'}hurt(40,'전우 아우의 칼');return '분노한 칼이 더 빨랐다.'}},
     {l:'모른다고 잡아뗀다',st:'정',d:60,act:ok=>{if(ok)return '그는 확신하지 못하고 떠났다. 등 뒤가 오래 서늘했다.';hurt(30,'전우 아우의 칼');P.fame=Math.max(0,P.fame-5);return '거짓말이 얼굴에 쓰여 있었다.'}}],
 to:()=>{hurt(30,'전우 아우의 칼');return '그의 칼이 먼저 움직였다.'}},
{id:'e_prisoners',w:4,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.rank>=2&&P.gun&&gunState(P.gun,P.year).war,time:7,title:'포로 처분',han:'俘',hr:'부',
 text:()=>'싸움이 끝나고 포로 마흔 명이 남았다. 끌고 가자니 군량이 없고, 장수는 알아서 처리하라 한다.',
 ch:[{l:'모두 풀어 준다',st:'통',d:40,act:ok=>{P.s.매+=3;if(ok){P.tmp.n=mkName();later('e_f_pow_return',rint(3,7),{n:P.tmp.n});return '포로들이 절을 하고 흩어졌다. 그중 한 사내가 당신 이름을 물었다.'}P.fame=Math.max(0,P.fame-3);return '장수가 군령을 어겼다며 화를 냈다.'}},
     {l:'목을 벤다',act:()=>{P.fame+=4;P.s.매-=4;later('e_f_pow_ghost',rint(2,5),{});return '수급이 공으로 셈해졌다. 밤에 그 골짜기를 지나는 병사가 없었다.'}},
     {l:'노비로 팔아 군자금을 만든다',act:()=>{P.wealth+=12;P.s.매-=1;return '노예 상인이 마흔 명을 한 줄로 묶어 데려갔다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '머뭇거리는 사이 포로 절반이 밤에 달아났다.'}},
{id:'e_f_pow_return',w:1,when:()=>false,time:7,title:'풀어 준 포로',han:'釋',hr:'석',
 text:()=>`길이 막혀 고립되었다. 그때 다가온 무리의 우두머리가 ${P.tmp.q.n}이라 했다. 옛날 당신이 풀어 준 포로다.`,
 say:()=>[P.tmp.q.n,'목숨 하나 빚졌소. 오늘 갚겠소.'],
 ch:[{l:'그가 아는 샛길로 빠져나간다',act:()=>{P.hp=Math.min(100,P.hp+5);P.fame+=3;return '그는 사흘 길을 앞장서 안내하고 말없이 돌아갔다.'}},
     {l:'그를 내 편으로 끌어들인다',st:'매',d:50,act:ok=>{if(ok){P.s.통+=2;P.fame+=5;return '그는 부하 열 명을 데리고 당신 밑으로 들어왔다.'}return '그는 웃으며 고개를 저었다. 은혜는 갚았으니 이제 남이라 했다.'}},
     {l:'의심하고 칼을 뽑는다',st:'무',d:45,act:ok=>{P.s.매-=3;if(ok)return '그를 베었다. 품에서 당신에게 줄 마른 떡이 나왔다.';hurt(30,'칼부림');return '그의 무리가 당신을 버려두고 떠났다. 혼자 길을 찾다 다쳤다.'}}],
 to:()=>'그는 기다리다 떠났다. 길은 스스로 찾아야 했다.'},
{id:'e_f_pow_ghost',w:1,when:()=>false,time:6,title:'골짜기의 밤',han:'鬼',hr:'귀',
 text:()=>'그때 포로를 베던 골짜기 근처를 다시 지난다. 그날 숨어 살아남은 자가 마을에 있다는 말이 들렸다.',
 ch:[{l:'그를 찾아가 제사 비용을 건넨다',req:()=>P.wealth>=6,rq:'6천 전 필요',act:()=>{P.wealth-=6;P.s.매+=2;return '그는 돈을 받지 않았다. 제사는 지내라며 당신 손에 술병을 쥐여 주었다.'}},
     {l:'입을 막으려 사람을 보낸다',st:'지',d:50,act:ok=>{P.s.매-=3;if(ok)return '그는 사라졌다. 당신 꿈에 마흔 개의 얼굴이 나왔다.';hurt(25,'복수의 칼');return '보낸 자가 거꾸로 칼을 맞고 돌아왔다. 그날 밤 당신 막사에도 불이 났다.'}},
     {l:'모른 척 지나간다',p:.5,act:ok=>{if(ok)return '아무 일도 없었다. 다만 밤마다 잠을 설쳤다.';hurt(20,'원한의 화살');return '숲에서 날아온 화살이 어깨에 박혔다.'}}],
 to:()=>{hurt(10,'악몽');return '밤새 잠을 이루지 못했다.'}},
{id:'e_spysuspect',w:4,cd:6,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.age>=16,time:6,title:'첩자 의심',han:'諜',hr:'첩',
 text:()=>{P.tmp.n=mkName();return `새로 들어온 ${jo(P.tmp.n,'은/는')} 밤마다 막사를 나가 진채 둘레를 걷는다. 말투도 이 고장 것이 아니다.`},
 ch:[{l:'상관에게 보고한다',act:()=>{if(R()<.5){P.fame+=5;return `${P.tmp.n}의 품에서 진채 그림이 나왔다. 상을 받았다.`}P.s.매-=2;return `${jo(P.tmp.n,'은/는')} 고향 별을 보던 피난민이었다. 그는 곤장을 맞고 당신을 피했다.`}},
     {l:'몰래 뒤를 밟는다',st:'지',d:45,act:ok=>{if(ok){P.s.지+=2;later('e_f_spy_truth',rint(1,3),{n:P.tmp.n,spy:R()<.5?1:0});return '그는 진채 밖 무덤 앞에서 절을 했다. 더 지켜보기로 했다.'}hurt(15,'보초의 오인');return '보초에게 첩자로 오인되어 얻어맞았다.'}},
     {l:'술을 사며 가까워진다',st:'매',d:35,act:ok=>{later('e_f_spy_truth',rint(1,3),{n:P.tmp.n,spy:R()<.5?1:0,f:1});if(ok){P.s.매+=2;return '그는 고향 이야기를 많이 했다. 말끝마다 무언가를 감추었다.'}return '그는 술잔만 비우고 말이 없었다.'}}],
 to:()=>'그는 그날도 밤길을 나갔다.'},
{id:'e_f_spy_truth',w:1,when:()=>false,time:7,title:'밤길의 정체',han:'眞',hr:'진',
 text:()=>P.tmp.q.spy?`적이 야습해 온 밤, ${jo(P.tmp.q.n,'이/가')} 진채 뒷문 빗장을 풀고 있는 것을 보았다.`:`적이 야습해 온 밤, ${jo(P.tmp.q.n,'이/가')} 맨 먼저 북을 치며 뒷문으로 몰려오는 적을 막아섰다.`,
 ch:[{l:'달려가 그를 막는다',req:()=>P.tmp.q.spy,rq:'그가 빗장을 풀 때만',st:'무',d:50,act:ok=>{if(ok){P.fame+=8;P.s.무+=2;return '빗장이 다시 걸렸다. 진채가 살았다. 당신 공이 장부 맨 위에 올랐다.'}hurt(35,'첩자의 칼');return '그의 칼에 베였다. 뒷문이 열렸다.'}},
     {l:'그의 마음을 돌리려 소리친다',req:()=>P.tmp.q.spy&&P.tmp.q.f,rq:'함께 술을 나눈 사이일 때만',st:'매',d:45,act:ok=>{if(ok){P.fame+=6;return '그가 손을 멈추고 주저앉았다. 그는 적에게 볼모로 잡힌 처자를 위해 그랬다고 했다.'}hurt(25,'혼전');return '그는 고개를 돌렸다. 혼전 속에 다쳤다.'}},
     {l:'그와 나란히 싸운다',req:()=>!P.tmp.q.spy,rq:'그가 적을 막을 때만',st:'무',d:45,act:ok=>{if(ok){P.fame+=6;P.s.매+=2;return '둘이서 뒷문을 지켰다. 그는 의심받던 날들을 웃으며 털어 버렸다.'}hurt(30,'야습');return '그가 당신을 업고 빠져나왔다.'}},
     {l:'막사에 엎드려 숨는다',act:()=>{P.fame=Math.max(0,P.fame-4);return P.tmp.q.spy?'뒷문이 열리고 진채가 불탔다.':'그가 뒷문을 지키다 죽었다. 당신은 끝내 그를 의심만 했다.'}}],
 to:()=>{hurt(20,'야습');return '불길 속에 갈피를 잡지 못했다.'}},
{id:'e_leave',w:()=>P.focus==='rest'?6:3,cd:5,season:3,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.age>=17,time:6,title:'휴가',han:'暇',hr:'가',
 text:()=>(P.fam&&P.fam.mo&&P.fam.mo.alive)?'한 달 휴가를 받았다. 고향의 어머니가 아프다는 편지가 와 있다. 장터 주막에서는 동료들이 부른다.':'한 달 휴가를 받았다. 고향 집은 비었고, 장터 주막에서는 동료들이 부른다.',
 ch:[{l:'고향에 다녀온다',act:()=>{P.hp=Math.min(100,P.hp+10);P.wealth=Math.max(0,P.wealth-3);if(P.married)return `${P.fam&&P.fam.spouse?P.fam.spouse.n:'아내'}가 국을 끓여 주었다. 돌아오는 길이 무거웠다.`;return '마을 사람들이 군복을 보고 신기해했다. 부모 무덤의 풀을 베었다.'}},
     {l:'진채에 남아 창을 익힌다',act:()=>{P.s.무+=2;P.hp=Math.max(1,P.hp-3);return '빈 연병장에서 혼자 창을 휘둘렀다. 교위가 지나가다 보았다.'}},
     {l:'주막에서 실컷 논다',p:.5,act:ok=>{P.wealth=Math.max(0,P.wealth-5);if(ok){P.s.매+=2;P.hp=Math.min(100,P.hp+5);return '한 달을 웃으며 보냈다. 동료들과 형제처럼 되었다.'}hurt(15,'주막 싸움');return '술김에 다른 부대 병사와 주먹다짐을 했다.'}}],
 to:()=>'휴가가 하루하루 줄었다.'},
{id:'e_warhorse',w:()=>P.focus==='arms'?6:3,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.rank>=1,time:6,title:'사나운 말',han:'馬',hr:'마',
 text:()=>'새로 배정된 군마가 사람을 태우지 않는다. 마구간지기는 북방 오환 말이라 성질이 그렇다고 한다.',
 ch:[{l:'날마다 손수 먹이고 길들인다',st:'통',d:45,act:ok=>{if(ok){P.s.통+=1;later('e_f_horse_battle',rint(1,4),{});return '석 달 만에 말이 당신 발소리를 알아들었다.'}hurt(20,'말발굽');return '갈비뼈에 발굽을 맞았다.'}},
     {l:'올라타서 기를 꺾는다',st:'무',d:55,act:ok=>{if(ok){P.s.무+=2;P.fame+=2;return '반나절을 버텼다. 말이 고개를 숙였다. 병사들이 휘파람을 불었다.'}hurt(30,'낙마');return '내동댕이쳐졌다.'}},
     {l:'다른 말로 바꿔 달라 한다',act:()=>'순한 늙은 말을 받았다. 느렸다.'}],
 to:()=>'말은 여전히 날뛰었다.'},
{id:'e_f_horse_battle',w:1,when:()=>false,time:6,title:'말이 기억하다',han:'駿',hr:'준',
 text:()=>'혼전 속에 말에서 떨어질 뻔했다. 몇 해 전 길들인 그 말이 적병 사이에서 당신을 향해 머리를 돌린다.',
 ch:[{l:'말 등에 몸을 던진다',st:'무',d:35,act:ok=>{if(ok){P.fame+=5;return '말이 적진을 뚫고 당신을 진채까지 데려왔다.'}hurt(25,'혼전');return '안장을 놓쳤지만 말이 곁을 지켜 주었다.'}},
     {l:'말을 앞세워 적을 흩는다',st:'통',d:50,act:ok=>{if(ok){P.fame+=8;P.s.통+=2;return '말발굽이 적의 대열을 갈랐다. 그날 공은 당신과 말의 것이었다.'}hurt(30,'창');return '말이 창에 찔려 쓰러졌다. 당신도 다쳤다.'}},
     {l:'말을 버리고 걸어서 물러난다',act:()=>{hurt(15,'퇴각');return '말은 적의 차지가 되었다.'}}],
 to:()=>{hurt(20,'혼전');return '말의 고삐가 손에서 미끄러졌다.'}},
{id:'e_deserter',w:3,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.rank>=1,time:7,title:'탈영병',han:'逃',hr:'도',
 text:()=>{P.tmp.n=mkName();return `밤 보초를 돌다 담을 넘는 자를 붙잡았다. 같은 고향 출신 ${P.tmp.n}이다. 처자가 굶는다며 보내 달라 한다.`},
 ch:[{l:'군율대로 넘긴다',act:()=>{P.fame+=3;P.s.매-=2;return `${jo(P.tmp.n,'은/는')} 이튿날 목이 베였다. 고향에 이 소식이 갔다.`}},
     {l:'모른 척 보내 준다',act:()=>{P.s.매+=2;later('e_f_deserter_back',rint(4,8),{n:P.tmp.n});return '그는 어둠 속으로 사라졌다. 보초 장부에는 이상 없음이라 적었다.'}},
     {l:'곤장 몇 대로 끝내고 눌러 앉힌다',st:'통',d:45,act:ok=>{if(ok){P.s.통+=2;return '그는 다시 창을 잡았다. 녹봉 일부를 그의 집으로 보내 주었다.'}P.s.매-=1;return '그는 사흘 뒤 다시 도망쳤다. 이번엔 당신이 문책을 받았다.'}}],
 to:()=>'그는 손을 뿌리치고 담을 넘었다.'},
{id:'e_f_deserter_back',w:1,when:()=>false,time:6,title:'산에서 온 편지',han:'書',hr:'서',
 text:()=>`산적이 된 ${jo(P.tmp.q.n,'이/가')} 사람을 보내왔다. 그때 목숨을 살려 준 은혜를 잊지 않았다며 고향 마을은 털지 않겠다고 한다.`,
 ch:[{l:'고마운 마음만 받는다',act:()=>{P.s.매+=1;return '고향 마을은 난리 통에도 도적을 피했다.'}},
     {l:'그 산채 위치를 관에 알린다',act:()=>{P.fame+=5;P.s.매-=3;return '토벌군이 산채를 불살랐다. 그 뒤 고향에선 당신 이름을 함부로 꺼내지 않았다.'}},
     {l:'그를 귀순시키려 설득한다',st:'매',d:55,act:ok=>{if(ok){P.fame+=10;hon('도적을 귀순시킨 자',1/5000);return '그는 무리를 이끌고 산을 내려왔다. 그 공이 당신에게 돌아왔다.'}hurt(20,'산채의 의심');return '산채는 당신이 보낸 사람을 매질해 돌려보냈다.'}}],
 to:()=>'심부름꾼은 대답을 기다리다 산으로 돌아갔다.'},
{id:'e_letters',w:()=>P.focus==='study'?6:2,cd:6,when:()=>P.year>=160&&P.year<=260&&P.path==='군'&&P.s.지>=6,time:6,title:'편지 대필',han:'筆',hr:'필',
 text:()=>'글을 아는 병사가 당신뿐이다. 글 모르는 병사들이 고향에 보낼 편지를 써 달라고 줄을 섰다.',
 ch:[{l:'밤마다 공짜로 써 준다',act:()=>{P.s.매+=3;P.s.지+=1;later('e_f_letters_men',rint(2,4),{});return '병사들이 부르는 대로 받아 적었다. 어머니, 밥은 먹습니다.'}},
     {l:'한 통에 몇 전씩 받는다',act:()=>{P.wealth+=5;return '쏠쏠했다. 병사들 사이에서 글값 장수라 불렸다.'}},
     {l:'글을 가르쳐 스스로 쓰게 한다',st:'지',d:50,act:ok=>{if(ok){P.s.지+=2;P.fame+=3;return '열 명이 제 이름을 쓰게 되었다. 장수가 그 이야기를 들었다.'}P.s.지+=1;return '창 쥐던 손에 붓은 무거웠다. 다들 포기했다.'}}],
 to:()=>'병사들이 흩어졌다.'},
{id:'e_f_letters_men',w:1,when:()=>false,time:6,title:'답장들',han:'信',hr:'신',
 text:()=>'그때 편지를 써 주었던 병사들 집에서 답장이 왔다. 어느 집은 마른 대추를, 어느 집은 짚신을 보냈다.',
 ch:[{l:'병사들을 모아 답장을 읽어 준다',act:()=>{P.s.매+=2;P.s.통+=2;if(P.path==='군'&&P.rank<9&&R()<.4){P.rank++;return '병사들이 울고 웃었다. 그 일로 사람들이 당신을 따랐고 계급이 하나 올랐다.'}return '병사들이 울고 웃었다. 그날부터 그들은 당신 말이라면 들었다.'}},
     {l:'선물을 장터에 팔아 술을 산다',act:()=>{P.wealth+=2;P.s.매+=1;return '모두 한 잔씩 돌렸다.'}},
     {l:'답장 속 고향 소식을 정리해 둔다',st:'지',d:40,act:ok=>{if(ok){P.s.지+=2;return '여러 고을의 수확과 세금을 한눈에 알게 되었다. 쓸모가 있을 것이다.'}return '글씨가 엉망이라 반도 못 읽었다.'}}],
 to:()=>'답장들은 상자 속에 쌓였다.'},
{id:'e_census',w:4,cd:6,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.age>=18,time:7,title:'호적 정리',han:'籍',hr:'적',
 text:()=>{P.tmp.n=pick(SURN)+'씨';return `호적을 다시 짠다. 호족 ${P.tmp.n} 집안이 소작인 백 호를 숨기고 세금을 피한다. 그 집 집사가 비단을 들고 왔다.`},
 ch:[{l:'백 호를 모두 호적에 올린다',st:'정',d:()=>P.gov&&P.gov.trait==='탐욕'?60:45,act:ok=>{if(ok){P.fame+=6;later('e_f_census_revenge',rint(2,4),{n:P.tmp.n});return '세수가 늘었다. 태수가 당신 이름을 기억했다.'}P.fame=Math.max(0,P.fame-3);return '상관이 장부를 되돌려 보냈다. 호족 편이었다.'}},
     {l:'비단을 받고 눈감는다',act:()=>{P.wealth+=12;P.flags.corrupt=1;later('e_f_census_audit',rint(2,5),{n:P.tmp.n});return '장부의 숫자는 깔끔했다. 그 숫자가 거짓이라는 것만 빼면.'}},
     {l:'절반만 올리고 절반은 봐준다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=4;P.fame+=2;return '호족도 관아도 크게 불만이 없었다.'}return '양쪽 다 당신을 믿지 않게 되었다.'}}],
 to:()=>'장부 정리가 다음 해로 밀렸다.'},
{id:'e_f_census_revenge',w:1,when:()=>false,time:6,title:'호족의 투서',han:'訴',hr:'소',
 text:()=>`${P.tmp.q.n} 집안이 당신이 공금을 빼돌렸다는 투서를 자사부에 올렸다. 호적 정리 때의 앙갚음이다.`,
 ch:[{l:'장부를 들고 자사 앞에서 해명한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;P.s.정+=2;return '장부가 깨끗했다. 투서한 쪽이 무고로 벌을 받았다.'}P.fame=Math.max(0,P.fame-5);if(P.path==='관')P.rank=Math.max(0,P.rank-1);return '자사는 호족의 오랜 벗이었다. 자리가 깎였다.'}},
     {l:'호족과 손을 잡고 화해한다',act:()=>{P.wealth+=6;P.flags.corrupt=1;return '투서는 거두어졌다. 그 뒤로 그 집 일은 당신이 맡아 처리하게 되었다.'}},
     {l:'관직을 버리고 고향으로 간다',req:()=>P.path==='관',rq:'관리일 때만',act:()=>{setPath('민');P.fame+=3;return '사람들은 깨끗한 관리가 쫓겨났다며 아까워했다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-4);return '해명할 기회를 놓쳤다.'}},
{id:'e_f_census_audit',w:1,when:()=>false,time:7,title:'새 자사',han:'刺',hr:'자',
 text:()=>'새로 온 자사가 군현 호적을 하나하나 다시 맞춰 본다. 몇 해 전 당신이 손댄 장부도 그 더미에 있다.',
 ch:[{l:'밤새 장부를 다시 고친다',st:'지',d:55,act:ok=>{if(ok){P.s.지+=1;return '먹 냄새가 가시기 전에 장부를 제자리에 꽂았다. 자사는 넘어갔다.'}later('e_f_census_exile',1,{n:P.tmp.q.n});return '고친 흔적을 자사의 서리가 찾아냈다.'}},
     {l:'호족을 고발하고 죄를 감해 달라 한다',st:'정',d:45,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-12);P.fame+=2;return `${P.tmp.q.n} 집안이 벌을 받았다. 당신은 받은 비단을 토해 내고 살아남았다.`}later('e_f_census_exile',1,{n:P.tmp.q.n});return '호족이 먼저 당신 이름을 대었다.'}},
     {l:'자사의 서리에게 뇌물을 쓴다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=20;if(R()<.6)return '서리가 장부를 더미 맨 밑에 넣었다.';later('e_f_census_exile',1,{n:P.tmp.q.n});return '서리가 돈을 받고도 고발했다.'}}],
 to:()=>{later('e_f_census_exile',1,{n:P.tmp.q.n});return '장부가 자사 책상에 올랐다.'}},
{id:'e_f_census_exile',w:1,when:()=>false,time:7,title:'면직',han:'罷',hr:'파',
 text:()=>'호적을 거짓으로 꾸민 죄가 확정되었다. 자사는 면직과 변경 유배 중 하나를 고르라 한다.',
 ch:[{l:'면직되어 백성으로 돌아간다',act:()=>{setPath('민');P.wealth=Math.floor(P.wealth*.5);P.fame=Math.max(0,P.fame-8);return '관인을 반납했다. 고향 사람들은 등을 돌렸다.'}},
     {l:'벌금을 바치고 자리를 지킨다',req:()=>P.wealth>=40,rq:'4만 전 필요',act:()=>{P.wealth-=40;P.fame=Math.max(0,P.fame-4);if(P.path==='관')P.rank=Math.max(0,P.rank-1);return '자리 하나가 깎였지만 관복은 지켰다.'}},
     {l:'변경으로 가서 새로 시작한다',act:()=>{const r=moveTo(pick(['량주','유주','병주']));setPath('군');P.fame=Math.max(0,P.fame-5);return `${jo(r,'로')} 유배되어 변경 수졸이 되었다.`}}],
 to:()=>{setPath('민');P.fame=Math.max(0,P.fame-8);return '관인을 빼앗겼다.'}},
{id:'e_runaway',w:4,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.age>=18,time:7,title:'도망 노비',han:'奴',hr:'노',
 text:()=>{P.tmp.n=mkName();return `호족 집에서 달아난 노비 ${jo(P.tmp.n,'이/가')} 붙잡혀 왔다. 등에 채찍 자국이 겹겹이다. 주인은 돌려 달라 한다.`},
 ch:[{l:'율대로 주인에게 돌려준다',act:()=>{P.wealth+=3;P.s.매-=1;return '그는 끌려가며 당신을 돌아보았다.'}},
     {l:'주인의 학대를 문서로 남겨 풀어 준다',st:'정',d:55,act:ok=>{if(ok){P.fame+=5;later('e_f_slave_return',rint(4,8),{n:P.tmp.n});return '그는 양인이 되었다. 호족이 당신을 노려보았다.'}P.fame=Math.max(0,P.fame-2);return '상관이 문서를 찢었다. 노비는 끌려갔다.'}},
     {l:'몰래 이름을 바꿔 둔전병으로 보낸다',st:'지',d:45,act:ok=>{if(ok){P.s.지+=1;later('e_f_slave_return',rint(4,8),{n:P.tmp.n});return '새 호적을 얻은 그가 먼 둔전으로 떠났다.'}hurt(20,'문책');return '서류가 들통나 문책을 받았다.'}}],
 to:()=>'주인의 가노들이 그를 끌고 갔다.'},
{id:'e_f_slave_return',w:1,when:()=>false,time:7,title:'노비였던 사람',han:'良',hr:'량',
 text:()=>`비단 옷 입은 사내가 찾아왔다. 몇 해 전 당신이 풀어 준 노비 ${P.tmp.q.n}이다. 지금은 소금 수레를 부리는 상인이라 한다.`,
 say:()=>[P.tmp.q.n,'이 몸이 사람이 된 날을 잊지 않았습니다.'],
 ch:[{l:'그가 바치는 금을 받는다',act:()=>{P.wealth+=20;return '금 한 근이었다. 노비 한 사람 값의 열 배였다.'}},
     {l:'금 대신 그의 상단과 손을 잡는다',act:()=>{P.wealth+=8;later('e_f_slave_son',rint(3,6),{n:P.tmp.q.n});return '그의 수레에 당신 몫의 짐이 실리기 시작했다.'}},
     {l:'그 돈으로 다른 노비를 풀어 주라 한다',act:()=>{P.fame+=8;P.s.매+=3;hon('노비를 풀어 준 자',1/3000);return '그는 이듬해 노비 열 명을 사서 풀어 주었다. 그 이야기가 퍼졌다.'}}],
 to:()=>{P.wealth+=8;return '그는 상자 하나를 두고 갔다.'}},
{id:'e_f_slave_son',w:1,when:()=>false,time:7,title:'사돈 제의',han:'姻',hr:'인',
 text:()=>`${P.tmp.q.n}의 상단이 크게 일어났다. 그가 자기 아들과 당신 집안을 혼인으로 묶자고 한다. 노비 출신이라는 말이 따라붙는다.`,
 ch:[{l:'딸을 그 집에 시집보낸다',req:()=>(P.kids||[]).some(c=>c.alive&&c.sex==='f'&&P.year-c.b>=14),rq:'혼기 찬 딸이 있을 때만',act:()=>{const c=P.kids.find(c=>c.alive&&c.sex==='f'&&P.year-c.b>=14);P.wealth+=25;P.fame=Math.max(0,P.fame-3);return `딸 ${jo(c.n,'이/가')} 상단의 며느리가 되었다. 사대부들은 수군댔지만 곳간은 찼다.`}},
     {l:'신분을 따져 거절한다',act:()=>{P.fame+=2;P.wealth=Math.max(0,P.wealth-4);return '그는 얼굴을 붉히고 수레를 거두어 갔다.'}},
     {l:'혼인 대신 의형제를 맺는다',st:'매',d:45,act:ok=>{if(ok){P.wealth+=10;P.s.매+=2;return '술잔을 나누고 형님 아우가 되었다. 서로 체면이 섰다.'}return '그는 서운해하며 웃었다. 그 뒤로 거래만 남았다.'}}],
 to:()=>'답이 늦자 그는 다른 집안을 찾았다.'},
{id:'e_concubine',w:4,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.age>=18,time:7,title:'상관의 첩',han:'妾',hr:'첩',
 text:()=>{P.tmp.n=mkName();return `장터에서 사람을 때려 다치게 한 자가 잡혀 왔다. 상관이 아끼는 첩의 오라비 ${P.tmp.n}이다.`},
 ch:[{l:'율대로 곤장을 친다',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;later('e_f_concubine_fall',rint(1,3),{n:P.tmp.n,g:1});return '백성들이 박수를 쳤다. 상관의 얼굴이 하얗게 굳었다.'}P.fame+=2;later('e_f_concubine_fall',rint(1,3),{n:P.tmp.n,g:1});return '곤장을 쳤다. 그날 저녁 상관이 당신을 불러 꾸짖었다.'}},
     {l:'조용히 풀어 준다',act:()=>{P.s.매-=1;later('e_f_concubine_scandal',rint(1,3),{n:P.tmp.n});return '첩이 고맙다는 말을 전해 왔다. 다친 백성은 이를 갈았다.'}},
     {l:'풀어 주고 첩에게 생색을 낸다',st:'매',d:45,act:ok=>{if(ok){P.fame+=3;if(P.rank<4&&R()<.5)P.rank++;later('e_f_concubine_scandal',rint(1,3),{n:P.tmp.n});return '상관이 당신을 편애하기 시작했다.'}later('e_f_concubine_scandal',rint(1,3),{n:P.tmp.n});return '첩은 당신을 아첨꾼이라 비웃었다.'}}],
 to:()=>'상관의 사람이 와서 그를 데려갔다.'},
{id:'e_f_concubine_fall',w:1,when:()=>false,time:7,title:'첩의 앙갚음',han:'讒',hr:'참',
 text:()=>`곤장을 맞은 ${P.tmp.q.n}의 누이가 베갯머리에서 당신을 헐뜯는다는 말이 들린다. 상관의 눈빛이 날로 차가워진다.`,
 ch:[{l:'더 윗선에 상관의 비리를 올린다',st:'지',d:55,act:ok=>{if(ok){P.fame+=8;if(P.path==='관')P.rank=Math.min(P.rank+1,9);return '상관이 파면되었다. 그 자리의 일이 당신에게 왔다.'}P.fame=Math.max(0,P.fame-6);if(P.path==='관')P.rank=Math.max(0,P.rank-1);return '고발장이 상관 손에 먼저 들어갔다.'}},
     {l:'선물을 들고 첩에게 사과한다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=10;P.fame=Math.max(0,P.fame-2);return '첩은 선물을 받았다. 백성들은 당신이 꺾였다고 했다.'}},
     {l:'다른 고을로 전보를 청한다',act:()=>{const r=moveRandom();return `${jo(r,'로')} 옮겨 갔다. 깐깐한 관리라는 이름이 먼저 가 있었다.`}}],
 to:()=>{P.fame=Math.max(0,P.fame-3);return '상관의 눈 밖에 났다.'}},
{id:'e_f_concubine_scandal',w:1,when:()=>false,time:7,title:'또 그 사람',han:'禍',hr:'화',
 text:()=>`풀려난 ${jo(P.tmp.q.n,'이/가')} 이번엔 사람을 죽였다. 백성들은 그때 당신이 풀어 줘서라고 수군댄다.`,
 ch:[{l:'이번엔 직접 잡아 처벌한다',st:'무',d:45,act:ok=>{if(ok){P.fame+=5;return '그를 잡아 목을 베었다. 첩과 상관은 입을 다물었다.'}hurt(25,'첩 오라비 패거리');return '패거리가 길에서 당신을 막았다.'}},
     {l:'그때 기록을 상관 탓으로 돌린다',st:'지',d:50,act:ok=>{if(ok)return '상관이 풀어 주라 했다는 쪽지가 남아 있었다. 비난이 상관에게 쏠렸다.';P.fame=Math.max(0,P.fame-8);return '쪽지 따위는 없었다. 모두가 당신을 손가락질했다.'}},
     {l:'유족에게 사죄하고 위로금을 낸다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{P.wealth-=10;P.s.매+=1;P.fame=Math.max(0,P.fame-2);return '유족은 돈을 받았다. 눈빛은 받지 않았다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-6);return '원망이 당신에게 쏟아졌다.'}},
{id:'e_rainrite',w:()=>P.gun&&gunState(P.gun,P.year).harvest==='흉년'?6:2,cd:6,season:1,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.rank>=1,time:7,title:'기우제',han:'雩',hr:'우',
 text:()=>'두 달째 비가 없다. 태수가 기우제를 당신에게 맡겼다. 무당은 용을 부른다며 흙으로 용을 빚고 있다.',
 ch:[{l:'예법대로 경건히 제를 올린다',st:'정',d:40,act:ok=>{if(R()<(ok?.55:.3)){P.fame+=6;later('e_f_rain_next',rint(2,5),{});return '사흘 뒤 비가 내렸다. 백성들은 당신이 하늘을 움직였다 했다.'}P.s.정+=1;return '비는 오지 않았다. 그래도 애썼다는 말은 들었다.'}},
     {l:'무당에게 맡기고 판을 크게 벌인다',act:()=>{P.wealth=Math.max(0,P.wealth-3);if(R()<.4){P.fame+=4;later('e_f_rain_next',rint(2,5),{});return '굿판 사흘째 소나기가 쏟아졌다.'}P.fame=Math.max(0,P.fame-2);return '징 소리만 요란했다. 비는 끝내 오지 않았다.'}},
     {l:'제사는 짧게 끝내고 우물을 판다',st:'통',d:50,act:ok=>{if(ok){P.s.통+=2;P.fame+=4;return '하늘보다 땅이 빨랐다. 새 우물 다섯으로 논 한 귀퉁이를 살렸다.'}P.fame=Math.max(0,P.fame-3);return '우물은 말랐고 백성들은 제사를 소홀히 해서라고 했다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);return '제사 날짜도 못 잡고 가뭄이 깊어졌다.'}},
{id:'e_f_rain_next',w:1,season:1,when:()=>false,time:7,title:'비를 부른 사람',han:'雨',hr:'우',
 text:()=>'또 가물었다. 백성들이 그때 비를 부른 사람을 찾는다며 당신 집 앞에 모여 무릎을 꿇었다.',
 ch:[{l:'다시 제를 올린다',p:.4,act:ok=>{if(ok){P.fame+=10;hon('비를 부르는 사람',1/5000);return '이번에도 비가 왔다. 고을 사람들이 당신 사당을 짓자고 했다.'}P.fame=Math.max(0,P.fame-6);return '비가 오지 않았다. 신통력이 다했다는 말과 함께 돌이 날아왔다.'}},
     {l:'그때는 우연이었다고 솔직히 말한다',st:'정',d:45,act:ok=>{if(ok){P.s.정+=2;P.fame+=2;return '사람들이 실망했지만 당신 말을 믿었다. 함께 물길을 팠다.'}P.fame=Math.max(0,P.fame-4);return '사람들은 당신이 자기들을 버렸다고 여겼다.'}},
     {l:'비 대신 곡식 나눔을 연다',req:()=>P.wealth>=15,rq:'1만 5천 전 필요',act:()=>{P.wealth-=12;P.fame+=6;return '비는 오지 않았지만 굶어 죽은 이도 없었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-3);return '모인 사람들이 실망해 흩어졌다.'}},
{id:'e_postfraud',w:3,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.age>=18,time:7,title:'역참 비리',han:'驛',hr:'역',
 text:()=>{P.tmp.n=mkName();return `역참 장부에 말 스무 필이 있는데 마구간에는 일곱뿐이다. 역졸 ${jo(P.tmp.n,'이/가')} 역장이 말을 팔아먹었다고 귀띔했다.`},
 ch:[{l:'정식으로 조사한다',st:'지',d:50,act:ok=>{if(ok){P.fame+=4;later('e_f_post_witness',rint(1,2),{n:P.tmp.n});return '말 판 기록을 찾아냈다. 역장이 하옥되기 직전이다. 증인은 역졸뿐이다.'}P.fame=Math.max(0,P.fame-2);return '역장이 장부를 불태웠다. 증거가 사라졌다.'}},
     {l:'역장과 몫을 나눈다',act:()=>{P.wealth+=8;P.flags.corrupt=1;later('e_f_post_courier',rint(1,3),{});return '말 판 값의 삼 할이 당신 몫이었다.'}},
     {l:'역졸에게 입단속을 시킨다',act:()=>{P.s.매-=1;return '역졸은 고개를 숙였다. 그 눈빛에 실망이 묻어 있었다.'}}],
 to:()=>'장부는 그대로 위로 올라갔다.'},
{id:'e_f_post_witness',w:1,when:()=>false,time:7,title:'역졸의 목숨',han:'證',hr:'증',
 text:()=>`역장 일이 재판에 걸렸다. 증인인 역졸 ${jo(P.tmp.q.n,'이/가')} 밤마다 누가 집을 엿본다며 당신을 찾아왔다.`,
 ch:[{l:'내 집에 숨겨 준다',st:'무',d:45,act:ok=>{if(ok){P.fame+=8;return `${jo(P.tmp.q.n,'이/가')} 법정에서 증언했다. 역장의 목이 베였다.`}hurt(30,'자객의 칼');return '자객이 담을 넘었다. 역졸을 지키다 당신이 칼을 맞았다.'}},
     {l:'다른 고을로 빼돌린다',st:'지',d:40,act:ok=>{if(ok){P.fame+=4;return '역졸은 살았다. 증언은 서면으로만 남았고 역장은 유배되었다.'}P.s.매-=2;return '그를 실은 수레가 도중에 사라졌다.'}},
     {l:'혼자 몸을 사리라 한다',act:()=>{P.s.매-=3;return `사흘 뒤 ${jo(P.tmp.q.n,'이/가')} 우물에서 떠올랐다. 재판은 흐지부지되었다.`}}],
 to:()=>{P.s.매-=2;return '그는 대답을 듣지 못하고 돌아갔다. 다시 오지 않았다.'}},
{id:'e_f_post_courier',w:1,when:()=>false,time:6,title:'늦은 급보',han:'急',hr:'급',
 text:()=>'급보를 실은 파발이 역참에서 말을 갈아타지 못해 하루가 늦었다. 전선이 무너졌다며 조사관이 내려왔다.',
 ch:[{l:'역장에게 모든 죄를 넘긴다',st:'지',d:50,act:ok=>{if(ok){P.wealth=Math.max(0,P.wealth-5);return '역장 혼자 목이 베였다. 그의 눈이 끝까지 당신을 보았다.'}hurt(30,'옥살이');if(P.path==='관')P.rank=Math.max(0,P.rank-1);return '역장이 당신 몫까지 털어놓았다.'}},
     {l:'받은 돈으로 말을 사 채운다',req:()=>P.wealth>=12,rq:'1만 2천 전 필요',act:()=>{P.wealth-=12;return '조사관이 왔을 때 마구간은 찼다. 문제는 늦은 하루뿐이었다.'}},
     {l:'모든 것을 자백한다',act:()=>{P.fame=Math.max(0,P.fame-6);P.wealth=Math.max(0,P.wealth-8);if(P.path==='관')P.rank=Math.max(0,P.rank-1);return '죄를 털어놓아 목숨은 건졌다. 자리와 재물을 잃었다.'}}],
 to:()=>{hurt(20,'문초');return '조사관 앞에 끌려갔다.'}},
{id:'e_casebook',w:()=>P.focus==='study'?6:2,cd:8,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.s.지>=7,time:7,title:'판례 정리',han:'律',hr:'율',
 text:()=>'현의 판결문이 뒤죽박죽이다. 같은 죄에 어떤 해는 곤장, 어떤 해는 벌금이다. 누군가 정리해야 한다.',
 ch:[{l:'밤을 새워 판례집을 엮는다',st:'지',d:45,act:ok=>{P.hp=Math.max(1,P.hp-5);if(ok){P.s.지+=3;later('e_f_casebook',rint(2,5),{});return '삼백 건을 죄목별로 엮었다. 눈이 침침해졌다.'}P.s.지+=1;return '반도 못 하고 쓰러졌다.'}},
     {l:'상관 이름으로 올려 준다',act:()=>{P.s.매+=2;if(P.rank<4&&R()<.4)P.rank++;return '상관이 칭찬을 받았다. 그는 당신을 아꼈다.'}},
     {l:'내 일만 한다',act:()=>{P.wealth+=2;return '혼란은 그대로였다. 녹봉은 꼬박꼬박 나왔다.'}}],
 to:()=>'정리할 사람은 나타나지 않았다.'},
{id:'e_f_casebook',w:1,when:()=>false,time:6,title:'판례집의 쓸모',han:'典',hr:'전',
 text:()=>'당신이 엮은 판례집이 이웃 현에까지 베껴져 돌고 있다. 군에서 그 엮은이를 찾는다는 전갈이 왔다.',
 ch:[{l:'군으로 올라간다',req:()=>P.path==='관',rq:'관리일 때만',act:()=>{P.rank=Math.min(P.rank+1,9);P.fame+=6;return '군의 결조연이 되었다. 판례집은 당신 이름으로 남았다.'}},
     {l:'판례집을 고치고 다듬는다',st:'지',d:45,act:ok=>{if(ok){P.s.지+=2;P.fame+=8;hon('판례집을 엮은 자',1/5000);return '두 번째 판에서 오류 서른 곳을 바로잡았다. 학자들이 인용하기 시작했다.'}return '고칠수록 일이 늘었다.'}},
     {l:'필사본을 팔아 돈을 번다',act:()=>{P.wealth+=10;P.fame+=2;return '서리 지망생들이 다투어 샀다.'}}],
 to:()=>{P.fame+=2;return '판례집은 저 혼자 퍼졌다.'}},
{id:'e_relief',w:()=>P.gun&&gunState(P.gun,P.year).harvest==='흉년'?7:1,cd:6,season:0,when:()=>P.year>=160&&P.year<=260&&P.path==='관'&&P.rank>=2,time:7,title:'진휼',han:'賑',hr:'진',
 text:()=>'춘궁기에 관아 앞에 굶은 사람들이 쓰러져 있다. 창고에는 곡식이 있지만 위에서 열라는 명령이 없다.',
 ch:[{l:'명령 없이 창고를 연다',act:()=>{P.fame+=8;P.s.매+=3;later('e_f_relief_inquiry',rint(1,2),{});return '죽을 쑤어 나누었다. 사흘 만에 쓰러진 이들이 일어났다.'}},
     {l:'위에 급보를 올리고 기다린다',st:'정',d:45,act:ok=>{if(ok){P.fame+=3;return '보름 만에 허락이 떨어졌다. 그사이 서른 명이 죽었다.'}P.fame=Math.max(0,P.fame-3);return '급보는 답이 없었다. 성 밖에 무덤이 늘었다.'}},
     {l:'창고 곡식을 몰래 비싸게 판다',act:()=>{P.wealth+=15;P.fame=Math.max(0,P.fame-5);P.flags.corrupt=1;return '부잣집들이 곡식을 사 갔다. 쌀값이 열 배로 뛰었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-4);return '망설이는 사이 사람들이 죽어 나갔다.'}},
{id:'e_f_relief_inquiry',w:1,when:()=>false,time:7,title:'멋대로 연 창고',han:'倉',hr:'창',
 text:()=>'명령 없이 관창을 연 일로 조사관이 내려왔다. 창고 장부의 빈칸을 손가락으로 짚으며 누구 영으로 열었냐고 묻는다.',
 ch:[{l:'내 뜻이었다고 당당히 말한다',st:'정',d:50,act:ok=>{if(ok){P.fame+=6;later('e_f_relief_fame',rint(2,5),{});return '조사관이 급암이 하내 창고를 연 고사를 떠올렸다. 벌 대신 보고서에 칭찬을 적었다.'}P.fame+=3;if(P.path==='관')P.rank=Math.max(0,P.rank-1);later('e_f_relief_fame',rint(2,5),{});return '자리가 하나 깎였다. 관아 앞에 백성들이 모여 울었다.'}},
     {l:'구제받은 백성들의 연명장을 내민다',st:'매',d:45,act:ok=>{if(ok){P.fame+=4;return '천 명의 손도장이 찍힌 비단이었다. 조사관이 말없이 붓을 내려놓았다.'}P.wealth=Math.max(0,P.wealth-8);return '조사관은 백성 손도장은 증거가 아니라며 벌금을 매겼다.'}},
     {l:'태수의 구두 허락이 있었다고 둘러댄다',st:'지',d:()=>P.gov&&P.gov.trait==='청렴'?40:60,act:ok=>{if(ok)return P.gov?`태수 ${jo(P.gov.n,'이/가')} 말없이 고개를 끄덕여 주었다.`:'태수가 말없이 고개를 끄덕여 주었다.';hurt(25,'문책');P.fame=Math.max(0,P.fame-4);return '태수가 그런 적 없다고 했다. 거짓말까지 죄목에 붙었다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-2);if(P.path==='관')P.rank=Math.max(0,P.rank-1);return '답을 못 하자 자리가 깎였다.'}},
{id:'e_f_relief_fame',w:1,when:()=>false,time:6,title:'살린 사람들',han:'活',hr:'활',
 text:()=>'그 봄 창고를 열어 살린 사람들이 길에서 당신을 알아보고 절을 한다. 고을 노인들이 당신을 효렴으로 천거하자는 글을 돌린다.',
 ch:[{l:'천거를 받아들인다',req:()=>P.path==='관',rq:'관리일 때만',act:()=>{P.rank=Math.min(P.rank+1,9);P.fame+=10;hon('창고를 연 관리',1/3000);return '천거가 조정에 올라갔다. 한 자리 높은 관인을 받았다.'}},
     {l:'사양하고 노인들에게 술을 낸다',act:()=>{P.fame+=6;P.s.매+=2;return '사양할수록 이름이 더 높아졌다.'}},
     {l:'그 이름으로 다음 흉년 대비 의창을 만든다',st:'통',d:45,act:ok=>{if(ok){P.fame+=8;P.s.통+=2;return '집집이 곡식을 조금씩 모아 마을 창고를 지었다.'}P.wealth=Math.max(0,P.wealth-4);return '모은 곡식을 향리가 빼돌렸다.'}}],
 to:()=>{P.fame+=3;return '노인들이 당신 이름을 비석에 새겼다.'}},
{id:'e_partner',w:4,cd:7,when:()=>P.year>=160&&P.year<=260&&P.path==='상'&&P.age>=18,time:7,title:'동업 제안',han:'伙',hr:'화',
 text:()=>{P.tmp.n=mkName();P.tmp.to=pick(['형주','익주','양주','량주','유주']);return `장터에서 사귄 ${jo(P.tmp.n,'이/가')} ${P.tmp.to}로 가는 상단에 밑천을 반씩 대자 한다. 이 할 이문은 장담한다고 한다.`},
 ch:[{l:'가진 돈 절반을 댄다',req:()=>P.wealth>=10,rq:'1만 전 필요',act:()=>{const v=Math.floor(P.wealth*.5);P.wealth-=v;later('e_f_partner_back',rint(1,3),{n:P.tmp.n,to:P.tmp.to,v});return `${money(v)}을 맡겼다. 수레가 ${P.tmp.to} 쪽으로 떠났다.`}},
     {l:'직접 따라간다',st:'무',d:50,act:ok=>{if(ok){P.wealth+=10;P.s.무+=1;return `${P.tmp.to}까지 다녀왔다. 길에서 도적을 두 번 떼어 냈다. 이문이 남았다.`}hurt(25,'상단 습격');P.wealth=Math.floor(P.wealth*.7);return '고갯길에서 도적을 만났다. 짐 절반을 잃었다.'}},
     {l:'사람을 아직 모른다며 거절한다',act:()=>'그는 다른 사람을 찾아갔다. 그 사람이 돈을 벌었는지는 모른다.'}],
 to:()=>'그는 기다리지 않았다.'},
{id:'e_f_partner_back',w:1,when:()=>false,time:6,title:'돌아온 수레',han:'車',hr:'거',
 text:()=>{P.tmp.ok=R()<.55;return P.tmp.ok?`${P.tmp.q.to}에 갔던 ${P.tmp.q.n}의 수레가 돌아왔다. 짐칸이 비단과 옻으로 가득하다.`:`${P.tmp.q.to}에 간 ${P.tmp.q.n}의 수레가 돌아오지 않는다. 그가 그쪽에서 집을 샀다는 소문이 들린다.`},
 ch:[{l:'약속한 몫을 나눈다',req:()=>P.tmp.ok,rq:'수레가 돌아왔을 때만',act:()=>{P.wealth+=Math.round(P.tmp.q.v*1.8);P.fame+=2;return '맡긴 돈이 두 배 가까이 되어 돌아왔다.'}},
     {l:'다음 상단에 몫을 그대로 다시 싣는다',req:()=>P.tmp.ok,rq:'수레가 돌아왔을 때만',act:()=>{P.wealth+=Math.round(P.tmp.q.v*.3);later('e_f_partner_big',rint(1,3),{n:P.tmp.q.n,v:Math.round(P.tmp.q.v*1.5)});return '이문 일부만 받고 나머지는 다시 수레에 실었다.'}},
     {l:'직접 찾으러 간다',req:()=>!P.tmp.ok,rq:'수레가 안 돌아왔을 때만',st:'지',d:55,act:ok=>{moveTo(P.tmp.q.to);if(ok){P.wealth+=P.tmp.q.v;return `${P.tmp.q.to}의 장터에서 그를 찾아냈다. 관에 끌고 가겠다 하자 원금을 내놓았다.`}hurt(20,'객지 고생');return `${P.tmp.q.to}까지 갔지만 그는 이미 다른 데로 떴다.`}},
     {l:'떼인 셈 친다',req:()=>!P.tmp.ok,rq:'수레가 안 돌아왔을 때만',act:()=>{P.s.지+=2;return '비싼 수업료였다. 그 뒤로 계약은 꼭 문서로 했다.'}}],
 to:()=>'소식만 기다리다 한 해가 갔다.'},
{id:'e_f_partner_big',w:1,when:()=>false,time:6,title:'두 번째 수레',han:'商',hr:'상',
 text:()=>`${P.tmp.q.n}과 다시 보낸 수레가 돌아올 때다. 그런데 길목 군현에 난리가 났다는 소문이 먼저 왔다.`,
 ch:[{l:'기다린다',p:.5,act:ok=>{if(ok){P.wealth+=P.tmp.q.v*2;P.fame+=4;return '수레가 난리를 피해 돌아왔다. 난리 통이라 값이 세 배로 뛰었다.'}return '수레는 끝내 오지 않았다. 동업자도 짐도 난리 속에 사라졌다.'}},
     {l:'사람을 사서 마중 보낸다',req:()=>P.wealth>=6,rq:'6천 전 필요',st:'통',d:45,act:ok=>{P.wealth-=5;if(ok){P.wealth+=Math.round(P.tmp.q.v*1.6);return '마중 간 무리가 수레를 호위해 왔다.'}P.wealth+=Math.round(P.tmp.q.v*.3);return '짐 대부분은 약탈당했다. 겨우 한 수레만 건졌다.'}},
     {l:'몫을 다른 상인에게 헐값에 넘긴다',act:()=>{P.wealth+=Math.round(P.tmp.q.v*.6);return '손해는 봤지만 손에 쥔 것이 있다.'}}],
 to:()=>'소문만 무성했다.'},
{id:'e_fakecoin',w:()=>P.year>=190&&P.year<=230?5:3,cd:6,when:()=>P.year>=160&&P.year<=260&&['상','민'].includes(P.path)&&P.age>=16,time:6,title:'위조 동전',han:'錢',hr:'전',
 text:()=>'손님에게 받은 오수전 꾸러미가 이상하게 가볍다. 납을 섞은 가짜가 절반이다.',
 ch:[{l:'다른 손님에게 슬쩍 넘긴다',act:()=>{if(R()<.6){P.s.매-=1;return '가짜 돈은 다른 사람 손으로 넘어갔다.'}later('e_f_coin_traced',rint(1,2),{});return '돈을 받은 손님이 동전을 이로 깨물어 보았다.'}},
     {l:'시장 관리에게 신고한다',st:'정',d:45,act:ok=>{if(ok){P.wealth+=3;P.fame+=3;return '위조범 일당이 잡혔다. 포상금이 나왔다.'}P.wealth=Math.max(0,P.wealth-4);return '관리는 신고한 당신 돈부터 압수했다.'}},
     {l:'녹여서 쇳값이라도 건진다',act:()=>{P.wealth=Math.max(0,P.wealth-2);return '구리와 납을 갈라 대장장이에게 팔았다. 손해가 반으로 줄었다.'}}],
