<title>난세일생</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Song+Myung&display=swap">
<style>
/* Layout: one-screen game. Status bar, profile strip, a chronicle of bamboo-slip rows, and a timed decision sheet pinned to the bottom. Palette: Han bronze verdigris on celadon paper. */
:root{
  --paper:#E3E7DE; --paper-2:#D4DACD; --slip:#EDF0E8; --ink:#1B211E; --ink-soft:#545F58; --line:#B5BEB1;
  --bronze:#2B675C; --bronze-soft:#2b675c22; --blood:#9B2921; --brass:#86651F;
  --m-han:#BCC0B5; --m-wei:#4F6FA8; --m-shu:#4E8F5A; --m-wu:#B5483A; --m-yuan:#C49A3A; --m-jin:#7D5BA6; --m-lb:#5E9C9A; --m-lz:#A0784E; --m-dong:#6B5B4E; --m-ys:#C07AA0; --m-oth:#8C8F6A; --sea:#C3D1CE; --river:#4A7F93;
  --f-disp:'Song Myung','Nanum Myeongjo','Batang',serif;
  --f-body:'Gowun Batang','Noto Serif KR','Batang',serif;
  --f-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111613; --paper-2:#19201C; --slip:#161C19; --ink:#DCE2D8; --ink-soft:#97A39A; --line:#2E3832;
  --bronze:#6CB4A3; --bronze-soft:#6cb4a322; --blood:#E2665B; --brass:#D2AA5B; --m-han:#3A423D; --m-wei:#6F8FCB; --m-shu:#6DB37A; --m-wu:#D7695A; --m-yuan:#D9B45A; --m-jin:#A487CC; --m-lb:#7CC1BE; --m-lz:#C29B6E; --m-dong:#9A887A; --m-ys:#DC97BC; --m-oth:#AAB081; --sea:#0B1515; --river:#5E9DB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111613; --paper-2:#19201C; --slip:#161C19; --ink:#DCE2D8; --ink-soft:#97A39A; --line:#2E3832;
  --bronze:#6CB4A3; --bronze-soft:#6cb4a322; --blood:#E2665B; --brass:#D2AA5B; --m-han:#3A423D; --m-wei:#6F8FCB; --m-shu:#6DB37A; --m-wu:#D7695A; --m-yuan:#D9B45A; --m-jin:#A487CC; --m-lb:#7CC1BE; --m-lz:#C29B6E; --m-dong:#9A887A; --m-ys:#DC97BC; --m-oth:#AAB081; --sea:#0B1515; --river:#5E9DB0; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto}

/* ---------- title ---------- */
#title{padding-block:28px 32px;gap:22px}
.hero{display:flex;gap:22px;align-items:flex-start}
.vtitle{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--f-disp);font-size:clamp(52px,13vw,84px);line-height:1;letter-spacing:.06em;color:var(--ink);
  border-left:2px solid var(--blood);padding-left:14px;flex:none}
.hero-text{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:4px}
.hero-text h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.2;text-wrap:balance}
.hero-text .sub{margin:0;color:var(--ink-soft)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-family:var(--f-ui);font-size:14px}
.rules li{display:flex;gap:10px}
.rules b{font-family:var(--f-disp);font-weight:400;color:var(--bronze);flex:none;width:2.6em}
.rules b small{font-family:var(--f-ui);font-size:11px;margin-left:3px;color:var(--ink-soft)}
.odds-table{border-top:1px solid var(--line);padding-top:14px}
.odds-table h2{margin:0 0 8px;font-family:var(--f-ui);font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
.odds-table table{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:13.5px;font-variant-numeric:tabular-nums}
.odds-table td{padding:4px 0;border-bottom:1px dashed var(--line)}
.odds-table td:last-child{text-align:right;color:var(--ink-soft)}
.odds-table tr.rare td{color:var(--brass)}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:2px;font-family:var(--f-disp);font-size:18px;letter-spacing:.08em}
.btn:hover{background:var(--bronze);border-color:var(--bronze)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--bronze-soft);color:var(--ink)}
.best{font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)}

/* ---------- game ---------- */
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 8px;border-bottom:1px solid var(--line);font-family:var(--f-ui);font-size:13px}
.bar .era{font-family:var(--f-disp);font-size:20px;line-height:1.1}
.bar .era small{font-family:var(--f-ui);font-size:12px;color:var(--ink-soft);margin-left:6px}
.bar .pop{margin-left:auto;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.25}
.bar .pop b{display:block;color:var(--ink);font-weight:400;font-size:14px}
.tool{border:1px solid var(--line);background:transparent;border-radius:2px;padding:4px 8px;font-family:var(--f-ui);font-size:12px;min-width:38px}
.tool:hover{border-color:var(--bronze)}
.tool{white-space:nowrap;flex:none}
.bar .pop{white-space:nowrap}

.profile{padding-block:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.who .nm{font-family:var(--f-disp);font-size:24px;line-height:1.1}
.who .zi{font-size:13px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-ui);font-size:12px}
.chip{border:1px solid var(--line);padding:1px 8px;border-radius:2px;color:var(--ink-soft)}
.chip.fac{border-color:var(--bronze);color:var(--bronze)}
.chip.rank{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.st{display:flex;flex-direction:column;gap:3px;min-width:0}
.st .lab{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.st .lab b{font-family:var(--f-disp);font-weight:400;color:var(--ink);font-size:14px;white-space:nowrap}
.st .lab b em{font-style:normal;font-family:var(--f-ui);font-size:11px;color:var(--ink-soft);margin-left:3px}
.meter{height:4px;background:var(--paper-2);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink-soft);transition:width .4s}
.st.hp .meter i{background:var(--blood)}
.st.wl .meter i{background:var(--brass)}
.st.fm .meter i{background:var(--cinnabar,#9a3b2e)}

.chron{flex:1;min-height:0;overflow-y:auto;margin:0;padding:6px 0 12px;list-style:none;scroll-behavior:smooth}
.chron li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--line);animation:in .35s ease-out}
@keyframes in{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.ly{font-family:var(--f-disp);font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink-soft);border-right:2px solid var(--paper-2);padding-right:8px;text-align:right}
.ly small{display:block;font-family:var(--f-ui);font-size:11px}
.lt{min-width:0}
.lt p{margin:0}
.k-flow .lt{color:var(--ink-soft)}
.k-world .lt{color:var(--bronze);font-family:var(--f-ui);font-size:14px}
.k-local .lt{color:var(--brass);font-family:var(--f-ui);font-size:14px}
.k-local .lt::before{content:"鄕 고을";font-family:var(--f-disp);font-size:12px;border:1px solid var(--brass);padding:0 4px;margin-right:8px;border-radius:2px}
.k-world .lt::before{content:"天下 천하";font-family:var(--f-disp);font-size:12px;border:1px solid var(--bronze);padding:0 4px;margin-right:8px;border-radius:2px}
.k-event .lt b{font-family:var(--f-disp);font-weight:400;font-size:16px}
.k-event .lt .pick{font-family:var(--f-ui);font-size:13px;color:var(--bronze);margin-left:6px}
.k-event .lt .pick.late{color:var(--blood)}
.k-key .lt{font-weight:700}
.k-birth .lt,.k-death .lt{font-family:var(--f-disp);font-size:17px}
.k-death .lt{color:var(--blood)}
.profile{flex-direction:row;align-items:center;gap:12px}
.prof-l{flex:none;width:min(46%,230px)}
.prof-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.profile .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.radar{display:block;width:100%;height:auto;overflow:visible}
.radar .rg{fill:none;stroke:var(--line);stroke-width:.7}
.radar .rv{fill:var(--bronze);fill-opacity:.22;stroke:var(--bronze);stroke-width:1.5;stroke-linejoin:round}
.radar .rl{font-family:var(--f-ui);font-size:13px;fill:var(--ink-soft)}
.radar .rhj{font-family:var(--f-disp);fill:var(--ink)}
.radar .rnum{fill:var(--ink);font-weight:700}
.card-radar{width:100%;max-width:340px;margin:0 auto}
.pt{flex:none;display:block;background-image:url(portraits.webp);background-size:1200% 1100%;background-color:var(--paper-2);border:1px solid var(--line);border-radius:3px}
.pt-me{width:58px;height:58px}
.who{align-items:center}
.say .pt{width:54px;height:54px}
.pt-s{width:28px;height:28px}
.card .pt{width:76px;height:76px}
.term{border-bottom:1px dotted var(--bronze);cursor:help;border-radius:1px}
.term:hover,.term:focus-visible{background:var(--bronze-soft);outline:none}
.gloss{position:fixed;z-index:60;width:max-content;max-width:min(300px,calc(100vw - 32px));background:var(--ink);color:var(--paper);padding:10px 12px;border-radius:4px;font-family:var(--f-ui);font-size:13px;line-height:1.55;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.gloss b{display:block;font-family:var(--f-disp);font-weight:400;font-size:16px;margin-bottom:2px}
.gloss p{margin:0}
.hint{margin:0;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-soft)}
.wall,.tidings{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.wall h2{margin:0;font-family:var(--f-ui);font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
.wall h3,.tidings h3{margin:6px 0 0;font-family:var(--f-ui);font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
.wall p,.tidings p{margin:0}
.wall ul,.wall ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.wall .mut{color:var(--ink-soft);font-family:var(--f-ui);font-size:12.5px;font-variant-numeric:tabular-nums}
.tidings b{color:var(--brass);font-weight:700}
.focus{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-ui);font-size:12px}
.focus b{font-weight:400;color:var(--ink-soft);margin-right:2px}
.focus button{border:1px solid var(--line);background:transparent;padding:2px 8px;border-radius:2px;font:inherit;color:var(--ink)}
.duty{font-family:var(--f-ui);font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.duty summary{cursor:pointer;list-style:none;color:var(--ink)}.duty summary::-webkit-details-marker{display:none}
.duty summary b{font-weight:400;color:var(--ink-soft);margin-right:6px}.duty summary::after{content:' ▾';color:var(--ink-soft)}
.duty[open] summary::after{content:' ▴'}.duty p{margin:6px 0;color:var(--ink-soft);line-height:1.5}
.duty .dr{display:grid;grid-template-columns:4.5em 6em 1fr;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)}.duty .dr em{font-style:normal;color:var(--ink-soft)}
.fxl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;font-family:var(--f-ui);font-size:11px}
.fxl span{padding:0 6px;border-radius:2px;border:1px solid}.fxl .up{color:#2f6b4a;border-color:#2f6b4a55}.fxl .dn{color:#9a3b2e;border-color:#9a3b2e55}
.focus button.on{background:var(--bronze);border-color:var(--bronze);color:var(--paper)}
.namebox{display:flex;gap:8px;align-items:center}
.nsur{font-family:var(--f-disp);font-size:24px;flex:none}
#nameIn{flex:1;min-width:0;font-family:var(--f-disp);font-size:22px;padding:6px 10px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:2px}
#nameIn:focus{outline:2px solid var(--bronze);outline-offset:1px}
.nameok{font-size:15px;padding:9px 14px;flex:none}
.namehint{font-family:var(--f-ui);font-size:12px;color:var(--ink-soft)}
.say{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--bronze);background:var(--paper);padding:8px 10px}
.say-seal{flex:none;width:34px;height:34px;border:1.5px solid var(--bronze);color:var(--bronze);display:grid;place-items:center;font-family:var(--f-disp);font-size:17px;border-radius:50%}
.say-body{min-width:0}
.say b{display:block;font-family:var(--f-disp);font-weight:400;font-size:14px;color:var(--bronze);line-height:1.3}
.say p{margin:0;font-size:15px}
.vs{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--paper);padding:10px 12px}
.vs-row{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) auto;gap:8px;align-items:center;font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums}
.vs-n{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;min-width:0}
.vs-n span:last-child{overflow:hidden;text-overflow:ellipsis}
.vs-bar{height:10px;background:var(--paper-2);overflow:hidden}
.vs-bar i{display:block;height:100%;width:100%;transition:width .5s ease-out}
.vs .me .vs-bar i{background:var(--bronze)}
.vs .foe .vs-bar i{background:var(--blood)}
.vs-v{text-align:right;min-width:3.5em}
.vs-meta{font-family:var(--f-ui);font-size:12px;color:var(--ink-soft)}
.atlas{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.atlas h2,.map-pane h2{margin:0;font-family:var(--f-ui);font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
.mapcv{display:block;width:100%;max-width:560px;height:auto;aspect-ratio:516/404;margin:0 auto}
.atlas-ctl{display:flex;align-items:center;gap:10px;font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums}
.atlas-ctl input{flex:1;min-width:0;accent-color:var(--bronze)}
.atlas-ctl output{min-width:10em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-ui);font-size:12px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.map-pane{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.map-pane .mapcv{max-width:300px}
.tool.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#title,#end{width:100%;max-width:680px;margin-inline:auto}
@media (min-width:980px){
  .wrap{max-width:1080px}
  #game:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:28px}
  #game>*{grid-column:1}
  #game>.map-pane{grid-column:2;grid-row:1/5;align-self:start;border-bottom:0;padding-top:14px}
  #mapPane[hidden]{display:flex!important}
  #game .map-pane .mapcv{max-width:none}
  #mapBtn{display:none}
  #game .sheet{margin-inline:0;padding-inline:16px}
}
.reg{border:1px solid var(--line);background:var(--slip);padding:10px 12px;display:flex;flex-direction:column;gap:3px;max-width:440px;font-family:var(--f-ui);font-size:13px}
.reg .rh{font-family:var(--f-disp);font-size:15px;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:2px}
.reg .rr{display:grid;grid-template-columns:5.4em minmax(0,1fr) auto;gap:8px;font-variant-numeric:tabular-nums}
.reg .rr .r1{color:var(--ink-soft)}
.reg .rr.me{color:var(--blood);font-weight:700}
.reg .rn{color:var(--ink-soft);font-size:11px;margin-top:3px}
.chip.trait{border-color:var(--brass);color:var(--brass)}
.chip.lord{border-color:var(--blood);color:var(--blood)}
.dex{border-top:1px solid var(--line);padding-top:14px;font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)}
.dex h2{margin:0 0 8px;font-weight:400;font-size:12px;letter-spacing:.12em}
.dex ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.dex li{border:1px dashed var(--line);padding:1px 8px;border-radius:2px}
.dex li.got{border-style:solid;border-color:var(--bronze);color:var(--bronze)}

/* decision sheet */
.roll{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--paper);padding:16px}
.roll-in{width:min(420px,100%);text-align:center}
.roll-h{font-family:var(--f-ui);font-size:13px;color:var(--ink-soft);margin:0 0 18px;letter-spacing:.05em}
.roll dl{margin:0;display:grid;gap:10px}
.roll .rr{display:grid;grid-template-columns:5em 1fr;align-items:center;border-bottom:1px solid var(--line);padding:8px 4px}
.roll dt{font-family:var(--f-ui);font-size:12px;color:var(--ink-soft);text-align:left}
.roll dd{margin:0;font-size:22px;text-align:right;color:var(--ink-soft);opacity:.55;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roll dd.hit{color:var(--ink);opacity:1;animation:rollhit .35s ease-out}
.roll dd.rare{color:var(--bronze)}
.roll dd.hit{transform-origin:right center}
@keyframes rollhit{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.roll-skip{font-family:var(--f-ui);font-size:11px;color:var(--ink-soft);margin-top:20px;opacity:.6}
.sheet{background:var(--slip);border-top:2px solid var(--ink);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px}
.seal{flex:none;width:44px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1;background:var(--blood);color:var(--slip);font-family:var(--f-disp);font-size:22px;border-radius:3px}
.seal small{font-family:var(--f-ui);font-size:11px;opacity:.9}
.sheet h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1.2}
.secs{margin-left:auto;font-family:var(--f-disp);font-size:26px;font-variant-numeric:tabular-nums;color:var(--blood);min-width:2ch;text-align:right}
.timer{height:5px;background:var(--paper-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--blood);transform-origin:left;width:100%}
.sheet .story{margin:0;max-width:62ch}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--ink);background:var(--paper);padding:10px 12px;border-radius:2px;font-family:var(--f-body);font-size:15px}
.choice:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.choice:hover:not(:disabled) .key,.choice:hover:not(:disabled) .tag{color:var(--paper);border-color:var(--paper)}

function vsClash(m,f){
  const c=VS.cfg,pm=c.pow('me',m,VS),pf=c.pow('foe',f,VS);let dm=0,df=0,k;
  if(!m){dm=pf*1.3;k='idle';}

  else if(c.beats[m]===f){df=pm*c.mul[m];k='win';}

}
function vsAct(mine){
  if(!VS||VS.busy)return;VS.busy=true;cancelAnimationFrame(evRAF);

}

const pv=p=>Math.min(.95,p+((P.traits||[]).includes('강운')?.1:0)+(P.flags&&P.flags.omen===P.year?.05:0));
function see(name){if(!P.seen.includes(name))P.seen.push(name);try{const s=new Set(JSON.parse(localStorage.getItem('nanse-dex')||'[]'));s.add(name);localStorage.setItem('nanse-dex',JSON.stringify([...s]));}catch(_){}}
function figHere(){const y=P.year;return FIG.filter(f=>f.id!==P.name&&f.at.some(([a,b,r])=>y>=a&&y<=b&&r===P.region));}
const dots=v=>'●'.repeat(v)+'○'.repeat(5-v);
function bond(n,txt){const id=P.tmp.fig.id;const v=clamp((P.bonds[id]||0)+n,0,5);P.bonds[id]=v;return `${txt} (${id} 인연 ${dots(v)})`;}
function bondsStr(){return Object.entries(P.bonds).filter(([,v])=>v>0).map(([k,v])=>`${k} ${dots(v)}`).join(', ')||'없음';}
function roll(p){const ok=R()<p;if(ok)P.luck*=p;return ok;}

 text:()=>'조조의 둔전관이 왔다. 관청 소를 빌려 쓰면 수확의 6할, 제 소를 끌고 오면 절반을 바치라 한다.',

     {l:'제 소를 끌고 들어간다',req:()=>P.wealth>=10,rq:'소 한 마리(1만 전) 필요',act:()=>{P.flags.tuntian=1;P.wealth+=8;later('f1_tuntian_tax',rint(2,4),{});return '소를 끌고 둔전에 들었다. 거둔 것의 절반은 내 몫이다.'}},
     {l:'남의 땅에 묶이지 않는다',act:()=>{P.wealth=Math.max(0,P.wealth-2);return '떠돌이로 남았다. 그해 겨울 유민들 틈에서 쌀겨로 버텼다.'}}],
 to:()=>'대답을 미루다 자리가 찼다.'},
{id:'guandu',prio:1,when:()=>P.year===200&&P.path==='군'&&['조조','원소'].includes(ruler()),time:7,title:'관도 대치',han:'渡',hr:'도',
 text:()=>ruler()==='원소'?'원소의 십만 대군이 관도에서 조조와 맞섰다. 군량은 오소에 쌓여 있다.':'원소의 십만 대군 앞에서 조조군은 군량이 바닥났다. 허유가 원소를 버리고 넘어왔다는 소문이 돈다.',
 ch:[{l:'오소 야습에 자원한다',req:()=>ruler()==='조조',rq:'조조군만',st:'무',d:55,act:ok=>{if(ok){P.fame+=16;return '조조를 따라 오소로 달려가 군량고에 불을 질렀다. 원소군이 무너졌다.'}hurt(50,'오소의 불길');return '어둠 속 혼전에서 크게 다쳤다.'}},
     {l:'오소를 지킨다',req:()=>ruler()==='원소',rq:'원소군만',st:'무',d:60,act:ok=>{if(ok){P.fame+=5;later('f1_guandu_after',2,{});return '불길 속을 빠져나왔다. 사로잡힌 순우경은 코가 베였다고 한다.'}die('오소의 불길');return '한밤중 조조의 기병이 들이닥쳤다.'}},
     {l:'진채를 사수한다',act:()=>{P.fame+=5;hurt(10,'관도의 화살');if(ruler()==='원소'){later('f1_guandu_after',2,{});return '조조의 벽력거가 날린 돌덩이에 망루가 무너졌다. 그래도 끝까지 자리를 지켰다.'}return '원소군이 흙산 망루에서 화살을 퍼부었다. 방패를 머리에 이고 다니며 끝까지 버텼다.'}},
     {l:'몰래 투항 서신을 보낸다',st:'지',d:50,act:ok=>{if(ruler()==='조조'){P.fame-=3;return '싸움이 끝나자 조조는 원소 진영에서 나온 편지들을 읽지도 않고 불태웠다. 목숨을 건졌다.'}if(ok){moveTo('연주');P.fame+=8;return '장합을 따라 조조에게 투항했다. 새 주인은 너그러웠다.'}hurt(40,'군율');return '서신이 발각되어 곤장을 맞았다.'}}],
 to:()=>{hurt(35,'관도 전투');if(ruler()==='원소')later('f1_guandu_after',2,{});return '우왕좌왕하다 화살을 맞았다.'}},
{id:'longzhong',w:4,once:1,when:()=>inR('형주')&&P.year>=200&&P.year<=207&&P.age>=15,time:8,title:'융중의 선비',han:'龍',hr:'룡',
 text:()=>'양양 서쪽 융중. 밭을 갈며 양보음을 부르는 젊은 선비가 스스로를 관중과 악의에 견준다.',
 ch:[{l:'천하의 형세를 묻는다',act:()=>{P.s.지+=7;later('f1_longzhong',Math.max(1,207-P.year),{a:1});return '"조조와는 다투지 말고 손권과는 손을 잡고, 형주와 익주를 차지하라." 밤새 귀를 기울였다.'}},
     {l:'농사 이야기만 나눈다',act:()=>{P.s.정+=3;later('f1_longzhong',Math.max(1,207-P.year),{a:2});return '"세상일보다 보리 이삭이 걱정이오." 둘은 해가 질 때까지 밭두렁에 앉아 있었다.'}},
     {l:'허풍이라며 비웃는다',act:()=>{P.s.매-=1;later('f1_longzhong',Math.max(1,207-P.year),{a:0});return '선비는 화내지 않고 웃기만 했다.'}}],
 to:()=>'선비는 낮잠을 자고 있었다.'},
{id:'changban',prio:1,when:()=>P.year===208&&inR('형주')&&P.path!=='군'&&P.age>=6,time:6,title:'장판의 피난',han:'奔',hr:'분',
 text:()=>'조조의 대군이 남하한다. 유비가 백성 십만을 이끌고 남쪽으로 달아난다. 등 뒤에서 호표기의 말발굽 소리가 울린다.',
 ch:[{l:'유비를 따라 달린다',p:.65,act:ok=>{if(ok){P.fame+=3;return '한 장수가 갓난아이를 품에 안고 혼전 속을 빠져나가는 것을 보았다. 조운이라 했다.'}hurt(40,'장판의 혼전');return '호표기에 짓밟혔다.'}},
     {l:'고향에 남는다',act:()=>{P.wealth=Math.floor(P.wealth*.8);return '조조군이 곡식을 거두어 갔다. 이듬해 이 땅의 주인이 또 바뀌었다.'}},
     {l:'조조군에 투신한다',req:()=>P.age>=16&&P.age<=45,rq:'16~45세',st:'무',d:45,act:ok=>{setPath('군');if(ok){P.fame+=4;P.wealth+=3;return '조조군의 길잡이가 되어 물길을 안내했다. 상으로 비단을 받았다.'}hurt(20,'군율');return '"첩자 아닌가." 의심받아 매를 맞은 뒤 졸병이 되었다.'}}],
 to:()=>{hurt(25,'장판의 혼전');return '피난민 무리에 밀려 넘어졌다.'}},
{id:'chibi',prio:1,when:()=>P.year===208&&P.path==='군'&&(ruler()==='조조'||inR('형주','양주')),time:6,title:'적벽',han:'赤',hr:'적',
 text:()=>ruler()==='조조'||inR('예주','연주','기주')?'동남풍이 거세다. 서로 이어 붙인 함선들 사이로 불붙은 배들이 돌진해 온다.':'황개의 배에 불이 붙었다. 바람이 우리 편이다. 북소리가 울린다.',
 ch:[{l:'강물로 뛰어든다',req:()=>ruler()==='조조',rq:'조조군만',p:.6,act:ok=>{if(ok){hurt(30,'장강');return '차가운 강물을 헤엄쳐 겨우 기슭에 닿았다.'}die('장강');return '갑옷이 무거웠다.'}},
     {l:'엉겨 붙은 배를 떼어 낸다',req:()=>ruler()==='조조',rq:'조조군만',st:'무',d:55,act:ok=>{if(ok){P.fame+=12;return '도끼로 밧줄을 끊어 배 몇 척을 불길에서 떼어 냈다.'}die('적벽의 불길');return '불길이 돛을 타고 내려왔다.'}},
     {l:'화용도로 달아난다',req:()=>ruler()==='조조',rq:'조조군만',st:'지',d:45,act:ok=>{if(ok){hurt(15,'화용도');P.fame+=3;return '풀을 베어 진창길을 메우며 강릉까지 살아서 돌아왔다.'}hurt(45,'화용도');return '진흙탕에 쓰러진 말들 사이에 깔렸다.'}},
     {l:'화공 선봉에 선다',req:()=>ruler()!=='조조',rq:'손유 연합만',st:'무',d:50,act:ok=>{if(ok){P.fame+=15;return '불붙은 배를 몰아 조조의 함대에 들이받았다.'}hurt(40,'적벽의 불길');return '불길이 우리 배까지 옮겨붙었다.'}},
     {l:'후방에서 화살을 나른다',req:()=>ruler()!=='조조',rq:'손유 연합만',act:()=>{P.fame+=5;return '강 건너 하늘이 붉게 물드는 것을 보았다.'}}],
 to:()=>{hurt(55,'적벽의 불길');return '연기에 갇혀 정신을 잃었다.'}},
{id:'yizhou',prio:1,when:()=>P.year===214&&inR('익주')&&P.age>=16,time:7,title:'성도 포위',han:'圍',hr:'위',
 text:()=>'유비의 군대가 성도를 에워쌌다. 마초까지 합류했다는 소식에 성안이 술렁인다. 유장은 항복을 고민한다.',
 ch:[{l:'성문을 열자고 주장한다',st:'지',d:45,act:ok=>{later('f1_yizhou_coin',1,{});if(ok){P.fame+=8;return '새 주인은 성문을 열자던 이들을 중히 썼다.'}P.fame=Math.max(0,P.fame-2);return '겁쟁이 소리를 들었다. 사흘 뒤 성문은 열렸다.'}},
     {l:'끝까지 싸우자고 한다',st:'무',d:50,act:ok=>{if(ok){P.fame+=5;return '항복 뒤에도 충절을 인정받았다. 유비는 황권처럼 끝까지 버틴 이들을 오히려 높였다.'}hurt(40,'성도 공방');return '성벽 아래서 화살을 맞았다.'}},
     {l:'조용히 지낸다',act:()=>{later('f1_yizhou_coin',1,{});return '성문이 열리자 유비는 성안의 금은을 장졸들에게 나눠 주었다. 관청 창고가 텅 비었다.'}}],
 to:()=>'회의는 끝났고, 성문이 열렸다.'},
{id:'plague',prio:1,when:()=>P.year===217,time:7,title:'정유년 대역병',han:'疫',hr:'역',
 text:()=>'집집마다 곡소리가 들린다. 건안칠자 가운데 서간, 진림, 응창, 유정이 이 역병에 쓰러졌다고 한다.',
 ch:[{l:'문을 걸어 잠그고 버틴다',p:.75,act:ok=>{P.wealth=Math.max(0,P.wealth-2);if(ok)return '한 해를 집 안에서만 보냈다. 밭은 잡초에 묻혔다.';hurt(45,'역병');return '문틈으로도 역병은 들어왔다.'}},
     {l:'앓는 이웃을 돌본다',p:.5,act:ok=>{P.s.매+=8;P.fame+=6;kind(mkName(),'역병 때 당신이 돌봐 준 이웃');if(ok)return '이웃들이 당신을 은인이라 불렀다.';hurt(50,'역병');return '이웃은 살았지만 병이 당신에게 옮았다.'}},
     {l:'의원을 데려온다',req:()=>P.wealth>=20,rq:'2만 전 필요',p:.9,act:ok=>{P.wealth-=15;if(ok)return '비싼 약값을 치르고 온 식구가 살았다.';hurt(40,'역병');return '약도 듣지 않았다.'}}],
 to:()=>{if(R()<.5){hurt(45,'역병');return '손쓸 틈도 없이 열이 올랐다.'}return '운 좋게 비켜 갔다.'}},
{id:'jingzhou',prio:1,when:()=>P.year===219&&inR('형주')&&P.age>=12,time:7,title:'흰옷의 상인들',han:'白',hr:'백',
 text:()=>'관우가 북쪽 번성을 치는 사이, 흰옷 입은 상인들의 배가 강을 건너왔다. 강가 봉화대가 조용하다.',
 ch:[{l:'수상하다고 관아에 알린다',st:'지',d:55,act:ok=>{if(ok){P.fame+=6;return '당신 말을 믿은 이는 몇 없었다. 그래도 식구들은 미리 산골로 보냈다. 사흘 뒤 강릉이 떨어졌다.'}P.fame+=2;return '관리는 콧방귀를 뀌었다. 사흘 뒤 강릉의 미방이 성문을 열었다.'}},
     {l:'상인들과 거래한다',act:()=>{P.wealth+=10;later('f1_jingzhou_wu',1,{});return '값을 후하게 쳐주었다. 나중에 알고 보니 여몽의 병사들이었다.'}},
     {l:'관우를 따라 북으로 간다',req:()=>P.path==='군',rq:'군인만',st:'무',d:55,act:ok=>{if(ok){P.fame+=8;hurt(20,'맥성');moveTo('익주');return '맥성의 포위를 뚫고 익주로 달아났다.'}die('맥성');return '관 장군과 함께 맥성에 갇혔다.'}}],
 to:()=>'눈을 떠 보니 손권의 깃발이 성 위에 걸려 있었다.'},
{id:'yiling',prio:1,when:()=>P.year===222&&P.path==='군'&&['촉','오'].includes(ruler()),time:6,title:'이릉',han:'夷',hr:'이',
 text:()=>ruler()==='촉'?'칠백 리에 걸쳐 늘어선 영채. 한여름 밤, 바람을 타고 불길이 번진다.':'육손 도독이 마침내 명을 내렸다. "모두 띠풀 한 단씩 들고 촉의 영채로!"',
 ch:[{l:'영채를 버리고 달아난다',req:()=>ruler()==='촉',rq:'촉군만',st:'통',d:45,act:ok=>{if(ok){hurt(15,'이릉의 불길');return '백제성까지 살아서 걸어왔다.'}hurt(50,'이릉의 불길');return '퇴로마저 불타고 있었다.'}},
     {l:'폐하를 호위한다',req:()=>ruler()==='촉',rq:'촉군만',st:'무',d:60,act:ok=>{if(ok){P.fame+=14;return '마안산에서 끝까지 싸우며 황제의 퇴로를 열었다.'}die('이릉의 불길');return '불길이 어가를 뒤쫓았다.'}},
     {l:'불을 들고 돌격한다',req:()=>ruler()==='오',rq:'오군만',st:'무',d:45,act:ok=>{if(ok){P.fame+=12;return '영채 마흔 곳이 하룻밤에 무너졌다.'}hurt(35,'촉군의 창');return '불길 속에서 촉군의 창에 찔렸다.'}},
     {l:'뒤에서 띠풀을 묶어 나른다',req:()=>ruler()==='오',rq:'오군만',act:()=>{P.fame+=4;P.s.정+=1;return '밤새 띠풀 수천 단을 묶었다. 손바닥이 갈대에 다 베였다.'}}],
 to:()=>{hurt(40,'이릉의 불길');return '연기 속을 헤맸다.'}},
{id:'beifa',w:7,when:()=>P.year>=228&&P.year<=234&&P.path==='군'&&['촉','위'].includes(ruler()),time:7,title:'북벌',han:'伐',hr:'벌',
 text:()=>ruler()==='촉'?(P.year>=231?'제갈 승상이 다시 기산으로 나아간다. 목우가 군량을 싣고 잔도를 오른다.':'제갈 승상이 출사표를 올리고 북으로 나아간다. 군량 수레가 잔도를 따라 줄을 잇는다.'):(P.year>=231?'촉군이 또 기산으로 나왔다. 사마 도독은 영채를 굳게 지키고 싸우지 말라 명했다.':'촉군이 기산으로 나왔다. 천수, 남안, 안정 세 군이 촉에 붙었다는 소식에 조정이 술렁인다.'),
 ch:[{l:'선봉에 지원한다',st:'무',d:55,act:ok=>{if(ok){P.fame+=12;return '적의 보루 둘을 빼앗았다.'}hurt(45,'기산 전투');return '돌과 화살이 쏟아졌다.'}},
     {l:'군량 수송을 맡는다',st:'정',d:40,act:ok=>{if(ok){P.fame+=6;return '험한 잔도를 지나 군량을 무사히 날랐다.'}hurt(20,'잔도');return '잔도에서 수레가 굴러떨어졌다.'}},
     {l:'몰래 진을 빠져나간다',act:()=>{P.fame=Math.max(0,P.fame-10);setPath('민');later('f1_beifa_deserter',rint(2,5),{});return '탈영했다. 이름을 바꾸고 산골에 숨었다.'}}],
 to:()=>{hurt(20,'기산 전투');return '명령을 놓쳐 대열에서 떨어졌다.'}},
{id:'caocao',w:4,once:1,when:()=>inR('연주','예주')&&P.year>=192&&P.year<=210&&P.age>=18&&P.age<=50&&Math.max(P.s.통,P.s.무,P.s.지,P.s.정)>=62&&P.path!=='적',time:8,title:'조조의 부름',han:'才',hr:'재',
 text:()=>P.year>=210?'"오직 재능만 있으면 천거하라." 조조가 구현령을 내렸다. 당신의 이름이 명단에 올랐다.':'조조가 사방에서 인재를 불러 모은다. 출신은 묻지 않는다고 한다. 당신의 이름이 천거 명단에 올랐다.',
 ch:[{l:'조조를 찾아간다',act:()=>{const war=P.s.무+P.s.통>P.s.지+P.s.정;setPath(war?'군':'관');P.rank=Math.max(P.rank,2);P.fame=Math.max(P.fame,TH.군[2])+4;return `조조는 당신과 밤늦도록 이야기를 나눴다. ${war?'장수':'막료'}로 쓰이게 되었다.`}},
     {l:'간웅은 섬기지 않는다',act:()=>{P.s.매+=4;later('f1_caocao_again',rint(2,4),{});return '사람들은 고집이라 했고, 당신은 지조라 했다.'}}],
 to:()=>'사자가 다른 이의 집으로 갔다.'},
{id:'sunce',w:5,once:1,when:()=>inR('양주')&&P.year>=195&&P.year<=199&&P.age>=16&&P.age<=40&&['민','상'].includes(P.path),time:7,title:'소패왕',han:'覇',hr:'패',
 text:()=>'스무 살 남짓한 장수가 강을 건너왔다. 군령이 엄해 백성의 닭 한 마리, 푸성귀 한 포기 건드리지 않는다고 한다.',
 ch:[{l:'손책의 군에 들어간다',act:()=>{setPath('군');P.fame+=5;later('f1_sunce_death',Math.max(1,200-P.year),{});return '강동 평정의 길에 함께하게 되었다.'}},
     {l:'소와 술을 바치러 간다',act:()=>{P.wealth=Math.max(0,P.wealth-3);P.fame+=3;P.s.매+=2;later('f1_sunce_death',Math.max(1,200-P.year),{far:1});return '고을 사람들과 소와 술을 들고 진채를 찾았다. 손책은 웃으며 잔을 받았다.'}},
     {l:'멀리서 지켜본다',act:()=>{P.s.지+=1;later('f1_sunce_death',Math.max(1,200-P.year),{far:1});return '젊은 장수의 기세가 너무 날카로워 보였다.'}}],
 to:()=>'행렬이 지나갔다.'},
{id:'huatuo',w:4,once:1,when:()=>P.hp<70&&inR('예주','서주','연주','양주')&&P.year>=185&&P.year<=207,time:7,title:'떠돌이 의원',han:'醫',hr:'의',
 text:()=>'패국 초현 출신의 늙은 의원이 마을에 들렀다. 배를 갈라 병을 고친다는 소문이 있다.',
 ch:[{l:'치료를 청한다',act:()=>{P.hp=maxHp();later('f1_huatuo_relapse',3,{});return '마비산을 마시고 눈을 떠 보니 몸이 가벼웠다. 의원은 "삼 년 뒤 다시 도질 것"이라 일렀다. 그의 이름은 화타였다.'}},
     {l:'배를 가른다니 무섭다',act:()=>{P.hp=Math.min(maxHp(),P.hp+8);return '의원은 웃으며 범, 사슴, 곰, 원숭이, 새의 몸짓을 흉내 내는 오금희를 가르쳐 주고 떠났다.'}}],
 to:()=>'의원은 이미 다음 마을로 떠났다.'},
{id:'conscript',w:4,when:()=>P.year>=184&&P.age>=16&&P.age<=45&&['민','상'].includes(P.path),time:6,title:'징발',han:'徵',hr:'징',
 text:()=>`${ruler()==='한'?'관':ruler()}의 관리가 마을을 돌며 장정을 끌어간다. 대문이 쾅쾅 울린다.`,
 ch:[{l:'창을 받아 든다',act:()=>{setPath('군');return `${ruler()==='한'?'관':ruler()}의 군졸이 되었다.`}},
     {l:'뒷문으로 달아난다',st:'지',d:40,act:ok=>{if(ok)return '뒷산 동굴에서 사흘을 버텼다. 관리는 돌아갔다.';hurt(15,'곤장');setPath('군');return '붙잡혀 곤장을 맞고 끌려갔다.'}},
     {l:'관리 손에 돈을 쥐여준다',req:()=>P.wealth>=20,rq:'2만 전 필요',act:()=>{P.wealth-=15;later('f1_conscript_bribe',rint(1,2),{});return '관리는 돈을 소매에 넣고 못 본 척 지나갔다.'}}],
 to:()=>{setPath('군');return '문을 열기도 전에 끌려 나갔다.'}},
{id:'bandit',w:2,when:()=>P.age>=13&&P.path!=='적',time:5,title:'고갯길의 도적',han:'賊',hr:'적',
 text:()=>'고갯마루에서 도적 떼가 길을 막았다. 녹슨 칼끝이 번뜩인다.',
 ch:[{l:'맞서 싸운다',st:'무',d:45,act:ok=>{if(ok){P.fame+=4;P.wealth+=5;return '두목을 쓰러뜨리자 나머지가 흩어졌다.'}hurt(35,'도적의 칼');return '칼을 맞고 쓰러졌다.'}},
     {l:'가진 것을 내준다',act:()=>{P.wealth=Math.floor(P.wealth*.5);later('f1_bandit_meet',rint(2,5),{});return '목숨값으로 보따리를 내주었다. 두목의 왼뺨에 칼자국이 있었다.'}},
     {l:'수풀로 뛰어든다',st:'지',d:35,act:ok=>{if(ok)return '덤불 속으로 굴러 빠져나왔다.';hurt(20,'도적의 칼');P.wealth=Math.floor(P.wealth*.7);return '붙잡혀 얻어맞고 털렸다.'}}],
 to:()=>{hurt(25,'도적의 몽둥이');P.wealth=Math.floor(P.wealth*.6);return '얼어붙은 사이 몽둥이가 날아왔다.'}},
{id:'marry',w:1,when:()=>!P.married&&P.age>=16&&P.age<=32,time:7,title:'혼담',han:'婚',hr:'혼',
 text:()=>{P.tmp.house=pick(SURN);return `중매쟁이가 찾아왔다. 이웃 고을 ${P.tmp.house}씨 집안과 혼담을 넣자고 한다.`},
 ch:[{l:'혼인한다',act:()=>{P.married=1;setSpouse(P.tmp.house);P.s.매+=2;P.wealth=Math.max(0,P.wealth-5);return `납폐로 비단과 돈을 보내고 ${P.tmp.house}씨 집안과 혼례를 올렸다.`}},
     {l:'더 좋은 집안을 노린다',st:'매',d:55,act:ok=>{if(ok){P.married=1;setSpouse(pick(['원','양','순','최','진']));P.wealth+=15;P.fame+=3;return '고을 호족 집안과 혼인했다. 혼수가 수레로 셋이었다.'}P.fame=Math.max(0,P.fame-2);return '눈만 높다는 소문이 났다. 중매쟁이들의 발길이 뜸해졌다.'}},
     {l:'아직은 때가 아니다',act:()=>{P.s.매-=1;return '중매쟁이가 혀를 차며 돌아갔다. 혼기를 놓친다는 수군거림이 돌았다.'}}],
 to:()=>'답을 미루는 사이 혼담이 흐지부지되었다.'},
{id:'baby',when:()=>false,time:6,title:'첫울음',han:'子',
 text:()=>{const sex=R()<.5?'m':'f';P.tmp.sex=sex;P.tmp.names=[];const used=(P.kids||[]).map(k=>k.n.slice(P.surname.length));const all=sex==='m'?GIV.filter(g=>!NAMEBAN.has(P.surname+g)):KIDN_F;let pool=all.filter(x=>!used.includes(x));if(pool.length<3)pool=all.slice();for(let i=0;i<3;i++)P.tmp.names.push(pool.splice(Math.floor(R()*pool.length),1)[0]);return `${(P.kids||[]).length?'또 ':''}${sex==='m'?'아들':'딸'}이 태어났다. 이름을 지어야 한다.`},
 ch:[0,1,2].map(i=>({l:()=>P.surname+P.tmp.names[i],act:()=>{const n=P.surname+P.tmp.names[i];addKid(n,P.tmp.sex);return `${n}. 좋은 이름이다.`}})),
 to:()=>{addKid(P.surname+(P.tmp.sex==='m'?'아무개':'아기'),P.tmp.sex);return '이름을 못 정하는 사이, 동네에서 아이를 아무개라 부르기 시작했다.'}},
{id:'sick',w:2,when:()=>P.age>=10,time:6,title:'열병',han:'病',hr:'병',
 text:()=>'온몸이 불덩이 같다. 사흘째 물 한 모금 넘기지 못했다.',
 ch:[{l:'약초를 달여 먹는다',st:'지',d:35,act:ok=>{if(ok){P.hp=Math.min(maxHp(),P.hp+5);return '산에서 캔 시호를 달여 먹었다. 열이 내렸다.'}hurt(25,'열병');return '잘못 캔 풀이었다. 배앓이까지 겹쳤다.'}},
     {l:'무당을 부른다',p:.5,act:ok=>{P.wealth=Math.max(0,P.wealth-5);if(ok)return '굿이 끝나자 열이 내렸다. 우연일지도 모른다.';hurt(30,'열병');return '굿값만 날렸다.'}},
     {l:'이를 악물고 버틴다',act:()=>{hurt(rint(5,30),'열병');return '열흘 만에 자리를 털고 일어났다.'}}],
 to:()=>{hurt(30,'열병');return '정신이 오락가락했다.'}},
{id:'xiaolian',w:3,once:1,when:()=>P.year<220&&['민','상'].includes(P.path)&&P.age>=18&&(P.s.매>=55||P.s.정>=58||P.s.지>=62)&&P.fame>=4,time:7,title:'효렴 천거',han:'擧',hr:'거',
 text:()=>'군 태수가 당신을 효렴으로 천거하겠다고 한다. 군에서 해마다 몇 명 올리지 못하는 자리다.',
 ch:[{l:'받아들인다',act:()=>{setPath('관');P.rank=1;P.fame+=5;later('f1_xiaolian_patron',rint(3,6),{n:(P.gov&&P.gov.n)||(mkName())});return '도성으로 올라가 낭관이 되었다. 천거해 준 태수에게는 평생 고리(故吏)의 예를 갖춰야 한다.'}},
     {l:'세 번 사양한다',p:.5,act:ok=>{P.s.매+=4;P.fame+=5;if(ok){setPath('관');P.rank=2;return '겸양이 높이 평가되어 더 좋은 자리로 다시 불렸다.'}return '정말로 다른 이에게 넘어갔다. 이름만 남았다.'}}],
 to:()=>'기회는 다른 이에게 돌아갔다.'},
{id:'battle',w:7,when:()=>P.path==='군'&&P.year>=184&&P.rank<4,time:6,title:'접전',han:'戰',hr:'전',
 text:()=>{P.tmp.enemy=enemyOf();return `${P.tmp.enemy}의 군세와 맞닥뜨렸다. 북소리가 땅을 울린다.`},
 ch:[{l:'선봉에 선다',st:'무',d:55,act:ok=>{if(ok){P.fame+=10;P.wealth+=5;return '적진을 가장 먼저 뚫었다. 공을 적는 장부 맨 위에 이름이 올랐다.'}hurt(45,`${P.tmp.enemy}의 창`);return '적의 창이 갑옷을 뚫었다.'}},
     {l:'대열을 지킨다',st:'통',d:40,act:ok=>{if(ok){P.fame+=4;return '방패를 맞대고 끝까지 버텼다.'}hurt(25,`${P.tmp.enemy}의 화살`);return '화살이 어깨에 박혔다.'}},
     {l:'뒤로 빠진다',p:.8,act:ok=>{P.fame=Math.max(0,P.fame-3);if(ok)return '살아남았다. 누구도 칭찬하지 않았다.';hurt(15,'독전대의 곤장');return '독전대에 걸려 곤장을 맞았다.'}}],
 to:()=>{hurt(30,'혼전');return '얼어붙은 사이 대열이 무너졌다.'}},
{id:'duel',w:3,when:()=>P.path==='군'&&P.rank>=4,time:6,title:'일기토',han:'鬪',hr:'투',
 text:()=>'적장이 진 앞으로 말을 몰고 나와 이름을 밝히며 겨루기를 청한다. 양군의 눈이 당신에게 쏠린다.',
 ch:[{l:'말을 몰아 나간다',vs:()=>{P.tmp.fmu=rint(55,88);return duelCfg('적장',P.tmp.fmu,null);},after:r=>{P.hp=Math.max(0,Math.round(r.me));if(r.win){P.fame+=18;return '적장을 베었다. 이름이 천하에 퍼졌다.'}if(r.draw){P.fame+=6;P.hp=Math.max(P.hp,5);return '수십 합을 겨뤘으나 승부가 나지 않았다.'}if(r.koMe){if(R()<.5){die('일기토');return '적장의 창이 먼저 닿았다.'}P.hp=8;return '말에서 떨어져 간신히 진으로 돌아왔다.'}P.hp=Math.max(P.hp,5);return '밀려서 물러났다.'}},
     {l:'몰래 궁수에게 쏘게 한다',st:'지',d:50,act:ok=>{if(ok){P.fame+=8;P.s.매-=4;return '적장이 화살에 쓰러졌다. 이겼지만 뒷말이 많았다.'}P.fame=Math.max(0,P.fame-6);return '화살이 빗나갔다. 비겁하다는 낙인이 찍혔다.'}},
     {l:'응하지 않는다',act:()=>{P.fame=Math.max(0,P.fame-4);return '적진에서 웃음소리가 들렸다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-4);return '머뭇거리는 사이 적장은 비웃으며 돌아갔다.'}},
{id:'graft',w:3,when:()=>P.path==='관'&&!P.flags.corrupt,time:7,title:'장부',han:'簿',hr:'부',
 text:()=>'상관이 세곡 장부를 슬쩍 내민다. "숫자 몇 개만 고치면 자네 몫도 있네."',
 ch:[{l:'함께한다',act:()=>{P.wealth+=20;P.s.매-=5;P.flags.corrupt=1;return '주머니가 두둑해졌다. 잠자리는 불편해졌다.'}},
     {l:'거절한다',p:.7,act:ok=>{P.s.매+=3;if(ok)return '상관은 어색하게 웃으며 장부를 거두었다.';P.fame=Math.max(0,P.fame-5);return '얼마 뒤 외진 현으로 좌천되었다.'}},
     {l:'자사에게 고발한다',st:'지',d:55,act:ok=>{if(ok){P.fame+=12;later('f1_graft_revenge',rint(2,5),{});return '상관이 파면되었다. 강직하다는 평이 돌았다.'}hurt(30,'모함');P.fame=Math.max(0,P.fame-4);return '거꾸로 모함을 받아 옥에 갇혔다가 풀려났다.'}}],
 to:()=>{P.s.매-=2;return '아무 말도 못 했다. 묵인한 셈이 되었다.'}},
{id:'caught',w:4,when:()=>P.path==='관'&&P.flags.corrupt,time:6,title:'발각',han:'罪',hr:'죄',
 text:()=>'자사의 종사가 내려왔다. 고쳐 쓴 장부가 그의 손에 들려 있다.',
 ch:[{l:'종사에게 뇌물을 쓴다',req:()=>P.wealth>=30,rq:'3만 전 필요',act:()=>{P.wealth-=30;P.flags.corrupt=0;return '종사는 장부를 불에 던졌다.'}},
     {l:'동료에게 뒤집어씌운다',st:'지',d:55,act:ok=>{P.flags.corrupt=0;if(ok){const n=mkName();P.s.매-=6;later('f1_caught_son',rint(3,6),{n});return `동료 ${jo(n,'이/가')} 끌려갔다. 당신은 무사했다.`}die('참수');return '거짓이 드러났다. 저잣거리에서 목이 베였다.'}},
     {l:'죄를 자백한다',act:()=>{P.flags.corrupt=0;P.wealth=Math.floor(P.wealth*.3);setPath('민');P.s.매+=3;return '관직과 재산을 잃고 고향으로 돌아갔다.'}}],
 to:()=>{P.flags.corrupt=0;hurt(55,'옥사');setPath('민');return '변명할 틈도 없이 옥에 갇혔다.'}},
{id:'lawsuit',w:3,when:()=>P.path==='관'&&P.rank>=1,time:7,title:'송사',han:'訟',hr:'송',
 text:()=>{P.tmp.farmer=mkName();return `권세가 집안이 가난한 농부 ${P.tmp.farmer}의 땅을 빼앗았다는 송사가 들어왔다. 권세가의 하인이 돈 꾸러미를 들고 기다린다.`},
 ch:[{l:'법대로 판결한다',st:'정',d:45,act:ok=>{if(ok){P.fame+=7;P.s.매+=2;return '농부가 땅을 돌려받았다. 고을 사람들이 칭송했다.'}P.fame+=2;hurt(15,'권세가의 보복');return '판결은 했지만 밤길에 몽둥이를 맞았다.'}},
     {l:'뇌물을 받는다',act:()=>{P.wealth+=15;P.s.매-=4;later('f1_lawsuit_farmer',rint(3,6),{n:P.tmp.farmer});return '농부는 울며 돌아갔다.'}},
     {l:'양쪽을 달래 화해시킨다',st:'정',d:45,act:ok=>{if(ok){P.fame+=4;P.wealth+=4;return '농부는 땅값 일부를, 당신은 사례를 받았다.'}P.fame=Math.max(0,P.fame-2);return '양쪽 모두 불만이었다. 우유부단하다는 평이 돌았다.'}}],
 to:()=>{later('f1_lawsuit_farmer',rint(4,7),{n:P.tmp.farmer});return '판결을 미루는 사이 농부가 소송을 포기했다.'}},
{id:'riot',w:2,when:()=>P.path==='관'&&P.rank>=2&&P.year>=184,time:6,title:'민란',han:'亂',hr:'란',
 text:()=>`${P.post&&P.post.where?P.post.where:'현'}에 민란이 일어났다.${P.post&&P.post.minsim!=null?` 민심이 ${P.post.minsim}까지 떨어져 있었다.`:''} 성난 백성들이 관아로 몰려온다.`,
 ch:[{l:'관창을 열어 곡식을 나눈다',st:'매',d:50,act:ok=>{if(ok){P.fame+=10;later('f1_riot_audit',rint(1,2),{});return '백성들이 무기를 내려놓았다.'}hurt(30,'민란');return '곡식만 털리고 얻어맞았다.'}},

     {l:'절반만 건다',st:'정',d:40,act:ok=>{if(ok){P.wealth=Math.floor(P.wealth*1.3)+4;return '쏠쏠하게 남겼다.'}P.wealth=Math.floor(P.wealth*.7);return '도착해 보니 시세가 떨어져 있었다.'}},

     {l:'거절한다',act:()=>{later('f1_friend_return',rint(2,5),{n:P.tmp.fr,v:0,lent:0});return `${jo(P.tmp.fr,'은/는')} 말없이 돌아섰다.`}}],

     {l:'재주를 내보인다',st:()=>['통','무','지','정'].reduce((a,k)=>P.s[k]>P.s[a]?k:a,'무'),d:55,act:ok=>ok?bond(2,'"이런 인재가 숨어 있었다니." 당신의 이름을 물었다.'):bond(-1,'솜씨를 보이려다 망신만 당했다.')},

       if(prev){P.s.매-=5;return `${jo(prev,'을/를')} 떠나 ${lord}에게 갔다. 배신자라는 말이 뒤따랐다.`}return `${lord}의 휘하에 들었다. ${P.status} 출신으로서는 꿈같은 일이었다.`}},
     {l:'정중히 사양한다',act:()=>{P.bonds[P.tmp.fig.id]=2;P.s.매+=2;return '사자는 아쉬운 얼굴로 돌아갔다.'}}],

     {l:'함께 박수를 친다',act:()=>{P.s.매+=1;return '이야기는 사실보다 빨리 퍼졌다. 사람들은 오래도록 관우가 화웅을 벤 줄 알았다.'}},

{id:'field',w:9,when:()=>P.path==='군'&&P.rank>=4&&P.year>=184,time:7,title:'출진',han:'陣',hr:'진',
 text:()=>{ensurePost();const q=P.post,A=q&&q.troops?q.troops:Math.round([0,0,0,0,600,1500,3500,6000,12000,30000][P.rank]*(.7+R()*.6)/10)*10,E=Math.round(A*(.6+R()*1.2)/10)*10;
   P.tmp.bt={A,E,qm:q&&q.train!=null?.6+q.train/250+q.morale/250:1,enemy:enemyOf(),ter:pick(TERR),fs:{통:rint(40,85),무:rint(40,85),지:rint(40,85)}};
   return `${P.tmp.bt.enemy}의 군세 ${E.toLocaleString()}이 다가온다. 그대가 이끄는 병력은 ${A.toLocaleString()}명${q&&q.train!=null?`, 훈련 ${q.train} 사기 ${q.morale}`:''}.`;},
 ch:[{l:'출진하여 맞선다',vs:()=>battleCfg(P.tmp.bt),after:r=>{const b=P.tmp.bt,kill=Math.round(b.E-r.foe),lost=Math.round(b.A-r.me);if(P.post&&P.post.troops!=null){P.post.troops=Math.max(Math.round(b.A*.15),Math.round(r.me));P.post.morale=c100(P.post.morale+(r.win?10:r.draw?0:-15));P.post.train=c100(P.post.train+2);}
       if(r.win){P.fame+=6+Math.min(14,Math.round(b.E/700));P.wealth+=3;return `적 ${kill.toLocaleString()}명을 베고 이겼다. 아군 손실 ${lost.toLocaleString()}명.`}
       if(r.draw){P.fame+=2;return `승부를 가리지 못하고 양군이 물러났다. 아군 손실 ${lost.toLocaleString()}명.`}
       P.fame=Math.max(0,P.fame-4);if(r.koMe&&R()<.12){die(`${b.enemy}군과의 패전`);return '패주하는 아군 속에서 쓰러졌다.'}
       hurt(rint(10,30),`${b.enemy}군과의 패전`);return `크게 졌다. 아군 ${lost.toLocaleString()}명을 잃고 물러났다.`}},
     {l:'성을 굳게 지킨다',st:'통',d:45,act:ok=>{if(ok){P.fame+=3;return '적이 성 아래서 열흘을 버티다 물러갔다.'}hurt(15,'농성');return '성벽 일부가 무너졌지만 겨우 지켰다.'}},
     {l:'후퇴한다',act:()=>{P.fame=Math.max(0,P.fame-3);return '싸우지 않고 물러났다. 병사들의 눈빛이 식었다.'}}],
 to:()=>{hurt(20,'적의 기습');P.fame=Math.max(0,P.fame-3);return '명령을 내리지 못하는 사이 적이 들이쳤다.'}},
{id:'hero',w:4,cd:5,when:()=>P.path==='군'&&P.rank>=1&&HEROES.some(h=>P.year>=h.y[0]&&P.year<=h.y[1]&&!h.side.includes(ruler())&&h.n!==P.name),time:7,title:'명장',han:'將',hr:'장',
 text:()=>{const h=pick(HEROES.filter(h=>P.year>=h.y[0]&&P.year<=h.y[1]&&!h.side.includes(ruler())&&h.n!==P.name));P.tmp.hero=h;return `적진에서 한 장수가 홀로 말을 몰고 나왔다. ${h.n}다. 아군 병사들이 술렁인다.`;},
 ch:[{l:'일기토에 응한다',vs:()=>duelCfg(P.tmp.hero.n,P.tmp.hero.mu,P.tmp.hero.line),after:r=>{const h=P.tmp.hero;P.hp=Math.max(0,Math.round(r.me));
       if(r.win){P.fame+=30;P.luck*=.05;P.flags.beat=h.n;return `${jo(h.n,'을/를')} 물리쳤다! 천하가 그대의 이름을 알게 되었다.`}
       if(r.draw){P.fame+=12;P.hp=Math.max(P.hp,5);return `${h.n}와 승부를 가리지 못했다. 그것만으로도 이름이 났다.`}
       if(r.koMe){if(R()<.6){die(`${h.n}의 창`);return `${h.n}의 일격을 받아내지 못했다.`}P.hp=6;return '말에서 떨어졌으나 부하들이 끌고 돌아왔다.'}
       P.hp=Math.max(P.hp,5);P.fame+=5;return `${h.n}에게 밀렸지만 살아서 돌아왔다.`}},

     {l:'군사를 물린다',act:()=>{P.fame=Math.max(0,P.fame-3);return '싸우지 않고 물러났다. 현명했는지도 모른다.'}}],
 to:()=>{P.fame=Math.max(0,P.fame-3);return '아무도 나서지 못했다. 적장은 웃으며 돌아갔다.'}},
